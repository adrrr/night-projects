<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>ORBIT MERGE</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #0a0a0f;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
canvas {
  display: block;
  width: 100%; height: 100%;
}
#ui-overlay {
  position: absolute; top: 0; left: 0; right: 0;
  pointer-events: none;
  padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: flex-start;
  z-index: 10;
}
#score-display {
  font-size: clamp(18px, 4vw, 28px);
  color: #e0e0ff;
  font-weight: 700;
  text-shadow: 0 0 12px rgba(120,140,255,0.6);
}
#score-display span { color: #7df; }
#high-score {
  font-size: clamp(12px, 2.5vw, 16px);
  color: #8888bb;
  margin-top: 2px;
}
#combo-display {
  font-size: clamp(14px, 3vw, 20px);
  color: #ffa;
  font-weight: 700;
  text-shadow: 0 0 12px rgba(255,255,120,0.6);
  opacity: 0;
  transition: opacity 0.2s;
}
#game-over-screen {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(5,5,15,0.85);
  display: none; flex-direction: column;
  justify-content: center; align-items: center;
  z-index: 20;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
#game-over-screen.active { display: flex; }
#game-over-screen h1 {
  font-size: clamp(32px, 8vw, 56px);
  color: #fff;
  text-shadow: 0 0 30px rgba(120,200,255,0.5);
  margin-bottom: 8px;
}
#game-over-screen .final-score {
  font-size: clamp(20px, 5vw, 36px);
  color: #7df;
  margin-bottom: 4px;
}
#game-over-screen .new-best {
  font-size: clamp(14px, 3vw, 20px);
  color: #fd5;
  margin-bottom: 24px;
  min-height: 24px;
}
#game-over-screen .biggest-planet {
  font-size: clamp(14px, 3vw, 18px);
  color: #aab;
  margin-bottom: 24px;
}
#restart-btn {
  pointer-events: all;
  background: linear-gradient(135deg, #2a1a5e, #1a3a6e);
  border: 2px solid rgba(120,200,255,0.3);
  color: #7df;
  font-size: clamp(18px, 4vw, 24px);
  font-weight: 700;
  padding: 16px 48px;
  border-radius: 16px;
  cursor: pointer;
  min-height: 56px;
  min-width: 200px;
  transition: all 0.2s;
}
#restart-btn:active {
  transform: scale(0.95);
  background: linear-gradient(135deg, #3a2a7e, #2a4a8e);
}
#hint {
  position: absolute; bottom: 20px; left: 0; right: 0;
  text-align: center;
  font-size: clamp(13px, 2.8vw, 16px);
  color: rgba(150,150,200,0.6);
  pointer-events: none;
  z-index: 10;
  transition: opacity 1s;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui-overlay">
  <div>
    <div id="score-display">SCORE <span id="score-val">0</span></div>
    <div id="high-score">BEST: <span id="high-val">0</span></div>
  </div>
  <div id="combo-display"></div>
</div>
<div id="game-over-screen">
  <h1>SUPERNOVA</h1>
  <div class="final-score" id="final-score"></div>
  <div class="new-best" id="new-best"></div>
  <div class="biggest-planet" id="biggest-planet"></div>
  <button id="restart-btn">PLAY AGAIN</button>
</div>
<div id="hint">Tap orbiting planets to release them — match sizes to merge!</div>

<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const scoreEl = document.getElementById('score-val');
const highEl = document.getElementById('high-val');
const comboEl = document.getElementById('combo-display');
const hintEl = document.getElementById('hint');
const goScreen = document.getElementById('game-over-screen');
const finalScoreEl = document.getElementById('final-score');
const newBestEl = document.getElementById('new-best');
const biggestEl = document.getElementById('biggest-planet');
const restartBtn = document.getElementById('restart-btn');

// --- AUDIO ENGINE ---
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur, vol = 0.15, type = 'sine') {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function sfxRelease() {
  playTone(520, 0.12, 0.1, 'sine');
  playTone(780, 0.08, 0.06, 'sine');
}

function sfxMerge(tier) {
  const base = 200 + tier * 80;
  playTone(base, 0.25, 0.18, 'sine');
  playTone(base * 1.5, 0.15, 0.1, 'triangle');
  setTimeout(() => playTone(base * 2, 0.2, 0.08, 'sine'), 60);
}

function sfxSpawn() {
  playTone(440, 0.06, 0.04, 'sine');
}

function sfxGameOver() {
  playTone(300, 0.4, 0.2, 'sawtooth');
  setTimeout(() => playTone(200, 0.5, 0.15, 'sawtooth'), 150);
  setTimeout(() => playTone(120, 0.8, 0.12, 'sawtooth'), 350);
}

function sfxBounce() {
  playTone(150, 0.06, 0.05, 'square');
}

// --- PLANET TIERS ---
const TIERS = [
  { name: 'Pebble',   r: 10, color: '#8899aa', glow: '#6688bb' },
  { name: 'Rock',     r: 14, color: '#aa7755', glow: '#cc8844' },
  { name: 'Moon',     r: 19, color: '#bbbbcc', glow: '#9999dd' },
  { name: 'Mars',     r: 25, color: '#dd5533', glow: '#ff4422' },
  { name: 'Earth',    r: 32, color: '#3388dd', glow: '#22aaff' },
  { name: 'Neptune',  r: 40, color: '#4455cc', glow: '#5566ff' },
  { name: 'Saturn',   r: 50, color: '#ddaa44', glow: '#ffcc33' },
  { name: 'Jupiter',  r: 62, color: '#cc8844', glow: '#ff9933' },
  { name: 'Red Giant', r: 76, color: '#ff3322', glow: '#ff5544' },
  { name: 'STAR',     r: 92, color: '#ffffff', glow: '#ffffaa' },
];

// --- GAME STATE ---
let W, H, cx, cy, starR, arenaR;
let score, highScore, combo, comboTimer, maxTier;
let orbiting = [];   // planets in orbit
let freePlanets = []; // released planets
let particles = [];
let shakeX = 0, shakeY = 0, shakeMag = 0;
let spawnTimer = 0;
let gameOver = false;
let hintVisible = true;
let hintTimer = 0;
let starPulse = 0;
let bgStars = [];

function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  C.width = W * dpr;
  C.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2;
  cy = H / 2;
  const minDim = Math.min(W, H);
  starR = minDim * 0.045;
  arenaR = minDim * 0.44;
  generateBgStars();
}

function generateBgStars() {
  bgStars = [];
  for (let i = 0; i < 120; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: Math.random() * 1.5 + 0.3,
      b: Math.random() * 0.5 + 0.2,
      phase: Math.random() * Math.PI * 2
    });
  }
}

highScore = parseInt(localStorage.getItem('orbitmerge_high') || '0');
highEl.textContent = highScore;

function init() {
  score = 0; combo = 0; comboTimer = 0; maxTier = 0;
  orbiting = []; freePlanets = []; particles = [];
  shakeX = 0; shakeY = 0; shakeMag = 0;
  spawnTimer = 0; gameOver = false;
  hintVisible = true; hintTimer = 0;
  scoreEl.textContent = '0';
  goScreen.classList.remove('active');
  hintEl.style.opacity = '1';
  comboEl.style.opacity = '0';
  // Spawn initial orbiting planets
  for (let i = 0; i < 4; i++) {
    spawnOrbiting();
  }
}

function spawnOrbiting() {
  if (orbiting.length >= 10) return false;
  // Pick tier: weighted toward small
  let tier = 0;
  const r = Math.random();
  if (r > 0.85) tier = 2;
  else if (r > 0.55) tier = 1;

  const orbitR = arenaR * (0.3 + Math.random() * 0.35);
  const angle = Math.random() * Math.PI * 2;
  const speed = (0.4 + Math.random() * 0.5) * (Math.random() > 0.5 ? 1 : -1);

  // Check we don't overlap with existing
  const px = cx + Math.cos(angle) * orbitR;
  const py = cy + Math.sin(angle) * orbitR;
  const pr = TIERS[tier].r;
  for (const o of orbiting) {
    const dx = (cx + Math.cos(o.angle) * o.orbitR) - px;
    const dy = (cy + Math.sin(o.angle) * o.orbitR) - py;
    if (Math.sqrt(dx*dx + dy*dy) < pr + TIERS[o.tier].r + 4) return false;
  }

  orbiting.push({ tier, orbitR, angle, speed, pulse: 0 });
  sfxSpawn();
  return true;
}

function releasePlanet(idx) {
  const o = orbiting[idx];
  const t = TIERS[o.tier];
  const x = cx + Math.cos(o.angle) * o.orbitR;
  const y = cy + Math.sin(o.angle) * o.orbitR;
  // Tangential velocity (perpendicular to radial direction)
  const dir = o.speed > 0 ? 1 : -1;
  const speed = Math.abs(o.speed) * o.orbitR * 0.025;
  const vx = -Math.sin(o.angle) * dir * speed;
  const vy = Math.cos(o.angle) * dir * speed;

  freePlanets.push({
    x, y, vx, vy, tier: o.tier, merging: false, life: 0,
    trail: []
  });
  orbiting.splice(idx, 1);
  sfxRelease();

  // Release particles
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 2 + 1;
    particles.push({
      x, y, vx: Math.cos(a)*s + vx*0.3, vy: Math.sin(a)*s + vy*0.3,
      life: 1, decay: 0.03 + Math.random()*0.02,
      r: 2, color: t.glow
    });
  }

  if (hintVisible) {
    hintVisible = false;
    hintEl.style.opacity = '0';
  }
}

function mergeEffect(x, y, tier) {
  const t = TIERS[tier];
  const count = 15 + tier * 5;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * 4 + 2 + tier * 0.5;
    particles.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: 1, decay: 0.015 + Math.random()*0.015,
      r: Math.random() * 3 + 1.5, color: t.glow
    });
  }
  // Ring
  particles.push({
    x, y, vx: 0, vy: 0,
    life: 1, decay: 0.04,
    r: t.r, ring: true, color: t.glow
  });
  shakeMag = Math.min(6 + tier * 2, 20);
}

function checkMerges() {
  for (let i = 0; i < freePlanets.length; i++) {
    if (freePlanets[i].merging) continue;
    for (let j = i + 1; j < freePlanets.length; j++) {
      if (freePlanets[j].merging) continue;
      const a = freePlanets[i], b = freePlanets[j];
      if (a.tier !== b.tier) continue;
      if (a.tier >= TIERS.length - 1) continue;

      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const minDist = TIERS[a.tier].r + TIERS[b.tier].r;

      if (dist < minDist) {
        // MERGE!
        const nx = (a.x + b.x) / 2;
        const ny = (a.y + b.y) / 2;
        const newTier = a.tier + 1;

        a.merging = true;
        b.merging = true;

        freePlanets.push({
          x: nx, y: ny,
          vx: (a.vx + b.vx) * 0.3,
          vy: (a.vy + b.vy) * 0.3,
          tier: newTier, merging: false, life: 0,
          trail: []
        });

        mergeEffect(nx, ny, newTier);
        sfxMerge(newTier);

        // Score
        const pts = (newTier + 1) * (newTier + 1) * 10;
        combo++;
        comboTimer = 120; // 2 seconds
        const multiplier = Math.min(combo, 5);
        score += pts * multiplier;
        scoreEl.textContent = score;

        if (combo > 1) {
          comboEl.textContent = `${combo}x COMBO!`;
          comboEl.style.opacity = '1';
        }

        if (newTier > maxTier) maxTier = newTier;

        // Check game over (created a STAR)
        if (newTier === TIERS.length - 1) {
          // Huge celebration but game continues
          shakeMag = 25;
          for (let k = 0; k < 80; k++) {
            const a2 = Math.random() * Math.PI * 2;
            const s = Math.random() * 8 + 3;
            particles.push({
              x: nx, y: ny, vx: Math.cos(a2)*s, vy: Math.sin(a2)*s,
              life: 1, decay: 0.008 + Math.random()*0.008,
              r: Math.random()*4+2, color: ['#fff','#ffa','#ffd','#aef'][Math.floor(Math.random()*4)]
            });
          }
        }
      }
    }
  }
  // Remove merged planets
  freePlanets = freePlanets.filter(p => !p.merging);
}

function checkCollisions() {
  // Bounce free planets off each other (different tiers)
  for (let i = 0; i < freePlanets.length; i++) {
    for (let j = i + 1; j < freePlanets.length; j++) {
      const a = freePlanets[i], b = freePlanets[j];
      if (a.tier === b.tier) continue; // handled by merge
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const minDist = TIERS[a.tier].r + TIERS[b.tier].r;
      if (dist < minDist && dist > 0) {
        // Elastic bounce
        const nx = dx / dist, ny = dy / dist;
        const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
        const dot = dvx * nx + dvy * ny;
        if (dot > 0) continue; // moving apart
        const massA = TIERS[a.tier].r * TIERS[a.tier].r;
        const massB = TIERS[b.tier].r * TIERS[b.tier].r;
        const totalMass = massA + massB;
        a.vx -= (2 * massB / totalMass) * dot * nx;
        a.vy -= (2 * massB / totalMass) * dot * ny;
        b.vx += (2 * massA / totalMass) * dot * nx;
        b.vy += (2 * massA / totalMass) * dot * ny;
        // Separate
        const overlap = minDist - dist;
        a.x += nx * overlap * 0.5;
        a.y += ny * overlap * 0.5;
        b.x -= nx * overlap * 0.5;
        b.y -= ny * overlap * 0.5;
        sfxBounce();
      }
    }
  }
}

function update() {
  if (gameOver) return;

  starPulse += 0.03;

  // Update orbiting planets
  for (const o of orbiting) {
    o.angle += o.speed * 0.016;
    o.pulse = (o.pulse + 0.05) % (Math.PI * 2);
  }

  // Spawn new orbiting planets
  spawnTimer++;
  const spawnRate = Math.max(60, 150 - score / 200); // gets faster
  if (spawnTimer > spawnRate && orbiting.length < 8) {
    spawnOrbiting();
    spawnTimer = 0;
  }

  // Game over if too many orbiting (overwhelmed)
  if (orbiting.length >= 10) {
    endGame();
    return;
  }

  // Update free planets
  for (const p of freePlanets) {
    // Light gravity toward center
    const dx = cx - p.x;
    const dy = cy - p.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 1) {
      const grav = 0.02;
      p.vx += (dx / dist) * grav;
      p.vy += (dy / dist) * grav;
    }

    // Friction
    p.vx *= 0.999;
    p.vy *= 0.999;

    p.x += p.vx;
    p.y += p.vy;
    p.life++;

    // Trail
    if (p.life % 2 === 0) {
      p.trail.push({ x: p.x, y: p.y, a: 0.5 });
      if (p.trail.length > 12) p.trail.shift();
    }
    for (const t of p.trail) t.a *= 0.92;

    // Bounce off arena boundary
    const pr = TIERS[p.tier].r;
    const edgeDist = dist + pr - arenaR;
    if (edgeDist > 0 && dist > 0) {
      const nx = dx / dist, ny = dy / dist;
      p.x += nx * edgeDist;
      p.y += ny * edgeDist;
      // Reflect velocity
      const dot = p.vx * (-nx) + p.vy * (-ny);
      p.vx += 2 * dot * (-nx) * 0.6;
      p.vy += 2 * dot * (-ny) * 0.6;
      sfxBounce();
    }

    // Hit central star? -> destroy planet
    if (dist < starR + pr) {
      p.merging = true;
      // Small explosion
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = Math.random() * 2 + 1;
        particles.push({
          x: p.x, y: p.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
          life: 1, decay: 0.04, r: 2, color: '#ff8844'
        });
      }
      shakeMag = Math.max(shakeMag, 3);
    }
  }

  freePlanets = freePlanets.filter(p => !p.merging);

  checkMerges();
  checkCollisions();

  // Update particles
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life -= p.decay;
    if (p.ring) p.r += 2;
  }
  particles = particles.filter(p => p.life > 0);

  // Shake
  if (shakeMag > 0) {
    shakeX = (Math.random() - 0.5) * shakeMag;
    shakeY = (Math.random() - 0.5) * shakeMag;
    shakeMag *= 0.88;
    if (shakeMag < 0.3) shakeMag = 0;
  } else {
    shakeX = 0; shakeY = 0;
  }

  // Combo timer
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer <= 0) {
      combo = 0;
      comboEl.style.opacity = '0';
    }
  }

  // Hint auto-hide
  if (hintVisible) {
    hintTimer++;
    if (hintTimer > 300) {
      hintVisible = false;
      hintEl.style.opacity = '0';
    }
  }
}

function endGame() {
  gameOver = true;
  sfxGameOver();

  const isNew = score > highScore;
  if (isNew) {
    highScore = score;
    localStorage.setItem('orbitmerge_high', highScore);
    highEl.textContent = highScore;
  }

  finalScoreEl.textContent = `Score: ${score}`;
  newBestEl.textContent = isNew ? 'NEW HIGH SCORE!' : '';
  biggestEl.textContent = `Biggest: ${TIERS[maxTier].name} (Tier ${maxTier + 1}/${TIERS.length})`;
  goScreen.classList.add('active');
}

function draw() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Background
  ctx.fillStyle = '#08080f';
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // Background stars
  const time = performance.now() * 0.001;
  for (const s of bgStars) {
    const twinkle = s.b + Math.sin(time * 1.5 + s.phase) * 0.15;
    ctx.fillStyle = `rgba(200,210,255,${twinkle})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  // Arena boundary (subtle)
  ctx.beginPath();
  ctx.arc(cx, cy, arenaR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(60,70,120,0.15)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Orbit paths (faint)
  for (const o of orbiting) {
    ctx.beginPath();
    ctx.arc(cx, cy, o.orbitR, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(60,80,140,0.12)';
    ctx.lineWidth = 0.5;
    ctx.setLineDash([4, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Central star
  const sp = Math.sin(starPulse) * 0.15 + 1;
  const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, starR * 3 * sp);
  gradient.addColorStop(0, 'rgba(255,240,200,0.9)');
  gradient.addColorStop(0.3, 'rgba(255,180,80,0.3)');
  gradient.addColorStop(1, 'rgba(255,120,40,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(cx - starR*4, cy - starR*4, starR*8, starR*8);

  ctx.beginPath();
  ctx.arc(cx, cy, starR, 0, Math.PI * 2);
  const starGrad = ctx.createRadialGradient(cx - starR*0.2, cy - starR*0.2, 0, cx, cy, starR);
  starGrad.addColorStop(0, '#fffbe0');
  starGrad.addColorStop(0.7, '#ffcc44');
  starGrad.addColorStop(1, '#ff8800');
  ctx.fillStyle = starGrad;
  ctx.fill();

  // Draw free planet trails
  for (const p of freePlanets) {
    const t = TIERS[p.tier];
    for (const tr of p.trail) {
      if (tr.a < 0.05) continue;
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, t.r * 0.3, 0, Math.PI * 2);
      ctx.fillStyle = t.glow + Math.floor(tr.a * 40).toString(16).padStart(2, '0');
      ctx.fill();
    }
  }

  // Draw free planets
  for (const p of freePlanets) {
    drawPlanet(p.x, p.y, p.tier, false);
  }

  // Draw orbiting planets
  for (const o of orbiting) {
    const x = cx + Math.cos(o.angle) * o.orbitR;
    const y = cy + Math.sin(o.angle) * o.orbitR;
    const pulseScale = 1 + Math.sin(o.pulse) * 0.05;
    drawPlanet(x, y, o.tier, true, pulseScale);
  }

  // Particles
  for (const p of particles) {
    if (p.ring) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.strokeStyle = p.color + Math.floor(p.life * 180).toString(16).padStart(2, '0');
      ctx.lineWidth = 2;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.color + Math.floor(p.life * 220).toString(16).padStart(2, '0');
      ctx.fill();
    }
  }

  // Orbiting count warning
  if (orbiting.length >= 7 && !gameOver) {
    const warn = Math.sin(time * 4) * 0.3 + 0.5;
    ctx.beginPath();
    ctx.arc(cx, cy, arenaR, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,50,30,${warn * 0.3})`;
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  ctx.restore();
}

function drawPlanet(x, y, tier, isOrbiting, scale = 1) {
  const t = TIERS[tier];
  const r = t.r * scale;

  // Glow
  const glow = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2.2);
  glow.addColorStop(0, t.glow + '40');
  glow.addColorStop(1, t.glow + '00');
  ctx.fillStyle = glow;
  ctx.fillRect(x - r*3, y - r*3, r*6, r*6);

  // Body
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  const bodyGrad = ctx.createRadialGradient(x - r*0.25, y - r*0.25, 0, x, y, r);
  bodyGrad.addColorStop(0, lighten(t.color, 40));
  bodyGrad.addColorStop(0.7, t.color);
  bodyGrad.addColorStop(1, darken(t.color, 40));
  ctx.fillStyle = bodyGrad;
  ctx.fill();

  // Specular highlight
  ctx.beginPath();
  ctx.arc(x - r*0.25, y - r*0.3, r * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fill();

  // Saturn ring
  if (tier === 6) {
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.6, r * 0.3, -0.3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(220,180,80,0.5)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  // Star tier - extra rays
  if (tier === TIERS.length - 1) {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + performance.now() * 0.001;
      const len = r * 0.6 + Math.sin(performance.now() * 0.003 + i) * r * 0.2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      ctx.lineTo(x + Math.cos(a) * (r + len), y + Math.sin(a) * (r + len));
      ctx.strokeStyle = 'rgba(255,255,200,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // Orbiting indicator: soft pulse ring
  if (isOrbiting) {
    ctx.beginPath();
    ctx.arc(x, y, r + 4, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(180,200,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([3, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Tier number (small, inside)
  if (r >= 14) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = `bold ${Math.max(10, r * 0.5)}px system-ui`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(tier + 1, x, y);
  }
}

function lighten(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
  return `rgb(${r},${g},${b})`;
}

function darken(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.max(0, r - amt); g = Math.max(0, g - amt); b = Math.max(0, b - amt);
  return `rgb(${r},${g},${b})`;
}

// --- INPUT ---
function getPos(e) {
  if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function handleTap(px, py) {
  ensureAudio();
  if (gameOver) return;

  // Find closest orbiting planet to tap
  let bestIdx = -1, bestDist = Infinity;
  for (let i = 0; i < orbiting.length; i++) {
    const o = orbiting[i];
    const ox = cx + Math.cos(o.angle) * o.orbitR;
    const oy = cy + Math.sin(o.angle) * o.orbitR;
    const dx = ox - px, dy = oy - py;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const hitR = Math.max(TIERS[o.tier].r + 20, 44); // min 44px tap target
    if (dist < hitR && dist < bestDist) {
      bestDist = dist;
      bestIdx = i;
    }
  }

  if (bestIdx >= 0) {
    releasePlanet(bestIdx);
  }
}

C.addEventListener('touchstart', e => {
  e.preventDefault();
  const p = getPos(e);
  handleTap(p.x, p.y);
}, { passive: false });

C.addEventListener('mousedown', e => {
  handleTap(e.clientX, e.clientY);
});

// Keyboard: number keys release Nth planet, space releases random
document.addEventListener('keydown', e => {
  ensureAudio();
  if (gameOver) {
    if (e.code === 'Space' || e.code === 'Enter') {
      init();
    }
    return;
  }

  if (e.code === 'Space' && orbiting.length > 0) {
    releasePlanet(0);
  } else if (e.key >= '1' && e.key <= '9') {
    const idx = parseInt(e.key) - 1;
    if (idx < orbiting.length) releasePlanet(idx);
  }
});

restartBtn.addEventListener('click', () => { ensureAudio(); init(); });
restartBtn.addEventListener('touchend', e => { e.preventDefault(); ensureAudio(); init(); });

// --- GAME LOOP ---
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
init();
loop();
</script>
</body>
