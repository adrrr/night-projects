<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>COLOR GRAVITY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;font-family:'Courier New',monospace}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;width:100%;pointer-events:none;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;z-index:10}
#ui *{pointer-events:none}
.ui-col{display:flex;flex-direction:column;gap:4px}
.ui-label{font-size:11px;color:#556;text-transform:uppercase;letter-spacing:2px}
.ui-value{font-size:22px;font-weight:bold;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.3)}
#combo-display{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:bold;color:#fff;text-shadow:0 0 30px rgba(255,255,255,.6);opacity:0;transition:none;pointer-events:none;z-index:10}
#mode-indicator{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 28px;border-radius:30px;font-size:15px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;pointer-events:none;z-index:10;transition:all .15s ease}
#mode-indicator.attract{background:rgba(0,180,255,.15);color:#0bf;border:2px solid rgba(0,180,255,.4);box-shadow:0 0 20px rgba(0,180,255,.2)}
#mode-indicator.repel{background:rgba(255,60,90,.15);color:#f36;border:2px solid rgba(255,60,90,.4);box-shadow:0 0 20px rgba(255,60,90,.2)}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;background:rgba(10,10,18,.95)}
#menu h1{font-size:clamp(32px,8vw,56px);color:#fff;text-shadow:0 0 40px rgba(100,200,255,.4),0 0 80px rgba(100,200,255,.2);margin-bottom:8px;letter-spacing:4px}
#menu .subtitle{font-size:clamp(12px,3vw,16px);color:#556;letter-spacing:6px;text-transform:uppercase;margin-bottom:40px}
#menu .hi-score{font-size:16px;color:#0bf;margin-bottom:30px}
.btn{pointer-events:all;padding:16px 48px;font-size:18px;font-weight:bold;font-family:inherit;letter-spacing:3px;text-transform:uppercase;border:2px solid #0bf;background:rgba(0,180,255,.1);color:#0bf;border-radius:40px;cursor:pointer;min-width:200px;min-height:56px;transition:all .2s}
.btn:active{transform:scale(.95);background:rgba(0,180,255,.25)}
#menu .instructions{margin-top:32px;color:#445;font-size:clamp(11px,2.5vw,13px);line-height:1.8;text-align:center;max-width:320px}
#menu .instructions span{color:#889}
#game-over{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;background:rgba(10,10,18,.92)}
#game-over h2{font-size:clamp(28px,7vw,44px);color:#f36;text-shadow:0 0 30px rgba(255,60,90,.4);margin-bottom:8px}
#game-over .final-score{font-size:clamp(40px,10vw,64px);color:#fff;font-weight:bold;margin:16px 0}
#game-over .new-best{font-size:16px;color:#0f8;margin-bottom:24px;min-height:24px}
#game-over .stats{color:#556;font-size:13px;margin-bottom:28px;line-height:2}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div class="ui-col">
    <div class="ui-label">Score</div>
    <div class="ui-value" id="score-val">0</div>
  </div>
  <div class="ui-col" style="align-items:center">
    <div class="ui-label">Lives</div>
    <div class="ui-value" id="lives-val">&#x2764; &#x2764; &#x2764;</div>
  </div>
  <div class="ui-col" style="align-items:flex-end">
    <div class="ui-label">Best</div>
    <div class="ui-value" id="best-val">0</div>
  </div>
</div>

<div id="combo-display"></div>
<div id="mode-indicator" class="attract">ATTRACT</div>

<div id="menu">
  <h1>COLOR GRAVITY</h1>
  <div class="subtitle">Night Projects</div>
  <div class="hi-score" id="menu-best"></div>
  <button class="btn" id="start-btn">PLAY</button>
  <div class="instructions">
    <span>Move</span> to aim your gravity well<br>
    <span>Tap / Space</span> to toggle attract ↔ repel<br>
    <span>Match 3+</span> same-color orbs for points<br>
    <span>Chain combos</span> for massive multipliers
  </div>
</div>

<div id="game-over">
  <h2>GAME OVER</h2>
  <div class="final-score" id="go-score">0</div>
  <div class="new-best" id="go-best"></div>
  <div class="stats" id="go-lives"></div>
  <div class="stats" id="go-stats"></div>
  <button class="btn" id="restart-btn">AGAIN</button>
</div>

<script>
'use strict';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score-val');
const bestEl = document.getElementById('best-val');
const livesEl = document.getElementById('lives-val');
const comboEl = document.getElementById('combo-display');
const modeEl = document.getElementById('mode-indicator');
const menuEl = document.getElementById('menu');
const goEl = document.getElementById('game-over');
const goScoreEl = document.getElementById('go-score');
const goBestEl = document.getElementById('go-best');
const goStatsEl = document.getElementById('go-stats');
const goLivesEl = document.getElementById('go-lives');
const menuBestEl = document.getElementById('menu-best');

// --- AUDIO ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function resumeAudio() { if (audioCtx.state === 'suspended') audioCtx.resume(); }

function playTone(freq, dur, vol, type) {
  const g = audioCtx.createGain();
  const o = audioCtx.createOscillator();
  o.type = type || 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}
function sfxMatch(combo) {
  const base = 300 + combo * 80;
  playTone(base, 0.15, 0.12, 'sine');
  setTimeout(() => playTone(base * 1.25, 0.12, 0.10, 'sine'), 60);
  setTimeout(() => playTone(base * 1.5, 0.2, 0.08, 'triangle'), 120);
}
function sfxToggle(attract) {
  playTone(attract ? 600 : 300, 0.08, 0.06, 'square');
  playTone(attract ? 800 : 200, 0.1, 0.05, 'sine');
}
function sfxLoseLife() {
  playTone(250, 0.15, 0.10, 'sawtooth');
  setTimeout(() => playTone(180, 0.2, 0.08, 'sawtooth'), 100);
}
function sfxDeath() {
  playTone(200, 0.3, 0.12, 'sawtooth');
  setTimeout(() => playTone(120, 0.4, 0.10, 'sawtooth'), 150);
  setTimeout(() => playTone(70, 0.6, 0.08, 'sawtooth'), 350);
}

// --- COLORS ---
const COLORS = [
  { h: '#00ccff', r: 0, g: 204, b: 255 },     // cyan
  { h: '#ff3366', r: 255, g: 51, b: 102 },     // pink
  { h: '#33ff88', r: 51, g: 255, b: 136 },     // green
  { h: '#ffaa00', r: 255, g: 170, b: 0 },      // orange
  { h: '#aa55ff', r: 170, g: 85, b: 255 },     // purple
  { h: '#ff4444', r: 255, g: 68, b: 68 },      // red
  { h: '#ffee33', r: 255, g: 238, b: 51 },     // yellow
];

// --- STATE ---
let W, H, dpr;
let orbs = [], particles = [], flashEffects = [];
let wellX, wellY, attract = true;
let score = 0, bestScore = 0, level = 1, combo = 0, maxCombo = 0, totalMatches = 0, lives = 3;
let gameActive = false, shakeX = 0, shakeY = 0, shakeDur = 0;
let spawnTimer = 0, spawnInterval, maxOrbs, numColors;
let deathLineY;
let comboTimer = 0;
let wellRadius = 0;
let wellPulse = 0;
let deathLinePulse = 0;
let loseLifeFlash = 0;

function updateLivesDisplay() {
  livesEl.textContent = '\u2764 '.repeat(lives).trim();
  livesEl.style.color = lives <= 1 ? '#f36' : '#fff';
}

function loadBest() { bestScore = parseInt(localStorage.getItem('colorGravityBest') || '0'); }
function saveBest() { localStorage.setItem('colorGravityBest', bestScore); }

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  deathLineY = H - 80;
}

function setLevel() {
  const l = level;
  numColors = Math.min(3 + Math.floor((l - 1) / 2), COLORS.length);
  spawnInterval = Math.max(18, 50 - l * 4);
  maxOrbs = Math.min(60 + l * 8, 150);
  wellRadius = Math.min(W, H) * 0.28;
}

// --- ORB ---
function spawnOrb() {
  if (orbs.length >= maxOrbs) return;
  const ci = Math.floor(Math.random() * numColors);
  const r = 14 + Math.random() * 6;
  orbs.push({
    x: 30 + Math.random() * (W - 60),
    y: -r - Math.random() * 40,
    vx: (Math.random() - 0.5) * 0.6,
    vy: 0.21 + Math.random() * 0.21 + level * 0.056,
    r, ci,
    matched: false,
    matchTimer: 0,
    glow: 0,
  });
}

// --- PARTICLE ---
function spawnParticles(x, y, ci, count) {
  const c = COLORS[ci];
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      life: 0.6 + Math.random() * 0.4,
      maxLife: 0.6 + Math.random() * 0.4,
      r: c.r, g: c.g, b: c.b,
      size: 2 + Math.random() * 3,
    });
  }
}

function spawnRing(x, y, ci) {
  const c = COLORS[ci];
  flashEffects.push({ x, y, r: 10, maxR: 80 + Math.random() * 40, life: 1, cr: c.r, cg: c.g, cb: c.b });
}

function shake(amount) {
  shakeDur = 8;
  shakeX = (Math.random() - 0.5) * amount;
  shakeY = (Math.random() - 0.5) * amount;
}

// --- MATCH DETECTION ---
function findMatches() {
  const MATCH_DIST = 38;
  const groups = [];
  const visited = new Set();

  for (let i = 0; i < orbs.length; i++) {
    if (visited.has(i) || orbs[i].matched) continue;
    const ci = orbs[i].ci;
    const group = [];
    const stack = [i];
    while (stack.length) {
      const idx = stack.pop();
      if (visited.has(idx)) continue;
      if (orbs[idx].ci !== ci || orbs[idx].matched) continue;
      visited.add(idx);
      group.push(idx);
      for (let j = 0; j < orbs.length; j++) {
        if (visited.has(j) || orbs[j].ci !== ci || orbs[j].matched) continue;
        const dx = orbs[idx].x - orbs[j].x;
        const dy = orbs[idx].y - orbs[j].y;
        if (dx * dx + dy * dy < MATCH_DIST * MATCH_DIST) {
          stack.push(j);
        }
      }
    }
    if (group.length >= 3) groups.push({ ci, indices: group });
  }
  return groups;
}

function processMatches() {
  const groups = findMatches();
  if (groups.length === 0) {
    combo = 0;
    return;
  }
  combo++;
  if (combo > maxCombo) maxCombo = combo;

  for (const g of groups) {
    const pts = g.indices.length * 10 * combo * level;
    score += pts;
    totalMatches += g.indices.length;

    let cx = 0, cy = 0;
    for (const idx of g.indices) {
      const o = orbs[idx];
      o.matched = true;
      o.matchTimer = 12;
      spawnParticles(o.x, o.y, o.ci, 6);
      cx += o.x; cy += o.y;
    }
    cx /= g.indices.length; cy /= g.indices.length;
    spawnRing(cx, cy, g.ci);

    sfxMatch(combo);
    shake(3 + combo * 2);

    if (combo > 1) {
      comboEl.textContent = `${combo}x COMBO`;
      comboEl.style.opacity = '1';
      comboEl.style.transform = 'translate(-50%,-50%) scale(1.2)';
      comboTimer = 60;
    }
  }

  scoreEl.textContent = score;
  if (score > bestScore) {
    bestScore = score;
    bestEl.textContent = bestScore;
    saveBest();
  }

  // Level up every 500 pts
  const newLevel = Math.floor(score / 500) + 1;
  if (newLevel > level) {
    level = newLevel;
    setLevel();
  }
}

// --- PHYSICS ---
function updateOrbs() {
  const GRAVITY = 0.12;
  const WELL_STRENGTH = attract ? 0.35 : -0.45;
  const FRICTION = 0.985;

  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];

    if (o.matched) {
      o.matchTimer--;
      if (o.matchTimer <= 0) {
        orbs.splice(i, 1);
      }
      continue;
    }

    // Normal gravity
    o.vy += GRAVITY;

    // Gravity well influence
    const dx = wellX - o.x;
    const dy = wellY - o.y;
    const distSq = dx * dx + dy * dy;
    const dist = Math.sqrt(distSq);

    if (dist < wellRadius && dist > 1) {
      const strength = WELL_STRENGTH * (1 - dist / wellRadius);
      o.vx += (dx / dist) * strength;
      o.vy += (dy / dist) * strength;
      o.glow = Math.min(1, o.glow + 0.08);
    } else {
      o.glow = Math.max(0, o.glow - 0.04);
    }

    // Orb-orb collision
    for (let j = i + 1; j < orbs.length; j++) {
      const o2 = orbs[j];
      if (o2.matched) continue;
      const bx = o.x - o2.x;
      const by = o.y - o2.y;
      const bDistSq = bx * bx + by * by;
      const minDist = o.r + o2.r;
      if (bDistSq < minDist * minDist && bDistSq > 0.1) {
        const bDist = Math.sqrt(bDistSq);
        const nx = bx / bDist;
        const ny = by / bDist;
        const overlap = (minDist - bDist) * 0.5;
        o.x += nx * overlap;
        o.y += ny * overlap;
        o2.x -= nx * overlap;
        o2.y -= ny * overlap;

        // Elastic-ish bounce
        const relVx = o.vx - o2.vx;
        const relVy = o.vy - o2.vy;
        const dot = relVx * nx + relVy * ny;
        if (dot > 0) {
          o.vx -= dot * nx * 0.5;
          o.vy -= dot * ny * 0.5;
          o2.vx += dot * nx * 0.5;
          o2.vy += dot * ny * 0.5;
        }
      }
    }

    o.vx *= FRICTION;
    o.vy *= FRICTION;
    o.x += o.vx;
    o.y += o.vy;

    // Wall bounds
    if (o.x < o.r) { o.x = o.r; o.vx *= -0.5; }
    if (o.x > W - o.r) { o.x = W - o.r; o.vx *= -0.5; }
    if (o.y > deathLineY + 60) {
      // Orb crossed death line — lose a life
      spawnParticles(o.x, o.y, o.ci, 8);
      orbs.splice(i, 1);
      lives--;
      loseLifeFlash = 12;
      updateLivesDisplay();
      sfxLoseLife();
      shake(6);
      if (lives <= 0) {
        gameOver();
        return;
      }
      continue;
    }
  }
}

// --- GAME OVER ---
function gameOver() {
  gameActive = false;
  sfxDeath();
  shake(12);

  goScoreEl.textContent = score;
  goBestEl.textContent = (bestScore > 0 && score >= bestScore) ? 'NEW BEST!' : '';
  goLivesEl.textContent = `Lives remaining: ${lives}`;
  goStatsEl.innerHTML = `Level ${level} · ${totalMatches} orbs matched · ${maxCombo}x max combo`;
  goEl.style.display = 'flex';
}

function startGame() {
  resumeAudio();
  orbs = []; particles = []; flashEffects = [];
  score = 0; level = 1; combo = 0; maxCombo = 0; totalMatches = 0; lives = 3;
  attract = true;
  spawnTimer = 0;
  scoreEl.textContent = '0';
  updateLivesDisplay();
  bestEl.textContent = bestScore;
  modeEl.className = 'attract';
  modeEl.textContent = 'ATTRACT';
  comboEl.style.opacity = '0';
  menuEl.classList.add('hidden');
  goEl.style.display = 'none';
  wellX = W / 2;
  wellY = H * 0.6;
  wellPulse = 0;
  setLevel();
  gameActive = true;
}

// --- INPUT ---
let pointerDown = false;

function handlePointerMove(x, y) {
  wellX = x;
  wellY = y;
}

function toggleMode() {
  attract = !attract;
  modeEl.className = attract ? 'attract' : 'repel';
  modeEl.textContent = attract ? 'ATTRACT' : 'REPEL';
  sfxToggle(attract);
  wellPulse = 1;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  resumeAudio();
  pointerDown = true;
  handlePointerMove(e.clientX, e.clientY);
});
canvas.addEventListener('pointermove', (e) => {
  e.preventDefault();
  if (pointerDown || true) handlePointerMove(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', (e) => {
  e.preventDefault();
  pointerDown = false;
});

// Double tap / tap to toggle
let lastTap = 0;
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const now = Date.now();
  if (now - lastTap < 300) {
    toggleMode();
  }
  lastTap = now;
  const t = e.touches[0];
  handlePointerMove(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  handlePointerMove(t.clientX, t.clientY);
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && gameActive) {
    e.preventDefault();
    toggleMode();
  }
});

// Click on canvas to toggle (mouse users — single click)
canvas.addEventListener('click', (e) => {
  if (gameActive && e.pointerType !== 'touch') {
    toggleMode();
  }
});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('start-btn').addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });
document.getElementById('restart-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('touchend', (e) => { e.preventDefault(); startGame(); });

// --- DRAW ---
function draw() {
  ctx.save();

  // Screen shake
  if (shakeDur > 0) {
    shakeDur--;
    ctx.translate(shakeX * (shakeDur / 8), shakeY * (shakeDur / 8));
  }

  // Background
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(-20, -20, W + 40, H + 40);

  // Subtle grid
  ctx.strokeStyle = 'rgba(40,40,70,0.3)';
  ctx.lineWidth = 0.5;
  const gridSize = 50;
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = 0; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Death line with pulsing red glow
  deathLinePulse += 0.04;
  const dlAlpha = 0.2 + Math.sin(deathLinePulse * 2) * 0.1;
  const dlGlowAlpha = 0.08 + Math.sin(deathLinePulse * 2) * 0.05;
  // Glow underneath the line
  const dlGrad = ctx.createLinearGradient(0, deathLineY - 20, 0, deathLineY + 20);
  dlGrad.addColorStop(0, 'rgba(255,50,80,0)');
  dlGrad.addColorStop(0.5, `rgba(255,50,80,${dlGlowAlpha})`);
  dlGrad.addColorStop(1, 'rgba(255,50,80,0)');
  ctx.fillStyle = dlGrad;
  ctx.fillRect(0, deathLineY - 20, W, 40);
  // Main line
  ctx.strokeStyle = `rgba(255,50,80,${dlAlpha})`;
  ctx.lineWidth = 2;
  ctx.shadowColor = 'rgba(255,50,80,0.6)';
  ctx.shadowBlur = 12 + Math.sin(deathLinePulse * 2) * 6;
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(0, deathLineY);
  ctx.lineTo(W, deathLineY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;

  // Lose life red flash overlay
  if (loseLifeFlash > 0) {
    loseLifeFlash--;
    ctx.fillStyle = `rgba(255,30,60,${loseLifeFlash / 30})`;
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  // Gravity well visualization
  if (gameActive) {
    wellPulse *= 0.92;
    const wr = wellRadius * (1 + wellPulse * 0.3);
    const wellColor = attract ? [0, 180, 255] : [255, 60, 90];
    const grad = ctx.createRadialGradient(wellX, wellY, 0, wellX, wellY, wr);
    grad.addColorStop(0, `rgba(${wellColor[0]},${wellColor[1]},${wellColor[2]},0.08)`);
    grad.addColorStop(0.5, `rgba(${wellColor[0]},${wellColor[1]},${wellColor[2]},0.03)`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(wellX, wellY, wr, 0, Math.PI * 2);
    ctx.fill();

    // Well center dot
    ctx.fillStyle = attract ? 'rgba(0,200,255,0.6)' : 'rgba(255,80,120,0.6)';
    ctx.beginPath();
    ctx.arc(wellX, wellY, 5, 0, Math.PI * 2);
    ctx.fill();

    // Crosshair
    ctx.strokeStyle = attract ? 'rgba(0,200,255,0.25)' : 'rgba(255,80,120,0.25)';
    ctx.lineWidth = 1;
    const ch = 12;
    ctx.beginPath();
    ctx.moveTo(wellX - ch, wellY); ctx.lineTo(wellX + ch, wellY);
    ctx.moveTo(wellX, wellY - ch); ctx.lineTo(wellX, wellY + ch);
    ctx.stroke();
  }

  // Flash effects (rings)
  for (let i = flashEffects.length - 1; i >= 0; i--) {
    const f = flashEffects[i];
    f.life -= 0.04;
    f.r += (f.maxR - f.r) * 0.15;
    if (f.life <= 0) { flashEffects.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(${f.cr},${f.cg},${f.cb},${f.life * 0.5})`;
    ctx.lineWidth = 2 * f.life;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Orbs
  for (const o of orbs) {
    if (o.matched && o.matchTimer > 0) {
      // Flash white then disappear
      const t = o.matchTimer / 12;
      ctx.globalAlpha = t;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r * (2 - t), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
      continue;
    }

    const c = COLORS[o.ci];

    // Glow
    if (o.glow > 0.05) {
      const glowGrad = ctx.createRadialGradient(o.x, o.y, o.r * 0.5, o.x, o.y, o.r * 2.5);
      glowGrad.addColorStop(0, `rgba(${c.r},${c.g},${c.b},${o.glow * 0.3})`);
      glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r * 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Main orb
    const orbGrad = ctx.createRadialGradient(o.x - o.r * 0.3, o.y - o.r * 0.3, 0, o.x, o.y, o.r);
    orbGrad.addColorStop(0, `rgba(${Math.min(255, c.r + 80)},${Math.min(255, c.g + 80)},${Math.min(255, c.b + 80)},1)`);
    orbGrad.addColorStop(0.7, c.h);
    orbGrad.addColorStop(1, `rgba(${c.r >> 1},${c.g >> 1},${c.b >> 1},1)`);
    ctx.fillStyle = orbGrad;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();

    // Specular highlight
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.arc(o.x - o.r * 0.25, o.y - o.r * 0.25, o.r * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= 0.02;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.vy += 0.03;
    const a = p.life / p.maxLife;
    ctx.fillStyle = `rgba(${p.r},${p.g},${p.b},${a})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

// --- COMBO DISPLAY ---
function updateCombo() {
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer <= 0) {
      comboEl.style.opacity = '0';
    } else {
      const s = 1 + (comboTimer / 60) * 0.2;
      comboEl.style.transform = `translate(-50%,-50%) scale(${s})`;
      comboEl.style.opacity = `${Math.min(1, comboTimer / 10)}`;
    }
  }
}

// --- MAIN LOOP ---
let matchCheckTimer = 0;

function loop() {
  requestAnimationFrame(loop);
  if (!gameActive) {
    draw();
    return;
  }

  // Spawn orbs
  spawnTimer++;
  if (spawnTimer >= spawnInterval) {
    spawnTimer = 0;
    spawnOrb();
  }

  updateOrbs();
  if (!gameActive) return; // game over happened in updateOrbs

  // Check matches periodically
  matchCheckTimer++;
  if (matchCheckTimer >= 8) {
    matchCheckTimer = 0;
    processMatches();
  }

  updateCombo();
  draw();
}

// --- INIT ---
loadBest();
bestEl.textContent = bestScore;
menuBestEl.textContent = bestScore > 0 ? `Best: ${bestScore}` : '';
resize();
window.addEventListener('resize', resize);
loop();
</script>
