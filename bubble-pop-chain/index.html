<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bubble Pop Chain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a1e;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
  }
  #ui {
    position: absolute; top: 0; left: 0; right: 0;
    pointer-events: none;
    padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: flex-start;
    z-index: 10;
  }
  .score-box {
    color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,0.5);
  }
  .score-box .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
    opacity: 0.6;
  }
  .score-box .value {
    font-size: 28px; font-weight: 700;
    line-height: 1.1;
  }
  .score-box.right { text-align: right; }
  #game-over {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(10,10,30,0.85);
    z-index: 20;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #game-over.show { display: flex; }
  #game-over h1 {
    font-size: 42px; color: #ff3366;
    text-shadow: 0 0 30px #ff336680, 0 0 60px #ff336640;
    margin-bottom: 8px;
  }
  #game-over .final-score {
    font-size: 20px; color: #fff; opacity: 0.8;
    margin-bottom: 4px;
  }
  #game-over .new-best {
    font-size: 16px; color: #ffcc00;
    text-shadow: 0 0 12px #ffcc0080;
    margin-bottom: 24px;
    min-height: 22px;
  }
  #restart-btn {
    pointer-events: auto;
    background: linear-gradient(135deg, #ff3366, #ff6633);
    color: #fff; border: none;
    padding: 16px 48px;
    font-size: 20px; font-weight: 700;
    border-radius: 50px;
    cursor: pointer;
    text-transform: uppercase; letter-spacing: 2px;
    box-shadow: 0 0 30px #ff336660;
    transition: transform 0.1s;
  }
  #restart-btn:active { transform: scale(0.95); }
  #chain-popup {
    position: absolute;
    pointer-events: none;
    font-size: 32px; font-weight: 900;
    color: #ffcc00;
    text-shadow: 0 0 20px #ffcc0080, 0 0 40px #ffcc0040;
    opacity: 0;
    z-index: 15;
    transition: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="score-box">
    <div class="label">Score</div>
    <div class="value" id="score-val">0</div>
  </div>
  <div class="score-box right">
    <div class="label">Best</div>
    <div class="value" id="best-val">0</div>
  </div>
</div>
<div id="chain-popup"></div>
<div id="game-over">
  <h1>GAME OVER</h1>
  <div class="final-score" id="final-score">Score: 0</div>
  <div class="new-best" id="new-best"></div>
  <button id="restart-btn">TAP TO RETRY</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score-val');
  const bestEl = document.getElementById('best-val');
  const chainPopup = document.getElementById('chain-popup');
  const gameOverEl = document.getElementById('game-over');
  const finalScoreEl = document.getElementById('final-score');
  const newBestEl = document.getElementById('new-best');
  const restartBtn = document.getElementById('restart-btn');

  let W, H, dpr;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // Audio
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function ensureAudio() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playPop(pitch = 1, delay = 0) {
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600 * pitch, t);
    osc.frequency.exponentialRampToValueAtTime(200 * pitch, t + 0.12);
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.15);
  }

  function playChain(count) {
    for (let i = 0; i < count; i++) {
      playPop(1 + i * 0.15, i * 0.06);
    }
  }

  function playGameOver() {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, t);
    osc.frequency.exponentialRampToValueAtTime(80, t + 0.6);
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.6);
  }

  // Colors — neon palette
  const COLORS = [
    { h: '#ff3366', g: '#ff336640' }, // pink
    { h: '#33ffcc', g: '#33ffcc40' }, // cyan
    { h: '#ffcc00', g: '#ffcc0040' }, // yellow
    { h: '#6633ff', g: '#6633ff40' }, // purple
    { h: '#33ff66', g: '#33ff6640' }, // green
    { h: '#ff6633', g: '#ff663340' }, // orange
  ];

  const BUBBLE_R_MIN = 22;
  const BUBBLE_R_MAX = 28;
  const DANGER_Y = 60;
  const CHAIN_DIST_FACTOR = 2.4;

  let bubbles, particles, popAnims, score, bestScore, gameRunning, gameOverShown;
  let spawnTimer, spawnInterval, elapsed, shakeAmount, shakeDecay;
  let chainPopups, dangerFrames;

  function loadBest() {
    try { return parseInt(localStorage.getItem('bpc_best')) || 0; } catch { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('bpc_best', v); } catch {}
  }

  function init() {
    bubbles = [];
    particles = [];
    popAnims = [];
    chainPopups = [];
    score = 0;
    bestScore = loadBest();
    gameRunning = true;
    gameOverShown = false;
    spawnInterval = 800;
    spawnTimer = 0;
    elapsed = 0;
    shakeAmount = 0;
    shakeDecay = 0;
    dangerFrames = 0;
    scoreEl.textContent = '0';
    bestEl.textContent = bestScore;
    gameOverEl.classList.remove('show');
    chainPopup.style.opacity = 0;
    // Spawn initial batch
    for (let i = 0; i < 8; i++) {
      spawnBubble(H * 0.5 + Math.random() * H * 0.4);
    }
  }

  function spawnBubble(startY) {
    const r = BUBBLE_R_MIN + Math.random() * (BUBBLE_R_MAX - BUBBLE_R_MIN);
    const x = r + Math.random() * (W - r * 2);
    const y = startY !== undefined ? startY : H + r;
    const ci = Math.floor(Math.random() * COLORS.length);
    bubbles.push({
      x, y, r, ci,
      vx: 0,
      vy: -(12 + Math.random() * 18), // upward speed
      wobblePhase: Math.random() * Math.PI * 2,
      wobbleAmp: 0.3 + Math.random() * 0.5,
      alive: true,
      popTime: -1,
      born: performance.now(),
    });
  }

  function popBubble(b, delay) {
    b.alive = false;
    b.popTime = performance.now() + delay;
    popAnims.push({ x: b.x, y: b.y, r: b.r, ci: b.ci, t: 0, delay });
    // Particles
    const count = 8 + Math.floor(Math.random() * 6);
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const speed = 60 + Math.random() * 120;
      particles.push({
        x: b.x, y: b.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 2 + Math.random() * 3,
        ci: b.ci,
        life: 1,
        delay,
      });
    }
  }

  function findChain(startBubble) {
    const ci = startBubble.ci;
    const chain = [startBubble];
    const visited = new Set([bubbles.indexOf(startBubble)]);
    const queue = [startBubble];
    while (queue.length) {
      const cur = queue.shift();
      for (let i = 0; i < bubbles.length; i++) {
        if (visited.has(i) || !bubbles[i].alive) continue;
        const b = bubbles[i];
        if (b.ci !== ci) continue;
        const dx = b.x - cur.x;
        const dy = b.y - cur.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < (cur.r + b.r) * CHAIN_DIST_FACTOR) {
          visited.add(i);
          chain.push(b);
          queue.push(b);
        }
      }
    }
    return chain;
  }

  function scoreForChain(n) {
    // 1=10, 2=30, 3=60, 4=100, 5=150 ...  formula: n*(n+1)/2 * 10
    return n * (n + 1) / 2 * 10;
  }

  function handleTap(px, py) {
    if (!gameRunning) return;
    ensureAudio();
    // Find tapped bubble (newest on top → search backwards)
    let tapped = null;
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (!b.alive) continue;
      const dx = b.x - px;
      const dy = b.y - py;
      // Generous hit area for mobile
      const hitR = Math.max(b.r * 1.15, 24);
      if (dx * dx + dy * dy < hitR * hitR) {
        tapped = b;
        break;
      }
    }
    if (!tapped) return;

    const chain = findChain(tapped);
    const pts = scoreForChain(chain.length);
    score += pts;
    if (score > bestScore) {
      bestScore = score;
      saveBest(bestScore);
    }
    scoreEl.textContent = score;
    bestEl.textContent = bestScore;

    // Pop with cascade delay
    for (let i = 0; i < chain.length; i++) {
      popBubble(chain[i], i * 55);
    }

    playChain(chain.length);

    // Screen shake for big chains
    if (chain.length >= 3) {
      shakeAmount = Math.min(chain.length * 2, 14);
      shakeDecay = 0.88;
    }

    // Show chain popup
    if (chain.length >= 2) {
      showChainPopup(tapped.x, tapped.y, chain.length, pts);
    }
  }

  function showChainPopup(x, y, count, pts) {
    chainPopups.push({
      x, y, text: `x${count}  +${pts}`,
      life: 1, vy: -40,
    });
  }

  // Input handlers
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    ensureAudio();
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    handleTap(px, py);
  });

  restartBtn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    ensureAudio();
    init();
  });

  function triggerGameOver() {
    if (gameOverShown) return;
    gameRunning = false;
    gameOverShown = true;
    playGameOver();
    finalScoreEl.textContent = `Score: ${score}`;
    if (score >= bestScore && score > 0) {
      newBestEl.textContent = 'NEW HIGH SCORE!';
    } else {
      newBestEl.textContent = '';
    }
    gameOverEl.classList.add('show');
  }

  // Main loop
  let lastTime = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    if (gameRunning) {
      elapsed += dt;
      // Difficulty ramp — spawn faster over time
      spawnInterval = Math.max(250, 800 - elapsed * 4);

      spawnTimer += dt * 1000;
      if (spawnTimer >= spawnInterval) {
        spawnTimer -= spawnInterval;
        spawnBubble();
        // After 30s, spawn 2 at a time sometimes
        if (elapsed > 30 && Math.random() < 0.3) spawnBubble();
        // After 60s, even more
        if (elapsed > 60 && Math.random() < 0.4) spawnBubble();
      }

      // Update bubbles
      for (const b of bubbles) {
        if (!b.alive) continue;
        b.wobblePhase += dt * 2.5;
        b.x += Math.sin(b.wobblePhase) * b.wobbleAmp;
        b.y += b.vy * dt;
        // Slow down as they rise (simulating buoyancy settling)
        b.vy *= 0.995;
        // Minimum rise speed only if bubble is in open space (not stacked)
        if (b.vy > -5 && !b.blocked) b.vy = -5;

        // Clamp to screen edges
        if (b.x < b.r) { b.x = b.r; b.wobbleAmp *= -1; }
        if (b.x > W - b.r) { b.x = W - b.r; b.wobbleAmp *= -1; }

        b.blocked = false;
      }

      // Bubble-bubble repulsion (multiple passes for stability)
      for (let pass = 0; pass < 3; pass++) {
        for (let i = 0; i < bubbles.length; i++) {
          const b = bubbles[i];
          if (!b.alive) continue;
          for (let j = i + 1; j < bubbles.length; j++) {
            const o = bubbles[j];
            if (!o.alive) continue;
            const dx = b.x - o.x;
            const dy = b.y - o.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minD = (b.r + o.r) * 1.02;
            if (dist < minD && dist > 0.1) {
              const overlap = (minD - dist) * 0.5;
              const nx = dx / dist;
              const ny = dy / dist;
              b.x += nx * overlap;
              b.y += ny * overlap;
              o.x -= nx * overlap;
              o.y -= ny * overlap;
              // Mark as blocked if pushed upward
              if (ny < -0.3) { b.blocked = true; b.vy = Math.max(b.vy, 0); }
              if (ny > 0.3) { o.blocked = true; o.vy = Math.max(o.vy, 0); }
            }
          }
        }
      }

      // Clamp and game over check
      let anyInDanger = false;
      for (const b of bubbles) {
        if (!b.alive) continue;
        // Hard clamp at danger line
        if (b.y < b.r + DANGER_Y) {
          b.y = b.r + DANGER_Y;
          b.vy = 0;
        }
        // Clamp bottom
        if (b.y > H + b.r * 2) { b.y = H + b.r * 2; }
        // Re-clamp edges after repulsion
        if (b.x < b.r) b.x = b.r;
        if (b.x > W - b.r) b.x = W - b.r;
        // Check if any bubble is at/past the danger zone
        if (b.y - b.r <= DANGER_Y + 5) {
          anyInDanger = true;
        }
      }

      // Cumulative danger counter — triggers game over after sustained breach
      if (anyInDanger) {
        dangerFrames++;
        if (dangerFrames > 40) triggerGameOver(); // ~0.7s at 60fps
      } else {
        dangerFrames = Math.max(0, dangerFrames - 2);
      }

      // Remove dead bubbles that have finished animating
      bubbles = bubbles.filter(b => b.alive || (now - b.popTime < 300));
    }

    // Update particles
    for (const p of particles) {
      if (p.delay > 0) { p.delay -= dt * 1000; continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt; // gravity
      p.vx *= 0.97;
      p.life -= dt * 2.5;
    }
    particles = particles.filter(p => p.life > 0 || p.delay > 0);

    // Update pop anims
    for (const a of popAnims) {
      if (a.delay > 0) { a.delay -= dt * 1000; continue; }
      a.t += dt * 6;
    }
    popAnims = popAnims.filter(a => a.t < 1 || a.delay > 0);

    // Update chain popups
    for (const cp of chainPopups) {
      cp.y += cp.vy * dt;
      cp.vy *= 0.96;
      cp.life -= dt * 1.2;
    }
    chainPopups = chainPopups.filter(cp => cp.life > 0);

    // Shake
    let sx = 0, sy = 0;
    if (shakeAmount > 0.5) {
      sx = (Math.random() - 0.5) * shakeAmount;
      sy = (Math.random() - 0.5) * shakeAmount;
      shakeAmount *= shakeDecay;
    } else {
      shakeAmount = 0;
    }

    // ---- DRAW ----
    ctx.save();
    ctx.translate(sx, sy);

    // Background
    ctx.fillStyle = '#0a0a1e';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // Subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    const gridSize = 40;
    for (let x = 0; x < W; x += gridSize) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // Danger zone
    const dangerPulse = 0.3 + 0.3 * Math.sin(now * 0.005);
    // Check how close nearest bubble is to danger zone
    let closestToDanger = H;
    for (const b of bubbles) {
      if (b.alive && b.y - b.r < closestToDanger) {
        closestToDanger = b.y - b.r;
      }
    }
    const dangerIntensity = Math.max(0, 1 - (closestToDanger - DANGER_Y) / 150);
    const dangerAlpha = (0.15 + dangerIntensity * 0.4) * (0.7 + dangerPulse * dangerIntensity);

    // Danger gradient
    const dg = ctx.createLinearGradient(0, 0, 0, DANGER_Y + 40);
    dg.addColorStop(0, `rgba(255,51,102,${dangerAlpha * 0.6})`);
    dg.addColorStop(1, 'rgba(255,51,102,0)');
    ctx.fillStyle = dg;
    ctx.fillRect(0, 0, W, DANGER_Y + 40);

    // Danger line
    ctx.strokeStyle = `rgba(255,51,102,${0.3 + dangerIntensity * 0.5 + dangerPulse * 0.2})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    ctx.moveTo(0, DANGER_Y);
    ctx.lineTo(W, DANGER_Y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw bubbles
    for (const b of bubbles) {
      if (!b.alive) continue;
      const c = COLORS[b.ci];
      const age = Math.min((now - b.born) / 300, 1);
      const scale = 0.3 + 0.7 * age; // pop-in animation

      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(scale, scale);

      // Outer glow
      const grd = ctx.createRadialGradient(0, 0, b.r * 0.2, 0, 0, b.r * 1.8);
      grd.addColorStop(0, c.g);
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(0, 0, b.r * 1.8, 0, Math.PI * 2);
      ctx.fill();

      // Main bubble
      const bgrd = ctx.createRadialGradient(-b.r * 0.25, -b.r * 0.25, b.r * 0.1, 0, 0, b.r);
      bgrd.addColorStop(0, 'rgba(255,255,255,0.35)');
      bgrd.addColorStop(0.4, c.h);
      bgrd.addColorStop(1, c.h + '99');
      ctx.fillStyle = bgrd;
      ctx.beginPath();
      ctx.arc(0, 0, b.r, 0, Math.PI * 2);
      ctx.fill();

      // Shine highlight
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.beginPath();
      ctx.ellipse(-b.r * 0.2, -b.r * 0.3, b.r * 0.35, b.r * 0.2, -0.5, 0, Math.PI * 2);
      ctx.fill();

      // Border glow
      ctx.strokeStyle = c.h + 'aa';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(0, 0, b.r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();
    }

    // Pop animations (expanding ring)
    for (const a of popAnims) {
      if (a.delay > 0) continue;
      const c = COLORS[a.ci];
      const t = a.t;
      const alpha = 1 - t;
      const expandR = a.r * (1 + t * 2);

      ctx.strokeStyle = c.h + Math.floor(alpha * 180).toString(16).padStart(2, '0');
      ctx.lineWidth = 3 * (1 - t);
      ctx.beginPath();
      ctx.arc(a.x, a.y, expandR, 0, Math.PI * 2);
      ctx.stroke();

      // Flash
      if (t < 0.2) {
        ctx.fillStyle = `rgba(255,255,255,${(0.2 - t) * 2})`;
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r * (1 + t), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Particles
    for (const p of particles) {
      if (p.delay > 0) continue;
      const c = COLORS[p.ci];
      const alpha = Math.max(0, p.life);
      ctx.fillStyle = c.h + Math.floor(alpha * 200).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
      ctx.fill();
    }

    // Chain popups
    for (const cp of chainPopups) {
      const alpha = Math.max(0, Math.min(1, cp.life));
      const scale = 0.5 + alpha * 0.5;
      ctx.save();
      ctx.translate(cp.x, cp.y);
      ctx.scale(scale, scale);
      ctx.font = '900 32px system-ui, -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = `rgba(255,204,0,${alpha})`;
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = 15 * alpha;
      ctx.fillText(cp.text, 0, 0);
      ctx.shadowBlur = 0;
      ctx.restore();
    }

    ctx.restore(); // undo shake

    requestAnimationFrame(() => {}); // keep alive
  }

  init();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
