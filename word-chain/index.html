<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#08080f;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}

#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;flex-direction:column;align-items:center}

#word-display.valid{color:#0f6}

.hud-value{font-size:clamp(20px,5vw,28px);font-weight:900;color:#fff}
#timer-val{color:#0ff;text-shadow:0 0 15px rgba(0,255,255,.5)}

#combo-val{color:#f0f;text-shadow:0 0 15px rgba(255,0,255,.5)}

#clear-btn{width:clamp(50px,13vw,64px);background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.1)}

// letter frequency weights for natural distribution
const LETTERS='EEEEEEEEEEEETTTTTTTTTAAAAAAAAOOOOOOOOIIIIIIIINNNNNNNNSSSSSSSSHHHHHHHRRRRRRRDDDDDLLLLLUUUUCCCCMMMMWWWFFYYGGPPBBVVKJXQZ';

// ============================================================
// AUDIO ENGINE
// ============================================================
let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}

function playTone(freq,dur,type='sine',vol=.15){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}

function sfxTap(){playTone(600+Math.random()*200,.08,'sine',.12)}
function sfxRemove(){playTone(300,.06,'triangle',.08)}
function sfxSubmit(combo){
  const base=400+combo*80;
  for(let i=0;i<3;i++)setTimeout(()=>playTone(base+i*150,.15,'sine',.12),i*60);
}
function sfxBadWord(){playTone(150,.25,'sawtooth',.1);setTimeout(()=>playTone(120,.3,'sawtooth',.08),100)}
function sfxShuffle(){for(let i=0;i<5;i++)setTimeout(()=>playTone(300+i*60,.05,'triangle',.06),i*30)}
function sfxChain(n){
  const base=500+n*100;
  for(let i=0;i<4;i++)setTimeout(()=>playTone(base+i*120,.12,'sine',.1),i*50);
}
function sfxGameOver(){
  for(let i=0;i<5;i++)setTimeout(()=>playTone(400-i*60,.3,'sawtooth',.08),i*120);

// ============================================================
// BUBBLE CLASS
// ============================================================
function randomLetter(){return LETTERS[Math.floor(Math.random()*LETTERS.length)]}

function makeBubble(x,y,letter){
  const padding=40;
  const topOffset=130; // avoid HUD area
  return{
    x:x||(padding+Math.random()*(W-padding*2)),
    y:y||(topOffset+Math.random()*(H-topOffset-120)),
    vx:(Math.random()-.5)*0.6,
    vy:(Math.random()-.5)*0.6,
    r:Math.max(28,Math.min(W,H)*0.055),
    letter:letter||randomLetter(),
    scale:0,targetScale:1,
    hue:Math.random()*360,
    selected:false,
    pulse:0,
    age:0
  }
}

function initBubbles(){
  bubbles=[];
  // Grid-based placement for even distribution
  const padding=50;
  const topOffset=140;
  const bottomOffset=110;
  const cols=Math.ceil(Math.sqrt(BUBBLE_COUNT*W/(H-topOffset-bottomOffset)));
  const rows=Math.ceil(BUBBLE_COUNT/cols);
  const cellW=(W-padding*2)/cols;
  const cellH=(H-topOffset-bottomOffset)/rows;
  for(let i=0;i<BUBBLE_COUNT;i++){
    const col=i%cols,row=Math.floor(i/cols);
    const cx=padding+cellW*(col+.5)+(Math.random()-.5)*cellW*.4;
    const cy=topOffset+cellH*(row+.5)+(Math.random()-.5)*cellH*.4;
    bubbles.push(makeBubble(cx,cy));
  }
  ensureVowels();
}

function ensureVowels(){
  const vowels='AEIOU';
  let vowelCount=bubbles.filter(b=>vowels.includes(b.letter)).length;
  while(vowelCount<4){
    // replace a random consonant with a vowel
    const consonants=bubbles.filter(b=>!vowels.includes(b.letter)&&!b.selected);
    if(consonants.length===0)break;
    const b=consonants[Math.floor(Math.random()*consonants.length)];
    b.letter=vowels[Math.floor(Math.random()*vowels.length)];
    vowelCount++;
  }
}

// ============================================================
// PARTICLES
// ============================================================
function spawnParticles(x,y,hue,count=12){
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=1+Math.random()*4;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      life:1,decay:.015+Math.random()*.02,
      r:2+Math.random()*4,
      hue:hue+Math.random()*40-20
    });
  }
}

function spawnFloatText(x,y,text,color='#fff',size=24){
  floatTexts.push({x,y,text,color,size,life:1,vy:-1.5});
}

// ============================================================
// GAME LOGIC
// ============================================================
function startGame(){
  initAudio();
  menuEl.classList.add('hidden');
  gameOverEl.classList.remove('visible');
  score=0;combo=0;bestCombo=0;timeLeft=GAME_TIME;wordsFound=0;comboTimer=0;
  currentWord='';selectionOrder=[];usedWords.clear();
  updateWordDisplay();updateHUD();
  initBubbles();
  particles=[];floatTexts=[];
  gameActive=true;
  lastTime=performance.now();
}

function endGame(){
  gameActive=false;
  sfxGameOver();
  if(score>highScore){highScore=score;localStorage.setItem('wc_hi',highScore)}
  finalScoreEl.textContent=score;
  bestLabelEl.textContent='BEST: '+highScore;
  bestLabelEl.className=score>=highScore&&score>0?'best-label new-best':'best-label';
  wordsFoundEl.textContent=wordsFound+' words found · best chain ×'+bestCombo;
  gameOverEl.classList.add('visible');
}

function tapBubble(b){
  if(b.selected||currentWord.length>=12)return;
  b.selected=true;
  b.pulse=1;
  b.selOrder=selectionOrder.length;
  selectionOrder.push(b);
  currentWord+=b.letter;
  sfxTap();
  spawnParticles(b.x,b.y,b.hue,6);
  updateWordDisplay();
}

function clearWord(){
  currentWord='';
  selectionOrder=[];
  bubbles.forEach(b=>{b.selected=false;b.selOrder=-1});
  sfxRemove();
  updateWordDisplay();
}

function submitWord(){
  if(currentWord.length<3)return;
  const w=currentWord.toLowerCase();
  if(usedWords.has(w)){
    // already used
    shakeMag=8;
    wordDisplay.classList.remove('shake');
    void wordDisplay.offsetWidth;
    wordDisplay.classList.add('shake');
    sfxBadWord();
    spawnFloatText(W/2,140,'ALREADY USED','#f66',18);
    clearWord();
    return;
  }
  if(WORDS.has(w)){
    // valid word!
    usedWords.add(w);
    combo++;
    if(combo>bestCombo)bestCombo=combo;
    comboTimer=3;
    const lenBonus=currentWord.length;
    const points=lenBonus*lenBonus*10*Math.max(1,combo);
    score+=points;
    wordsFound++;

    // bonus time for longer words
    const bonusTime=Math.max(0,lenBonus-2)*1.5;
    timeLeft=Math.min(timeLeft+bonusTime,99);

    sfxSubmit(combo);
    if(combo>1)sfxChain(combo);
    shakeMag=4+combo*2;

    // explode selected bubbles
    const selectedBubbles=bubbles.filter(b=>b.selected);
    selectedBubbles.forEach(b=>{
      spawnParticles(b.x,b.y,b.hue,20);
    });

    // float text
    const cy=selectedBubbles.reduce((s,b)=>s+b.y,0)/selectedBubbles.length;
    const cx=selectedBubbles.reduce((s,b)=>s+b.x,0)/selectedBubbles.length;
    spawnFloatText(cx,cy,'+'+points,combo>1?'#ff0':'#0f6',combo>1?32:24);
    if(combo>1)spawnFloatText(cx,cy-30,'CHAIN ×'+combo,'#f0f',20);
    if(bonusTime>0)spawnFloatText(cx,cy+30,'+'+bonusTime.toFixed(1)+'s','#0ff',16);

    // replace selected bubbles with new ones
    bubbles=bubbles.map(b=>{
      if(b.selected){
        const nb=makeBubble(b.x,b.y);
        nb.scale=0;
        return nb;
      }
      return b;
    });
    ensureVowels();

    currentWord='';
    selectionOrder=[];
    updateWordDisplay();
    updateHUD();
  } else {
    // invalid word
    shakeMag=10;
    combo=0;comboTimer=0;
    wordDisplay.classList.remove('shake');
    void wordDisplay.offsetWidth;
    wordDisplay.classList.add('shake');
    sfxBadWord();
    spawnFloatText(W/2,140,'NOT A WORD','#f44',20);
    clearWord();
    updateHUD();
  }
}

function shuffleBubbles(){
  sfxShuffle();
  bubbles.forEach(b=>{
    if(!b.selected){
      b.letter=randomLetter();
      b.hue=Math.random()*360;
      b.pulse=1;
      // scatter them
      b.vx=(Math.random()-.5)*3;
      b.vy=(Math.random()-.5)*3;
    }
  });
  ensureVowels();
  // shuffle costs 2 seconds
  timeLeft=Math.max(1,timeLeft-2);
  spawnFloatText(W/2,H/2,'-2s','#f66',20);
  updateHUD();
}

function updateWordDisplay(){
  if(currentWord.length===0){
    wordDisplay.innerHTML='&nbsp;';
    wordDisplay.classList.remove('valid');
  } else {
    wordDisplay.textContent=currentWord;
    const isValid=currentWord.length>=3&&WORDS.has(currentWord.toLowerCase())&&!usedWords.has(currentWord.toLowerCase());
    wordDisplay.classList.toggle('valid',isValid);
  }
  submitBtn.classList.toggle('disabled',currentWord.length<3);
}

function updateHUD(){
  timerVal.textContent=Math.ceil(timeLeft);
  scoreVal.textContent=score;
  comboVal.textContent=combo>0?'×'+combo:'×1';
  comboVal.style.color=combo>1?'#f0f':'rgba(255,0,255,.5)';
}

// ============================================================
// INPUT HANDLING
// ============================================================
function getPointerPos(e){
  if(e.touches)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  return{x:e.clientX,y:e.clientY};
}

function hitTestBubble(px,py){
  // find closest bubble within tap range
  let best=null,bestD=Infinity;
  for(const b of bubbles){
    const dx=px-b.x,dy=py-b.y;
    const d=Math.sqrt(dx*dx+dy*dy);
    const hitR=b.r+12; // generous tap target
    if(d<hitR&&d<bestD){bestD=d;best=b}
  }
  return best;
}

canvas.addEventListener('pointerdown',e=>{
  if(!gameActive)return;
  initAudio();
  const p=getPointerPos(e);
  const b=hitTestBubble(p.x,p.y);
  if(b){
    if(b.selected){
      // deselect: remove this letter and all after it
      const idx=findSelectedIndex(b);
      deselectFrom(idx);
      sfxRemove();
      updateWordDisplay();
    } else {
      tapBubble(b);
    }
  }
});

function findSelectedIndex(bubble){
  return selectionOrder.indexOf(bubble);
}

function deselectFrom(idx){
  // deselect all selected bubbles from idx onwards
  for(let i=idx;i<selectionOrder.length;i++){
    selectionOrder[i].selected=false;
    selectionOrder[i].selOrder=-1;
  }
  selectionOrder=selectionOrder.slice(0,idx);
  currentWord=currentWord.slice(0,idx);
}

// Keyboard support
document.addEventListener('keydown',e=>{
  if(!gameActive)return;
  if(e.key==='Enter'){e.preventDefault();submitWord()}
  else if(e.key==='Backspace'){
    e.preventDefault();
    if(currentWord.length>0){
      // deselect last
      deselectFrom(currentWord.length-1);
      sfxRemove();
      updateWordDisplay();
    }
  } else if(e.key==='Escape'){clearWord()}
  else if(e.key===' '){e.preventDefault();shuffleBubbles()}
  else if(/^[a-zA-Z]$/.test(e.key)){
    // find a non-selected bubble with this letter and tap it
    const letter=e.key.toUpperCase();
    const b=bubbles.find(b=>!b.selected&&b.letter===letter);
    if(b)tapBubble(b);
  }
});

// Button handlers
submitBtn.addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();submitWord()});
clearBtn.addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();clearWord()});
shuffleBtn.addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();shuffleBubbles()});
playBtn.addEventListener('pointerdown',e=>{e.stopPropagation();startGame()});
retryBtn.addEventListener('pointerdown',e=>{e.stopPropagation();startGame()});

// Prevent context menu on long press
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// ============================================================
// UPDATE & RENDER
// ============================================================
function update(dt){
  if(!gameActive)return;

  // Timer
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;endGame();return}

  // Combo decay
  if(combo>0){
    comboTimer-=dt;
    if(comboTimer<=0){combo=0;comboTimer=0}
  }

  // Screen shake decay
  if(shakeMag>0)shakeMag*=Math.pow(.001,dt);
  if(shakeMag<.1)shakeMag=0;
  shakeX=(Math.random()-.5)*shakeMag*2;
  shakeY=(Math.random()-.5)*shakeMag*2;

  // Update bubbles
  const padding=40;
  const topOffset=130;
  const bottomOffset=100;
  for(const b of bubbles){
    b.age+=dt;
    // lerp scale
    b.scale+=(b.targetScale-b.scale)*6*dt;
    // pulse decay
    if(b.pulse>0)b.pulse=Math.max(0,b.pulse-dt*3);
    // drift
    if(!b.selected){
      b.x+=b.vx*60*dt;
      b.y+=b.vy*60*dt;
      // gentle random force
      b.vx+=(Math.random()-.5)*0.1*dt*60;
      b.vy+=(Math.random()-.5)*0.1*dt*60;
      // damping
      b.vx*=Math.pow(.98,dt*60);
      b.vy*=Math.pow(.98,dt*60);
      // bounds
      if(b.x<padding+b.r){b.x=padding+b.r;b.vx=Math.abs(b.vx)*.5}
      if(b.x>W-padding-b.r){b.x=W-padding-b.r;b.vx=-Math.abs(b.vx)*.5}
      if(b.y<topOffset+b.r){b.y=topOffset+b.r;b.vy=Math.abs(b.vy)*.5}
      if(b.y>H-bottomOffset-b.r){b.y=H-bottomOffset-b.r;b.vy=-Math.abs(b.vy)*.5}
    }
    // repel from other bubbles
    for(const other of bubbles){
      if(other===b)continue;
      const dx=b.x-other.x,dy=b.y-other.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      const minDist=b.r+other.r+4;
      if(dist<minDist&&dist>0){
        const force=(minDist-dist)/minDist*.3;
        const nx=dx/dist,ny=dy/dist;
        b.vx+=nx*force;b.vy+=ny*force;
      }
    }
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*60*dt;p.y+=p.vy*60*dt;
    p.vy+=2*dt;// gravity
    p.life-=p.decay*60*dt;
    if(p.life<=0)particles.splice(i,1);
  }

  // Float texts
  for(let i=floatTexts.length-1;i>=0;i--){
    const f=floatTexts[i];
    f.y+=f.vy*60*dt;
    f.life-=.8*dt;
    if(f.life<=0)floatTexts.splice(i,1);
  }

  updateHUD();
}

function render(){
  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.translate(shakeX,shakeY);

  // Background grid
  ctx.strokeStyle='rgba(255,255,255,.015)';
  ctx.lineWidth=1;
  const gridSize=50;
  for(let x=0;x<W;x+=gridSize){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=gridSize){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  // Particles
  for(const p of particles){
    ctx.globalAlpha=p.life;
    ctx.fillStyle=`hsl(${p.hue},100%,70%)`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // Connection lines between selected bubbles
  if(selectionOrder.length>1){
    ctx.save();
    ctx.lineWidth=3;
    ctx.lineCap='round';
    for(let i=0;i<selectionOrder.length-1;i++){
      const a=selectionOrder[i],b=selectionOrder[i+1];
      const grad=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
      grad.addColorStop(0,`hsla(${a.hue},100%,60%,.4)`);
      grad.addColorStop(1,`hsla(${b.hue},100%,60%,.4)`);
      ctx.strokeStyle=grad;
      ctx.beginPath();
      ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Bubbles
  for(const b of bubbles){
    const s=b.scale*(1+b.pulse*0.2);
    if(s<=0)continue;
    const selScale=b.selected?1.15:1;
    const r=b.r*s*selScale;
    // selected bubbles gently bob
    const bobY=b.selected?Math.sin(performance.now()*.003+b.selOrder*1.5)*3:0;

    ctx.save();
    ctx.translate(b.x,b.y+bobY);

    // glow
    const glowAlpha=b.selected?.6:.15;
    const glowR=b.selected?r*2.5:r*1.8;
    const grad=ctx.createRadialGradient(0,0,r*.2,0,0,glowR);
    grad.addColorStop(0,`hsla(${b.hue},100%,60%,${glowAlpha})`);
    grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;
    ctx.fillRect(-glowR,-glowR,glowR*2,glowR*2);

    // bubble circle
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    if(b.selected){
      ctx.fillStyle=`hsla(${b.hue},80%,20%,.95)`;
      ctx.fill();
      ctx.shadowColor=`hsl(${b.hue},100%,60%)`;
      ctx.shadowBlur=18;
      ctx.strokeStyle=`hsl(${b.hue},100%,65%)`;
      ctx.lineWidth=3.5;
      ctx.stroke();
      ctx.shadowBlur=0;
    } else {
      ctx.fillStyle=`hsla(${b.hue},50%,12%,.85)`;
      ctx.fill();
      ctx.strokeStyle=`hsla(${b.hue},70%,40%,.35)`;
      ctx.lineWidth=2;
      ctx.stroke();
    }

    // letter
    ctx.fillStyle=b.selected?`hsl(${b.hue},100%,90%)`:'rgba(255,255,255,.85)';
    ctx.font=`900 ${r*.85}px system-ui,-apple-system,sans-serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    if(b.selected){ctx.shadowColor=`hsl(${b.hue},100%,70%)`;ctx.shadowBlur=10}
    ctx.fillText(b.letter,0,1);
    ctx.shadowBlur=0;

    // selection order number (small, top-right)
    if(b.selected&&selectionOrder.length>1){
      const numR=r*.3;
      ctx.fillStyle=`hsl(${b.hue},100%,60%)`;
      ctx.beginPath();
      ctx.arc(r*.65,-r*.55,numR,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#000';
      ctx.font=`800 ${numR*1.3}px system-ui`;
      ctx.fillText(String(b.selOrder+1),r*.65,-r*.53);
    }

    ctx.restore();
  }

  // Float texts
  for(const f of floatTexts){
    ctx.globalAlpha=Math.min(1,f.life*2);
    ctx.fillStyle=f.color;
    ctx.font=`900 ${f.size}px system-ui`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.shadowColor=f.color;
    ctx.shadowBlur=15;
    ctx.fillText(f.text,f.x,f.y);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  // Timer urgency
  if(gameActive&&timeLeft<10){
    const pulse=Math.sin(performance.now()*.006)*0.15;
    ctx.fillStyle=`rgba(255,0,0,${.05+pulse})`;
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();
}

function gameLoop(t){
  const dt=Math.min((t-lastTime)/1000,.05);
  lastTime=t;
  resize();
  update(dt);
  render();
  requestAnimationFrame(gameLoop);
}

// ============================================================
// MENU BG ANIMATION
// ============================================================
let bgBubbles=[];
for(let i=0;i<20;i++){
  bgBubbles.push({
    x:Math.random()*window.innerWidth,
    y:Math.random()*window.innerHeight,
    r:10+Math.random()*30,
    vx:(Math.random()-.5)*.3,
    vy:(Math.random()-.5)-.3,
    hue:Math.random()*360
  });
}

function renderMenuBg(){
  if(gameActive)return;
  ctx.clearRect(0,0,W,H);
  for(const b of bgBubbles){
    b.x+=b.vx;b.y+=b.vy;
    if(b.x<0)b.x=W;if(b.x>W)b.x=0;
    if(b.y<-50)b.y=H+50;
    const grad=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2);
    grad.addColorStop(0,`hsla(${b.hue},100%,60%,.08)`);
    grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;
    ctx.fillRect(b.x-b.r*2,b.y-b.r*2,b.r*4,b.r*4);
  }
}

// ============================================================
// INIT
// ============================================================
function showMenu(){
  menuEl.classList.remove('hidden');
  hiScoreMenu.textContent=highScore>0?'BEST: '+highScore:'';
}

showMenu();

(function menuLoop(){
  if(!gameActive){
    resize();
    renderMenuBg();
  }
  requestAnimationFrame(gameActive?()=>{}:menuLoop);
})();

// start main loop on first play
let loopStarted=false;
const origStart=startGame;
startGame=function(){
  origStart();
  if(!loopStarted){loopStarted=true;requestAnimationFrame(gameLoop)}
};

</script>
