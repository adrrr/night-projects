<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>Hairline</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:#f7f6f3;color:#14130f;user-select:none;-webkit-user-select:none;
  font-family:ui-monospace,'SF Mono','SFMono-Regular',Menlo,Consolas,monospace}
canvas{display:block;width:100%;height:100%;position:fixed;top:0;left:0}

/* ink tones */
:root{
  --ink:#14130f;
  --ink-2:rgba(20,19,15,.62);
  --ink-3:rgba(20,19,15,.40);
  --ink-4:rgba(20,19,15,.22);
  --ink-5:rgba(20,19,15,.05);
  --paper:#f7f6f3;
}

/* mute toggle — a whisper, top-right */
#mute{position:fixed;z-index:30;
  top:calc(12px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:none;background:transparent;color:var(--ink-3);cursor:pointer;
  font-size:15px;line-height:1;border-radius:8px;transition:color .15s}
#mute:hover{color:var(--ink)}

/* personal best — top-left whisper, only once set */
#pb{position:fixed;z-index:20;pointer-events:none;
  top:calc(16px + env(safe-area-inset-top));left:calc(18px + env(safe-area-inset-left));
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  opacity:0;transition:opacity .5s}
#pb.show{opacity:1}

/* overlays */
.overlay{position:fixed;z-index:20;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom));
  pointer-events:none}
.overlay.hidden{display:none}

/* fade-in helper */
.fade-in{animation:fadeIn .55s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- title ---- */
#title-name{font-size:clamp(40px,11vw,80px);font-weight:600;letter-spacing:-.04em;
  margin-bottom:22px;line-height:1}
.tap-cue{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.16}}

/* ---- result reveal ---- */
#result{gap:0}
#res-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);
  margin-bottom:14px}
#res-value{font-size:clamp(44px,13vw,92px);font-weight:600;letter-spacing:-.03em;line-height:1;
  font-variant-numeric:tabular-nums}
#res-deg{font-size:.42em;font-weight:400;color:var(--ink-3);margin-left:.06em;letter-spacing:-.02em}
#res-sub{font-size:12.5px;letter-spacing:.04em;color:var(--ink-2);margin-top:18px;height:16px}
#res-sub b{font-weight:600;color:var(--ink)}
.row-actions{display:flex;gap:16px;margin-top:34px;pointer-events:auto;
  padding-bottom:env(safe-area-inset-bottom)}
.btn{font-family:inherit;font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  padding:16px 28px;min-height:48px;border:1px solid var(--ink);background:transparent;color:var(--ink);
  border-radius:999px;cursor:pointer;transition:background .15s,color .15s,opacity .15s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:transparent;color:var(--ink)}
.btn.ghost{border-color:var(--ink-4);color:var(--ink-2)}
.btn.ghost:hover{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:360px){
  #result .row-actions{flex-direction:column;gap:12px;width:min(78vw,260px)}
  #result .row-actions .btn{width:100%}
}

/* ---- name entry (single native input) ---- */
#name{gap:0}
#name-label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);
  margin-bottom:6px}
#name-rank{font-size:13px;letter-spacing:.04em;color:var(--ink-2);margin-bottom:26px}
#name-rank b{font-weight:600;color:var(--ink)}
#name-input{font-family:inherit;font-size:clamp(40px,11vw,58px);font-weight:600;
  font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.28em;
  width:clamp(160px,52vw,220px);color:var(--ink);background:transparent;border:none;
  border-bottom:2px solid var(--ink);caret-color:var(--ink);padding:6px 0;outline:none;
  margin-bottom:26px;pointer-events:auto}
#name-input::placeholder{color:var(--ink-4)}

/* ---- leaderboard ---- */
#board{gap:0}
#board-title{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);
  margin-bottom:20px}
#board-list{width:min(86vw,330px);font-size:14px;line-height:1;pointer-events:auto;
  max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:env(safe-area-inset-bottom)}
.brow{display:flex;align-items:baseline;justify-content:space-between;
  padding:9px 4px;border-bottom:1px solid var(--ink-4);color:var(--ink-2)}
.brow:last-child{border-bottom:none}
.brow .rk{width:2.4em;text-align:left;color:var(--ink-3);font-variant-numeric:tabular-nums}
.brow .nm{flex:1;text-align:left;letter-spacing:.14em;color:var(--ink)}
.brow .er{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.brow.me{color:var(--ink)}
.brow.me .nm,.brow.me .er,.brow.me .rk{color:var(--ink);font-weight:600}
.brow.me{background:var(--ink-5);border-radius:8px;border-bottom-color:transparent;
  margin:0 -6px;padding-left:10px;padding-right:10px}
.brow.me.pulse{animation:mePulse .6s ease both}
@keyframes mePulse{0%{background:rgba(20,19,15,.16)}100%{background:var(--ink-5)}}
#board-empty{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;padding:8px 0 4px}

@media (prefers-reduced-motion:reduce){
  .brow.me.pulse{animation:none}
}

body{animation:enter .6s ease both}
@keyframes enter{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="mute" aria-label="Mute">&#9834;</button>
<div id="pb">pb &mdash;</div>

<!-- title -->
<div id="title" class="overlay">
  <div id="title-name">Hairline</div>
  <div class="tap-cue">tap to begin</div>
</div>

<!-- result reveal -->
<div id="result" class="overlay hidden">
  <div id="res-label">off by</div>
  <div id="res-value"><span id="res-num">0</span><span id="res-deg">&deg;</span></div>
  <div id="res-sub" aria-live="polite">&nbsp;</div>
  <div class="row-actions">
    <button class="btn ghost" id="res-board-btn">Board</button>
    <button class="btn primary" id="res-again-btn">Again</button>
  </div>
</div>

<!-- name entry -->
<div id="name" class="overlay hidden">
  <div id="name-label">top ten</div>
  <div id="name-rank" aria-live="polite">rank <b>&mdash;</b></div>
  <input id="name-input" type="text" maxlength="3"
    inputmode="text" autocomplete="off" autocapitalize="characters"
    autocorrect="off" spellcheck="false" enterkeyhint="done"
    placeholder="AAA" aria-label="Your initials, 1 to 3 letters or digits">
  <div class="row-actions">
    <button class="btn primary" id="name-submit">Submit</button>
  </div>
</div>

<!-- leaderboard -->
<div id="board" class="overlay hidden">
  <div id="board-title">leaderboard</div>
  <div id="board-list"></div>
  <div class="row-actions">
    <button class="btn primary" id="board-again-btn">Play</button>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   LEADERBOARD API
   The orchestrator fills the deployed Worker URL here.
   ============================================================ */
const LB_URL = "https://hairline-leaderboard.adrien-projects.workers.dev";

const $ = id => document.getElementById(id);
const canvas = $('c');
const ctx = canvas.getContext('2d');

const muteEl   = $('mute');
const pbEl     = $('pb');
const titleEl  = $('title');
const resultEl = $('result');
const resNumEl = $('res-num');
const resSubEl = $('res-sub');
const nameEl   = $('name');
const nameRankEl = $('name-rank');
const nameInput = $('name-input');
const boardEl  = $('board');
const boardTitleEl = $('board-title');
const boardListEl = $('board-list');

const resBoardBtn = $('res-board-btn');
const resAgainBtn = $('res-again-btn');
const nameSubmitBtn = $('name-submit');
const boardAgainBtn = $('board-again-btn');

/* ---------- Tunables ---------- */
const SWEEP_SEC = 1.9;     // one full revolution — identical for everyone (fair board)
const REVEAL_MS = 620;     // count-up duration on the result reveal
const DT_CLAMP  = 0.05;    // clamp delta-time across long frames / tab refocus
const PREC_DEC  = 4;       // decimals shown on the error
const PREC_MIN  = 0.0001;  // finest nonzero error we will ever display (never exactly 0)

/* ---------- Helpers ---------- */
const TAU = Math.PI * 2;
const D2R = Math.PI / 180;
const R2D = 180 / Math.PI;
const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);

// Smallest angular distance (deg) of `rad` to the horizontal axis (0 or 180).
function errToHorizontal(rad) {
  let d = ((rad % Math.PI) + Math.PI) % Math.PI; // fold into [0,π)
  d = Math.min(d, Math.PI - d);                  // [0,π/2]
  return d * R2D;
}
// Format an error so it is never exactly 0.0000.
function fmtErr(deg) {
  let v = deg;
  if (!(v > 0)) v = PREC_MIN;
  if (v < PREC_MIN) v = PREC_MIN;
  return v.toFixed(PREC_DEC);
}

/* ---------- Canvas / geometry ----------
   Full-bleed: the horizon and the needle both reach the page edges, so at
   horizontal they cover the same pixels and merge into one full-width line. */
let W = 0, H = 0, dpr = 1;
let cx = 0, cy = 0;   // pivot, snapped so a 1px stroke straddles one device pixel
let reach = 0;        // half-length long enough to always hit the page corners
let lineW = 1;        // CSS px line width (true 1 device-pixel hairline)

function resize() {
  dpr = window.devicePixelRatio || 1;
  const vv = window.visualViewport;
  W = (vv && vv.width)  || document.documentElement.clientWidth  || window.innerWidth;
  H = (vv && vv.height) || document.documentElement.clientHeight || window.innerHeight;
  canvas.width  = Math.max(1, Math.round(W * dpr));
  canvas.height = Math.max(1, Math.round(H * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Pivot at visual center, snapped to the device half-pixel grid so a 1px
  // stroke lands on a single device-pixel row/column => crisp, never smeared.
  const pxX = Math.round(W / 2 * dpr) + 0.5;
  const pxY = Math.round(H / 2 * dpr) + 0.5;
  cx = pxX / dpr;
  cy = pxY / dpr;

  // Reach beyond the farthest corner so the needle is full-bleed at any angle.
  reach = Math.ceil(Math.hypot(W, H)) + 4;
  lineW = 1 / dpr; // 1 device pixel
}

let resizeScheduled = false;
function scheduleResize() {
  if (resizeScheduled) return;
  resizeScheduled = true;
  requestAnimationFrame(() => { resizeScheduled = false; resize(); });
}
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', scheduleResize);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', scheduleResize);
  window.visualViewport.addEventListener('scroll', scheduleResize);
}
resize();

/* ---------- State ---------- */
const STATE = { TITLE: 0, PLAYING: 1, RESULT: 2, NAME: 3, BOARD: 4 };
let state = STATE.TITLE;

let angle = 0;           // current needle angle (rad)
const omega = TAU / SWEEP_SEC; // constant angular speed — same for all players
let landedAngle = 0;     // needle angle frozen at the shot
let lastError = 0;       // most recent shot's error (deg)
let revealStart = 0;     // performance.now() when the reveal count-up began

let pb = parseFloat(localStorage.getItem('hairline-pb'));
if (!Number.isFinite(pb)) pb = Infinity;
let muted = localStorage.getItem('hairline-muted') === '1';
let initials = (localStorage.getItem('hairline-initials') || 'AAA')
  .toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3) || 'A';

let topScores = [];      // cached leaderboard (ascending by error)
let cutoff = Infinity;   // #10 error; below it (or <10 entries) qualifies
let lbReady = false;     // did the initial GET succeed?

/* ---------- Audio (quiet, synthesised) ---------- */
let audioCtx = null;
function ensureAudio() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch (e) { audioCtx = null; }
}
function tone(freq, dur, vol, type, when) {
  if (muted || !audioCtx || audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime + (when || 0);
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(Math.max(20, freq), now);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol), now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(g).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + dur + 0.02);
}
const sfxFreeze = () => tone(240, 0.05, 0.06, 'square');                 // soft click on the shot
const sfxReveal = (err) => {                                            // pitch rises as error shrinks
  const q = clamp(1 - err / 12, 0, 1);                                 // 0 (poor) .. 1 (near-perfect)
  tone(440 + q * 360, 0.16, 0.07, 'sine');
  tone(660 + q * 540, 0.12, 0.035, 'sine', 0.04);
};

function syncMute() {
  muteEl.innerHTML = muted ? '&#9834;&#824;' : '&#9834;';
  muteEl.setAttribute('aria-label', muted ? 'Unmute' : 'Mute');
}
syncMute();

function syncPb() {
  if (pb === Infinity) { pbEl.classList.remove('show'); return; }
  pbEl.textContent = 'pb ' + fmtErr(pb) + '°';
  pbEl.classList.add('show');
}
syncPb();

/* ---------- Leaderboard client ---------- */
function recomputeCutoff() {
  cutoff = topScores.length < 10 ? Infinity
         : topScores[topScores.length - 1].error;
}
function qualifies(err) {
  // An offline/undeployed board (LB_URL placeholder or a failed GET) leaves
  // lbReady false. Never claim a placement we can't back with the server —
  // an offline shot just shows precision + "Again", never "top ten".
  if (!lbReady) return false;
  if (topScores.length < 10) return true;
  return err < cutoff;
}
async function fetchScores() {
  if (!LB_URL || LB_URL.indexOf('__LB_URL__') !== -1) return; // not deployed yet
  try {
    const r = await fetch(LB_URL.replace(/\/$/, '') + '/scores', { method: 'GET' });
    if (!r.ok) return;
    const data = await r.json();
    if (data && Array.isArray(data.scores)) {
      topScores = data.scores.slice(0, 10);
      lbReady = true;
      recomputeCutoff();
    }
  } catch (e) { /* offline — degrade gracefully */ }
}
async function submitScore(name, err) {
  if (!LB_URL || LB_URL.indexOf('__LB_URL__') !== -1) return null;
  try {
    const r = await fetch(LB_URL.replace(/\/$/, '') + '/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, error: err })
    });
    if (!r.ok) return null;
    const data = await r.json();
    if (data && Array.isArray(data.scores)) {
      topScores = data.scores.slice(0, 10);
      lbReady = true;
      recomputeCutoff();
    }
    return data && (typeof data.rank === 'number') ? data.rank : null;
  } catch (e) { return null; }
}
fetchScores(); // learn the current cutoff at boot

/* ---------- Flow ---------- */
function showOverlay(el) {
  [titleEl, resultEl, nameEl, boardEl].forEach(o => o.classList.add('hidden'));
  if (el) { el.classList.remove('hidden'); el.classList.remove('fade-in'); void el.offsetWidth; el.classList.add('fade-in'); }
}

function startGame() {
  ensureAudio();
  angle = Math.random() * TAU;   // random start — timing can't be memorised
  state = STATE.PLAYING;
  showOverlay(null);
}

let qualifiedThisShot = false; // did this result make the top 10?
let qualifyDecided = false;    // has finishReveal resolved the (async) qualification?
let scoresInFlight = null;     // GET promise fired concurrently with the reveal
let revealDone = false;        // count-up finished + finishReveal fired (once)

function shoot() {
  ensureAudio();
  sfxFreeze();
  landedAngle = angle;
  lastError = errToHorizontal(angle);
  state = STATE.RESULT;

  // Qualification is decided in finishReveal against FRESH data: fire the GET
  // concurrently with the count-up so it adds no perceptible latency. Default
  // to "not qualified" until that resolves.
  qualifiedThisShot = false;
  qualifyDecided = false;
  revealDone = false;
  scoresInFlight = fetchScores();

  // personal best
  if (lastError < pb) { pb = lastError; localStorage.setItem('hairline-pb', String(pb)); syncPb(); }

  // reveal
  resNumEl.textContent = fmtErr(0); // start the count-up from a tiny value
  resSubEl.innerHTML = '&nbsp;';
  // Primary is "Again" by default and held non-actionable until the async
  // qualification resolves in finishReveal — kills the Again/Add-name flip-flop.
  resAgainBtn.textContent = 'Again';
  resAgainBtn.style.opacity = '.5';
  resAgainBtn.style.pointerEvents = 'none';
  showOverlay(resultEl);
  revealStart = performance.now();
  sfxReveal(lastError);
}

async function finishReveal() {
  resNumEl.textContent = fmtErr(lastError);
  // Await the concurrent GET so qualification uses current data, not a stale
  // boot-time cutoff. The await resolves ~instantly if the GET already landed.
  if (scoresInFlight) { try { await scoresInFlight; } catch (e) { /* offline */ } }
  // A late shoot()/reset could have moved on; only commit if still on this result.
  if (state !== STATE.RESULT) return;

  qualifiedThisShot = qualifies(lastError);
  qualifyDecided = true;
  // Resolve and enable the primary now that qualification is known.
  resAgainBtn.textContent = qualifiedThisShot ? 'Add name' : 'Again';
  resAgainBtn.style.opacity = '';
  resAgainBtn.style.pointerEvents = '';

  const isPb = Math.abs(lastError - pb) < 1e-12;
  let sub;
  if (qualifiedThisShot) {
    sub = 'top ten &middot; rank <b>#' + provisionalRank(lastError) + '</b>';
  } else if (isPb) {
    sub = 'new personal best';
  } else {
    sub = 'pb <b>' + fmtErr(pb) + '°</b>';
  }
  resSubEl.innerHTML = sub;

  // Move focus to the now-actionable primary so desktop Space/Enter triggers it
  // (the gated keydown maps Space/Enter to the focused control, never to shoot).
  resAgainBtn.focus();
}

/* ---------- Name entry (single native input) ---------- */
function currentInitials() {
  // Non-empty fallback so the POST body is always valid (server still sanitizes).
  return (nameInput.value || 'A');
}
function openNameEntry(rank) {
  nameRankEl.innerHTML = 'rank <b>#' + rank + '</b>';
  state = STATE.NAME;
  // Un-hide the overlay, then focus + select SYNCHRONOUSLY inside the trusted
  // tap gesture — no await/setTimeout/rAF, or iOS Safari suppresses the keyboard.
  showOverlay(nameEl);
  nameInput.value = initials;
  nameInput.focus();
  nameInput.select();
}

/* ---------- Leaderboard render ---------- */
// missed: the player submitted but the server said they did NOT place
// (rank === null). Show the board honestly, no fake highlighted row.
function showBoard(myName, myRank, missed) {
  state = STATE.BOARD;
  boardListEl.innerHTML = '';
  boardTitleEl.textContent = missed ? 'just missed' : 'leaderboard';
  let meRow = null;
  if (!topScores.length) {
    const e = document.createElement('div');
    e.id = 'board-empty';
    e.textContent = lbReady ? 'no scores yet — be the first' : 'board offline';
    boardListEl.appendChild(e);
  } else {
    topScores.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'brow';
      // highlight the player's row: same rank+name, or first matching name with equal error
      if (myRank && (i + 1) === myRank && s.name === myName) { row.classList.add('me'); meRow = row; }
      const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = (i + 1) + '.';
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = s.name;
      const er = document.createElement('span'); er.className = 'er'; er.textContent = fmtErr(s.error) + '°';
      row.appendChild(rk); row.appendChild(nm); row.appendChild(er);
      boardListEl.appendChild(row);
    });
  }
  showOverlay(boardEl);
  // The "where am I" payoff: bring the player's row into view + a one-shot pulse.
  if (meRow) {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    meRow.scrollIntoView({ block: 'nearest', behavior: reduce ? 'auto' : 'smooth' });
    if (!reduce) {
      void meRow.offsetWidth; // reflow so the animation re-triggers
      meRow.classList.add('pulse');
    }
  }
  boardAgainBtn.focus();
}

let submitting = false; // guards against a double submit (rapid Enter + click)

async function submitAndShow() {
  if (submitting) return; // a submit is already in flight — ignore the second press
  submitting = true;
  const name = currentInitials();
  initials = name;
  localStorage.setItem('hairline-initials', name);
  nameSubmitBtn.disabled = true;
  let rank = null;
  try {
    rank = await submitScore(name, lastError);
  } finally {
    nameSubmitBtn.disabled = false;
    submitting = false;
  }
  // Defense in depth: trust the authoritative POST. If the server says the
  // player did NOT place (rank === null), show the board without a fake
  // highlighted row and with an honest "just missed" message. The server
  // sanitizes the name, so match against the sanitized echo for the highlight.
  const echoed = (rank && topScores[rank - 1]) ? topScores[rank - 1].name : name;
  showBoard(echoed, rank, rank === null);
}

/* ---------- Input router ---------- */
function onPress() {
  ensureAudio();
  if (state === STATE.TITLE)   { startGame(); return; }
  if (state === STATE.PLAYING) { shoot();     return; }
  // RESULT/NAME/BOARD: handled by explicit buttons (defense-in-depth no-op)
}

/* ---------- Update ---------- */
function update(dt) {
  if (state === STATE.PLAYING) {
    angle += omega * dt;            // ONE direction, constant speed
    if (angle > TAU) angle -= TAU;  // keep bounded to avoid float drift
  } else if (state === STATE.RESULT) {
    const t = clamp((performance.now() - revealStart) / REVEAL_MS, 0, 1);
    if (t < 1) {
      // ease-out count-up toward the true value
      const eased = 1 - Math.pow(1 - t, 3);
      resNumEl.textContent = fmtErr(lastError * eased);
    } else if (!revealDone) {
      // finishReveal is async (awaits the in-flight GET); guard against the
      // per-frame loop re-invoking it before the await settles.
      revealDone = true;
      finishReveal();
    }
  }
}

/* ---------- Draw ---------- */
function drawLine(rad, alpha, width) {
  const c = Math.cos(rad), s = Math.sin(rad);
  ctx.beginPath();
  ctx.moveTo(cx - c * reach, cy - s * reach);
  ctx.lineTo(cx + c * reach, cy + s * reach);
  ctx.lineWidth = width;
  ctx.strokeStyle = 'rgba(20,19,15,' + alpha + ')';
  ctx.stroke();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'butt';

  if (state === STATE.TITLE || state === STATE.NAME || state === STATE.BOARD) return; // clean paper behind these overlays

  // full-width horizon (the target) — faint hairline edge to edge
  drawLine(0, 0.16, lineW);

  // needle — black ink, full-bleed; at horizontal it merges with the horizon
  const a = (state === STATE.RESULT) ? landedAngle : angle;
  drawLine(a, 0.92, lineW);
}

/* ---------- Loop ---------- */
let lastT = performance.now();
let running = true;
function frame(now) {
  if (!running) return;
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > DT_CLAMP) dt = DT_CLAMP;
  if (dt < 0) dt = 0;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; }
  else if (!running) { running = true; lastT = performance.now(); requestAnimationFrame(frame); }
});

/* ---------- Input wiring ---------- */
// State-gated router (the root anti-restart fix): the global press only fires in
// TITLE/PLAYING. On RESULT/NAME/BOARD it early-returns WITHOUT preventDefault, so
// taps reach buttons/inputs natively and dead-space taps do nothing.
document.addEventListener('pointerdown', (e) => {
  if (state !== STATE.TITLE && state !== STATE.PLAYING) return;
  e.preventDefault();
  onPress();
}, { passive: false });

document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  // While entering a name, Enter submits; every other key types normally.
  if (state === STATE.NAME) {
    if (e.key === 'Enter') { e.preventDefault(); submitAndShow(); }
    return;
  }
  // Never let Space/Enter shoot while typing in an input.
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  // Global shoot/begin only in TITLE/PLAYING. On RESULT/BOARD, Space/Enter
  // naturally activate the focused button (native) — no handling here.
  if ((state === STATE.TITLE || state === STATE.PLAYING) &&
      (e.code === 'Space' || e.key === ' ' || e.key === 'Enter')) {
    e.preventDefault();
    onPress();
  }
});

muteEl.addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  localStorage.setItem('hairline-muted', muted ? '1' : '0');
  syncMute();
  if (!muted) ensureAudio();
});

// result actions — primary button funnels a qualifying shot into name entry,
// otherwise it simply plays again. "Board" always just views the leaderboard.
resAgainBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  ensureAudio();
  if (qualifiedThisShot) { openNameEntry(provisionalRank(lastError)); }
  else { startGame(); }
});
resBoardBtn.addEventListener('click', async (e) => {
  e.stopPropagation();
  ensureAudio();
  await fetchScores();
  showBoard(null, null);
});

// provisional rank for a fresh result (1-based) given the current cache
function provisionalRank(err) {
  let r = 1;
  for (const s of topScores) { if (err < s.error) break; r++; }
  return Math.min(r, 10);
}

// Live-sanitize so what they see == what gets submitted (server: 1-3 A-Z0-9).
nameInput.addEventListener('input', () => {
  nameInput.value = nameInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
});
nameSubmitBtn.addEventListener('click', (e) => { e.stopPropagation(); submitAndShow(); });
boardAgainBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
</script>
</body>
</html>
