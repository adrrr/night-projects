<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chroma Shift</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --accent-color: #00ffcc;
            --shadow-color: rgba(0, 255, 204, 0.5);
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            flex-direction: column;
            text-align: center;
        }

        #game-container {
            width: 90vw;
            height: 90vw;
            max-width: 500px;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #grid {
            display: grid;
            width: 100%;
            height: 100%;
            gap: 5px;
            transition: all 0.3s ease;
        }

        .tile {
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .tile:active {
            transform: scale(0.95);
        }

        #info {
            margin-top: 20px;
            font-size: 1.5rem;
            min-height: 50px;
        }
        
        #timer-bar {
            width: 100%;
            max-width: 500px;
            height: 5px;
            background-color: #333;
            margin-bottom: 20px;
            border-radius: 5px;
            overflow: hidden;
        }

        #timer-progress {
            height: 100%;
            width: 100%;
            background-color: var(--accent-color);
            transition: width 0.1s linear;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 26, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        h1 {
            font-size: 3rem;
            color: var(--accent-color);
            text-shadow: 0 0 15px var(--shadow-color);
        }
        
        p {
            font-size: 1.2rem;
            max-width: 80%;
        }

        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--shadow-color);
            margin-top: 20px;
        }

        button:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="timer-bar">
            <div id="timer-progress"></div>
        </div>
        <div id="grid"></div>
        <div id="info">
            Score: <span id="score">0</span> | High Score: <span id="high-score">0</span>
        </div>
    </div>

    <div id="start-screen">
        <h1>Chroma Shift</h1>
        <p>Find the tile with the different color before time runs out.</p>
        <button id="start-button">Start Game</button>
    </div>

    <div id="game-over-screen" style="display: none;">
        <h1>Game Over</h1>
        <p>Your score: <span id="final-score">0</span></p>
        <button id="restart-button">Play Again</button>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('high-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        const finalScoreDisplay = document.getElementById('final-score');
        const timerProgress = document.getElementById('timer-progress');

        let score = 0;
        let highScore = localStorage.getItem('chromaShiftHighScore') || 0;
        let level = 2;
        let baseColor, oddColor;
        let timerInterval;
        let timeLeft = 5000; // 5 seconds
        const totalTime = 5000;

        let audioContext;
        
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioContext) return;
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            if (type === 'correct') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.5);
            } else if (type === 'wrong') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(150, audioContext.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.5);
            }
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        function generateColors() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            baseColor = `rgb(${r}, ${g}, ${b})`;

            const difficulty = Math.max(10, 50 - level * 2);
            const offsetR = r + (Math.random() > 0.5 ? difficulty : -difficulty);
            const offsetG = g + (Math.random() > 0.5 ? difficulty : -difficulty);
            const offsetB = b + (Math.random() > 0.5 ? difficulty : -difficulty);
            
            oddColor = `rgb(${Math.max(0, Math.min(255, offsetR))}, ${Math.max(0, Math.min(255, offsetG))}, ${Math.max(0, Math.min(255, offsetB))})`;
        }

        function setupLevel() {
            grid.innerHTML = '';
            grid.style.gridTemplateColumns = `repeat(${level}, 1fr)`;
            grid.style.gridTemplateRows = `repeat(${level}, 1fr)`;

            generateColors();
            
            const totalTiles = level * level;
            const oddTileIndex = Math.floor(Math.random() * totalTiles);

            for (let i = 0; i < totalTiles; i++) {
                const tile = document.createElement('div');
                tile.classList.add('tile');
                tile.style.backgroundColor = (i === oddTileIndex) ? oddColor : baseColor;
                tile.addEventListener('click', () => handleTileClick(i === oddTileIndex));
                grid.appendChild(tile);
            }
            
            startTimer();
        }

        function handleTileClick(isCorrect) {
            clearInterval(timerInterval);
            if (isCorrect) {
                score++;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('chromaShiftHighScore', highScore);
                }
                if (score % 5 === 0 && level < 10) {
                     level++;
                }
                playSound('correct');
                updateDisplay();
                setupLevel();
            } else {
                playSound('wrong');
                gameOver();
            }
        }
        
        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = totalTime;
            const startTime = Date.now();
            
            timerInterval = setInterval(() => {
                const elapsedTime = Date.now() - startTime;
                timeLeft = totalTime - elapsedTime;
                const progress = Math.max(0, timeLeft / totalTime);
                timerProgress.style.width = `${progress * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    gameOver();
                }
            }, 16);
        }

        function updateDisplay() {
            scoreDisplay.textContent = score;
            highScoreDisplay.textContent = highScore;
        }

        function startGame() {
            initAudio();
            score = 0;
            level = 2;
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            updateDisplay();
            setupLevel();
        }

        function gameOver() {
            finalScoreDisplay.textContent = score;
            gameOverScreen.style.display = 'flex';
        }

        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', startGame);

        // Initial setup
        highScoreDisplay.textContent = highScore;
    </script>
</body>
</html>
