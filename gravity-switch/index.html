<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gravity Switch</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { 
  width: 100%; height: 100%; overflow: hidden; 
  background: #0a0a0f; 
  font-family: 'Segoe UI', system-ui, sans-serif;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
canvas { display: block; width: 100%; height: 100%; }
#ui {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none; z-index: 10;
}
#score {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
  font-size: clamp(28px, 6vw, 48px); font-weight: 900; color: #fff;
  text-shadow: 0 0 20px rgba(0,255,200,0.5); letter-spacing: 2px;
  opacity: 0; transition: opacity 0.3s;
}
#score.visible { opacity: 1; }
#menu {
  text-align: center; pointer-events: auto;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
#menu h1 {
  font-size: clamp(36px, 8vw, 64px); font-weight: 900;
  background: linear-gradient(135deg, #00ffc8, #7b2fff, #ff2d95);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-fill-color: transparent;
  margin-bottom: 8px; line-height: 1.1;
}
#menu .subtitle {
  font-size: clamp(14px, 3vw, 18px); color: rgba(255,255,255,0.5);
  margin-bottom: 12px;
}
#menu .high-score {
  font-size: clamp(16px, 3.5vw, 22px); color: #ffd700;
  text-shadow: 0 0 10px rgba(255,215,0,0.4);
}
#menu .start-btn {
  font-size: clamp(18px, 4vw, 24px); padding: 16px 48px;
  background: linear-gradient(135deg, #00ffc8, #00c89b);
  border: none; border-radius: 50px; color: #0a0a0f;
  font-weight: 800; cursor: pointer; letter-spacing: 1px;
  box-shadow: 0 0 30px rgba(0,255,200,0.3);
  transition: transform 0.15s, box-shadow 0.15s;
  min-height: 52px; min-width: 160px;
}
#menu .start-btn:active { transform: scale(0.95); }
#menu .controls {
  font-size: clamp(12px, 2.5vw, 14px); color: rgba(255,255,255,0.35);
  margin-top: 8px;
}
#game-over {
  display: none; text-align: center; pointer-events: auto;
  flex-direction: column; align-items: center; gap: 14px;
}
#game-over.visible { display: flex; }
#menu.hidden { display: none; }
#game-over h2 {
  font-size: clamp(32px, 7vw, 52px); font-weight: 900; color: #ff2d55;
  text-shadow: 0 0 20px rgba(255,45,85,0.5);
}
#game-over .final-score {
  font-size: clamp(20px, 4.5vw, 32px); color: #fff;
}
#game-over .new-best { 
  font-size: clamp(16px, 3.5vw, 22px); color: #ffd700;
  text-shadow: 0 0 15px rgba(255,215,0,0.5);
  animation: pulse 0.8s ease-in-out infinite alternate;
}
@keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
#game-over .retry-btn {
  font-size: clamp(18px, 4vw, 24px); padding: 16px 48px;
  background: linear-gradient(135deg, #7b2fff, #a855f7);
  border: none; border-radius: 50px; color: #fff;
  font-weight: 800; cursor: pointer; letter-spacing: 1px;
  box-shadow: 0 0 30px rgba(123,47,255,0.3);
  min-height: 52px; min-width: 160px;
}
#game-over .retry-btn:active { transform: scale(0.95); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score">0</div>
  <div id="menu">
    <h1>GRAVITY<br>SWITCH</h1>
    <div class="subtitle">Tap to flip gravity. Dodge everything.</div>
    <div class="high-score" id="menu-best"></div>
    <button class="start-btn" id="start-btn">PLAY</button>
    <div class="controls">TAP / SPACE / CLICK</div>
  </div>
  <div id="game-over">
    <h2>GAME OVER</h2>
    <div class="final-score" id="final-score"></div>
    <div class="new-best" id="new-best" style="display:none">★ NEW BEST! ★</div>
    <div class="high-score" id="go-best"></div>
    <button class="retry-btn" id="retry-btn">RETRY</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const menuEl = document.getElementById('menu');
const gameOverEl = document.getElementById('game-over');
const finalScoreEl = document.getElementById('final-score');
const newBestEl = document.getElementById('new-best');
const menuBestEl = document.getElementById('menu-best');
const goBestEl = document.getElementById('go-best');

let W, H, dpr;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, dur, type = 'sine', vol = 0.15) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type; osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}
function flipSound() { playSound(520, 0.12, 'sine', 0.12); playSound(780, 0.08, 'sine', 0.08); }
function scoreSound() { playSound(880, 0.1, 'sine', 0.1); }
function hitSound() { playSound(120, 0.3, 'sawtooth', 0.2); playSound(80, 0.4, 'square', 0.15); }

// Game state
let state = 'menu'; // menu, playing, over
let score = 0;
let best = parseInt(localStorage.getItem('gs_best') || '0');
let shakeX = 0, shakeY = 0, shakeDur = 0;
let flashAlpha = 0;
let flashColor = '#00ffc8';

// Player
const player = { x: 0, y: 0, vy: 0, w: 22, h: 22, gravDir: 1, trail: [] };
const GRAVITY = 1800;
const FLIP_BOOST = -600;
const GROUND_MARGIN = 50;

// Obstacles
let obstacles = [];
let obstacleTimer = 0;
let obstacleInterval = 1.4;
let speed = 220;
const GAP_MIN = 130;
const GAP_MAX = 200;

// Particles
let particles = [];

// Stars background
let stars = [];
function initStars() {
  stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + 0.5, a: Math.random() * 0.5 + 0.2, speed: Math.random() * 30 + 10 });
  }
}

function spawnParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * 200 + 50;
    particles.push({
      x, y, vx: Math.cos(angle) * spd, vy: Math.sin(angle) * spd,
      life: 1, decay: Math.random() * 2 + 1.5,
      r: Math.random() * 4 + 2, color
    });
  }
}

function spawnObstacle() {
  const gapSize = GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN) * Math.max(0.4, 1 - score / 80);
  const gapCenter = GROUND_MARGIN + gapSize / 2 + Math.random() * (H - GROUND_MARGIN * 2 - gapSize);
  const obstW = 35 + Math.random() * 15;
  
  // Random color from neon palette
  const colors = ['#00ffc8', '#7b2fff', '#ff2d55', '#ffd700', '#00b4ff'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  
  obstacles.push({
    x: W + obstW,
    gapTop: gapCenter - gapSize / 2,
    gapBot: gapCenter + gapSize / 2,
    w: obstW,
    color,
    scored: false,
    glow: 0
  });
}

function resetGame() {
  player.x = W * 0.25;
  player.y = H / 2;
  player.vy = 0;
  player.gravDir = 1;
  player.trail = [];
  obstacles = [];
  particles = [];
  obstacleTimer = 0;
  obstacleInterval = 1.4;
  speed = 220;
  score = 0;
  shakeX = 0; shakeY = 0; shakeDur = 0;
  flashAlpha = 0;
  scoreEl.textContent = '0';
  initStars();
}

function flipGravity() {
  if (state !== 'playing') return;
  player.gravDir *= -1;
  player.vy = FLIP_BOOST * player.gravDir;
  flipSound();
  spawnParticles(player.x, player.y, '#00ffc8', 6);
  flashAlpha = 0.15;
  flashColor = '#00ffc8';
}

function startGame() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  state = 'playing';
  resetGame();
  menuEl.classList.add('hidden');
  gameOverEl.classList.remove('visible');
  scoreEl.classList.add('visible');
}

function endGame() {
  state = 'over';
  hitSound();
  shakeDur = 0.4;
  flashAlpha = 0.4;
  flashColor = '#ff2d55';
  spawnParticles(player.x, player.y, '#ff2d55', 20);
  scoreEl.classList.remove('visible');
  
  const isNew = score > best;
  if (isNew) { best = score; localStorage.setItem('gs_best', best); }
  
  finalScoreEl.textContent = `Score: ${score}`;
  newBestEl.style.display = isNew ? 'block' : 'none';
  goBestEl.textContent = `Best: ${best}`;
  
  setTimeout(() => { gameOverEl.classList.add('visible'); }, 600);
}

function updateBestDisplay() {
  if (best > 0) {
    menuBestEl.textContent = `Best: ${best}`;
    menuBestEl.style.display = 'block';
  } else {
    menuBestEl.style.display = 'none';
  }
}

// Input
function handleInput(e) {
  e.preventDefault();
  if (state === 'playing') flipGravity();
}
canvas.addEventListener('pointerdown', handleInput);
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (state === 'playing') flipGravity();
  }
});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);

// Game loop
let lastTime = 0;
function loop(time) {
  requestAnimationFrame(loop);
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  
  ctx.save();
  
  // Shake
  if (shakeDur > 0) {
    shakeDur -= dt;
    const intensity = shakeDur * 20;
    shakeX = (Math.random() - 0.5) * intensity;
    shakeY = (Math.random() - 0.5) * intensity;
    ctx.translate(shakeX, shakeY);
  }
  
  // Clear
  ctx.fillStyle = '#0a0a0f';
  ctx.fillRect(-10, -10, W + 20, H + 20);
  
  // Stars
  stars.forEach(s => {
    if (state === 'playing') s.x -= s.speed * dt;
    if (s.x < 0) { s.x = W; s.y = Math.random() * H; }
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  // Ground & ceiling lines
  const lineGrad = ctx.createLinearGradient(0, 0, W, 0);
  lineGrad.addColorStop(0, 'rgba(123,47,255,0.3)');
  lineGrad.addColorStop(0.5, 'rgba(0,255,200,0.3)');
  lineGrad.addColorStop(1, 'rgba(255,45,85,0.3)');
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND_MARGIN); ctx.lineTo(W, GROUND_MARGIN); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, H - GROUND_MARGIN); ctx.lineTo(W, H - GROUND_MARGIN); ctx.stroke();
  
  if (state === 'playing') {
    // Physics
    player.vy += GRAVITY * player.gravDir * dt;
    player.y += player.vy * dt;
    
    // Bounds
    if (player.y - player.h / 2 < GROUND_MARGIN) {
      player.y = GROUND_MARGIN + player.h / 2;
      if (player.gravDir === -1) endGame();
    }
    if (player.y + player.h / 2 > H - GROUND_MARGIN) {
      player.y = H - GROUND_MARGIN - player.h / 2;
      if (player.gravDir === 1) endGame();
    }
    
    // Trail
    player.trail.unshift({ x: player.x, y: player.y, a: 1 });
    if (player.trail.length > 12) player.trail.pop();
    
    // Obstacles
    obstacleTimer += dt;
    if (obstacleTimer >= obstacleInterval) {
      obstacleTimer = 0;
      spawnObstacle();
    }
    
    // Speed ramp
    speed = 220 + score * 3;
    obstacleInterval = Math.max(0.7, 1.4 - score * 0.015);
    
    obstacles.forEach(o => {
      o.x -= speed * dt;
      
      // Score
      if (!o.scored && o.x + o.w / 2 < player.x) {
        o.scored = true;
        score++;
        scoreEl.textContent = score;
        scoreSound();
        o.glow = 1;
        flashAlpha = 0.08;
        flashColor = '#ffd700';
      }
      
      // Collision
      const px = player.x, py = player.y, pw = player.w * 0.4, ph = player.h * 0.4;
      if (px + pw > o.x && px - pw < o.x + o.w) {
        if (py - ph < o.gapTop || py + ph > o.gapBot) {
          if (state === 'playing') endGame();
        }
      }
    });
    
    // Remove offscreen
    obstacles = obstacles.filter(o => o.x + o.w > -50);
  }
  
  // Draw obstacles
  obstacles.forEach(o => {
    // Top pillar
    const topGrad = ctx.createLinearGradient(o.x, GROUND_MARGIN, o.x, o.gapTop);
    topGrad.addColorStop(0, 'rgba(0,0,0,0)');
    topGrad.addColorStop(1, o.color);
    ctx.fillStyle = topGrad;
    ctx.fillRect(o.x, GROUND_MARGIN, o.w, o.gapTop - GROUND_MARGIN);
    
    // Bottom pillar
    const botGrad = ctx.createLinearGradient(o.x, o.gapBot, o.x, H - GROUND_MARGIN);
    botGrad.addColorStop(0, o.color);
    botGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = botGrad;
    ctx.fillRect(o.x, o.gapBot, o.w, H - GROUND_MARGIN - o.gapBot);
    
    // Gap edge glow
    ctx.shadowColor = o.color;
    ctx.shadowBlur = 15;
    ctx.strokeStyle = o.color;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(o.x, o.gapTop); ctx.lineTo(o.x + o.w, o.gapTop); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(o.x, o.gapBot); ctx.lineTo(o.x + o.w, o.gapBot); ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Score glow
    if (o.glow > 0) {
      o.glow -= dt * 3;
      ctx.globalAlpha = o.glow * 0.3;
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(o.x - 5, o.gapTop, o.w + 10, o.gapBot - o.gapTop);
      ctx.globalAlpha = 1;
    }
  });
  
  // Trail
  player.trail.forEach((t, i) => {
    t.a -= dt * 4;
    if (t.a <= 0) return;
    const size = player.w * 0.6 * t.a;
    ctx.globalAlpha = t.a * 0.4;
    ctx.fillStyle = player.gravDir === 1 ? '#00ffc8' : '#7b2fff';
    ctx.beginPath();
    ctx.arc(t.x, t.y, size / 2, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  // Player
  if (state === 'playing' || state === 'over') {
    const px = player.x, py = player.y, ps = player.w;
    const pColor = player.gravDir === 1 ? '#00ffc8' : '#7b2fff';
    
    // Glow
    ctx.shadowColor = pColor;
    ctx.shadowBlur = 20;
    
    // Diamond shape
    ctx.fillStyle = pColor;
    ctx.beginPath();
    ctx.moveTo(px, py - ps / 2);
    ctx.lineTo(px + ps / 2, py);
    ctx.lineTo(px, py + ps / 2);
    ctx.lineTo(px - ps / 2, py);
    ctx.closePath();
    ctx.fill();
    
    // Inner bright
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    const inner = ps * 0.3;
    ctx.moveTo(px, py - inner / 2);
    ctx.lineTo(px + inner / 2, py);
    ctx.lineTo(px, py + inner / 2);
    ctx.lineTo(px - inner / 2, py);
    ctx.closePath();
    ctx.fill();
    
    ctx.shadowBlur = 0;
    
    // Gravity indicator arrow
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = pColor;
    const arrowY = py + player.gravDir * (ps / 2 + 8);
    ctx.beginPath();
    ctx.moveTo(px - 6, arrowY - player.gravDir * 5);
    ctx.lineTo(px + 6, arrowY - player.gravDir * 5);
    ctx.lineTo(px, arrowY + player.gravDir * 5);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  
  // Idle animation on menu
  if (state === 'menu') {
    const t = time / 1000;
    const demoY = H / 2 + Math.sin(t * 2) * 40;
    const demoColor = Math.sin(t) > 0 ? '#00ffc8' : '#7b2fff';
    ctx.shadowColor = demoColor;
    ctx.shadowBlur = 20;
    ctx.fillStyle = demoColor;
    ctx.beginPath();
    const dx = W / 2, ds = 24;
    ctx.moveTo(dx, demoY - ds / 2);
    ctx.lineTo(dx + ds / 2, demoY);
    ctx.lineTo(dx, demoY + ds / 2);
    ctx.lineTo(dx - ds / 2, demoY);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  // Particles
  particles = particles.filter(p => {
    p.life -= p.decay * dt;
    if (p.life <= 0) return false;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.98; p.vy *= 0.98;
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
    return true;
  });
  ctx.globalAlpha = 1;
  
  // Screen flash
  if (flashAlpha > 0) {
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle = flashColor;
    ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.globalAlpha = 1;
    flashAlpha -= dt * 2;
  }
  
  ctx.restore();
}

updateBestDisplay();
initStars();
requestAnimationFrame(loop);
</script>
</body>
</html>
