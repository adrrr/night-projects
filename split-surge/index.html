<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SPLIT SURGE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

// --- Audio ---
const AudioCtx=window.AudioContext||window.webkitAudioContext;
let audioCtx;
function ensureAudio(){if(!audioCtx)audioCtx=new AudioCtx()}

function playTone(freq,dur,vol=0.15,type='sine'){
  if(!audioCtx)return;
  try{
    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function playSplit(){
  playTone(600,0.12,0.18,'sine');
  playTone(900,0.08,0.12,'triangle');
  setTimeout(()=>playTone(1200,0.1,0.08,'sine'),40);
}

function playDestroy(){
  playTone(120,0.3,0.2,'sawtooth');
  playTone(80,0.4,0.18,'square');
  setTimeout(()=>playTone(60,0.3,0.12,'sawtooth'),50);
}

function playWave(){
  playTone(440,0.08,0.08,'sine');
  setTimeout(()=>playTone(660,0.08,0.08,'sine'),70);
  setTimeout(()=>playTone(880,0.06,0.06,'sine'),140);
}

function playGameOver(){
  playTone(400,0.3,0.2,'sawtooth');
  setTimeout(()=>playTone(300,0.3,0.18,'sawtooth'),150);
  setTimeout(()=>playTone(200,0.5,0.22,'sawtooth'),300);
}

function playScore(){
  playTone(800,0.06,0.06,'sine');
}

// --- Resize ---
let W,H,scale;
function resize(){
  const dpr=Math.min(devicePixelRatio,2); // cap for perf
  W=canvas.width=Math.round(window.innerWidth*dpr);
  H=canvas.height=Math.round(window.innerHeight*dpr);
  scale=Math.min(W,H)/800;
  canvas.style.width=window.innerWidth+'px';
  canvas.style.height=window.innerHeight+'px';
}
window.addEventListener('resize',resize);
resize();

// --- State ---
const STATE={MENU:0,PLAY:1,OVER:2};
let state=STATE.MENU;
let pieces=[];
let walls=[];
let particles=[];
let wave=0;
let maxPieces=1;
let score=0;
let highScore=parseInt(localStorage.getItem('splitSurgeHigh2'))||0;
let shakeAmount=0;
let shakeTime=0;
let wallSpeed,gapSize,wallTimer,wallInterval;
let driftVX=0,driftVY=0;
let flashAlpha=0;
let flashColor='#fff';
let gameTime=0;
let gameOverDelay=0;

const PIECE_R=()=>14*scale;
const WALL_W=()=>Math.max(8,16*scale);
const MIN_GAP=0.14;
const COLORS=['#00f0ff','#ff00ff','#00ff88','#ffff00','#ff6644','#44aaff','#ff8800','#aa44ff','#ff0066','#66ffcc','#ffaa00','#8844ff','#00ffaa','#ff44aa','#44ffaa','#aa00ff'];

// --- Piece ---
function createPiece(x,y,vx,vy,color){
  return{x,y,vx,vy,color:color||COLORS[0],trail:[],alive:true,age:0};
}

function initGame(){
  pieces=[];walls=[];particles=[];
  wave=0;maxPieces=1;score=0;
  wallSpeed=1.8*scale;
  gapSize=0.32;
  wallTimer=0;
  wallInterval=100;
  driftVX=0;driftVY=0;
  shakeAmount=0;shakeTime=0;
  gameTime=0;flashAlpha=0;
  gameOverDelay=0;
  // Start piece with slight upward-right drift
  const p=createPiece(W*0.2,H*0.5,0.5*scale,0.3*scale,COLORS[0]);
  pieces.push(p);
}

// --- Walls ---
function spawnWall(){
  wave++;
  if(wave>1)playWave();
  const numGaps=Math.min(1+Math.floor(pieces.length/3),5);
  const gaps=[];
  const currentGap=Math.max(gapSize,MIN_GAP);
  for(let i=0;i<numGaps;i++){
    let gy,attempts=0;
    do{
      gy=0.08+Math.random()*0.84;
      attempts++;
    }while(attempts<30&&gaps.some(g=>Math.abs(g-gy)<currentGap*1.1));
    gaps.push(gy);
  }
  walls.push({x:W+10,gaps,gapSize:currentGap,speed:wallSpeed,passed:false,color:`hsl(${(wave*37)%360},100%,50%)`});
  // Ramp difficulty
  wallSpeed=Math.min(5*scale,wallSpeed+0.08*scale);
  gapSize=Math.max(MIN_GAP,gapSize-0.005);
  wallInterval=Math.max(50,wallInterval-1.5);
}

// --- Particles ---
function burst(x,y,color,count=12,speed=3){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const s=(0.5+Math.random()*speed)*scale;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,size:(3+Math.random()*5)*scale});
  }
}

function splitBurst(x,y,color){
  burst(x,y,color,20,5);
  burst(x,y,'#ffffff',6,3);
  flashAlpha=0.12;flashColor=color;
}

function destroyBurst(x,y,color){
  burst(x,y,color,35,7);
  burst(x,y,'#ff2200',20,6);
  shakeAmount=15*scale;shakeTime=18;
  flashAlpha=0.2;flashColor='#ff2200';
}

// --- Split ---
function splitNearest(tx,ty){
  if(pieces.length===0)return;
  if(pieces.length>=16)return;
  let best=null,bestD=Infinity;
  for(const p of pieces){
    if(!p.alive)continue;
    const d=(p.x-tx)**2+(p.y-ty)**2;
    if(d<bestD){bestD=d;best=p;}
  }
  if(!best)return;
  playSplit();
  const angle=Math.random()*Math.PI*2;
  const spd=2.5*scale;
  const newColor=COLORS[pieces.length%COLORS.length];
  const p2=createPiece(best.x,best.y,
    best.vx+Math.cos(angle)*spd,
    best.vy+Math.sin(angle)*spd,
    newColor);
  best.vx+=-Math.cos(angle)*spd;
  best.vy+=-Math.sin(angle)*spd;
  pieces.push(p2);
  maxPieces=Math.max(maxPieces,pieces.length);
  splitBurst(best.x,best.y,newColor);
}

// --- Input ---
let isSwiping=false,lastPtrX=0,lastPtrY=0;

function getCanvasPos(cx,cy){
  const dpr=Math.min(devicePixelRatio,2);
  return{x:cx*dpr,y:cy*dpr};
}

canvas.addEventListener('pointerdown',(e)=>{
  e.preventDefault();
  ensureAudio();
  const{x,y}=getCanvasPos(e.clientX,e.clientY);
  if(state===STATE.MENU){state=STATE.PLAY;initGame();return;}
  if(state===STATE.OVER){
    if(gameOverDelay>30){state=STATE.PLAY;initGame();}
    return;
  }
  if(state===STATE.PLAY){
    splitNearest(x,y);
    lastPtrX=e.clientX;lastPtrY=e.clientY;isSwiping=true;
  }
});

canvas.addEventListener('pointermove',(e)=>{
  if(state===STATE.PLAY&&isSwiping){
    const dx=e.clientX-lastPtrX;
    const dy=e.clientY-lastPtrY;
    const dpr=Math.min(devicePixelRatio,2);
    driftVX+=dx*0.012*dpr;
    driftVY+=dy*0.012*dpr;
    lastPtrX=e.clientX;lastPtrY=e.clientY;
  }
});

canvas.addEventListener('pointerup',()=>{isSwiping=false;});
canvas.addEventListener('pointercancel',()=>{isSwiping=false;});

document.addEventListener('keydown',(e)=>{
  ensureAudio();
  if(e.code==='Space'){
    e.preventDefault();
    if(state===STATE.MENU){state=STATE.PLAY;initGame();return;}
    if(state===STATE.OVER&&gameOverDelay>30){state=STATE.PLAY;initGame();return;}
    if(state===STATE.PLAY){
      // Split nearest to center-left
      splitNearest(W*0.3,H*0.5);
    }
  }
  if(state===STATE.PLAY){
    const s=0.8*scale;
    if(e.code==='ArrowLeft'||e.code==='KeyA')driftVX-=s;
    if(e.code==='ArrowRight'||e.code==='KeyD')driftVX+=s;
    if(e.code==='ArrowUp'||e.code==='KeyW')driftVY-=s;
    if(e.code==='ArrowDown'||e.code==='KeyS')driftVY+=s;
  }
});

// Mouse click (non-touch) for splitting on desktop
canvas.addEventListener('contextmenu',(e)=>e.preventDefault());

// --- Update ---
function update(){
  if(state===STATE.OVER){gameOverDelay++;return;}
  if(state!==STATE.PLAY)return;
  gameTime++;

  const r=PIECE_R();
  const maxSpd=4*scale;
  const friction=0.995;

  // Apply drift to all pieces then decay
  for(const p of pieces){
    if(!p.alive)continue;
    p.vx+=driftVX*0.02;
    p.vy+=driftVY*0.02;
  }
  driftVX*=0.85;driftVY*=0.85;
  if(Math.abs(driftVX)<0.01)driftVX=0;
  if(Math.abs(driftVY)<0.01)driftVY=0;

  // Update pieces
  for(const p of pieces){
    if(!p.alive)continue;
    p.age++;
    p.vx*=friction;p.vy*=friction;

    // Speed cap
    const spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
    if(spd>maxSpd){const f=maxSpd/spd;p.vx*=f;p.vy*=f;}

    // Gentle random drift to keep things interesting
    if(Math.random()<0.05){
      p.vx+=(Math.random()-0.5)*0.3*scale;
      p.vy+=(Math.random()-0.5)*0.3*scale;
    }

    p.x+=p.vx;p.y+=p.vy;

    // Bounce off edges
    if(p.x<r){p.x=r;p.vx=Math.abs(p.vx)*0.7;}
    if(p.x>W-r){p.x=W-r;p.vx=-Math.abs(p.vx)*0.7;}
    if(p.y<r){p.y=r;p.vy=Math.abs(p.vy)*0.7;}
    if(p.y>H-r){p.y=H-r;p.vy=-Math.abs(p.vy)*0.7;}

    // Trail
    p.trail.push({x:p.x,y:p.y});
    if(p.trail.length>14)p.trail.shift();
  }

  // Wall spawn
  wallTimer++;
  if(wallTimer>=wallInterval||(wave===0&&wallTimer>=60)){
    wallTimer=0;
    spawnWall();
  }

  // Update walls
  for(const w of walls){w.x-=w.speed;}

  // Collision
  const wallW=WALL_W();
  for(const w of walls){
    if(w.x>W+wallW||w.x<-wallW*2)continue;
    for(const p of pieces){
      if(!p.alive)continue;
      if(p.age<20)continue; // brief grace period
      if(p.x+r>w.x&&p.x-r<w.x+wallW){
        let inGap=false;
        for(const gy of w.gaps){
          const halfGap=w.gapSize*H*0.5;
          const gapCenter=gy*H;
          if(p.y>gapCenter-halfGap+r*0.3&&p.y<gapCenter+halfGap-r*0.3){inGap=true;break;}
        }
        if(!inGap){
          p.alive=false;
          playDestroy();
          destroyBurst(p.x,p.y,p.color);
        }
      }
    }
    // Score for passing wall
    if(!w.passed&&w.x+wallW<0){
      w.passed=true;
      const alive=pieces.filter(p=>p.alive).length;
      score+=alive*wave;
      if(alive>0)playScore();
    }
  }

  // Cleanup
  pieces=pieces.filter(p=>p.alive);
  walls=walls.filter(w=>w.x>-wallW*3);

  // Game over
  if(pieces.length===0){
    state=STATE.OVER;
    gameOverDelay=0;
    playGameOver();
    if(score>highScore){highScore=score;localStorage.setItem('splitSurgeHigh2',highScore);}
  }

  // Shake decay
  if(shakeTime>0){shakeTime--;shakeAmount*=0.82;}
  else shakeAmount=0;
  flashAlpha*=0.88;
}

// --- Draw ---
function drawWall(w){
  const wallW=WALL_W();
  let lastY=0;
  const sorted=[...w.gaps].sort((a,b)=>a-b);

  function drawSegment(y1,y2){
    if(y2<=y1)return;
    const grad=ctx.createLinearGradient(w.x,0,w.x+wallW,0);
    grad.addColorStop(0,'rgba(255,0,80,0.9)');
    grad.addColorStop(0.5,'rgba(255,20,60,0.6)');
    grad.addColorStop(1,'rgba(255,0,80,0.2)');
    ctx.fillStyle=grad;
    ctx.fillRect(w.x,y1,wallW,y2-y1);
    // Edge glow
    ctx.save();
    ctx.shadowColor='#ff0050';ctx.shadowBlur=12*scale;
    ctx.fillStyle='rgba(255,0,80,0.4)';
    ctx.fillRect(w.x-2*scale,y1,wallW+4*scale,y2-y1);
    ctx.restore();
  }

  for(const gy of sorted){
    const halfGap=w.gapSize*H*0.5;
    const gapTop=gy*H-halfGap;
    const gapBot=gy*H+halfGap;
    drawSegment(lastY,Math.max(lastY,gapTop));
    // Gap edge markers
    ctx.strokeStyle='rgba(0,255,136,0.7)';
    ctx.lineWidth=2*scale;
    ctx.beginPath();ctx.moveTo(w.x-4*scale,gapTop);ctx.lineTo(w.x+wallW+4*scale,gapTop);ctx.stroke();
    ctx.beginPath();ctx.moveTo(w.x-4*scale,gapBot);ctx.lineTo(w.x+wallW+4*scale,gapBot);ctx.stroke();
    // Gap glow
    ctx.save();
    ctx.shadowColor='#00ff88';ctx.shadowBlur=8*scale;
    ctx.strokeStyle='rgba(0,255,136,0.3)';
    ctx.beginPath();ctx.moveTo(w.x,gapTop);ctx.lineTo(w.x+wallW,gapTop);ctx.stroke();
    ctx.beginPath();ctx.moveTo(w.x,gapBot);ctx.lineTo(w.x+wallW,gapBot);ctx.stroke();
    ctx.restore();
    lastY=gapBot;
  }
  drawSegment(lastY,H);
}

function drawPiece(p){
  if(!p.alive)return;
  const r=PIECE_R();
  // Trail
  for(let i=0;i<p.trail.length;i++){
    const t=p.trail[i];
    const a=(i+1)/(p.trail.length+1)*0.35;
    ctx.globalAlpha=a;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(t.x,t.y,r*((i+1)/p.trail.length)*0.6,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  // Outer glow
  ctx.save();
  ctx.shadowColor=p.color;
  ctx.shadowBlur=22*scale;
  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fillStyle=p.color;
  ctx.fill();
  ctx.restore();
  // Core
  const coreGrad=ctx.createRadialGradient(p.x-r*0.2,p.y-r*0.2,0,p.x,p.y,r);
  coreGrad.addColorStop(0,'rgba(255,255,255,0.9)');
  coreGrad.addColorStop(0.4,'rgba(255,255,255,0.3)');
  coreGrad.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fillStyle=coreGrad;
  ctx.fill();
}

function drawParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const pt=particles[i];
    pt.x+=pt.vx;pt.y+=pt.vy;
    pt.vx*=0.97;pt.vy*=0.97;
    pt.life-=0.022;
    if(pt.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=pt.life*pt.life;
    ctx.save();
    ctx.shadowColor=pt.color;ctx.shadowBlur=6*scale;
    ctx.fillStyle=pt.color;
    ctx.beginPath();
    ctx.arc(pt.x,pt.y,pt.size*pt.life,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  const fontSize=Math.max(14*scale,16);
  ctx.font=`bold ${fontSize}px monospace`;
  ctx.textBaseline='top';

  // Pieces count - left
  ctx.textAlign='left';
  ctx.save();
  ctx.shadowColor='#00f0ff';ctx.shadowBlur=8*scale;
  ctx.fillStyle='#00f0ff';
  ctx.fillText(`PIECES ${pieces.length}`,W*0.03,fontSize*0.5);
  ctx.restore();

  // Wave - left below
  ctx.save();
  ctx.shadowColor='#ff00ff';ctx.shadowBlur=8*scale;
  ctx.fillStyle='#ff00ff';
  ctx.fillText(`WAVE ${wave}`,W*0.03,fontSize*2);
  ctx.restore();

  // Score - right
  ctx.textAlign='right';
  ctx.save();
  ctx.shadowColor='#ffff00';ctx.shadowBlur=8*scale;
  ctx.fillStyle='#ffff00';
  ctx.fillText(`${score}`,W*0.97,fontSize*0.5);
  ctx.restore();

  // High score
  ctx.fillStyle='rgba(255,255,255,0.3)';
  ctx.font=`${fontSize*0.65}px monospace`;
  ctx.fillText(`HI ${highScore}`,W*0.97,fontSize*2);

  ctx.textBaseline='alphabetic';
}

function drawGrid(){
  ctx.strokeStyle='rgba(0,240,255,0.03)';
  ctx.lineWidth=1;
  const gs=40*scale;
  const offsetX=(gameTime*0.5*scale)%gs;
  for(let x=-offsetX;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

function draw(){
  ctx.save();

  // Shake
  if(shakeAmount>1){
    ctx.translate(
      (Math.random()-0.5)*shakeAmount,
      (Math.random()-0.5)*shakeAmount
    );
  }

  // BG
  ctx.fillStyle='#0a0a0f';
  ctx.fillRect(-20,-20,W+40,H+40);

  drawGrid();

  if(state===STATE.PLAY||state===STATE.OVER){
    // Warning line for upcoming walls
    for(const w of walls){
      if(w.x>W*0.7&&w.x<W+20){
        const alpha=1-(w.x-W*0.7)/(W*0.3+20);
        ctx.strokeStyle=`rgba(255,0,80,${alpha*0.15})`;
        ctx.lineWidth=1;
        ctx.setLineDash([6*scale,8*scale]);
        ctx.beginPath();ctx.moveTo(w.x,0);ctx.lineTo(w.x,H);ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Walls
    for(const w of walls)drawWall(w);

    // Pieces
    for(const p of pieces)drawPiece(p);

    drawParticles();

    // Flash
    if(flashAlpha>0.005){
      ctx.globalAlpha=flashAlpha;
      ctx.fillStyle=flashColor;
      ctx.fillRect(-20,-20,W+40,H+40);
      ctx.globalAlpha=1;
    }

    drawHUD();
  }

  // --- Menu ---
  if(state===STATE.MENU){
    drawMenuParticles();
    const cx=W/2,cy=H/2;

    // Title
    const ts=Math.max(32,60*scale);
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.save();
    ctx.shadowColor='#00f0ff';ctx.shadowBlur=40*scale;
    ctx.font=`bold ${ts}px monospace`;
    ctx.fillStyle='#00f0ff';
    ctx.fillText('SPLIT',cx,cy-ts*1.1);
    ctx.shadowColor='#ff00ff';
    ctx.fillStyle='#ff00ff';
    ctx.fillText('SURGE',cx,cy-ts*0.1);
    ctx.restore();

    // Instructions
    const ss=Math.max(11,ts*0.24);
    ctx.font=`${ss}px monospace`;
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillText('TAP TO SPLIT  •  SWIPE TO STEER  •  SURVIVE THE WALLS',cx,cy+ts*0.7);

    // Start prompt
    const pulse=0.4+Math.sin(Date.now()*0.005)*0.6;
    ctx.globalAlpha=Math.max(0.3,pulse);
    ctx.font=`bold ${Math.max(14,ts*0.32)}px monospace`;
    ctx.fillStyle='#fff';
    ctx.fillText('TAP ANYWHERE TO START',cx,cy+ts*1.5);
    ctx.globalAlpha=1;

    if(highScore>0){
      ctx.font=`${ss}px monospace`;
      ctx.fillStyle='rgba(255,255,0,0.5)';
      ctx.fillText(`HIGH SCORE: ${highScore}`,cx,cy+ts*2.2);
    }

    // Decorative orb
    const orbR=PIECE_R()*1.5;
    const orbY=cy+ts*3.2;
    ctx.save();
    ctx.shadowColor='#00f0ff';ctx.shadowBlur=30*scale;
    ctx.fillStyle='#00f0ff';
    ctx.beginPath();ctx.arc(cx,orbY,orbR,0,Math.PI*2);ctx.fill();
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,0.6)';
    ctx.beginPath();ctx.arc(cx-orbR*0.2,orbY-orbR*0.2,orbR*0.4,0,Math.PI*2);ctx.fill();

    ctx.textBaseline='alphabetic';
  }

  // --- Game Over ---
  if(state===STATE.OVER){
    const alpha=Math.min(1,gameOverDelay/20)*0.7;
    ctx.fillStyle=`rgba(5,5,10,${alpha})`;
    ctx.fillRect(-20,-20,W+40,H+40);

    if(gameOverDelay>10){
      const cx=W/2,cy=H/2;
      const ts=Math.max(26,50*scale);
      ctx.textAlign='center';ctx.textBaseline='middle';

      ctx.save();
      ctx.shadowColor='#ff0050';ctx.shadowBlur=25*scale;
      ctx.font=`bold ${ts}px monospace`;
      ctx.fillStyle='#ff0050';
      ctx.fillText('GAME OVER',cx,cy-ts*1.8);
      ctx.restore();

      const ss=Math.max(12,ts*0.38);
      const lh=ss*2.2;
      ctx.font=`${ss}px monospace`;

      ctx.fillStyle='#00f0ff';
      ctx.fillText(`WAVES SURVIVED: ${wave}`,cx,cy-ss*0.5);
      ctx.fillStyle='#ff00ff';
      ctx.fillText(`MAX PIECES: ${maxPieces}`,cx,cy-ss*0.5+lh);
      ctx.fillStyle='#ffff00';
      ctx.font=`bold ${ss*1.2}px monospace`;
      ctx.fillText(`SCORE: ${score}`,cx,cy-ss*0.5+lh*2);

      if(score>=highScore&&score>0){
        const hsPulse=0.7+Math.sin(Date.now()*0.006)*0.3;
        ctx.globalAlpha=hsPulse;
        ctx.fillStyle='#00ff88';
        ctx.font=`bold ${ss}px monospace`;
        ctx.fillText('★ NEW HIGH SCORE ★',cx,cy-ss*0.5+lh*3);
        ctx.globalAlpha=1;
      }

      if(gameOverDelay>30){
        const pulse=0.3+Math.sin(Date.now()*0.005)*0.7;
        ctx.globalAlpha=Math.max(0.3,pulse);
        ctx.font=`bold ${Math.max(13,ss*0.9)}px monospace`;
        ctx.fillStyle='#fff';
        ctx.fillText('TAP TO RETRY',cx,cy-ss*0.5+lh*4.2);
        ctx.globalAlpha=1;
      }

      ctx.textBaseline='alphabetic';
    }
  }

  ctx.restore();
}

// Floating particles for menu
let menuParticles=[];
for(let i=0;i<30;i++){
  menuParticles.push({
    x:Math.random()*2000,y:Math.random()*2000,
    vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,
    size:2+Math.random()*4,
    color:COLORS[Math.floor(Math.random()*COLORS.length)],
    alpha:0.2+Math.random()*0.4
  });
}
function drawMenuParticles(){
  for(const p of menuParticles){
    p.x+=p.vx*scale;p.y+=p.vy*scale;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;
    if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx.globalAlpha=p.alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x/2000*W,p.y/2000*H,p.size*scale,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// --- Loop ---
let lastFrameTime=0;
function loop(ts){
  requestAnimationFrame(loop);
  // Throttle to ~60fps on high refresh rate displays
  if(ts-lastFrameTime<14)return;
  lastFrameTime=ts;

  update();
  draw();
}

requestAnimationFrame(loop);
</script>
