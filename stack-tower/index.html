<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stack Tower</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; width: 100%; height: 100%; }
#ui { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; z-index: 10; }
#score-display { text-align: center; padding-top: max(20px, env(safe-area-inset-top)); color: #fff; font-size: 48px; font-weight: 900; text-shadow: 0 0 20px rgba(255,255,255,0.3); letter-spacing: 2px; }
#high-score { text-align: center; color: rgba(255,255,255,0.4); font-size: 14px; margin-top: 4px; }
#combo { text-align: center; color: #ffdd57; font-size: 22px; font-weight: 700; margin-top: 8px; opacity: 0; transition: opacity 0.2s; }
#overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; pointer-events: auto; background: rgba(10,10,26,0.75); }
#overlay.hidden { display: none; }
.overlay-title { font-size: 42px; font-weight: 900; color: #fff; text-shadow: 0 0 30px rgba(255,100,200,0.5); margin-bottom: 8px; }
.overlay-sub { font-size: 16px; color: rgba(255,255,255,0.5); margin-bottom: 30px; text-align: center; padding: 0 20px; }
.overlay-score { font-size: 72px; font-weight: 900; color: #ffdd57; text-shadow: 0 0 20px rgba(255,221,87,0.4); display: none; }
.overlay-label { font-size: 14px; color: rgba(255,255,255,0.4); margin-top: 4px; margin-bottom: 20px; display: none; }
.overlay-btn { background: linear-gradient(135deg, #ff6ec7, #7873f5); color: #fff; border: none; padding: 16px 48px; border-radius: 50px; font-size: 18px; font-weight: 700; cursor: pointer; pointer-events: auto; min-height: 54px; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 30px rgba(255,110,199,0.3); }
.overlay-btn:active { transform: scale(0.95); }
#perfect-flash { position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%); font-size: 38px; font-weight: 900; color: #ffdd57; text-shadow: 0 0 20px rgba(255,221,87,0.8); opacity: 0; pointer-events: none; z-index: 15; transition: opacity 0.25s, transform 0.25s; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score-display">0</div>
  <div id="high-score"></div>
  <div id="combo"></div>
</div>
<div id="perfect-flash">✨ PERFECT!</div>
<div id="overlay">
  <div class="overlay-title">STACK TOWER</div>
  <div class="overlay-sub">Tap anywhere to drop blocks.<br>Stack as high as you can!</div>
  <div class="overlay-score"></div>
  <div class="overlay-label"></div>
  <button class="overlay-btn" id="start-btn">TAP TO START</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score-display');
const highScoreEl = document.getElementById('high-score');
const comboEl = document.getElementById('combo');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');
const perfectFlash = document.getElementById('perfect-flash');
const overlayTitle = overlay.querySelector('.overlay-title');
const overlaySub = overlay.querySelector('.overlay-sub');
const overlayScore = overlay.querySelector('.overlay-score');
const overlayLabel = overlay.querySelector('.overlay-label');

let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// Audio
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type, vol) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.1, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sndDrop() { playTone(300, 0.08, 'square', 0.1); playTone(500, 0.06, 'triangle', 0.06); }
function sndPerfect() { playTone(523, 0.12, 'sine', 0.18); setTimeout(function(){playTone(659, 0.12, 'sine', 0.18)}, 70); setTimeout(function(){playTone(784, 0.15, 'sine', 0.18)}, 140); }
function sndGameOver() { playTone(200, 0.3, 'sawtooth', 0.1); setTimeout(function(){playTone(130, 0.5, 'sawtooth', 0.08)}, 200); }

// Game constants
const BLOCK_H = 32;
const BASE_SPEED = 2.5;

// State
let blocks, moving, fallingPieces, particles, score, combo, bestCombo, highScore, gameState, cameraY, targetCameraY, shakeX, shakeY, shakeDecay, perfectTimer;

highScore = parseInt(localStorage.getItem('stack-tower-hs')) || 0;
if (highScore > 0) highScoreEl.textContent = 'BEST: ' + highScore;

function hsl(h, s, l) { return 'hsl(' + h + ',' + s + '%,' + l + '%)'; }
function blockHue(i) { return (i * 22 + 200) % 360; }
function blockColor(i) { return hsl(blockHue(i), 70, 55); }
function blockGlow(i) { return hsl(blockHue(i), 85, 65); }

// Platform/ground Y — blocks stack upward from here
function groundY() { return H * 0.78; }

function init() {
  ensureAudio();
  var gy = groundY();
  var baseW = Math.min(W * 0.45, 180);
  var baseX = (W - baseW) / 2;
  blocks = [{ x: baseX, y: gy, w: baseW }];
  moving = null; fallingPieces = []; particles = [];
  score = 0; combo = 0; bestCombo = 0;
  cameraY = 0; targetCameraY = 0;
  shakeX = 0; shakeY = 0; shakeDecay = 0; perfectTimer = 0;
  scoreEl.textContent = '0';
  comboEl.style.opacity = '0';
  perfectFlash.style.opacity = '0';
  overlay.classList.add('hidden');
  gameState = 'playing';
  spawnMoving();
}

function spawnMoving() {
  var prev = blocks[blocks.length - 1];
  var y = prev.y - BLOCK_H;
  var dir = blocks.length % 2 === 0 ? 1 : -1;
  var startX = dir > 0 ? -prev.w : W;
  var speed = BASE_SPEED + Math.min(score * 0.08, 4.5);
  moving = { x: startX, y: y, w: prev.w, dir: dir, speed: speed };
}

function spawnParticle(x, y, color) {
  particles.push({ x: x, y: y, vx: (Math.random()-0.5)*8, vy: -Math.random()*5 - 2, life: 1, color: color, size: Math.random()*3.5 + 1.5 });
}

function drop() {
  if (gameState !== 'playing' || !moving) return;
  ensureAudio();
  var prev = blocks[blocks.length - 1];
  var m = moving;
  var overlapStart = Math.max(m.x, prev.x);
  var overlapEnd = Math.min(m.x + m.w, prev.x + prev.w);
  var overlapW = overlapEnd - overlapStart;

  if (overlapW <= 0) {
    // Miss
    fallingPieces.push({ x: m.x, y: m.y, w: m.w, vy: 0, vr: (Math.random()-0.5)*0.12, r: 0, color: blockColor(blocks.length), alpha: 1 });
    sndGameOver();
    gameOver();
    return;
  }

  var tolerance = 7;
  var isPerfect = Math.abs(m.x - prev.x) < tolerance && Math.abs(m.w - prev.w) < tolerance;

  if (isPerfect) {
    // Perfect drop — keep full width
    blocks.push({ x: prev.x, y: m.y, w: prev.w });
    combo++;
    if (combo > bestCombo) bestCombo = combo;
    sndPerfect();
    perfectFlash.style.opacity = '1';
    perfectFlash.style.transform = 'translate(-50%,-50%) scale(1.2)';
    perfectTimer = 50;
    shakeDecay = 10;
    for (var i = 0; i < 30; i++) spawnParticle(prev.x + prev.w * Math.random(), m.y, blockGlow(blocks.length - 1));
  } else {
    // Normal drop — slice off overhang
    blocks.push({ x: overlapStart, y: m.y, w: overlapW });
    combo = 0;
    sndDrop();

    // Left overhang
    if (m.x < prev.x) {
      var sw = overlapStart - m.x;
      if (sw > 1) fallingPieces.push({ x: m.x, y: m.y, w: sw, vy: 0, vr: -0.05 - Math.random()*0.05, r: 0, color: blockColor(blocks.length - 1), alpha: 1 });
    }
    // Right overhang
    if (m.x + m.w > overlapEnd) {
      var sx = overlapEnd;
      var sw2 = (m.x + m.w) - overlapEnd;
      if (sw2 > 1) fallingPieces.push({ x: sx, y: m.y, w: sw2, vy: 0, vr: 0.05 + Math.random()*0.05, r: 0, color: blockColor(blocks.length - 1), alpha: 1 });
    }
    for (var j = 0; j < 8; j++) { spawnParticle(overlapStart, m.y + BLOCK_H/2, '#fff'); spawnParticle(overlapEnd, m.y + BLOCK_H/2, '#fff'); }
  }

  score++;
  scoreEl.textContent = score;
  comboEl.textContent = combo > 1 ? '\uD83D\uDD25 ' + combo + 'x COMBO' : '';
  comboEl.style.opacity = combo > 1 ? '1' : '0';

  // Camera follow
  var topBlock = blocks[blocks.length - 1];
  var screenY = topBlock.y + cameraY;
  var desired = H * 0.55;
  if (screenY < desired) {
    targetCameraY = -(topBlock.y - desired);
  }

  moving = null;
  setTimeout(function() { if (gameState === 'playing') spawnMoving(); }, 130);
}

function gameOver() {
  gameState = 'over';
  moving = null;
  if (score > highScore) { highScore = score; localStorage.setItem('stack-tower-hs', highScore); }
  setTimeout(function() {
    overlayTitle.textContent = 'GAME OVER';
    overlaySub.textContent = 'Best combo: ' + bestCombo + 'x';
    overlayScore.textContent = score;
    overlayScore.style.display = 'block';
    overlayLabel.textContent = 'HIGH SCORE: ' + highScore;
    overlayLabel.style.display = 'block';
    startBtn.textContent = 'PLAY AGAIN';
    highScoreEl.textContent = 'BEST: ' + highScore;
    overlay.classList.remove('hidden');
  }, 600);
}

function update() {
  // Move block
  if (moving) {
    moving.x += moving.speed * moving.dir;
    if (moving.dir > 0 && moving.x > W + 10) moving.dir = -1;
    if (moving.dir < 0 && moving.x + moving.w < -10) moving.dir = 1;
  }
  // Camera smooth
  cameraY += (targetCameraY - cameraY) * 0.06;
  // Shake
  if (shakeDecay > 0) {
    shakeX = (Math.random() - 0.5) * shakeDecay;
    shakeY = (Math.random() - 0.5) * shakeDecay;
    shakeDecay *= 0.82;
    if (shakeDecay < 0.3) { shakeDecay = 0; shakeX = 0; shakeY = 0; }
  }
  // Falling pieces
  for (var i = fallingPieces.length - 1; i >= 0; i--) {
    var p = fallingPieces[i];
    p.vy += 0.5; p.y += p.vy; p.r += p.vr; p.alpha -= 0.006;
    if (p.y + cameraY > H + 200 || p.alpha <= 0) fallingPieces.splice(i, 1);
  }
  // Particles
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.life -= 0.025;
    if (p.life <= 0) particles.splice(i, 1);
  }
  // Perfect flash
  if (perfectTimer > 0) {
    perfectTimer--;
    if (perfectTimer <= 0) { perfectFlash.style.opacity = '0'; perfectFlash.style.transform = 'translate(-50%,-50%) scale(0.8)'; }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0d0d30');
  bg.addColorStop(0.7, '#0a0a1a');
  bg.addColorStop(1, '#050510');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Subtle stars
  for (var i = 0; i < 40; i++) {
    var sx = (i * 137.5) % W;
    var sy = ((i * 91.3 + cameraY * 0.03) % (H + 40)) - 20;
    var br = 0.12 + 0.15 * Math.sin(Date.now() * 0.0008 + i * 3);
    ctx.fillStyle = 'rgba(255,255,255,' + br + ')';
    ctx.fillRect(sx, sy, 1.5, 1.5);
  }

  ctx.save();
  ctx.translate(shakeX, shakeY);
  var oy = cameraY;

  // Ground line (subtle)
  var gy = groundY() + BLOCK_H + oy;
  if (gy < H + 10) {
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(0, gy, W, 2);
  }

  // Draw blocks
  for (var i = 0; i < blocks.length; i++) {
    var b = blocks[i];
    var dy = b.y + oy;
    if (dy > H + 50 || dy < -60) continue;

    // Glow
    ctx.shadowColor = blockGlow(i);
    ctx.shadowBlur = 16;

    // Block fill
    ctx.fillStyle = blockColor(i);
    ctx.beginPath();
    roundRect(ctx, b.x, dy, b.w, BLOCK_H - 2, 3);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Highlight stripe
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    roundRect(ctx, b.x, dy, b.w, BLOCK_H * 0.35, 3);
    ctx.fill();

    // Edge
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    roundRect(ctx, b.x, dy, b.w, BLOCK_H - 2, 3);
    ctx.stroke();
  }

  // Moving block
  if (moving) {
    var dy = moving.y + oy;
    var ci = blocks.length;
    ctx.shadowColor = blockGlow(ci);
    ctx.shadowBlur = 22;
    ctx.fillStyle = blockColor(ci);
    ctx.beginPath();
    roundRect(ctx, moving.x, dy, moving.w, BLOCK_H - 2, 3);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    roundRect(ctx, moving.x, dy, moving.w, BLOCK_H * 0.35, 3);
    ctx.fill();

    // Subtle guide outline on previous block position
    var prev = blocks[blocks.length - 1];
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    roundRect(ctx, prev.x, dy, prev.w, BLOCK_H - 2, 3);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Falling pieces
  for (var i = 0; i < fallingPieces.length; i++) {
    var p = fallingPieces[i];
    var dy = p.y + oy;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.translate(p.x + p.w / 2, dy + BLOCK_H / 2);
    ctx.rotate(p.r);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -(BLOCK_H - 2) / 2, p.w, BLOCK_H - 2);
    ctx.restore();
  }

  // Particles
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y + oy, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function loop() {
  if (gameState === 'playing') {
    update();
  } else if (gameState === 'over') {
    // Animate remaining pieces
    for (var i = fallingPieces.length - 1; i >= 0; i--) {
      var p = fallingPieces[i]; p.vy += 0.5; p.y += p.vy; p.r += p.vr;
      if (p.y + cameraY > H + 200) fallingPieces.splice(i, 1);
    }
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.14; p.life -= 0.025;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
  draw();
  requestAnimationFrame(loop);
}

// Input
function handleInput(e) {
  if (e) e.preventDefault();
  if (gameState === 'playing') drop();
}
canvas.addEventListener('pointerdown', handleInput);
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); handleInput(); }
});
startBtn.addEventListener('click', function(e) { e.stopPropagation(); init(); });

// Init
gameState = 'idle';
blocks = []; fallingPieces = []; particles = [];
cameraY = 0; targetCameraY = 0; shakeX = 0; shakeY = 0; shakeDecay = 0; perfectTimer = 0;
score = 0; combo = 0; bestCombo = 0;
requestAnimationFrame(loop);
</script>
</body>
</html>
