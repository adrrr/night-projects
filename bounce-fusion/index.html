<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bounce Fusion</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a12;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;pointer-events:none;padding:max(env(safe-area-inset-top,8px),8px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;font-family:'Segoe UI',system-ui,sans-serif;color:#e0e0ff;z-index:10}
#score{font-size:clamp(24px,5vw,36px);font-weight:800;text-shadow:0 0 20px rgba(0,240,255,.5)}
#combo{font-size:clamp(18px,4vw,28px);font-weight:700;color:#ffd700;text-shadow:0 0 15px rgba(255,215,0,.5);opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
#hi{font-size:clamp(11px,2.5vw,15px);opacity:.5;margin-top:2px}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;font-family:'Segoe UI',system-ui,sans-serif;color:#e0e0ff;background:rgba(10,10,18,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .3s}
.scr.hide{opacity:0;pointer-events:none}
.ttl{font-size:clamp(38px,9vw,68px);font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#00f0ff,#ff00aa,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;line-height:1.1;margin-bottom:12px}
.sub{font-size:clamp(13px,3vw,17px);opacity:.6;margin-bottom:28px;text-align:center;max-width:85%;line-height:1.5}
.btn{pointer-events:auto;font-size:clamp(17px,4vw,23px);font-weight:700;padding:14px 44px;border:2px solid #00f0ff;border-radius:12px;background:rgba(0,240,255,.08);color:#00f0ff;cursor:pointer;min-width:180px;min-height:52px;text-align:center;-webkit-tap-highlight-color:transparent;transition:transform .1s,background .1s}
.btn:active{transform:scale(.95);background:rgba(0,240,255,.22)}
.fs{font-size:clamp(48px,11vw,76px);font-weight:900;color:#fff;text-shadow:0 0 30px rgba(0,240,255,.6);margin-bottom:4px}
.st{font-size:clamp(12px,2.8vw,15px);opacity:.5;margin-bottom:20px;text-align:center;line-height:1.9}
.nh{font-size:clamp(15px,3.5vw,20px);color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.5);margin-bottom:12px;animation:pls .6s ease-in-out infinite alternate}
@keyframes pls{from{transform:scale(1)}to{transform:scale(1.08)}}
.ft{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(48px,12vw,80px);font-weight:900;color:#ff00aa;text-shadow:0 0 40px rgba(255,0,170,.8);pointer-events:none;z-index:15;opacity:0;transition:opacity .3s}
.ft.on{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div><div id="score">0</div><div id="hi">BEST: 0</div></div><div id="combo"></div></div>
<div id="ft" class="ft"></div>
<div id="menu" class="scr">
<div class="ttl">BOUNCE<br>FUSION</div>
<div class="sub">Bounce balls with your paddle.<br>Same color &amp; size = FUSE!<br>Don't let any ball fall.</div>
<button class="btn" id="playBtn">TAP TO PLAY</button>
</div>
<div id="go" class="scr hide">
<div class="sub" style="margin-bottom:6px">GAME OVER</div>
<div class="fs" id="goScore">0</div>
<div class="nh hide" id="goHi">NEW HIGH SCORE!</div>
<div class="st" id="goSt"></div>
<button class="btn" id="goBtn">PLAY AGAIN</button>
</div>
<script>
// ── Canvas ──────────────────────────────────────────
const C = document.getElementById('c'), X = C.getContext('2d');
let W, H, dpr;
function resize(){
  dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  C.width = W * dpr; C.height = H * dpr;
  X.setTransform(dpr,0,0,dpr,0,0);
}
resize(); addEventListener('resize', resize);

// ── Audio ───────────────────────────────────────────
let ac = null;
function ensureAudio(){
  if(!ac) ac = new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended') ac.resume();
}
function snd(type, pitch){
  if(!ac) return;
  try {
    const t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    if(type==='bounce'){
      o.type='sine';
      o.frequency.setValueAtTime(500+pitch*80,t);
      o.frequency.exponentialRampToValueAtTime(250,t+.07);
      g.gain.setValueAtTime(.1,t);
      g.gain.exponentialRampToValueAtTime(.001,t+.07);
      o.start(t); o.stop(t+.07);
    } else if(type==='fuse'){
      const b=200+pitch*120;
      o.type='sine';
      o.frequency.setValueAtTime(b,t);
      o.frequency.exponentialRampToValueAtTime(b*3,t+.25);
      g.gain.setValueAtTime(.18,t);
      g.gain.exponentialRampToValueAtTime(.001,t+.28);
      o.start(t); o.stop(t+.28);
      const o2=ac.createOscillator(),g2=ac.createGain();
      o2.connect(g2); g2.connect(ac.destination);
      o2.type='sine';
      o2.frequency.setValueAtTime(70,t);
      o2.frequency.exponentialRampToValueAtTime(35,t+.18);
      g2.gain.setValueAtTime(.22,t);
      g2.gain.exponentialRampToValueAtTime(.001,t+.18);
      o2.start(t); o2.stop(t+.18);
    } else if(type==='flip'){
      o.type='sawtooth';
      o.frequency.setValueAtTime(200,t);
      o.frequency.exponentialRampToValueAtTime(1200,t+.35);
      g.gain.setValueAtTime(.08,t);
      g.gain.exponentialRampToValueAtTime(.001,t+.4);
      o.start(t); o.stop(t+.4);
    } else if(type==='flipEnd'){
      o.type='sawtooth';
      o.frequency.setValueAtTime(1000,t);
      o.frequency.exponentialRampToValueAtTime(150,t+.3);
      g.gain.setValueAtTime(.08,t);
      g.gain.exponentialRampToValueAtTime(.001,t+.35);
      o.start(t); o.stop(t+.35);
    } else if(type==='powerup'){
      [600,800,1000].forEach((f,i)=>{
        const oo=ac.createOscillator(),gg=ac.createGain();
        oo.connect(gg); gg.connect(ac.destination);
        oo.type='sine';
        oo.frequency.setValueAtTime(f,t+i*.08);
        gg.gain.setValueAtTime(.08,t+i*.08);
        gg.gain.exponentialRampToValueAtTime(.001,t+i*.08+.12);
        oo.start(t+i*.08); oo.stop(t+i*.08+.12);
      });
    } else if(type==='over'){
      o.type='square';
      o.frequency.setValueAtTime(350,t);
      o.frequency.exponentialRampToValueAtTime(80,t+.5);
      g.gain.setValueAtTime(.12,t);
      g.gain.exponentialRampToValueAtTime(.001,t+.5);
      o.start(t); o.stop(t+.5);
    }
  } catch(e){}
}

// ── Constants ───────────────────────────────────────
const COLS = ['#00f0ff','#ff00aa','#39ff14','#ffd700'];
const SIZES = [13,19,27,37,50];
const PTS = [1,5,15,50,150];
const GRAV = 420;
const REST = .75;
const MAX_B = 22;
const PAD_H = 14;
const MAX_P = 180;

// ── State ───────────────────────────────────────────
let state='menu', score=0, hi, balls=[], parts=[], pops=[], pows=[];
let pad, elapsed, spawnT, combo, comboT;
let gFlip, gFlipT, gFlipCD, shake, fusions, maxCombo;
let inX, lastT;
hi = parseInt(localStorage.getItem('bf_hi'))||0;
document.getElementById('hi').textContent='BEST: '+hi;

// ── Helpers ─────────────────────────────────────────
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

// ── Particles ───────────────────────────────────────
function emitP(x,y,col,n,spd){
  for(let i=0;i<n&&parts.length<MAX_P;i++){
    const a=Math.random()*Math.PI*2, s=30+Math.random()*spd;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1.5+Math.random()*3,col,life:1,dec:1.2+Math.random()*1.5});
  }
}
function emitRing(x,y,col,n,rad){
  for(let i=0;i<n&&parts.length<MAX_P;i++){
    const a=(i/n)*Math.PI*2, s=rad*2.5;
    parts.push({x:x+Math.cos(a)*rad*.3,y:y+Math.sin(a)*rad*.3,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*2,col,life:1,dec:1+Math.random()});
  }
}

// ── Popups ──────────────────────────────────────────
function addPop(x,y,txt,col){ pops.push({x,y,txt,col,life:1,vy:-90}); }

// ── Game Logic ──────────────────────────────────────
function padW(){ return Math.min(W*.28,140); }
function spawnInt(){ return Math.max(.55, 2-elapsed/60); }
function numCols(){ return elapsed<10?2:elapsed<25?3:4; }
function grav(){ const g=GRAV+elapsed*1.8; return gFlip?-g:g; }

function startGame(){
  state='playing';
  score=0; balls=[]; parts=[]; pops=[]; pows=[];
  elapsed=0; spawnT=.6; combo=0; comboT=0;
  gFlip=false; gFlipT=0; gFlipCD=16+rnd(0,4);
  shake=0; fusions=0; maxCombo=0;
  pad={x:W/2,y:H-50,w:padW(),h:PAD_H,glow:0};
  inX=W/2;
  document.getElementById('menu').classList.add('hide');
  document.getElementById('go').classList.add('hide');
  document.getElementById('score').textContent='0';
  document.getElementById('combo').classList.remove('on');
  lastT=performance.now();
}

function spawnBall(){
  if(balls.length>=MAX_B) return;
  const nc=numCols(), ci=Math.floor(Math.random()*nc);
  const m=SIZES[0]+10;
  balls.push({x:m+Math.random()*(W-2*m),y:-SIZES[0],vx:rnd(-50,50),vy:rnd(30,70),col:ci,lv:0,r:SIZES[0],fa:0});
}

function spawnPow(){
  const m=30;
  pows.push({x:m+Math.random()*(W-2*m),y:-20,vy:55+rnd(0,35),r:16,p:0});
}

function fuseBalls(i,j){
  const a=balls[i],b=balls[j];
  const nl=a.lv+1;
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  const hi2=Math.max(i,j), lo=Math.min(i,j);
  balls.splice(hi2,1); balls.splice(lo,1);

  if(nl>=SIZES.length){
    emitP(mx,my,COLS[a.col],35,300);
    emitRing(mx,my,'#fff',16,60);
    shake+=14;
    const p=500*Math.max(1,combo);
    score+=p;
    addPop(mx,my,'+'+p,'#fff');
    snd('fuse',4);
  } else {
    balls.push({x:mx,y:my,vx:(a.vx+b.vx)/2,vy:(a.vy+b.vy)/2,col:a.col,lv:nl,r:SIZES[nl],fa:1});
    emitP(mx,my,COLS[a.col],12+nl*7,130+nl*45);
    emitRing(mx,my,COLS[a.col],10+nl*3,SIZES[nl]);
    shake+=3+nl*3;
    const p=PTS[nl]*Math.max(1,combo);
    score+=p;
    let t='+'+p;
    if(combo>1) t+=' ×'+combo;
    addPop(mx,my,t,COLS[a.col]);
    snd('fuse',nl);
  }
  fusions++;
  combo++;
  comboT=3;
  maxCombo=Math.max(maxCombo,combo);
  document.getElementById('score').textContent=score;
  const ce=document.getElementById('combo');
  if(combo>=2){ ce.textContent='COMBO ×'+combo; ce.classList.add('on'); }
}

function resolveCol(a,b){
  const dx=b.x-a.x, dy=b.y-a.y;
  let d=Math.sqrt(dx*dx+dy*dy);
  if(d===0){ d=1; b.x+=1; }
  const nx=dx/d, ny=dy/d;
  const dvn=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
  if(dvn<=0) return;
  const ma=a.r*a.r, mb=b.r*b.r, tm=ma+mb;
  const imp=dvn*.8;
  a.vx-=imp*(mb/tm)*nx; a.vy-=imp*(mb/tm)*ny;
  b.vx+=imp*(ma/tm)*nx; b.vy+=imp*(ma/tm)*ny;
  const ov=(a.r+b.r-d)/2+.5;
  a.x-=nx*ov; a.y-=ny*ov;
  b.x+=nx*ov; b.y+=ny*ov;
}

function endGame(){
  state='gameover';
  snd('over',0);
  let nh=false;
  if(score>hi){ hi=score; localStorage.setItem('bf_hi',hi); document.getElementById('hi').textContent='BEST: '+hi; nh=true; }
  document.getElementById('goScore').textContent=score;
  const nhe=document.getElementById('goHi');
  nh?nhe.classList.remove('hide'):nhe.classList.add('hide');
  document.getElementById('goSt').innerHTML='Time: '+Math.floor(elapsed)+'s<br>Fusions: '+fusions+'<br>Max Combo: ×'+maxCombo;
  document.getElementById('go').classList.remove('hide');
}

// ── Update ──────────────────────────────────────────
function update(dt){
  if(state!=='playing') return;
  elapsed+=dt;

  // Paddle
  pad.w=padW();
  pad.y=gFlip?50:H-50;
  pad.x=lerp(pad.x,inX,Math.min(1,dt*22));
  pad.x=clamp(pad.x,pad.w/2,W-pad.w/2);
  pad.glow*=.9;

  // Spawning
  spawnT-=dt;
  if(spawnT<=0){ spawnBall(); spawnT=spawnInt(); }

  // Powerup spawn
  gFlipCD-=dt;
  if(gFlipCD<=0&&!gFlip&&pows.length===0){ spawnPow(); gFlipCD=20+rnd(0,10); }

  // Gravity flip timer
  if(gFlip){
    gFlipT-=dt;
    const fe=document.getElementById('ft');
    if(gFlipT<=0){
      gFlip=false; fe.classList.remove('on');
      snd('flipEnd',0);
      for(let i=0;i<25;i++) emitP(rnd(0,W),H*.15,'#ff00aa',2,80);
    } else {
      fe.textContent=Math.ceil(gFlipT); fe.classList.add('on');
    }
  }

  // Combo decay
  if(comboT>0){ comboT-=dt; if(comboT<=0){ combo=0; document.getElementById('combo').classList.remove('on'); } }

  // Powerups
  for(let i=pows.length-1;i>=0;i--){
    const p=pows[i];
    p.vy+=15*dt; p.y+=p.vy*dt; p.p+=dt*4;
    if(Math.abs(p.x-pad.x)<pad.w/2+p.r && Math.abs(p.y-pad.y)<pad.h/2+p.r){
      gFlip=true; gFlipT=5; pows.splice(i,1);
      snd('flip',0); snd('powerup',0);
      shake+=8; emitP(p.x,p.y,'#ff00aa',28,220); pad.glow=1;
      continue;
    }
    if(p.y>H+30) pows.splice(i,1);
  }

  // Balls physics
  const g=grav();
  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i];
    const mf=1+b.lv*.1;
    b.vy+=g*mf*dt;
    b.vx*=(1-.3*dt); b.vy*=(1-.08*dt);
    const v=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if(v>800){ b.vx*=800/v; b.vy*=800/v; }
    b.x+=b.vx*dt; b.y+=b.vy*dt;

    // Walls
    if(b.x-b.r<0){ b.x=b.r; b.vx=Math.abs(b.vx)*REST; }
    if(b.x+b.r>W){ b.x=W-b.r; b.vx=-Math.abs(b.vx)*REST; }

    if(!gFlip){
      if(b.y-b.r<0){ b.y=b.r; b.vy=Math.abs(b.vy)*REST; }
      if(b.y+b.r>H+15){ endGame(); return; }
    } else {
      if(b.y+b.r>H){ b.y=H-b.r; b.vy=-Math.abs(b.vy)*REST; }
      if(b.y+b.r<-15){ endGame(); return; }
    }

    // Paddle collision (zone-based to prevent tunneling)
    const whalf=pad.w/2, phalf=pad.h/2+4; // slightly taller hitbox
    const inX2=b.x>pad.x-whalf-b.r && b.x<pad.x+whalf+b.r;
    if(inX2){
      const padTop=pad.y-phalf, padBot=pad.y+phalf;
      const hitFromAbove=!gFlip && b.vy>0 && b.y+b.r>padTop && b.y-b.r<padBot;
      const hitFromBelow=gFlip && b.vy<0 && b.y-b.r<padBot && b.y+b.r>padTop;
      if(hitFromAbove||hitFromBelow){
        const hp=clamp((b.x-pad.x)/whalf,-1,1);
        if(!gFlip){ b.vy=-Math.abs(b.vy)*.85; b.vy=Math.min(b.vy,-120); b.y=padTop-b.r; }
        else { b.vy=Math.abs(b.vy)*.85; b.vy=Math.max(b.vy,120); b.y=padBot+b.r; }
        b.vx+=hp*280;
        snd('bounce',b.lv); emitP(b.x,!gFlip?padTop:padBot,COLS[b.col],4,70); pad.glow=.6;
      }
    }

    if(b.fa>0) b.fa-=dt*3;
  }

  // Ball-ball collisions
  outer: for(let i=0;i<balls.length;i++){
    for(let j=i+1;j<balls.length;j++){
      const a=balls[i],b=balls[j];
      const dx=b.x-a.x, dy=b.y-a.y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<a.r+b.r){
        if(a.col===b.col && a.lv===b.lv){
          fuseBalls(i,j);
          i=-1; continue outer;
        } else { resolveCol(a,b); }
      }
    }
  }

  // Particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=80*dt;
    p.life-=p.dec*dt;
    if(p.life<=0) parts.splice(i,1);
  }

  // Popups
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i];
    p.y+=p.vy*dt; p.life-=dt*.8;
    if(p.life<=0) pops.splice(i,1);
  }

  shake*=Math.pow(.04,dt);
  if(shake<.5) shake=0;
}

// ── Render ──────────────────────────────────────────
function render(){
  X.save();
  if(shake>.5) X.translate((Math.random()-.5)*shake*2,(Math.random()-.5)*shake*2);

  // Background
  const bg=X.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,gFlip?'#1a0022':'#0a0a12');
  bg.addColorStop(1,gFlip?'#0a0a12':'#0d0016');
  X.fillStyle=bg; X.fillRect(0,0,W,H);

  // Grid
  X.strokeStyle='rgba(255,255,255,.025)'; X.lineWidth=1;
  for(let x=0;x<W;x+=40){ X.beginPath(); X.moveTo(x,0); X.lineTo(x,H); X.stroke(); }
  for(let y=0;y<H;y+=40){ X.beginPath(); X.moveTo(0,y); X.lineTo(W,y); X.stroke(); }

  // Danger zone
  if(state==='playing'){
    let da=0;
    for(const b of balls){
      const dd=gFlip?b.y:(H-b.y);
      if(dd<100) da=Math.max(da,(1-dd/100)*.35);
    }
    if(da>0){
      const dg=X.createLinearGradient(0,gFlip?0:H-90,0,gFlip?90:H);
      dg.addColorStop(0,`rgba(255,0,0,${gFlip?da:0})`);
      dg.addColorStop(1,`rgba(255,0,0,${gFlip?0:da})`);
      X.fillStyle=dg; X.fillRect(0,0,W,H);
    }
  }

  // Particles
  X.globalCompositeOperation='lighter';
  for(const p of parts){
    const a=Math.max(0,p.life);
    X.globalAlpha=a*.8; X.fillStyle=p.col;
    X.beginPath(); X.arc(p.x,p.y,p.r*a,0,Math.PI*2); X.fill();
  }
  X.globalCompositeOperation='source-over'; X.globalAlpha=1;

  // Powerups
  for(const p of pows){
    const sc=.8+Math.sin(p.p)*.2, r=p.r*sc;
    X.globalCompositeOperation='lighter';
    const gl=X.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3);
    gl.addColorStop(0,'rgba(255,0,170,.3)'); gl.addColorStop(1,'rgba(255,0,170,0)');
    X.fillStyle=gl; X.fillRect(p.x-r*3,p.y-r*3,r*6,r*6);
    X.globalCompositeOperation='source-over';
    X.save(); X.translate(p.x,p.y);
    X.fillStyle='#ff00aa'; X.strokeStyle='#fff'; X.lineWidth=2;
    X.beginPath(); X.moveTo(0,-r); X.lineTo(r*.7,0); X.lineTo(0,r); X.lineTo(-r*.7,0); X.closePath();
    X.fill(); X.stroke();
    X.fillStyle='#fff'; X.font=`bold ${r}px sans-serif`; X.textAlign='center'; X.textBaseline='middle';
    X.fillText('⇅',0,1);
    X.restore();
  }

  // Balls
  for(const b of balls){
    const fs=b.fa>0?1+Math.sin(b.fa*Math.PI)*.3:1;
    const r=b.r*fs; const c=COLS[b.col];

    X.globalCompositeOperation='lighter';
    const gr=r*(2+b.lv*.4);
    const gl=X.createRadialGradient(b.x,b.y,r*.5,b.x,b.y,gr);
    gl.addColorStop(0,c+'40'); gl.addColorStop(1,c+'00');
    X.fillStyle=gl; X.beginPath(); X.arc(b.x,b.y,gr,0,Math.PI*2); X.fill();
    X.globalCompositeOperation='source-over';

    const bd=X.createRadialGradient(b.x-r*.3,b.y-r*.3,r*.1,b.x,b.y,r);
    bd.addColorStop(0,'#fff'); bd.addColorStop(.3,c); bd.addColorStop(1,c+'80');
    X.fillStyle=bd; X.beginPath(); X.arc(b.x,b.y,r,0,Math.PI*2); X.fill();

    if(b.lv>0){
      X.strokeStyle='rgba(255,255,255,.35)'; X.lineWidth=1.5;
      for(let k=0;k<b.lv;k++){
        X.beginPath(); X.arc(b.x,b.y,r*(.5+k*.15),0,Math.PI*2); X.stroke();
      }
    }
    X.fillStyle='rgba(255,255,255,.13)';
    X.beginPath(); X.arc(b.x-r*.25,b.y-r*.25,r*.35,0,Math.PI*2); X.fill();
  }

  // Paddle
  if(state==='playing'){
    const px=pad.x-pad.w/2, py=pad.y-pad.h/2;
    X.globalCompositeOperation='lighter';
    const pg=X.createRadialGradient(pad.x,pad.y,0,pad.x,pad.y,pad.w*.7);
    const gi=.12+pad.glow*.4;
    pg.addColorStop(0,`rgba(0,240,255,${gi})`); pg.addColorStop(1,'rgba(0,240,255,0)');
    X.fillStyle=pg; X.fillRect(pad.x-pad.w,pad.y-pad.h*4,pad.w*2,pad.h*8);
    X.globalCompositeOperation='source-over';

    const pd=X.createLinearGradient(px,py,px,py+pad.h);
    pd.addColorStop(0,'#00f0ff'); pd.addColorStop(1,'#0080aa');
    X.fillStyle=pd;
    const cr=pad.h/2;
    X.beginPath();
    X.moveTo(px+cr,py); X.lineTo(px+pad.w-cr,py);
    X.arc(px+pad.w-cr,py+cr,cr,-Math.PI/2,Math.PI/2);
    X.lineTo(px+cr,py+pad.h);
    X.arc(px+cr,py+cr,cr,Math.PI/2,-Math.PI/2);
    X.closePath(); X.fill();
    X.strokeStyle=`rgba(0,240,255,${.6+pad.glow*.4})`; X.lineWidth=2; X.stroke();
  }

  // Score popups
  for(const p of pops){
    const a=Math.max(0,p.life), s=1+(1-a)*.5;
    X.globalAlpha=a; X.save(); X.translate(p.x,p.y); X.scale(s,s);
    const fs=Math.max(14,Math.min(20,W*3/100));
    X.font=`bold ${fs}px sans-serif`; X.textAlign='center'; X.textBaseline='middle';
    X.fillStyle=p.col; X.shadowColor=p.col; X.shadowBlur=10;
    X.fillText(p.txt,0,0);
    X.shadowBlur=0; X.restore(); X.globalAlpha=1;
  }

  X.restore();
}

// ── Input ───────────────────────────────────────────
C.addEventListener('touchstart',e=>{e.preventDefault();ensureAudio();inX=e.touches[0].clientX},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();inX=e.touches[0].clientX},{passive:false});
C.addEventListener('touchend',e=>{e.preventDefault()},{passive:false});
C.addEventListener('mousedown',e=>{ensureAudio();inX=e.clientX});
C.addEventListener('mousemove',e=>{if(state==='playing')inX=e.clientX});
const keys={};
document.addEventListener('keydown',e=>{keys[e.key]=true;ensureAudio()});
document.addEventListener('keyup',e=>{keys[e.key]=false});
function keyInput(dt){
  const s=600;
  if(keys.ArrowLeft||keys.a) inX=pad.x-s*dt;
  if(keys.ArrowRight||keys.d) inX=pad.x+s*dt;
}

// ── Buttons ─────────────────────────────────────────
document.getElementById('playBtn').onclick=()=>{ensureAudio();startGame()};
document.getElementById('goBtn').onclick=()=>{ensureAudio();startGame()};
document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'){
    if(state==='menu'||state==='gameover'){ensureAudio();startGame();}
  }
});

// ── Loop ────────────────────────────────────────────
lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-(lastT||now))/1000,.05);
  lastT=now;
  if(state==='playing'){ keyInput(dt); update(dt); }
  render();
}
requestAnimationFrame(loop);
</script>
</body>
