<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gravity Well</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  font-family: 'Courier New', monospace;
}
canvas {
  display: block;
  width: 100%; height: 100%;
}
#ui {
  position: absolute; top: 0; left: 0; right: 0;
  padding: 16px 20px;
  display: flex; justify-content: space-between; align-items: flex-start;
  pointer-events: none; z-index: 10;
}
#score-display {
  font-size: 28px; font-weight: bold;
  color: #fff; text-shadow: 0 0 20px rgba(100,180,255,0.8);
}
#high-score {
  font-size: 14px; color: rgba(255,255,255,0.5);
  margin-top: 4px;
}
#mass-bar-wrap {
  width: 120px; height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px; overflow: hidden;
  margin-top: 8px;
}
#mass-bar {
  height: 100%; width: 50%;
  background: linear-gradient(90deg, #4af, #a6f);
  border-radius: 4px;
  transition: width 0.3s;
}
#combo-display {
  font-size: 16px; color: #ff0;
  text-shadow: 0 0 10px rgba(255,255,0,0.6);
  opacity: 0; transition: opacity 0.2s;
  text-align: right;
}
#game-over {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.85);
  z-index: 20; opacity: 0;
  transition: opacity 0.5s;
  pointer-events: none;
}
#game-over.visible {
  opacity: 1; pointer-events: auto;
}
#game-over h1 {
  font-size: 48px; color: #f44;
  text-shadow: 0 0 40px rgba(255,50,50,0.8);
  margin-bottom: 12px;
}
#game-over .final-score {
  font-size: 32px; color: #fff;
  margin-bottom: 8px;
}
#game-over .new-high {
  font-size: 18px; color: #ff0;
  text-shadow: 0 0 15px rgba(255,255,0,0.6);
  margin-bottom: 24px;
  min-height: 24px;
}
#game-over .restart-btn {
  font-size: 22px; color: #000;
  background: #4af; border: none;
  padding: 16px 48px; border-radius: 12px;
  font-family: 'Courier New', monospace;
  font-weight: bold; cursor: pointer;
  min-width: 200px; min-height: 56px;
  text-shadow: none;
  box-shadow: 0 0 30px rgba(68,170,255,0.5);
}
#game-over .restart-btn:active {
  transform: scale(0.95);
  background: #3ae;
}
#start-screen {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(0,0,0,0.9);
  z-index: 30;
}
#start-screen h1 {
  font-size: 42px; color: #fff;
  text-shadow: 0 0 40px rgba(100,180,255,0.8);
  margin-bottom: 8px; text-align: center;
}
#start-screen .subtitle {
  font-size: 16px; color: rgba(255,255,255,0.5);
  margin-bottom: 40px; text-align: center;
  padding: 0 20px;
}
#start-screen .start-btn {
  font-size: 24px; color: #000;
  background: #4af; border: none;
  padding: 18px 56px; border-radius: 14px;
  font-family: 'Courier New', monospace;
  font-weight: bold; cursor: pointer;
  min-width: 220px; min-height: 60px;
  box-shadow: 0 0 40px rgba(68,170,255,0.5);
}
#start-screen .start-btn:active {
  transform: scale(0.95);
}
#start-screen .hint {
  font-size: 14px; color: rgba(255,255,255,0.35);
  margin-top: 20px; text-align: center;
  padding: 0 30px;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="ui">
  <div>
    <div id="score-display">0</div>
    <div id="high-score"></div>
    <div id="mass-bar-wrap"><div id="mass-bar"></div></div>
  </div>
  <div id="combo-display"></div>
</div>

<div id="game-over">
  <h1>COLLAPSED</h1>
  <div class="final-score" id="final-score">0</div>
  <div class="new-high" id="new-high"></div>
  <button class="restart-btn" id="restart-btn">RESTART</button>
</div>

<div id="start-screen">
  <h1>GRAVITY WELL</h1>
  <div class="subtitle">TAP to pulse your gravity.<br>Absorb matter. Avoid antimatter.</div>
  <button class="start-btn" id="start-btn">START</button>
  <div class="hint">Tap/click anywhere to pull objects in</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// UI elements
const scoreEl = document.getElementById('score-display');
const highScoreEl = document.getElementById('high-score');
const massBar = document.getElementById('mass-bar');
const comboEl = document.getElementById('combo-display');
const gameOverEl = document.getElementById('game-over');
const finalScoreEl = document.getElementById('final-score');
const newHighEl = document.getElementById('new-high');
const restartBtn = document.getElementById('restart-btn');
const startScreen = document.getElementById('start-screen');
const startBtn = document.getElementById('start-btn');

let W, H, cx, cy, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx = W / 2;
  cy = H / 2;
}
resize();
window.addEventListener('resize', resize);

// Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(freq, dur, vol = 0.15, type = 'sine') {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.5, audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}

function playPulse() {
  playSound(200, 0.15, 0.12, 'sine');
  playSound(120, 0.2, 0.08, 'triangle');
}

function playAbsorb(big) {
  const f = big ? 600 : 400;
  playSound(f, 0.12, 0.1, 'sine');
  playSound(f * 1.5, 0.08, 0.06, 'sine');
}

function playAnti() {
  playSound(80, 0.4, 0.2, 'sawtooth');
  playSound(60, 0.3, 0.15, 'square');
}

function playGameOver() {
  playSound(200, 0.5, 0.2, 'sawtooth');
  setTimeout(() => playSound(100, 0.8, 0.25, 'sawtooth'), 200);
  setTimeout(() => playSound(50, 1.2, 0.3, 'sawtooth'), 500);
}

function playCombo() {
  playSound(800, 0.1, 0.08, 'sine');
  playSound(1000, 0.1, 0.06, 'sine');
}

// Game state
let state = 'start'; // start, playing, over
let score, highScore, mass, maxMass, minMass;
let objects, particles, pulseWaves;
let pulseActive, pulseRadius, pulseStrength;
let comboCount, comboTimer;
let shakeX, shakeY, shakeDur;
let spawnTimer, spawnInterval;
let difficulty, gameTime;
let bgStars;

const MIN_MASS = 8;
const START_MASS = 25;
const MAX_MASS = 80;
const PULSE_SPEED = 400;
const PULSE_MAX_RADIUS_MULT = 8;
const BASE_GRAVITY = 180;
const PULSE_GRAVITY = 600;

highScore = parseInt(localStorage.getItem('gravitywell-high') || '0');

function initBgStars() {
  bgStars = [];
  for (let i = 0; i < 120; i++) {
    bgStars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.5 + 0.1,
      flicker: Math.random() * Math.PI * 2
    });
  }
}

function initGame() {
  score = 0;
  mass = START_MASS;
  maxMass = MAX_MASS;
  minMass = MIN_MASS;
  objects = [];
  particles = [];
  pulseWaves = [];
  pulseActive = false;
  pulseRadius = 0;
  pulseStrength = 0;
  comboCount = 0;
  comboTimer = 0;
  shakeX = 0; shakeY = 0; shakeDur = 0;
  spawnTimer = 0;
  spawnInterval = 1.2;
  difficulty = 0;
  gameTime = 0;
  initBgStars();
  updateUI();
}

function spawnObject() {
  const edge = Math.random() * (2 * W + 2 * H);
  let sx, sy;
  if (edge < W) { sx = edge; sy = -30; }
  else if (edge < W + H) { sx = W + 30; sy = edge - W; }
  else if (edge < 2 * W + H) { sx = 2 * W + H - edge; sy = H + 30; }
  else { sx = -30; sy = 2 * W + 2 * H - edge; }

  const angle = Math.atan2(cy - sy, cx - sx) + (Math.random() - 0.5) * 1.2;
  const speed = 30 + Math.random() * 50 + difficulty * 5;

  // Red antimatter chance increases with difficulty
  const antiChance = Math.min(0.08 + difficulty * 0.035, 0.45);
  const isAnti = Math.random() < antiChance;

  // Bigger objects at higher difficulty
  const baseSize = isAnti ? (4 + Math.random() * 4) : (3 + Math.random() * 6 + difficulty * 0.5);
  const sizeClamp = Math.min(baseSize, 14);

  // Point value scales with size
  const points = isAnti ? 0 : Math.round(sizeClamp * 2);

  objects.push({
    x: sx, y: sy,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    r: sizeClamp,
    anti: isAnti,
    points: points,
    alpha: 1,
    trail: []
  });
}

function triggerPulse() {
  if (state !== 'playing') return;
  pulseActive = true;
  pulseRadius = mass;
  pulseStrength = 1;
  pulseWaves.push({ r: mass, alpha: 0.7, maxR: mass * PULSE_MAX_RADIUS_MULT });
  playPulse();
}

function addParticles(x, y, color, count, speed) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = Math.random() * speed;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      r: Math.random() * 2 + 0.5,
      life: 0.6 + Math.random() * 0.4,
      maxLife: 0.6 + Math.random() * 0.4,
      color
    });
  }
}

function shake(intensity, duration) {
  shakeDur = duration;
  shakeX = (Math.random() - 0.5) * intensity;
  shakeY = (Math.random() - 0.5) * intensity;
}

function addCombo() {
  comboCount++;
  comboTimer = 2;
  if (comboCount >= 3) {
    playCombo();
    const bonus = comboCount * 5;
    score += bonus;
    comboEl.textContent = `${comboCount}x COMBO +${bonus}`;
    comboEl.style.opacity = '1';
    comboEl.style.color = '#ff0';
  }
}

function updateUI() {
  scoreEl.textContent = score;
  if (highScore > 0) highScoreEl.textContent = `HI ${highScore}`;
  const pct = ((mass - minMass) / (maxMass - minMass)) * 100;
  massBar.style.width = Math.max(0, Math.min(100, pct)) + '%';
  if (pct < 25) {
    massBar.style.background = 'linear-gradient(90deg, #f44, #f80)';
  } else {
    massBar.style.background = 'linear-gradient(90deg, #4af, #a6f)';
  }
}

function update(dt) {
  if (state !== 'playing') return;

  gameTime += dt;
  difficulty = Math.min(gameTime / 30, 10); // ramps over ~5 minutes

  // Spawn
  spawnInterval = Math.max(0.25, 1.2 - difficulty * 0.09);
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    spawnTimer = spawnInterval;
    spawnObject();
    // Extra spawns at higher difficulty
    if (difficulty > 3 && Math.random() < 0.3) spawnObject();
    if (difficulty > 6 && Math.random() < 0.3) spawnObject();
  }

  // Pulse waves
  for (let i = pulseWaves.length - 1; i >= 0; i--) {
    const pw = pulseWaves[i];
    pw.r += PULSE_SPEED * dt;
    pw.alpha *= 0.96;
    if (pw.r > pw.maxR || pw.alpha < 0.01) pulseWaves.splice(i, 1);
  }

  // Pulse decay
  if (pulseActive) {
    pulseRadius += PULSE_SPEED * dt;
    pulseStrength *= 0.97;
    if (pulseStrength < 0.05 || pulseRadius > mass * PULSE_MAX_RADIUS_MULT) {
      pulseActive = false;
    }
  }

  // Passive gravity strength scales with mass
  const passiveGravity = BASE_GRAVITY * (mass / START_MASS) * 0.6;

  // Objects
  for (let i = objects.length - 1; i >= 0; i--) {
    const o = objects[i];
    const dx = cx - o.x;
    const dy = cy - o.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const nx = dx / (dist + 0.01);
    const ny = dy / (dist + 0.01);

    // Passive gentle gravity (always pulling slightly)
    const passiveF = passiveGravity / (dist + 50);
    o.vx += nx * passiveF * dt;
    o.vy += ny * passiveF * dt;

    // Pulse gravity (strong pull during pulse)
    if (pulseActive && dist < pulseRadius) {
      const pulseF = PULSE_GRAVITY * pulseStrength * (mass / START_MASS) / (dist + 30);
      o.vx += nx * pulseF * dt;
      o.vy += ny * pulseF * dt;
    }

    o.x += o.vx * dt;
    o.y += o.vy * dt;

    // Trail
    o.trail.push({ x: o.x, y: o.y, a: 0.5 });
    if (o.trail.length > 8) o.trail.shift();
    for (const t of o.trail) t.a *= 0.9;

    // Absorption check
    if (dist < mass + o.r * 0.5) {
      if (o.anti) {
        // Antimatter damage
        mass -= o.r * 1.5;
        shake(12, 0.2);
        addParticles(o.x, o.y, '#f44', 15, 120);
        playAnti();
        comboCount = 0;
        comboEl.style.opacity = '0';

        if (mass <= minMass) {
          mass = minMass;
          gameOver();
          return;
        }
      } else {
        // Matter absorbed
        mass = Math.min(maxMass, mass + o.r * 0.3);
        score += o.points;
        addParticles(o.x, o.y, '#4af', 10, 80);
        playAbsorb(o.r > 8);
        addCombo();
        shake(3, 0.08);
      }
      objects.splice(i, 1);
      continue;
    }

    // Off-screen cleanup (generous margin)
    if (o.x < -200 || o.x > W + 200 || o.y < -200 || o.y > H + 200) {
      objects.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Shake
  if (shakeDur > 0) {
    shakeDur -= dt;
    shakeX *= 0.9;
    shakeY *= 0.9;
  } else {
    shakeX = 0;
    shakeY = 0;
  }

  // Combo decay
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) {
      comboCount = 0;
      comboEl.style.opacity = '0';
    }
  }

  updateUI();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Background stars
  for (const s of bgStars) {
    s.flicker += 0.02;
    const a = s.a + Math.sin(s.flicker) * 0.15;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.fill();
  }

  // Pulse waves
  for (const pw of pulseWaves) {
    ctx.beginPath();
    ctx.arc(cx, cy, pw.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(100,180,255,${pw.alpha * 0.4})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Gravity field visualization (subtle)
  if (state === 'playing') {
    const fieldR = mass * 2;
    const grd = ctx.createRadialGradient(cx, cy, mass * 0.5, cx, cy, fieldR);
    grd.addColorStop(0, 'rgba(100,150,255,0.06)');
    grd.addColorStop(1, 'rgba(100,150,255,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, fieldR, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
  }

  // Objects trails & bodies
  for (const o of objects) {
    // Trail
    for (let t = 0; t < o.trail.length; t++) {
      const tr = o.trail[t];
      const prog = t / o.trail.length;
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, o.r * prog * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = o.anti
        ? `rgba(255,60,60,${tr.a * 0.3})`
        : `rgba(100,180,255,${tr.a * 0.2})`;
      ctx.fill();
    }

    // Body
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    if (o.anti) {
      ctx.fillStyle = '#f44';
      ctx.shadowColor = '#f44';
      ctx.shadowBlur = 15;
    } else {
      // Color based on size
      const hue = 200 + o.r * 5;
      ctx.fillStyle = `hsl(${hue}, 80%, 65%)`;
      ctx.shadowColor = `hsl(${hue}, 80%, 65%)`;
      ctx.shadowBlur = 10;
    }
    ctx.fill();
    ctx.shadowBlur = 0;

    // Antimatter inner warning
    if (o.anti) {
      ctx.beginPath();
      ctx.arc(o.x, o.y, o.r * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = '#800';
      ctx.fill();
    }
  }

  // Black hole (player)
  if (state === 'playing' || state === 'over') {
    // Accretion disk
    const diskR = mass * 1.3;
    const time = performance.now() * 0.001;
    ctx.save();
    ctx.translate(cx, cy);
    for (let ring = 0; ring < 3; ring++) {
      ctx.beginPath();
      const rr = mass + ring * 4 + Math.sin(time * 2 + ring) * 2;
      ctx.arc(0, 0, rr, 0, Math.PI * 2);
      const alpha = (0.15 - ring * 0.04) * (mass / START_MASS);
      ctx.strokeStyle = `rgba(140,100,255,${Math.min(alpha, 0.3)})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Event horizon glow
    const glow = ctx.createRadialGradient(0, 0, mass * 0.3, 0, 0, mass * 1.5);
    glow.addColorStop(0, 'rgba(80,50,200,0.3)');
    glow.addColorStop(0.5, 'rgba(60,30,150,0.1)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(0, 0, mass * 1.5, 0, Math.PI * 2);
    ctx.fillStyle = glow;
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(0, 0, mass, 0, Math.PI * 2);
    const coreGrd = ctx.createRadialGradient(0, 0, 0, 0, 0, mass);
    coreGrd.addColorStop(0, '#111');
    coreGrd.addColorStop(0.7, '#050510');
    coreGrd.addColorStop(1, '#1a0a3a');
    ctx.fillStyle = coreGrd;
    ctx.shadowColor = '#6040c0';
    ctx.shadowBlur = 25;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Bright ring at edge
    ctx.beginPath();
    ctx.arc(0, 0, mass, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(160,120,255,${0.4 + Math.sin(time * 3) * 0.1})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
  }

  // Particles
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = alpha;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function gameOver() {
  state = 'over';
  playGameOver();
  shake(20, 0.4);
  addParticles(cx, cy, '#a040ff', 40, 200);
  addParticles(cx, cy, '#4af', 30, 150);

  finalScoreEl.textContent = score;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('gravitywell-high', highScore);
    newHighEl.textContent = 'NEW HIGH SCORE!';
  } else {
    newHighEl.textContent = '';
  }

  setTimeout(() => {
    gameOverEl.classList.add('visible');
  }, 800);
}

function startGame() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  initGame();
  state = 'playing';
  startScreen.style.display = 'none';
  gameOverEl.classList.remove('visible');
}

// Input
function handleInput(x, y) {
  if (state === 'playing') {
    triggerPulse();
  }
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  handleInput(e.clientX, e.clientY);
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (state === 'playing') {
      triggerPulse();
    } else if (state === 'over') {
      startGame();
    } else if (state === 'start') {
      startGame();
    }
  }
});

startBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  startGame();
});
startBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  e.stopPropagation();
  startGame();
});

restartBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  startGame();
});
restartBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  e.stopPropagation();
  startGame();
});

// Game loop
let lastTime = 0;
function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.05);
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// Init stars for start screen
initBgStars();
requestAnimationFrame(loop);
</script>
</body>
</html>
