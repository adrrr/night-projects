// ============================================================
//  UPDATE
// ============================================================

function update(dt) {
  if (!running || !player) return;

  // Death animation countdown
  if (deathAnimActive) {
    deathAnimTimer -= dt; // real time
    if (deathAnimTimer <= 0) {
      deathAnimActive = false;
      slowmoScale = 1;
      player.alive = false;
      running = false;
      playGameOver();
      vignetteEl.style.opacity = '0';
      gameOver();
      return;
    }
    // Keep rendering but don't process game logic
    gameTime += dt * 0.2;
    player.flashTimer += dt * 15;
    // Directional shake during death
    if (shakeIntensity > 0.5) {
      shakeX = Math.cos(deathImpactAngle) * shakeIntensity * (0.5 + Math.random() * 0.5);
      shakeY = Math.sin(deathImpactAngle) * shakeIntensity * (0.5 + Math.random() * 0.5);
      shakeIntensity *= SHAKE_DECAY;
    } else {
      shakeX = shakeY = 0;
    }
    return;
  }

  // Tier-up: micro-freeze (0.06s) then smooth slow-mo (sine ease: 1.0 → 0.3 → 1.0)
  if (tierUpFreezeTimer > 0) {
    tierUpFreezeTimer -= dt;
    slowmoScale = 0; // complete freeze
    if (tierUpFreezeTimer <= 0) {
      tierUpSlowmoTimer = TIERUP_SLOWMO_DURATION;
    }
  } else if (tierUpSlowmoTimer > 0) {
    tierUpSlowmoTimer -= dt;
    const progress = Math.min(1, 1 - (tierUpSlowmoTimer / TIERUP_SLOWMO_DURATION));
    slowmoScale = 1 - 0.7 * Math.sin(Math.PI * progress);
    if (tierUpSlowmoTimer <= 0 && !frenzyActive) {
      slowmoScale = 1;
    }
  }

  // Tier-up size lerp (easeOutCubic over 0.3s, uses real dt so it's visible during slow-mo)
  if (tierUpSizeLerpTimer > 0) {
    tierUpSizeLerpTimer = Math.max(0, tierUpSizeLerpTimer - dt);
    const t = 1 - (tierUpSizeLerpTimer / 0.3);
    const ease = 1 - Math.pow(1 - t, 3); // easeOutCubic
    player.radius = tierUpSizeLerpFrom + (player.targetRadius - tierUpSizeLerpFrom) * ease;
    if (tierUpSizeLerpTimer <= 0) player.radius = player.targetRadius;
  }

  // Apply slow-mo
  const effectiveDt = dt * slowmoScale;
  gameTime += effectiveDt;

  // Festin golden time timer
  if (frenzyActive) {
    frenzyTimer -= dt; // real time, not slowed
    // Initial slow-mo for first 0.5s, then normal speed during golden time
    if (frenzyTimer < 3.5 && tierUpSlowmoTimer <= 0) {
      slowmoScale = 1;
    }
    // Maintain golden glow
    saturationFlash = Math.max(0.6, saturationFlash);
    if (frenzyTimer <= 0) {
      frenzyActive = false;
      slowmoScale = 1;
      saturationFlash = 0;
      stopFestinDrone();
      // Show festin summary
      if (festinPointsAccum > 0) {
        spawnFloatingText(W / 2, H / 3, `FESTIN +${festinPointsAccum} pts !`, '#ffd700', true, 38);
      }
    }
  }
  // Saturation flash decay (only when not in festin)
  if (saturationFlash > 0 && !frenzyActive) {
    saturationFlash = Math.max(0, saturationFlash - dt * 3);
  }

  // Grace period countdown
  if (graceTimer > 0) {
    graceTimer = Math.max(0, graceTimer - dt);
  }

  // Tier-up golden flash decay
  if (tierUpFlashTimer > 0) {
    tierUpFlashTimer = Math.max(0, tierUpFlashTimer - dt);
  }

  // Tier-up expansion ring animation (legacy single ring)
  if (tierUpRingAlpha > 0) {
    tierUpRingRadius += dt * 300;
    tierUpRingAlpha = Math.max(0, tierUpRingAlpha - dt * 1.4);
  }

  // Enhanced tier-up 3-ring animation
  for (let i = 0; i < 3; i++) {
    const ring = tierUpRings[i];
    if (ring.alpha <= 0) continue;
    ring.age += dt;
    if (ring.age > ring.delay) {
      ring.radius += dt * 300;
      ring.alpha = Math.max(0, ring.alpha - dt * 1.0);
    }
  }

  // Tier-up zoom animation
  if (tierUpZoomTimer > 0) {
    tierUpZoomTimer -= dt;
    const zt = 1 - (tierUpZoomTimer / 1.0);
    tierUpZoomScale = zt < 0.3 ? 1 - (zt / 0.3) * 0.08 : 0.92 + ((zt - 0.3) / 0.7) * 0.08;
    if (tierUpZoomTimer <= 0) tierUpZoomScale = 1;
  }

  // Tier-up text bounce + drift + fade animation
  if (tierUpTextTimer > 0) {
    tierUpTextTimer -= dt;
    const tt = 1 - (tierUpTextTimer / 1.5); // 0→1 progress
    // Scale: 0.5→1.15 (overshoot) → 1.0 (settle)
    if (tt < 0.12) tierUpTextScale = 0.5 + (tt / 0.12) * 0.65; // 0.5→1.15
    else if (tt < 0.25) tierUpTextScale = 1.15 - ((tt - 0.12) / 0.13) * 0.15; // 1.15→1.0
    else tierUpTextScale = 1;
    // Upward drift: 0→-40px over lifetime
    tierUpTextY = -tt * 40;
    // Fade out in last 40% of lifetime
    tierUpTextAlpha = tt > 0.6 ? 1 - ((tt - 0.6) / 0.4) : 1;
    if (tierUpTextTimer <= 0) { tierUpTextScale = 0; tierUpTextAlpha = 0; }
  }

  // Combo timer decay
  if (comboTimer > 0) {
    comboTimer -= effectiveDt;
    if (comboTimer <= 0) {
      comboCount = 0;
      comboPitch = 1;
    }
  }
  if (comboPulseScale > 1) {
    comboPulseScale = Math.max(1, comboPulseScale - effectiveDt * 3);
  }

  // Zone wave sweep
  if (zoneWaveY >= 0) {
    zoneWaveY += dt * (H / 0.8);
    if (zoneWaveY > H + 50) zoneWaveY = -1;
  }

  // Zone slow-mo timer
  if (zoneSlowmoTimer > 0) {
    zoneSlowmoTimer -= dt;
    if (zoneSlowmoTimer <= 0 && tierUpSlowmoTimer <= 0 && !frenzyActive) {
      slowmoScale = 1;
    }
  }

  // Highscore pulse timer
  if (highscorePulseTimer > 0) {
    highscorePulseTimer -= dt;
    highScoreEl.style.color = '#ffd700';
    highScoreEl.style.textShadow = '0 0 10px rgba(255,200,0,.5)';
    if (highscorePulseTimer <= 0) {
      highScoreEl.style.color = '';
      highScoreEl.style.textShadow = '';
    }
  }

  // Adaptive danger: track time since last hit
  timeSinceLastHit += dt;

  // Difficulty wave oscillator (~31s period, wider swings for tension/release rhythm)
  difficultyWave = 0.6 + 0.4 * Math.sin(gameTime * 0.2);

  // Zone transition text timer
  if (zoneTransitionTimer > 0) {
    zoneTransitionTimer -= dt;
    if (zoneTransitionTimer <= 0 && zoneTextEl) {
      zoneTextEl.classList.remove('visible');
    }
  }

  // Prestige animation
  if (inPrestige) {
    prestigeTimer -= dt;
    if (prestigeTimer <= 0) {
      completePrestige();
    }
    return; // freeze game during prestige
  }

  // Update zone based on player tier
  currentZone = getZoneForTier(player.tier);

  // Track max tier
  maxTierReached = Math.max(maxTierReached, player.tier);

  // --- Stun & slow timers ---
  if (playerStunTimer > 0) playerStunTimer = Math.max(0, playerStunTimer - effectiveDt);
  if (playerSlowTimer > 0) playerSlowTimer = Math.max(0, playerSlowTimer - effectiveDt);

  // --- Tail flick cooldown ---
  if (tailFlickCooldown > 0) {
    tailFlickCooldown -= effectiveDt;
    joystick.cooldownIndicator = Math.max(0, tailFlickCooldown / TAIL_FLICK_COOLDOWN);
  }

  // --- Tail flick timer ---
  if (tailFlickActive) {
    tailFlickTimer -= effectiveDt;
    if (tailFlickTimer <= 0) tailFlickActive = false;
  }

  // --- Tail flick squash animation ---
  if (tailFlickSquash > 0) {
    tailFlickSquash = Math.max(0, tailFlickSquash - effectiveDt * 10);
  }

  // --- Joystick elastic release animation ---
  if (joystick.releaseAnimT > 0) {
    joystick.releaseAnimT = Math.max(0, joystick.releaseAnimT - effectiveDt * 5);
  }

  // --- Joystick ripple animation ---
  joystick.ripplePhase += effectiveDt * 3;

  // --- Player movement (unified pointer for both touch and desktop) ---
  let hasDirectionalInput = false;
  let playerActualSpeed = 0;

  // Joystick input (mobile)
  if (joystick.active && joystick.tilt > 0) {
    hasDirectionalInput = true;
    const targetAngle = joystick.angle;
    let angleDiff = targetAngle - player.angle;
    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
    player.angle += angleDiff * Math.min(1, effectiveDt * 12);

    // Analog speed: tilt controls speed (0 to full)
    let speed = PLAYER_BASE_SPEED * joystick.tilt;
    if (frenzyActive) speed *= 1.3;
    if (boosting && boostFuel > 0) {
      speed *= BOOST_MULT;
      boostFuel = Math.max(0, boostFuel - BOOST_DRAIN);
      if (!hasEverBoosted) { hasEverBoosted = true; revealBoostBar(); }
    }
    if (playerStunTimer > 0) speed *= 0.6;
    if (playerSlowTimer > 0) speed *= 0.6;

    // Tail flick burst
    if (tailFlickActive) speed *= TAIL_FLICK_SPEED_MULT;

    const move = speed * (60 * effectiveDt);
    player.x += Math.cos(player.angle) * move;
    player.y += Math.sin(player.angle) * move;
    playerActualSpeed = speed;

    // Reset inertia while actively controlling
    playerInertiaTimer = 0;

    // Swim haptic rhythm (rhythmic tail beats)
    swimHapticTimer += effectiveDt * (1 + playerActualSpeed / PLAYER_BASE_SPEED);
    if (swimHapticTimer > 0.3) {
      swimHapticTimer = 0;
      if (joystick.tilt > 0.4) haptic(3);
    }
  } else if (pointer.active && !joystick.active) {
    // Desktop/fallback pointer control
    const dx = pointer.x - player.x;
    const dy = pointer.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 2) {
      hasDirectionalInput = true;
      const targetAngle = Math.atan2(dy, dx);
      let angleDiff = targetAngle - player.angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      player.angle += angleDiff * Math.min(1, effectiveDt * 12);

      let speed = PLAYER_BASE_SPEED;
      if (frenzyActive) speed *= 1.3;
      if (boosting && boostFuel > 0) {
        speed *= BOOST_MULT;
        boostFuel = Math.max(0, boostFuel - BOOST_DRAIN);
        if (!hasEverBoosted) { hasEverBoosted = true; revealBoostBar(); }
      }
      if (playerStunTimer > 0) speed *= 0.6;
      if (playerSlowTimer > 0) speed *= 0.6;
      if (tailFlickActive) speed *= TAIL_FLICK_SPEED_MULT;

      const move = Math.min(dist, speed * (60 * effectiveDt));
      player.x += (dx / dist) * move;
      player.y += (dy / dist) * move;
      playerActualSpeed = move / (60 * effectiveDt);
    }
  }

  // --- Aquatic inertia (after joystick release) ---
  if (!hasDirectionalInput && playerInertiaTimer > 0) {
    playerInertiaTimer -= effectiveDt;
    const inertiaMove = 60 * effectiveDt;
    player.x += playerInertiaVx * inertiaMove;
    player.y += playerInertiaVy * inertiaMove;
    playerInertiaVx *= INERTIA_FRICTION;
    playerInertiaVy *= INERTIA_FRICTION;
    playerActualSpeed = Math.sqrt(playerInertiaVx * playerInertiaVx + playerInertiaVy * playerInertiaVy);
    if (playerActualSpeed > 0.1) hasDirectionalInput = true; // prevent auto-swim during glide
  }

  // --- Tail flick movement (applies even without joystick) ---
  if (tailFlickActive && !joystick.active) {
    const flickSpeed = PLAYER_BASE_SPEED * TAIL_FLICK_SPEED_MULT * 60 * effectiveDt;
    player.x += tailFlickDirX * flickSpeed;
    player.y += tailFlickDirY * flickSpeed;
    hasDirectionalInput = true;
  }

  if (!hasDirectionalInput) {
    // Idle auto-swim: drift forward at 40% speed
    let idleSpeed = PLAYER_BASE_SPEED * 0.4;
    if (frenzyActive) idleSpeed *= 1.3;
    if (playerStunTimer > 0) idleSpeed *= 0.6;
    if (playerSlowTimer > 0) idleSpeed *= 0.6;

    // Auto-dodge: nudge angle away from nearby predators
    let dodgeAngleX = 0, dodgeAngleY = 0;
    for (const f of fishes) {
      if (!f.alive || f.tier <= player.tier) continue;
      const ddx = player.x - f.x, ddy = player.y - f.y;
      const dd = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dd < 120 && dd > 0) {
        const strength = (120 - dd) / 120;
        dodgeAngleX += (ddx / dd) * strength;
        dodgeAngleY += (ddy / dd) * strength;
      }
    }
    if (dodgeAngleX !== 0 || dodgeAngleY !== 0) {
      const dodgeTarget = Math.atan2(dodgeAngleY, dodgeAngleX);
      let daDiff = dodgeTarget - player.angle;
      while (daDiff > Math.PI) daDiff -= Math.PI * 2;
      while (daDiff < -Math.PI) daDiff += Math.PI * 2;
      player.angle += daDiff * Math.min(1, effectiveDt * 3);
    }

    const idleMove = idleSpeed * (60 * effectiveDt);
    player.x += Math.cos(player.angle) * idleMove;
    player.y += Math.sin(player.angle) * idleMove;
  }

  if (!boosting) {
    boostFuel = Math.min(BOOST_MAX, boostFuel + BOOST_REGEN);
  }

  // --- Boost button visual state ---
  if (isTouchDevice) {
    const boostFull = boostFuel >= BOOST_MAX * 0.95;
    boostBtnEl.classList.toggle('pulse-ready', boostFull && !boosting);
    boostBtnEl.classList.toggle('vibrating', boosting && boostFuel > 0);
    // Boost tunnel vignette effect
    if (boosting && boostFuel > 0) {
      const vigAngle = player ? player.angle : 0;
      const vx = Math.cos(vigAngle);
      const vy = Math.sin(vigAngle);
      boostVignetteEl.style.opacity = '1';
      boostVignetteEl.style.background = `radial-gradient(ellipse at ${50 + vx * 20}% ${50 + vy * 20}%, transparent 30%, rgba(0,0,0,0.25) 100%)`;
    } else {
      boostVignetteEl.style.opacity = '0';
    }
  }

  // --- Camera zoom (dynamic for large tiers) ---
  if (player.tier >= 5) {
    cameraZoomTarget = CAMERA_ZOOM_T5;
  } else if (player.tier >= 4) {
    cameraZoomTarget = CAMERA_ZOOM_T4;
  } else {
    cameraZoomTarget = 1;
  }
  cameraZoom += (cameraZoomTarget - cameraZoom) * Math.min(1, effectiveDt * 2);

  // --- Apply bounce velocity ---
  player.x += playerBounceVx;
  player.y += playerBounceVy;
  playerBounceVx *= 0.85;
  playerBounceVy *= 0.85;
  if (Math.abs(playerBounceVx) < 0.1) playerBounceVx = 0;
  if (Math.abs(playerBounceVy) < 0.1) playerBounceVy = 0;

  // --- Soft bounce screen edges ---
  const pr = player.radius;
  if (player.x < pr) {
    player.x = pr;
    playerBounceVx = 5 + Math.random() * 5;
    haptic(5);
  } else if (player.x > W - pr) {
    player.x = W - pr;
    playerBounceVx = -(5 + Math.random() * 5);
    haptic(5);
  }
  if (player.y < pr) {
    player.y = pr;
    playerBounceVy = 5 + Math.random() * 5;
    haptic(5);
  } else if (player.y > H - pr) {
    player.y = H - pr;
    playerBounceVy = -(5 + Math.random() * 5);
    haptic(5);
  }

  // Player animation — tail speed proportional to actual movement speed
  const tailSpeedMult = hasDirectionalInput ? (0.8 + (playerActualSpeed / PLAYER_BASE_SPEED) * 1.5) : 0.5;
  player.tailPhase += effectiveDt * 10 * tailSpeedMult;
  player.mouthOpen = Math.max(0, player.mouthOpen - effectiveDt * 2);

  // Smooth radius lerp toward targetRadius (skip if tier-up easeOutCubic is active)
  if (tierUpSizeLerpTimer <= 0) {
    if (Math.abs(player.radius - player.targetRadius) > 0.5) {
      player.radius += (player.targetRadius - player.radius) * Math.min(1, effectiveDt * 8);
    } else {
      player.radius = player.targetRadius;
    }
  }

  if (player.invincible > 0) {
    player.invincible -= effectiveDt;
    player.flashTimer += effectiveDt * 12;
  }

  frameCount++;

  // --- Jellyfish (twilight/abyss zone obstacle) ---
  if (currentZone === 'twilight' || currentZone === 'abyss') {
    // Spawn jellyfish
    if (Math.random() < effectiveDt * 0.3 && jellyfish.length < 5) {
      spawnJellyfish();
    }
    // Update & collision
    for (let i = jellyfish.length - 1; i >= 0; i--) {
      const j = jellyfish[i];
      j.x += j.vx * 60 * effectiveDt;
      j.y += j.vy * 60 * effectiveDt;
      j.phase += effectiveDt * 3;
      j.tentaclePhase += effectiveDt * 2;

      // Soft bounce
      if (j.x < 30) j.vx = Math.abs(j.vx);
      if (j.x > W - 30) j.vx = -Math.abs(j.vx);
      if (j.y < 30) j.vy = Math.abs(j.vy) * 0.5;
      if (j.y > H - 30) j.vy = -Math.abs(j.vy);

      // Remove if way off screen
      if (j.y < -100 || j.y > H + 100) { jellyfish.splice(i, 1); continue; }

      // Collision with player — damage + slow
      if (player.invincible <= 0) {
        const jdx = player.x - j.x, jdy = player.y - j.y;
        const jdist = Math.sqrt(jdx * jdx + jdy * jdy);
        if (jdist < player.radius + j.radius * 0.6) {
          // Jellyfish slow: 60% speed for 0.5s
          playerSlowTimer = 0.5;

          player.invincible = 1.5;
          player.eaten = Math.max(0, player.eaten - 2);

          if (player.tier <= 1) {
            deathImpactAngle = Math.atan2(player.y - j.y, player.x - j.x);
            triggerDeathAnim();
            return;
          }

          player.tier--;
          player.radius = TIER_RADIUS[player.tier] * radiusScale;
          player.targetRadius = player.radius;
          timeSinceLastHit = 0;
          adaptiveDangerSpawned = false;
          shakeIntensity = 12;
          spawnEatParticles(player.x, player.y, '#bb55ff', 15);

          const kAngle = Math.atan2(player.y - j.y, player.x - j.x);
          player.x += Math.cos(kAngle) * 40;
          player.y += Math.sin(kAngle) * 40;

          haptic(50);
          playHurt();
          vignetteEl.style.opacity = '1';
          setTimeout(() => vignetteEl.style.opacity = '0', 200);
        }
      }
    }
  } else {
    // Clear jellyfish in non-twilight zones
    jellyfish = [];
  }

  // --- Count active chasers for max chaser cap ---
  let activeChaserCount = 0;
  const MAX_CHASERS = 3;

  // --- Enemy fish AI ---
  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i];
    if (!f.alive) { fishes.splice(i, 1); continue; }

    if (f.eatCooldown > 0) f.eatCooldown -= effectiveDt;
    if (f.sizeBoost > 0) f.sizeBoost -= effectiveDt;
    if (f.chaseCooldown > 0) f.chaseCooldown -= effectiveDt;
    f.mouthOpen = Math.max(0, f.mouthOpen - effectiveDt * 4);
    f.tailPhase += effectiveDt * (8 + f.speed * 3);

    if (f.tier === 0) {
      // Plancton drift
      f.turnTimer -= effectiveDt;
      if (f.turnTimer <= 0) {
        f.turnTimer = 3 + Math.random() * 4;
        f.targetAngle = f.angle + (Math.random() - 0.5) * 2;
      }
      let aDiff = f.targetAngle - f.angle;
      while (aDiff > Math.PI) aDiff -= Math.PI * 2;
      while (aDiff < -Math.PI) aDiff += Math.PI * 2;
      f.angle += aDiff * Math.min(1, effectiveDt * 1.5);

      const spd = f.speed * 0.5 * 60 * effectiveDt;
      f.x += Math.cos(f.angle) * spd;
      f.y += Math.sin(f.angle) * spd;

      if (f.x < 20) f.targetAngle = 0;
      if (f.x > W - 20) f.targetAngle = Math.PI;
      if (f.y < 20) f.targetAngle = Math.PI / 2;
      if (f.y > H - 20) f.targetAngle = -Math.PI / 2;

      const margin = 150;
      if (f.x < -margin || f.x > W + margin || f.y < -margin || f.y > H + margin) {
        fishes.splice(i, 1);
        continue;
      }
    } else {
      // Normal fish AI
      const distToPlayer = distBetween(player, f);
      // Continuous time pressure: detection range grows with game time
      const timePressure = Math.min(3, gameTime / 40);
      const timeDetectBonus = timePressure * 15; // +15px per timePressure unit
      // Adaptive danger: escalating range bonus at 6s/10s/15s
      const adaptiveRangeBonus = timeSinceLastHit > 6 ? 0.15 : 0;
      // Grace period: predators are "confused" — 50% detection range reduction
      const graceDetectMult = graceTimer > 0 ? 0.5 : 1;
      const detectRange = (PREDATOR_DETECT_RANGE + (depthLevel - 1) * PREDATOR_DEPTH_DETECT_BONUS + timeDetectBonus) * (1 + adaptiveRangeBonus) * graceDetectMult * difficultyWave;
      const isPredator = f.tier > player.tier;

      // Chase with timer, cooldown, and max chaser cap
      let isChasing = false;
      if (isPredator && f.chaseCooldown <= 0 && distToPlayer < detectRange) {
        if (f.chaseTimer > 0 || activeChaserCount < MAX_CHASERS) {
          isChasing = true;
          if (f.chaseTimer <= 0) f.chaseTimer = 4; // start new chase
          f.chaseTimer -= effectiveDt;
          activeChaserCount++;
          if (f.chaseTimer <= 0) {
            // Chase expired — lose interest
            isChasing = false;
            f.chaseTimer = 0;
            f.chaseCooldown = 3;
            f.targetAngle = f.angle + (Math.random() - 0.5) * 3;
          }
        }
      } else if (f.chaseTimer > 0 && (!isPredator || distToPlayer >= detectRange)) {
        // Lost sight — reset chase
        f.chaseTimer = 0;
      }

      // Active predator chase — continuous, bypasses turnTimer
      if (isChasing) {
        f.targetAngle = Math.atan2(player.y - f.y, player.x - f.x);
        f.fleeing = false;
      } else {
        f.turnTimer -= effectiveDt;
        if (f.turnTimer <= 0) {
          f.turnTimer = 2 + Math.random() * 4;
          if (player.tier > f.tier && distToPlayer < 250) {
            f.fleeing = true;
            f.fleeTimer = 1.5 + Math.random();
            f.targetAngle = Math.atan2(f.y - player.y, f.x - player.x);
          } else {
            f.targetAngle = f.angle + (Math.random() - 0.5) * 1.5;
          }
        }
      }

      if (f.fleeing) {
        f.fleeTimer -= effectiveDt;
        if (f.fleeTimer <= 0) f.fleeing = false;
        f.targetAngle = Math.atan2(f.y - player.y, f.x - player.x);
      }

      let aDiff = f.targetAngle - f.angle;
      while (aDiff > Math.PI) aDiff -= Math.PI * 2;
      while (aDiff < -Math.PI) aDiff += Math.PI * 2;
      f.angle += aDiff * Math.min(1, effectiveDt * (isChasing ? 5 : 3));

      // Predators chase at 70% player speed, with time/adaptive scaling
      const timeSpeedBonus = 1 + Math.min(0.15, timePressure * 0.05); // +5% per timePressure, cap +15%
      const adaptiveSpeedBonus = timeSinceLastHit > 15 ? 1.1 : 1;     // +10% if no damage 15s
      let spdMult = f.fleeing ? 1.5 : 1;
      let spd;
      if (isChasing) {
        spd = PREDATOR_CHASE_SPEED_RATIO * PLAYER_BASE_SPEED * timeSpeedBonus * adaptiveSpeedBonus * 60 * effectiveDt;
      } else {
        spd = f.speed * spdMult * 60 * effectiveDt;
      }
      f.x += Math.cos(f.angle) * spd;
      f.y += Math.sin(f.angle) * spd;

      const margin = f.radius * 4 + 100;
      if (f.x < -margin || f.x > W + margin || f.y < -margin || f.y > H + margin) {
        fishes.splice(i, 1);
        continue;
      }

      if (f.x < f.radius) f.targetAngle = 0;
      if (f.x > W - f.radius) f.targetAngle = Math.PI;
      if (f.y < f.radius) f.targetAngle = Math.PI / 2;
      if (f.y > H - f.radius) f.targetAngle = -Math.PI / 2;
    }

    // --- Collision with player (asymmetric hitbox: easy to eat, hard to die) ---
    const dx = player.x - f.x, dy = player.y - f.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    // Generous hitbox for eating (0.8), tight hitbox for predators (0.55)
    const eatOverlap = f.tier === 0 ? 0.9 : 0.8;
    const hurtOverlap = 0.55;
    const canEat = f.tier < player.tier && dist < (player.radius + f.radius) * eatOverlap;
    const canHurt = f.tier > player.tier && dist < (player.radius + f.radius) * hurtOverlap;
    const canBump = f.tier === player.tier && dist < (player.radius + f.radius) * 0.65;
    if (canEat || canHurt || canBump) {
      if (canEat) {
        // EAT!
        f.alive = false;

        // Reveal size bar on first eat
        if (!hasEverEaten) { hasEverEaten = true; revealSizeBar(); }

        // Combo tracking
        if (comboTimer > 0) {
          comboCount++;
        } else {
          comboCount = 1;
        }
        comboTimer = 2; // 2s window
        comboPulseScale = 1.4;
        comboPitch = 1 + (comboCount - 1) * 0.1; // +10% pitch per combo (Mario coins)

        // Tier-based scoring with frenzy doubler and depth multiplier
        let pointValue = TIER_POINTS[f.tier] || 1;
        if (frenzyActive) pointValue *= 2;
        pointValue *= scoreMultiplier;
        score += pointValue;
        if (frenzyActive) festinPointsAccum += pointValue;
        totalFishEaten++;
        fishEatenByTier[f.tier]++;
        player.totalEaten++;
        player.eaten++;
        player.mouthOpen = 1;

        // Oxygen refill proportional to tier
        oxygen = Math.min(OXYGEN_MAX, oxygen + (OXYGEN_REFILL_PER_TIER[f.tier] || 5));

        // Track eat time for frenzy
        recentEats.push(gameTime);
        checkFrenzy();

        // Scaled eat feedback by eaten tier
        const fb = EAT_FEEDBACK[Math.min(f.tier, EAT_FEEDBACK.length - 1)];
        const isMagnetic = f.tier >= 2; // tier 2+ particles fly toward player
        spawnEatParticles(f.x, f.y, getFishColors(f.tier, currentZone).body, fb.particles, isMagnetic);
        if (f.tier > 0) spawnBubble(f.x, f.y);
        shakeIntensity = Math.max(shakeIntensity, fb.shake);
        playerScaleBump = fb.scaleBump;

        const scoreText = frenzyActive ? `+${pointValue}!` : `+${pointValue}`;
        const ftSize = typeof fb.textSize === 'number' ? fb.textSize : 32;
        spawnFloatingText(f.x, f.y, scoreText,
          frenzyActive ? '#ffd700' : getFishColors(f.tier, currentZone).body,
          pointValue >= 10, ftSize);

        haptic(fb.haptic);
        playEat(comboPitch);

        // Score milestones
        while (nextMilestoneIdx < SCORE_MILESTONES.length && score >= SCORE_MILESTONES[nextMilestoneIdx]) {
          playMilestone();
          spawnFloatingText(W / 2, H / 4, `${SCORE_MILESTONES[nextMilestoneIdx]} !`, '#80e0ff', true, 28);
          nextMilestoneIdx++;
        }
        // In-game record detection
        if (!inGameRecordBeaten && highScore > 0 && score > highScore) {
          inGameRecordBeaten = true;
          spawnFloatingText(W / 2, H / 4, 'NOUVEAU RECORD !', '#ffd700', true, 36);
          highscorePulseTimer = 2;
          playMilestone();
          haptic([20, 10, 30]);
        }

        // Level up check
        if (player.tier < TIER_COUNT - 1 && player.eaten >= TIER_THRESHOLDS[player.tier]) {
          const oldTier = player.tier;
          const oldTierColor = getFishColors(oldTier, currentZone).body;
          player.tier++;
          player.eaten = 0;
          hasFirstTierUp = true;
          player.targetRadius = TIER_RADIUS[player.tier] * radiusScale;
          maxTierReached = Math.max(maxTierReached, player.tier);
          const newTierColor = getFishColors(player.tier, getZoneForTier(player.tier)).body;

          // --- TIER-UP SPECTACLE ---
          // Timeline: shockwave → slow-mo eases in → size lerps → golden flash → text

          // 1. Shockwave rings (start immediately)
          tierUpRings[0] = { radius: player.radius, alpha: 0.8, color: '#ffffff', age: 0, delay: 0 };
          tierUpRings[1] = { radius: player.radius, alpha: 0.7, color: oldTierColor, age: 0, delay: 0.1 };
          tierUpRings[2] = { radius: player.radius, alpha: 0.6, color: newTierColor, age: 0, delay: 0.2 };
          tierUpRingColor = newTierColor;
          tierUpRingRadius = player.radius;
          tierUpRingAlpha = 0.7;

          // 2. Sound (at the START of the sequence)
          playTierUp();

          // 3. Micro-freeze then smooth slow-mo (sine ease in/out)
          tierUpFreezeTimer = TIERUP_FREEZE_DURATION;

          // 4. Smooth size lerp (easeOutCubic over 0.3s)
          tierUpSizeLerpTimer = 0.3;
          tierUpSizeLerpFrom = player.radius;

          // 5. Golden flash on player body (0.3s, rgba(255,215,0,0.3))
          tierUpFlashTimer = 0.3;

          // 50+ bicolor particles with varied sizes
          spawnEatParticles(player.x, player.y, oldTierColor, 25, false, 2, 10);
          spawnEatParticles(player.x, player.y, newTierColor, 25, false, 2, 10);

          // Zoom-out animation
          tierUpZoomTimer = 1.0;

          // 6. Text bounce + drift animation
          tierUpTextTimer = 1.5;
          tierUpTextName = TIER_NAMES[player.tier];
          tierUpTextColor = newTierColor;
          tierUpTextAlpha = 1;
          tierUpTextY = 0;

          // Haptic crescendo
          haptic([30, 15, 30, 15, 50, 20, 80]);

          shakeIntensity = 15;

          // Grace period
          graceTimer = 3;

          // Zone change
          const newZone = getZoneForTier(player.tier);
          if (newZone !== currentZone) {
            triggerZoneTransition(newZone);
          }
        } else if (player.tier === TIER_COUNT - 1) {
          // At max tier — track prestige progress
          prestigeEats++;
          if (prestigeEats >= PRESTIGE_EXTRA_EATS) {
            triggerPrestige();
          }
        }

        // Post-eat breathing pulse: push nearby predators back ~30px
        for (const pf of fishes) {
          if (!pf.alive || pf.tier <= player.tier) continue;
          const pdx = pf.x - player.x, pdy = pf.y - player.y;
          const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
          if (pdist < 120 && pdist > 0) {
            pf.x += (pdx / pdist) * 30;
            pf.y += (pdy / pdist) * 30;
          }
        }

      } else if (canBump && player.invincible <= 0) {
        // BUMP — same tier: knockback, stun, no damage
        const bumpAngle = Math.atan2(player.y - f.y, player.x - f.x);
        player.x += Math.cos(bumpAngle) * 30;
        player.y += Math.sin(bumpAngle) * 30;
        f.x -= Math.cos(bumpAngle) * 30;
        f.y -= Math.sin(bumpAngle) * 30;
        playerStunTimer = 0.4;
        player.invincible = 0.5; // brief immunity to avoid repeated bumps
        timeSinceLastHit = 0;
        adaptiveDangerSpawned = false;
        shakeIntensity = Math.max(shakeIntensity, 5);
        haptic(15);
        playBonk();

      } else if (canHurt && player.invincible <= 0) {
        // HURT
        player.invincible = 1.5;
        player.eaten = 0;
        timeSinceLastHit = 0;
        adaptiveDangerSpawned = false;

        if (player.tier <= 1) {
          deathImpactAngle = Math.atan2(player.y - f.y, player.x - f.x);
          triggerDeathAnim();
          return;
        }

        player.tier--;
        player.radius = TIER_RADIUS[player.tier] * radiusScale;
        player.targetRadius = player.radius;
        shakeIntensity = 12;
        spawnEatParticles(player.x, player.y, '#ff4444', 15);

        const kAngle = Math.atan2(player.y - f.y, player.x - f.x);
        player.x += Math.cos(kAngle) * 40;
        player.y += Math.sin(kAngle) * 40;

        haptic(50);
        playHurt();
        vignetteEl.style.opacity = '1';
        setTimeout(() => vignetteEl.style.opacity = '0', 200);
      }
    }
  }

  // --- Fish-fish eating ---
  if (frameCount % FISH_EAT_CHECK_INTERVAL === 0 && gameTime - lastFishEatTime >= FISH_EAT_GLOBAL_COOLDOWN) {
    fishFishEating:
    for (let i = 0; i < fishes.length; i++) {
      const a = fishes[i];
      if (!a.alive || a.tier <= 0 || a.eatCooldown > 0) continue;
      for (let j = 0; j < fishes.length; j++) {
        if (i === j) continue;
        const b = fishes[j];
        if (!b.alive || b.tier >= a.tier) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < (a.radius + b.radius) * 0.7) {
          b.alive = false;
          a.mouthOpen = 1;
          a.eatCooldown = FISH_EAT_PER_FISH_COOLDOWN;
          a.sizeBoost = 1.5;
          lastFishEatTime = gameTime;
          spawnEatParticles(b.x, b.y, getFishColors(b.tier, currentZone).body, 5);
          spawnBubble(b.x, b.y);
          const respawnTier = b.tier;
          const respawnDelay = 2 + Math.random();
          pendingRespawns.push({ tier: respawnTier, time: gameTime + respawnDelay });
          break fishFishEating;
        }
      }
    }
  }

  // --- Process pending respawns ---
  for (let i = pendingRespawns.length - 1; i >= 0; i--) {
    if (gameTime >= pendingRespawns[i].time && fishes.length < MAX_FISH) {
      fishes.push(createFish(pendingRespawns[i].tier, true));
      pendingRespawns.splice(i, 1);
    }
  }

  // --- Spawn new fish ---
  let visibleCount = 0;
  let planctonCount = 0;
  for (const f of fishes) {
    if (f.tier === 0) { planctonCount++; continue; }
    if (f.x > -50 && f.x < W + 50 && f.y > -50 && f.y < H + 50) visibleCount++;
  }

  while (planctonCount < PLANCTON_TARGET_COUNT && fishes.length < MAX_FISH) {
    fishes.push(createFish(0, true));
    planctonCount++;
  }

  while (visibleCount < MIN_VISIBLE && fishes.length < MAX_FISH) {
    const tier = chooseTier(player.tier, gameTime);
    fishes.push(createFish(tier, true));
    visibleCount++;
  }
  if (Math.random() < effectiveDt * 3 && fishes.length < MAX_FISH) {
    fishes.push(createFish(chooseTier(player.tier, gameTime), true));
  }

  // --- Adaptive danger: spawn predator near player if no damage for 10s ---
  // (6s → detect range bonus already in AI, 15s → chase speed bonus already in AI)
  if (timeSinceLastHit > 10 && !adaptiveDangerSpawned && fishes.length < MAX_FISH) {
    // Spawn from offscreen edge direction, not on top of player
    const spawnDist = 200 + Math.random() * 100;
    const spawnAngle = Math.random() * Math.PI * 2;
    const predTier = Math.min(TIER_COUNT - 1, player.tier + 1);
    const predator = createFish(predTier, true);
    predator.x = player.x + Math.cos(spawnAngle) * spawnDist;
    predator.y = player.y + Math.sin(spawnAngle) * spawnDist;
    // Clamp to screen edges so it comes from offscreen
    predator.x = Math.max(-predator.radius * 2, Math.min(W + predator.radius * 2, predator.x));
    predator.y = Math.max(-predator.radius * 2, Math.min(H + predator.radius * 2, predator.y));
    predator.targetAngle = Math.atan2(player.y - predator.y, player.x - predator.x);
    predator.angle = predator.targetAngle;
    fishes.push(predator);
    adaptiveDangerSpawned = true; // only one per cycle, resets on damage
  }

  // --- Particles (with magnetism for tier 2+ eats) ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    if (p.magnetic && player && player.alive) {
      if (p.magnetTimer > 0) {
        p.magnetTimer -= effectiveDt; // expand outward first
      } else {
        // Attract toward player
        const mdx = player.x - p.x, mdy = player.y - p.y;
        const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
        if (mdist > 2) {
          p.vx += (mdx / mdist) * 12;
          p.vy += (mdy / mdist) * 12;
        }
      }
    }
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); }
  }

  // --- Bubbles ---
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y += b.vy;
    b.x += Math.sin(b.y * 0.05) * 0.3;
    b.life -= b.decay;
    if (b.life <= 0) { bubbles.splice(i, 1); }
  }

  if (Math.random() < effectiveDt * 2) {
    spawnBubble(Math.random() * W, H + 5);
  }

  // --- Floating texts ---
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= ft.big ? 0.6 : 1.2;
    ft.life -= ft.decay;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  // --- Player scale bump decay (~0.5s visible) ---
  if (playerScaleBump > 0) {
    playerScaleBump = Math.max(0, playerScaleBump - effectiveDt * 1.0);
  }

  // --- Oxygen drain (only at depth >= 2) ---
  if (depthLevel >= 2) {
    const oxygenDrain = OXYGEN_DRAIN_RATE * (1 + (depthLevel - 1) * OXYGEN_DEPTH_DRAIN_MULT);
    oxygen = Math.max(0, oxygen - oxygenDrain * effectiveDt);
    oxygenBarEl.style.width = (oxygen / OXYGEN_MAX * 100) + '%';
    if (oxygen < OXYGEN_MAX * 0.92 && !hasEverLowOxygen) { hasEverLowOxygen = true; revealOxygenBar(); }
    if (oxygen <= 0) {
      deathReason = 'oxygen';
      deathImpactAngle = Math.PI / 2; // downward for oxygen death
      triggerDeathAnim();
      return;
    }
  } else {
    oxygen = OXYGEN_MAX;
  }

  // --- Reef currents ---
  if (currentZone === 'reef') {
    // Spawn new currents
    if (reefCurrents.length < 3 && Math.random() < effectiveDt * 0.5) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      reefCurrents.push({
        x: dir > 0 ? -50 : W + 50,
        y: H * (0.2 + Math.random() * 0.6),
        dir,
        speed: 1.5 + Math.random() * 1.5,
        width: 150 + Math.random() * 200,
        life: 1,
      });
    }
    for (let i = reefCurrents.length - 1; i >= 0; i--) {
      const c = reefCurrents[i];
      c.x += c.dir * c.speed * 60 * effectiveDt;
      // Push player if within current band (80px wide)
      const inBandY = Math.abs(player.y - c.y) < 80;
      const inBandX = player.x > c.x - c.width / 2 && player.x < c.x + c.width / 2;
      if (inBandY && inBandX) {
        // Stronger base push
        player.x += c.dir * c.speed * 0.7 * 60 * effectiveDt;
        // Direction-aware: swimming with current = speed boost, against = slow
        const playerDirX = Math.cos(player.angle);
        const alignment = playerDirX * c.dir; // +1 = same dir, -1 = against
        if (alignment > 0.3) {
          // Swimming WITH current — 30% speed boost via position push
          player.x += c.dir * c.speed * 0.3 * 60 * effectiveDt;
        }
        // Against current: the base push already slows effective movement
      }
      // Push fish too (wider band)
      for (const f of fishes) {
        if (f.tier === 0) continue;
        const fInY = Math.abs(f.y - c.y) < 80;
        const fInX = f.x > c.x - c.width / 2 && f.x < c.x + c.width / 2;
        if (fInY && fInX) {
          f.x += c.dir * c.speed * 0.5 * 60 * effectiveDt;
        }
      }
      // Remove when off screen
      if ((c.dir > 0 && c.x > W + c.width) || (c.dir < 0 && c.x < -c.width)) {
        reefCurrents.splice(i, 1);
      }
    }
  } else {
    reefCurrents = [];
  }

  // --- Abyss ambush predators ---
  if (currentZone === 'abyss') {
    // Spawn ambush fish (quasi-invisible, activate when player is close)
    if (ambushFish.length < 4 && Math.random() < effectiveDt * 0.25) {
      // Place away from player
      let ax, ay;
      do {
        ax = 60 + Math.random() * (W - 120);
        ay = 60 + Math.random() * (H - 120);
      } while (Math.sqrt((ax - player.x) ** 2 + (ay - player.y) ** 2) < 250);
      ambushFish.push({
        x: ax, y: ay,
        tier: Math.min(TIER_COUNT - 1, player.tier + 1),
        radius: TIER_RADIUS[Math.min(TIER_COUNT - 1, player.tier + 1)] * radiusScale,
        angle: Math.random() * Math.PI * 2,
        tailPhase: Math.random() * Math.PI * 2,
        mouthOpen: 0,
        activated: false,
        warning: false,       // warning flash phase
        warningTimer: 0,      // 0.3s countdown before activation
        opacity: 0.06, // nearly invisible
        life: 15 + Math.random() * 10, // despawn timer
      });
    }
    for (let i = ambushFish.length - 1; i >= 0; i--) {
      const a = ambushFish[i];
      a.tailPhase += effectiveDt * 4;
      a.life -= effectiveDt;
      if (a.life <= 0) { ambushFish.splice(i, 1); continue; }

      const dToPlayer = Math.sqrt((a.x - player.x) ** 2 + (a.y - player.y) ** 2);

      // Warning phase: eyes glow 0.3s before activation (range 150px)
      if (!a.activated && !a.warning && dToPlayer < 150) {
        a.warning = true;
        a.warningTimer = 0.3;
      }
      if (a.warning && !a.activated) {
        a.warningTimer -= effectiveDt;
        // Pulse opacity for warning (eyes visible)
        a.opacity = 0.06 + 0.3 * Math.abs(Math.sin(gameTime * 20));
        if (a.warningTimer <= 0) {
          a.activated = true;
          shakeIntensity = Math.max(shakeIntensity, 5);
        }
      }
      if (a.activated) {
        a.opacity = Math.min(1, a.opacity + effectiveDt * 3);
        // Chase player
        const chaseAngle = Math.atan2(player.y - a.y, player.x - a.x);
        let ad = chaseAngle - a.angle;
        while (ad > Math.PI) ad -= Math.PI * 2;
        while (ad < -Math.PI) ad += Math.PI * 2;
        a.angle += ad * Math.min(1, effectiveDt * 5);
        const aSpd = PREDATOR_CHASE_SPEED_RATIO * PLAYER_BASE_SPEED * 0.9 * 60 * effectiveDt;
        a.x += Math.cos(a.angle) * aSpd;
        a.y += Math.sin(a.angle) * aSpd;

        // Collision with player — same as predator hit
        if (player.invincible <= 0 && dToPlayer < (player.radius + a.radius) * 0.55) {
          player.invincible = 1.5;
          player.eaten = 0;
          if (player.tier <= 1) {
            deathImpactAngle = Math.atan2(player.y - a.y, player.x - a.x);
            triggerDeathAnim();
            return;
          }
          player.tier--;
          player.radius = TIER_RADIUS[player.tier] * radiusScale;
          player.targetRadius = player.radius;
          timeSinceLastHit = 0;
          adaptiveDangerSpawned = false;
          shakeIntensity = 12;
          spawnEatParticles(player.x, player.y, '#ff4444', 15);
          const kAngle = Math.atan2(player.y - a.y, player.x - a.x);
          player.x += Math.cos(kAngle) * 40;
          player.y += Math.sin(kAngle) * 40;
          haptic(50);
          playHurt();
          vignetteEl.style.opacity = '1';
          setTimeout(() => vignetteEl.style.opacity = '0', 200);
          ambushFish.splice(i, 1);
          continue;
        }

        // Despawn if off screen
        if (a.x < -80 || a.x > W + 80 || a.y < -80 || a.y > H + 80) {
          ambushFish.splice(i, 1);
        }
      }
    }
  } else {
    ambushFish = [];
  }

  // --- Camera shake ---
  if (shakeIntensity > 0.5) {
    shakeX = (Math.random() - 0.5) * shakeIntensity;
    shakeY = (Math.random() - 0.5) * shakeIntensity;
    shakeIntensity *= SHAKE_DECAY;
  } else {
    shakeX = shakeY = 0;
    shakeIntensity = 0;
  }

  boostBarEl.style.width = (boostFuel / BOOST_MAX * 100) + '%';

  const now = performance.now();
  if (now - lastHUDTime > 250) {
    lastHUDTime = now;
    updateHUD();
  }
}

function distBetween(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

// ============================================================
//  RENDER
// ============================================================

function render() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Camera dynamic zoom (tier 4-5 zoom out)
  const effectiveCamZoom = tierUpZoomScale * cameraZoom;
  if (effectiveCamZoom !== 1) {
    ctx.translate(W / 2, H / 2);
    ctx.scale(effectiveCamZoom, effectiveCamZoom);
    ctx.translate(-W / 2, -H / 2);
  }

  // --- Zone-based background ---
  const bg = ZONE_BG[currentZone] || ZONE_BG.surface;
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, bg.top);
  bgGrad.addColorStop(0.5, bg.mid);
  bgGrad.addColorStop(1, bg.bot);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // Light rays from top (intensity varies by zone)
  ctx.save();
  ctx.globalAlpha = bg.rayAlpha;
  const rayCount = currentZone === 'abyss' ? 2 : 5;
  for (let i = 0; i < rayCount; i++) {
    const rx = W * (0.15 + i * (0.7 / rayCount));
    const rw = 40 + i * 20;
    const rayH = currentZone === 'abyss' ? H * 0.3 : H * 0.7;
    const grad = ctx.createLinearGradient(rx, 0, rx, rayH);
    grad.addColorStop(0, bg.rayColor);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(rx - rw / 2, 0);
    ctx.lineTo(rx - rw * 1.5, rayH);
    ctx.lineTo(rx + rw * 1.5, rayH);
    ctx.lineTo(rx + rw / 2, 0);
    ctx.fill();
  }
  ctx.restore();

  // Surface zone: animated waves at top
  if (currentZone === 'surface') {
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = '#aaddff';
    ctx.lineWidth = 2;
    for (let wave = 0; wave < 3; wave++) {
      const wy = 5 + wave * 12;
      ctx.beginPath();
      for (let x = 0; x <= W; x += 10) {
        const y = wy + Math.sin(x * 0.02 + gameTime * (1.5 + wave * 0.3)) * (4 + wave * 2);
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // Stronger sun rays overlay
    ctx.globalAlpha = 0.04;
    for (let i = 0; i < 3; i++) {
      const rx = W * (0.25 + i * 0.25) + Math.sin(gameTime * 0.3 + i) * 20;
      const rw = 60 + i * 15;
      const grad = ctx.createLinearGradient(rx, 0, rx, H * 0.5);
      grad.addColorStop(0, '#ffffcc');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(rx - rw / 2, 0);
      ctx.lineTo(rx - rw * 2, H * 0.5);
      ctx.lineTo(rx + rw * 2, H * 0.5);
      ctx.lineTo(rx + rw / 2, 0);
      ctx.fill();
    }
    ctx.restore();
  }

  // Twilight zone: marine snow and dark algae
  if (currentZone === 'twilight' && zoneDecor) {
    ctx.save();
    // Marine snow (descending particles)
    ctx.fillStyle = 'rgba(180,200,220,0.3)';
    for (const s of zoneDecor.twilight.snow) {
      const sy = (s.y + gameTime * s.speed * 30) % (H + 20) - 10;
      const sx = s.x + Math.sin(gameTime * 0.5 + s.drift) * 15;
      ctx.globalAlpha = 0.15 + 0.1 * Math.sin(gameTime + s.drift);
      ctx.beginPath();
      ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
      ctx.fill();
    }
    // Dark algae from bottom
    for (const a of zoneDecor.twilight.algae) {
      ctx.globalAlpha = 0.12;
      ctx.strokeStyle = '#334455';
      ctx.lineWidth = a.w;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(a.x, H);
      const wave = Math.sin(gameTime * 1.2 + a.x * 0.01) * 15;
      ctx.quadraticCurveTo(a.x + wave, H - a.h * 0.5, a.x + wave * 1.5, H - a.h);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Reef zone: visible currents (water streaks)
  if (currentZone === 'reef') {
    ctx.save();
    for (const c of reefCurrents) {
      ctx.globalAlpha = 0.08;
      ctx.strokeStyle = '#66ccbb';
      ctx.lineWidth = 2;
      const halfW = c.width / 2;
      for (let s = -3; s <= 3; s++) {
        const sy = c.y + s * 18;
        ctx.beginPath();
        ctx.moveTo(c.x - halfW, sy);
        ctx.bezierCurveTo(c.x - halfW * 0.3, sy - 5, c.x + halfW * 0.3, sy + 5, c.x + halfW, sy);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Reef zone: detailed corals and anemones
  if (currentZone === 'reef' && zoneDecor) {
    ctx.save();
    // Corals
    for (const c of zoneDecor.reef.corals) {
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = c.color;
      if (c.type === 0) {
        // Branch coral
        ctx.beginPath();
        ctx.moveTo(c.x, H);
        ctx.lineTo(c.x - c.w * 0.3, H - c.h * 0.6);
        ctx.lineTo(c.x - c.w * 0.5, H - c.h);
        ctx.lineTo(c.x - c.w * 0.1, H - c.h * 0.7);
        ctx.lineTo(c.x + c.w * 0.2, H - c.h * 0.9);
        ctx.lineTo(c.x + c.w * 0.4, H - c.h * 0.5);
        ctx.lineTo(c.x + c.w * 0.3, H);
        ctx.fill();
      } else if (c.type === 1) {
        // Mushroom coral
        ctx.beginPath();
        ctx.moveTo(c.x - c.w * 0.15, H);
        ctx.lineTo(c.x - c.w * 0.15, H - c.h * 0.6);
        ctx.ellipse(c.x, H - c.h * 0.6, c.w * 0.5, c.h * 0.4, 0, Math.PI, 0);
        ctx.lineTo(c.x + c.w * 0.15, H);
        ctx.fill();
      } else {
        // Fan coral
        ctx.beginPath();
        ctx.moveTo(c.x, H);
        ctx.quadraticCurveTo(c.x - c.w * 0.8, H - c.h * 0.5, c.x - c.w * 0.3, H - c.h);
        ctx.quadraticCurveTo(c.x, H - c.h * 1.1, c.x + c.w * 0.3, H - c.h);
        ctx.quadraticCurveTo(c.x + c.w * 0.8, H - c.h * 0.5, c.x, H);
        ctx.fill();
      }
    }
    // Anemones (gentle wave)
    for (const a of zoneDecor.reef.anemones) {
      ctx.globalAlpha = 0.2;
      ctx.strokeStyle = a.color;
      ctx.lineWidth = 2;
      for (let t = 0; t < a.tentacles; t++) {
        const tx = a.x + (t - a.tentacles / 2) * 6;
        const wave = Math.sin(gameTime * 2 + t * 0.7) * 8;
        ctx.beginPath();
        ctx.moveTo(tx, a.y);
        ctx.quadraticCurveTo(tx + wave, a.y - a.len * 0.6, tx + wave * 1.5, a.y - a.len);
        ctx.stroke();
      }
      // Base
      ctx.fillStyle = a.color;
      ctx.globalAlpha = 0.15;
      ctx.beginPath();
      ctx.ellipse(a.x, a.y, a.tentacles * 4, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Abyss zone: bioluminescent lights and hydrothermal vents
  if (currentZone === 'abyss' && zoneDecor) {
    ctx.save();
    // Bioluminescent particles
    for (const l of zoneDecor.abyss.lights) {
      const pulse = 0.3 + 0.7 * Math.sin(gameTime * 0.8 + l.phase);
      ctx.globalAlpha = pulse * 0.2;
      ctx.fillStyle = l.color;
      ctx.beginPath();
      ctx.arc(l.x, l.y, l.size + pulse * 2, 0, Math.PI * 2);
      ctx.fill();
      // Soft glow
      ctx.globalAlpha = pulse * 0.06;
      ctx.beginPath();
      ctx.arc(l.x, l.y, l.size * 6, 0, Math.PI * 2);
      ctx.fill();
    }
    // Hydrothermal vents at bottom
    for (const v of zoneDecor.abyss.vents) {
      ctx.globalAlpha = 0.15;
      ctx.fillStyle = '#222';
      // Vent silhouette
      ctx.beginPath();
      ctx.moveTo(v.x - v.w / 2, H);
      ctx.lineTo(v.x - v.w * 0.3, H - v.h);
      ctx.quadraticCurveTo(v.x, H - v.h - 10, v.x + v.w * 0.3, H - v.h);
      ctx.lineTo(v.x + v.w / 2, H);
      ctx.fill();
      // Rising heat bubbles from vent
      ctx.globalAlpha = 0.12;
      for (let b = 0; b < 4; b++) {
        const by = H - v.h - ((gameTime * 20 + b * 30) % (v.h + 40));
        const bx = v.x + Math.sin(gameTime * 2 + b * 1.5) * 8;
        ctx.fillStyle = 'rgba(200,200,200,0.3)';
        ctx.beginPath();
        ctx.arc(bx, by, 2 + 0.3 * Math.sin(gameTime + b), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // Bubbles (behind fish)
  for (const b of bubbles) {
    ctx.globalAlpha = b.life * 0.3;
    ctx.strokeStyle = '#88ccff';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(200,230,255,0.3)';
    ctx.beginPath();
    ctx.arc(b.x - b.size * 0.2, b.y - b.size * 0.2, b.size * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Jellyfish (between bubbles and fish)
  for (const j of jellyfish) {
    drawJellyfish(j);
  }

  // Enemy fish & plancton (with onboarding halos)
  for (const f of fishes) {
    if (!f.alive) continue;
    if (f.tier === 0) {
      drawPlancton(f.x, f.y, f.radius, f.tailPhase, currentZone);
    } else {
      const r = f.sizeBoost > 0 ? f.radius * (1 + 0.08 * f.sizeBoost) : f.radius;

      // Onboarding halo: green = edible, red = danger, none = same tier
      if (player && player.alive) {
        if (f.tier < player.tier) {
          // Subtle green halo — edible
          const haloGrad = ctx.createRadialGradient(f.x, f.y, r * 0.6, f.x, f.y, r * 2);
          haloGrad.addColorStop(0, 'rgba(80,255,80,0.12)');
          haloGrad.addColorStop(1, 'rgba(80,255,80,0)');
          ctx.fillStyle = haloGrad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, r * 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (f.tier > player.tier) {
          // Subtle red halo with micro pulsation — danger
          const dangerPulse = 0.08 + 0.04 * Math.sin(gameTime * 6 + f.x);
          const haloGrad = ctx.createRadialGradient(f.x, f.y, r * 0.6, f.x, f.y, r * 2.2);
          haloGrad.addColorStop(0, `rgba(255,60,60,${dangerPulse})`);
          haloGrad.addColorStop(1, 'rgba(255,60,60,0)');
          ctx.fillStyle = haloGrad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, r * 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawFish(f.x, f.y, r, f.angle, f.tier, f.mouthOpen, f.tailPhase, false, currentZone, f.bodyRatioW, f.bodyRatioH);
    }
  }

  // Abyss ambush predators (drawn with variable opacity + warning eye glow)
  for (const a of ambushFish) {
    ctx.globalAlpha = a.opacity;
    drawFish(a.x, a.y, a.radius, a.angle, a.tier, a.mouthOpen, a.tailPhase, false, 'abyss', 1, 1);

    // Warning phase: bioluminescent eye glow before activation
    if (a.warning && !a.activated) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(gameTime * 25);
      const eyeOffX = Math.cos(a.angle) * a.radius * 0.4;
      const eyeOffY = Math.sin(a.angle) * a.radius * 0.4;
      const eyeGlow = ctx.createRadialGradient(
        a.x + eyeOffX, a.y + eyeOffY, 0,
        a.x + eyeOffX, a.y + eyeOffY, a.radius * 0.8
      );
      eyeGlow.addColorStop(0, 'rgba(255,50,50,0.8)');
      eyeGlow.addColorStop(0.5, 'rgba(255,50,50,0.2)');
      eyeGlow.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = eyeGlow;
      ctx.beginPath();
      ctx.arc(a.x + eyeOffX, a.y + eyeOffY, a.radius * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // Player
  if (player && player.alive) {
    // Abyss zone: player halo (visibility light)
    if (currentZone === 'abyss') {
      const haloR = player.radius * 5;
      const halo = ctx.createRadialGradient(player.x, player.y, player.radius * 0.5, player.x, player.y, haloR);
      halo.addColorStop(0, 'rgba(100,200,255,0.12)');
      halo.addColorStop(0.5, 'rgba(60,140,200,0.05)');
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(player.x, player.y, haloR, 0, Math.PI * 2);
      ctx.fill();

      // Darkness mask (reduce visibility away from player)
      // Radial gradient: transparent near player, dark far away
      const darkR = Math.max(W, H);
      const dark = ctx.createRadialGradient(player.x, player.y, haloR * 0.7, player.x, player.y, darkR);
      dark.addColorStop(0, 'rgba(0,2,8,0)');
      dark.addColorStop(0.3, 'rgba(0,2,8,0.4)');
      dark.addColorStop(1, 'rgba(0,2,8,0.7)');
      ctx.fillStyle = dark;
      ctx.fillRect(-10, -10, W + 20, H + 20);
    }

    // Flash when invincible
    if (player.invincible > 0 && Math.sin(player.flashTimer * Math.PI) > 0) {
      ctx.globalAlpha = 0.4;
    }
    const pDrawR = player.radius * (1 + playerScaleBump);
    // Tail flick squash & stretch
    if (tailFlickSquash > 0) {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      // Squash phase (first 0.5) then stretch (0.5-1.0)
      const t = 1 - tailFlickSquash;
      const scaleX = t < 0.5 ? 1 - t * 0.3 : 0.85 + (t - 0.5) * 0.5;
      const scaleY = t < 0.5 ? 1 + t * 0.2 : 1.1 - (t - 0.5) * 0.3;
      ctx.scale(scaleX, scaleY);
      ctx.rotate(-player.angle);
      ctx.translate(-player.x, -player.y);
      drawFish(player.x, player.y, pDrawR, player.angle, player.tier,
               player.mouthOpen, player.tailPhase, true, currentZone);
      // White flash
      if (tailFlickSquash > 0.5) {
        ctx.globalAlpha = (tailFlickSquash - 0.5) * 0.6;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(player.x, player.y, pDrawR * 1.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    } else {
      drawFish(player.x, player.y, pDrawR, player.angle, player.tier,
               player.mouthOpen, player.tailPhase, true, currentZone);
    }
    ctx.globalAlpha = 1;

    // Grace period protective shimmer — faint iridescent shield bubble
    if (graceTimer > 0) {
      const graceAlpha = Math.min(1, graceTimer / 1.5) * 0.25; // fades in last 1.5s
      const shimmerPhase = gameTime * 5;
      const shimmerR = pDrawR * 1.6 + Math.sin(shimmerPhase) * 3;
      // Outer iridescent ring
      const shimmerGrad = ctx.createRadialGradient(player.x, player.y, pDrawR * 0.8, player.x, player.y, shimmerR);
      shimmerGrad.addColorStop(0, `rgba(180,230,255,0)`);
      shimmerGrad.addColorStop(0.6, `rgba(180,230,255,${graceAlpha * 0.4})`);
      shimmerGrad.addColorStop(0.85, `rgba(220,255,255,${graceAlpha * 0.6})`);
      shimmerGrad.addColorStop(1, `rgba(180,230,255,0)`);
      ctx.fillStyle = shimmerGrad;
      ctx.beginPath();
      ctx.arc(player.x, player.y, shimmerR, 0, Math.PI * 2);
      ctx.fill();
      // Subtle rotating highlight arc
      ctx.strokeStyle = `rgba(255,255,255,${graceAlpha * 0.5})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(player.x, player.y, shimmerR - 2, shimmerPhase % (Math.PI * 2), (shimmerPhase % (Math.PI * 2)) + Math.PI * 0.6);
      ctx.stroke();
    }

    // Tier-up golden flash overlay on player body (0.3s, rgba(255,215,0,0.3))
    if (tierUpFlashTimer > 0) {
      ctx.globalAlpha = (tierUpFlashTimer / 0.3) * 0.3;
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(player.x, player.y, pDrawR * 1.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // XP ring — progress toward next tier (agar.io style)
    {
      const xpRadius = pDrawR * 1.7;
      let xpProgress, xpColor;
      if (player.tier < TIER_COUNT - 1) {
        xpProgress = player.eaten / TIER_THRESHOLDS[player.tier];
        xpColor = getFishColors(player.tier + 1, currentZone).body;
      } else {
        xpProgress = prestigeEats / PRESTIGE_EXTRA_EATS;
        xpColor = '#ffcc00';
      }
      // Background ring
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x, player.y, xpRadius, 0, Math.PI * 2);
      ctx.stroke();
      // Progress arc
      if (xpProgress > 0) {
        const startA = -Math.PI / 2;
        const endA = startA + Math.min(1, xpProgress) * Math.PI * 2;
        ctx.strokeStyle = xpColor;
        ctx.lineWidth = 3;
        ctx.shadowColor = xpColor;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(player.x, player.y, xpRadius, startA, endA);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    // Player chevron — white-gold for visibility on any tier color
    {
      const chevronY = player.y - pDrawR * 1.9 - 16;
      const chevronSize = 10;
      // Breathe in sync with glow ring (same 2.5 freq)
      const chevBreath = Math.sin(gameTime * 2.5);
      const chevronAlpha = 0.6 + 0.1 * (1 + chevBreath); // 0.6→0.8
      ctx.globalAlpha = chevronAlpha;
      ctx.shadowColor = 'rgba(255,215,100,0.5)';
      ctx.shadowBlur = 8;
      ctx.fillStyle = 'rgba(255,235,200,0.9)';
      ctx.beginPath();
      ctx.moveTo(player.x - chevronSize, chevronY - chevronSize * 0.6);
      ctx.lineTo(player.x + chevronSize, chevronY - chevronSize * 0.6);
      ctx.lineTo(player.x, chevronY + chevronSize * 0.5);
      ctx.closePath();
      ctx.fill();
      // Subtle gold outline
      ctx.strokeStyle = 'rgba(255,215,0,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(player.x - chevronSize, chevronY - chevronSize * 0.6);
      ctx.lineTo(player.x + chevronSize, chevronY - chevronSize * 0.6);
      ctx.lineTo(player.x, chevronY + chevronSize * 0.5);
      ctx.closePath();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // Combo counter above chevron
    if (comboCount >= 2) {
      const comboY = player.y - pDrawR * 1.9 - 30;
      let comboColor;
      if (frenzyActive) comboColor = '#ffd700';
      else if (comboCount >= 7) comboColor = '#ffd700';
      else if (comboCount >= 5) comboColor = '#ff4444';
      else if (comboCount >= 3) comboColor = '#ffaa00';
      else comboColor = '#ffffff';
      const comboSize = Math.min(36, 20 + comboCount * 2) * comboPulseScale;
      ctx.font = `bold ${Math.round(comboSize)}px "Segoe UI", system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillStyle = comboColor;
      ctx.globalAlpha = Math.min(1, comboTimer / 0.3); // fade out near end
      if (comboCount >= 5 || frenzyActive) {
        ctx.shadowColor = comboColor;
        ctx.shadowBlur = 12;
      }
      ctx.fillText(`×${comboCount}`, player.x, comboY);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // Festin golden time overlay + timer arc
    if (frenzyActive && frenzyTimer > 0) {
      // Golden overlay
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(-20, -20, W + 40, H + 40);
      ctx.globalAlpha = 1;
      // Timer arc (cooldown ring)
      const festinProgress = frenzyTimer / 4;
      const arcRadius = pDrawR * 2.2;
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 10;
      const startA = -Math.PI / 2;
      const endA = startA + festinProgress * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(player.x, player.y, arcRadius, startA, endA);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Build-up near tier-up: sparkles + XP glow
    {
      const xpRadiusBU = pDrawR * 1.7;
      let progressBU;
      if (player.tier < TIER_COUNT - 1) {
        progressBU = player.eaten / TIER_THRESHOLDS[player.tier];
      } else {
        progressBU = prestigeEats / PRESTIGE_EXTRA_EATS;
      }
      if (progressBU >= 0.8) {
        // Sparkles at end of XP arc
        const xpColorBU = player.tier < TIER_COUNT - 1
          ? getFishColors(player.tier + 1, currentZone).body : '#ffcc00';
        const endAngle = -Math.PI / 2 + Math.min(1, progressBU) * Math.PI * 2;
        const sparkX = player.x + Math.cos(endAngle) * xpRadiusBU;
        const sparkY = player.y + Math.sin(endAngle) * xpRadiusBU;
        const sparkAlpha = 0.4 + 0.4 * Math.sin(gameTime * 8);
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = sparkAlpha;
        ctx.beginPath();
        ctx.arc(sparkX, sparkY, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        // Threshold - 1: blink the ring
        const threshold = player.tier < TIER_COUNT - 1
          ? TIER_THRESHOLDS[player.tier] : PRESTIGE_EXTRA_EATS;
        const current = player.tier < TIER_COUNT - 1 ? player.eaten : prestigeEats;
        if (current === threshold - 1) {
          const blink = Math.sin(gameTime * 10) > 0;
          if (blink) {
            ctx.strokeStyle = xpColorBU;
            ctx.lineWidth = 5;
            ctx.shadowColor = xpColorBU;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(player.x, player.y, xpRadiusBU, -Math.PI / 2, endAngle);
            ctx.stroke();
            ctx.shadowBlur = 0;
          }
        }
      }
      // Prestige build-up: rising particles when close
      if (player.tier === TIER_COUNT - 1 && prestigeEats >= PRESTIGE_EXTRA_EATS * 0.75) {
        const intensity = (prestigeEats - PRESTIGE_EXTRA_EATS * 0.75) / (PRESTIGE_EXTRA_EATS * 0.25);
        ctx.globalAlpha = 0.3 * intensity;
        ctx.fillStyle = '#ffd700';
        for (let pi = 0; pi < 6; pi++) {
          const ppx = player.x + Math.sin(gameTime * 2 + pi * Math.PI / 3) * (pDrawR + 15);
          const ppy = player.y - ((gameTime * 40 + pi * 15) % 60);
          ctx.beginPath();
          ctx.arc(ppx, ppy, 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }

    // Tier-up expansion ring (legacy single ring)
    if (tierUpRingAlpha > 0) {
      ctx.strokeStyle = tierUpRingColor;
      ctx.globalAlpha = tierUpRingAlpha;
      ctx.lineWidth = 3 * tierUpRingAlpha;
      ctx.beginPath();
      ctx.arc(player.x, player.y, tierUpRingRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Enhanced 3-ring tier-up shockwaves
    for (let ri = 0; ri < 3; ri++) {
      const ring = tierUpRings[ri];
      if (ring.alpha <= 0) continue;
      ctx.strokeStyle = ring.color;
      ctx.globalAlpha = ring.alpha;
      ctx.lineWidth = 3 * ring.alpha;
      ctx.shadowColor = ring.color;
      ctx.shadowBlur = 10 * ring.alpha;
      ctx.beginPath();
      ctx.arc(player.x, player.y, ring.radius, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;

    // Jellyfish slow: purple tint over player
    if (playerSlowTimer > 0) {
      ctx.globalAlpha = 0.25 * (playerSlowTimer / 0.5);
      ctx.fillStyle = '#9944ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, pDrawR * 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Boost trail
    if (boosting && boostFuel > 0) {
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = '#ffcc44';
      for (let i = 0; i < 3; i++) {
        const bx = player.x - Math.cos(player.angle) * (player.radius + 10 + i * 8) + (Math.random() - 0.5) * 6;
        const by = player.y - Math.sin(player.angle) * (player.radius + 10 + i * 8) + (Math.random() - 0.5) * 6;
        ctx.beginPath();
        ctx.arc(bx, by, 2 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating texts (variable font size per text)
  for (const ft of floatingTexts) {
    ctx.globalAlpha = ft.life;
    ctx.textAlign = 'center';
    ctx.font = `bold ${ft.fontSize}px "Segoe UI", system-ui, sans-serif`;
    if (ft.glow) {
      ctx.shadowColor = ft.color;
      ctx.shadowBlur = 20;
    } else {
      ctx.shadowBlur = 0;
    }
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // Saturation flash overlay (frenzy/festin golden glow)
  if (saturationFlash > 0 && !frenzyActive) {
    // Brief flash only (festin golden overlay is handled separately above)
    ctx.globalAlpha = saturationFlash * 0.15;
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.globalAlpha = 1;
  }

  // Zone wave sweep
  if (zoneWaveY >= 0 && zoneWaveY < H + 50) {
    ctx.globalAlpha = 0.3 * (1 - zoneWaveY / H);
    const waveGrad = ctx.createLinearGradient(0, zoneWaveY - 30, 0, zoneWaveY + 30);
    waveGrad.addColorStop(0, 'transparent');
    waveGrad.addColorStop(0.5, zoneWaveColor);
    waveGrad.addColorStop(1, 'transparent');
    ctx.fillStyle = waveGrad;
    ctx.fillRect(-10, zoneWaveY - 30, W + 20, 60);
    ctx.globalAlpha = 1;
  }

  // Tier-up text: "TIER UP!" in gold + "→ tier name" in tier color
  if (tierUpTextScale > 0 && tierUpTextAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = tierUpTextAlpha;
    ctx.translate(W / 2, H / 2 + tierUpTextY);
    ctx.scale(tierUpTextScale, tierUpTextScale);
    ctx.textAlign = 'center';
    // "TIER UP!" label — gold, big
    ctx.font = 'bold 46px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 24;
    ctx.fillText('TIER UP!', 0, -16);
    // "→ tier name" — tier color, smaller
    ctx.font = 'bold 28px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = tierUpTextColor;
    ctx.shadowColor = tierUpTextColor;
    ctx.shadowBlur = 16;
    ctx.fillText('\u2192 ' + tierUpTextName, 0, 22);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Tier-up bicolor flash
  if (tierUpFlashTimer > 0) {
    ctx.globalAlpha = (tierUpFlashTimer / 0.3) * 0.15;
    ctx.fillStyle = tierUpRingColor || '#ffd700';
    ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.globalAlpha = 1;
  }

  // --- JOYSTICK RENDERING (mobile only) ---
  if (isTouchDevice && running && player && player.alive && !deathAnimActive && !inPrestige) {
    const drawJoystick = joystick.active || joystick.releaseAnimT > 0;
    if (drawJoystick) {
      ctx.save();
      // Elastic release animation
      let knobOffX = 0, knobOffY = 0;
      if (joystick.active) {
        knobOffX = joystick.currentX - joystick.originX;
        knobOffY = joystick.currentY - joystick.originY;
      } else if (joystick.releaseAnimT > 0) {
        // Elastic ease-out (overshoot)
        const t = 1 - joystick.releaseAnimT;
        const elastic = 1 - Math.pow(2, -10 * t) * Math.cos(t * Math.PI * 3);
        knobOffX = joystick.releaseFromX * (1 - elastic);
        knobOffY = joystick.releaseFromY * (1 - elastic);
      }

      const baseX = joystick.originX;
      const baseY = joystick.originY;
      const alpha = joystick.active ? 0.5 : joystick.releaseAnimT * 0.5;

      // Zone-themed color
      let joyColor;
      if (currentZone === 'abyss') joyColor = 'rgba(0,255,200,';
      else if (currentZone === 'twilight') joyColor = 'rgba(120,140,220,';
      else if (currentZone === 'reef') joyColor = 'rgba(80,220,160,';
      else joyColor = 'rgba(100,200,255,';

      // Aquatic ripple on base circle
      const ripple1 = 1 + 0.03 * Math.sin(joystick.ripplePhase * 2.5);
      const ripple2 = 1 + 0.02 * Math.sin(joystick.ripplePhase * 3.7 + 1);

      // Base circle (outer ring with ripple)
      ctx.globalAlpha = alpha * 0.3;
      ctx.strokeStyle = joyColor + '0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(baseX, baseY, JOYSTICK_MAX_RADIUS * ripple1, JOYSTICK_MAX_RADIUS * ripple2, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Inner base circle
      ctx.globalAlpha = alpha * 0.15;
      ctx.fillStyle = joyColor + '0.1)';
      ctx.beginPath();
      ctx.arc(baseX, baseY, JOYSTICK_BASE_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      // Directional glow on the rim
      if (joystick.active && joystick.tilt > 0.1) {
        const glowX = baseX + Math.cos(joystick.glowDir) * JOYSTICK_MAX_RADIUS;
        const glowY = baseY + Math.sin(joystick.glowDir) * JOYSTICK_MAX_RADIUS;
        const glowGrad = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, 25);
        glowGrad.addColorStop(0, joyColor + (0.4 * joystick.tilt) + ')');
        glowGrad.addColorStop(1, joyColor + '0)');
        ctx.globalAlpha = alpha;
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(glowX, glowY, 25, 0, Math.PI * 2);
        ctx.fill();
      }

      // Knob
      const knobX = baseX + knobOffX;
      const knobY = baseY + knobOffY;
      ctx.globalAlpha = alpha * 0.8;
      const knobGrad = ctx.createRadialGradient(knobX, knobY, 0, knobX, knobY, JOYSTICK_KNOB_RADIUS);
      knobGrad.addColorStop(0, joyColor + '0.5)');
      knobGrad.addColorStop(0.7, joyColor + '0.25)');
      knobGrad.addColorStop(1, joyColor + '0.1)');
      ctx.fillStyle = knobGrad;
      ctx.beginPath();
      ctx.arc(knobX, knobY, JOYSTICK_KNOB_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = joyColor + '0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(knobX, knobY, JOYSTICK_KNOB_RADIUS, 0, Math.PI * 2);
      ctx.stroke();

      // Tail flick cooldown indicator (arc on base)
      if (joystick.cooldownIndicator > 0) {
        ctx.globalAlpha = alpha * 0.5;
        ctx.strokeStyle = 'rgba(255,150,50,0.5)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(baseX, baseY, JOYSTICK_MAX_RADIUS + 5, -Math.PI / 2, -Math.PI / 2 + joystick.cooldownIndicator * Math.PI * 2);
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  // --- CONTROL ZONE RENDERING (mobile only) ---
  if (isTouchDevice && running && controlZoneEl.classList.contains('visible')) {
    ctx.save();
    const czTop = H * 0.72;
    const czHeight = H - czTop;

    // Semi-transparent zone-colored backdrop
    let czColor1, czColor2;
    if (currentZone === 'abyss') { czColor1 = 'rgba(0,10,20,0.3)'; czColor2 = 'rgba(0,5,15,0.5)'; }
    else if (currentZone === 'twilight') { czColor1 = 'rgba(10,15,30,0.25)'; czColor2 = 'rgba(5,10,25,0.4)'; }
    else if (currentZone === 'reef') { czColor1 = 'rgba(10,50,50,0.2)'; czColor2 = 'rgba(5,30,35,0.35)'; }
    else { czColor1 = 'rgba(15,50,80,0.15)'; czColor2 = 'rgba(10,35,60,0.3)'; }
    const czGrad = ctx.createLinearGradient(0, czTop, 0, H);
    czGrad.addColorStop(0, czColor1);
    czGrad.addColorStop(1, czColor2);
    ctx.fillStyle = czGrad;
    ctx.fillRect(0, czTop, W, czHeight);

    // Sand/plancton particles
    ctx.globalAlpha = 0.15;
    for (const p of controlZoneParticles) {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = W;
      if (p.x > W) p.x = 0;
      if (p.y < 0) p.y = czHeight;
      if (p.y > czHeight) p.y = 0;
      const py = czTop + p.y;
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = currentZone === 'abyss' ? 'rgba(0,255,200,0.3)' : 'rgba(180,200,220,0.4)';
      ctx.beginPath();
      ctx.arc(p.x, py, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // Prestige cinematic animation
  if (inPrestige) {
    const totalDur = 3.0;
    const t = 1 - (prestigeTimer / totalDur); // 0 → 1

    // Fish swimming down
    if (t < 0.4 && player) {
      const fishY = H / 2 + (t / 0.4) * (H / 2 + 50);
      ctx.globalAlpha = Math.max(0, 1 - t * 2.5);
      drawFish(W / 2, fishY, player.radius, Math.PI / 2, player.tier,
               0, gameTime * 10, true, currentZone);
      ctx.globalAlpha = 1;
    }

    // Progressive darken
    ctx.globalAlpha = Math.min(0.85, t * 1.2);
    ctx.fillStyle = '#000010';
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Rising bubbles
    ctx.globalAlpha = Math.min(0.8, t * 2);
    for (let bi = 0; bi < 10; bi++) {
      const bx = W * 0.2 + (bi / 10) * W * 0.6 + Math.sin(gameTime * 3 + bi) * 20;
      const by = H - ((gameTime * 60 + bi * 80) % (H + 40));
      ctx.fillStyle = 'rgba(150,200,255,0.3)';
      ctx.beginPath();
      ctx.arc(bx, by, 3 + Math.sin(gameTime + bi) * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Text: "PROFONDEUR X" with sequential letter reveal
    if (t > 0.4) {
      const textT = (t - 0.4) / 0.3;
      const fullText = `PROFONDEUR ${depthLevel + 1}`;
      const visChars = Math.min(fullText.length, Math.ceil(textT * fullText.length));
      const displayText = fullText.substring(0, visChars);
      ctx.globalAlpha = Math.min(1, textT * 2);
      ctx.fillStyle = '#80e0ff';
      ctx.font = 'bold 48px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#00aaff';
      ctx.shadowBlur = 20;
      ctx.fillText(displayText, W / 2, H / 2 - 20);
      ctx.shadowBlur = 0;
    }

    // Multiplier with 3 pulses
    if (t > 0.7) {
      const multT = (t - 0.7) / 0.3;
      const pulse = 1 + 0.15 * Math.sin(multT * Math.PI * 6);
      ctx.globalAlpha = Math.min(1, multT * 3);
      ctx.save();
      ctx.translate(W / 2, H / 2 + 30);
      ctx.scale(pulse, pulse);
      ctx.font = 'bold 64px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd700';
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 25;
      ctx.fillText(`×${depthLevel + 1}`, 0, 0);
      ctx.shadowBlur = 0;
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function gameOver() {
  const finalScore = score;
  const isNewRecord = finalScore > highScore;

  if (isNewRecord) {
    highScore = finalScore;
    localStorage.setItem('deepfeed_hi', String(highScore));
  }

  const timeSurvived = ((performance.now() - startTime) / 1000).toFixed(1);
  const minutes = Math.floor(timeSurvived / 60);
  const seconds = (timeSurvived % 60).toFixed(0);
  const timeStr = minutes > 0 ? `${minutes}min ${seconds}s` : `${timeSurvived}s`;

  // Death title
  const deathTitle = deathReason === 'oxygen'
    ? 'Plus d\'air ! 🫧💀'
    : 'Tu t\'es fait manger ! 🐟💀';

  // Build stats HTML
  let html = '';

  // Death title
  html += `<div class="death-title">${deathTitle}</div>`;

  // Score in vedette
  html += `<div class="final-score${isNewRecord ? ' record' : ''}">${finalScore}</div>`;
  if (isNewRecord) {
    html += `<div class="record-badge">🏆 Nouveau record !</div>`;
  } else if (highScore > 0) {
    html += `<div style="font-size:13px;opacity:.5;margin-bottom:8px">Record : ${highScore}</div>`;
  }

  // Visual fish summary by tier color
  let hasFishStats = false;
  let fishHtml = '<div class="fish-summary">';
  for (let t = 0; t < TIER_COUNT; t++) {
    if (fishEatenByTier[t] > 0) {
      hasFishStats = true;
      const color = TIER_COLORS[t].body;
      fishHtml += `<div class="fish-summary-item"><span class="fish-dot" style="background:${color}"></span>×${fishEatenByTier[t]}</div>`;
    }
  }
  fishHtml += '</div>';
  if (hasFishStats) html += fishHtml;

  // Progress hint (how close to next tier)
  if (player && player.tier < TIER_COUNT - 1) {
    const pointsNeeded = TIER_THRESHOLDS[player.tier] - player.eaten;
    const progressPct = (player.eaten / TIER_THRESHOLDS[player.tier]) * 100;
    if (pointsNeeded > 0 && pointsNeeded <= TIER_THRESHOLDS[player.tier]) {
      const nextName = TIER_NAMES[player.tier + 1];
      html += `<div class="progress-hint">Encore un peu et tu grandissais ! 🐟→${nextName}</div>`;
      html += `<div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${Math.min(100, progressPct)}%"></div></div>`;
    }
  }

  // Stats rows
  html += '<div id="end-stats-rows">';
  const addStat = (label, value) => {
    html += `<div class="stat-row"><span class="stat-label">${label}</span><span class="stat-value">${value}</span></div>`;
  };
  addStat('Taille max', TIER_NAMES[maxTierReached]);
  if (depthLevel > 1) addStat('Profondeur max', `${maxDepthReached}`);
  if (bestFrenzy > 0) addStat('Meilleur combo', `${bestFrenzy} d\'affilée`);
  addStat('Durée', timeStr);
  html += '</div>';

  endStatsEl.innerHTML = html;
  playBtn.textContent = 'Replonger';
  overlay.classList.remove('hidden');
  updateHUD();

  // Save max tier
  const prevMaxTier = parseInt(localStorage.getItem('deepfeed_maxTier') || '1', 10);
  if (maxTierReached > prevMaxTier) localStorage.setItem('deepfeed_maxTier', String(maxTierReached));

  initTitleAmbient();
  titleLastTime = performance.now();
  titleRafId = requestAnimationFrame(titleLoop);
}

// ============================================================
//  GAME LOOP
// ============================================================

let lastTime = 0;
let rafId = null;
let safetyInterval = null;

function loop(timestamp) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  update(dt);
  render();
}

function startLoop() {
  lastTime = performance.now();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);

  if (safetyInterval) clearInterval(safetyInterval);
  safetyInterval = setInterval(() => {
    if (running && !document.hidden) {
      lastTime = performance.now();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }
  }, 2000);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && running) {
    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
});
