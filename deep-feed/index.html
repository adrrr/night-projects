// ============================================================
//  HUD UPDATE
// ============================================================

function updateHUD() {
  scoreEl.textContent = `Score: ${score}`;
  if (highScore > 0) highScoreEl.textContent = `Best: ${highScore}`;

  if (depthLevel > 1) {
    depthInfoEl.textContent = `Profondeur ${depthLevel} — x${scoreMultiplier}`;
    depthInfoEl.style.display = 'block';
  } else {
    depthInfoEl.style.display = 'none';
  }

  if (player) {
    const zoneName = ZONE_NAMES[player.tier] || 'Surface';
    sizeInfoEl.textContent = `${TIER_NAMES[player.tier]} — ${zoneName}`;
    if (player.tier < TIER_COUNT - 1) {
      const progress = (player.eaten / TIER_THRESHOLDS[player.tier]) * 100;
      sizeBarEl.style.width = Math.min(100, progress) + '%';
      const c1 = getFishColors(player.tier, currentZone);
      const c2 = getFishColors(player.tier + 1, currentZone);
      sizeBarEl.style.background = `linear-gradient(90deg, ${c1.body}, ${c2.body})`;
    } else {
      // At max tier — show prestige progress
      const progress = (prestigeEats / PRESTIGE_EXTRA_EATS) * 100;
      sizeBarEl.style.width = Math.min(100, progress) + '%';
      sizeBarEl.style.background = 'linear-gradient(90deg, #bb55ff, #ffcc00)';
    }
  }
  boostBarEl.style.width = (boostFuel / BOOST_MAX * 100) + '%';
}

// ============================================================
//  COLLISION
// ============================================================

function circlesOverlap(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  const dist = Math.sqrt(dx * dx + dy * dy);
  return dist < (ar + br) * 0.7;
}

// ============================================================
//  PRESTIGE ANIMATION
// ============================================================

function triggerPrestige() {
  inPrestige = true;
  prestigeTimer = 1.5; // 1.5s animation
  playPrestige();
  haptic([50, 30, 50, 30, 100]);

  // Flash
  prestigeFlashEl.style.opacity = '0.8';
  setTimeout(() => { prestigeFlashEl.style.opacity = '0'; }, 300);
}

function completePrestige() {
  inPrestige = false;
  depthLevel++;
  maxDepthReached = Math.max(maxDepthReached, depthLevel);
  scoreMultiplier = depthLevel;
  prestigeEats = 0;

  // Reset player to Fry but keep score
  oxygen = OXYGEN_MAX; // refill oxygen on prestige
  player.tier = 1;
  player.eaten = 0;
  player.radius = TIER_RADIUS[1] * radiusScale;
  player.targetRadius = player.radius;
  player.invincible = 2; // brief immunity after prestige
  graceTimer = 3; // grace period after prestige too

  // Clear fish and respawn fresh (faster ones) — no tier 2 at start
  fishes = [];
  jellyfish = [];
  ambushFish = [];
  reefCurrents = [];
  const planctonCount = 12 + Math.floor(Math.random() * 6);
  for (let i = 0; i < planctonCount; i++) {
    fishes.push(createFish(0, false, true));
  }
  const fryCount = 6 + Math.floor(Math.random() * 5);
  for (let i = 0; i < fryCount; i++) {
    fishes.push(createFish(1, true));
  }

  currentZone = 'surface';
  spawnFloatingText(W / 2, H / 2 - 30, `PROFONDEUR ${depthLevel}`, '#ffcc00', true);
  spawnFloatingText(W / 2, H / 2 + 10, `Score x${scoreMultiplier}`, '#80e0ff', true);
  shakeIntensity = 15;
}

// ============================================================
//  FRENZY CHECK
// ============================================================

function checkFrenzy() {
  const now = gameTime;
  // Prune old eats
  while (recentEats.length > 0 && now - recentEats[0] > FRENZY_WINDOW) {
    recentEats.shift();
  }

  if (recentEats.length >= FRENZY_THRESHOLD && !frenzyActive) {
    // Trigger frenzy!
    frenzyActive = true;
    frenzyTimer = FRENZY_SLOWMO_DURATION;
    frenzyCount = recentEats.length;
    bestFrenzy = Math.max(bestFrenzy, frenzyCount);
    slowmoScale = FRENZY_SLOWMO_SCALE;
    saturationFlash = 1;

    playFrenzy();
    haptic([20, 10, 20, 10, 40]);
    spawnFloatingText(W / 2, H / 3, `FRENZY x${frenzyCount}!`, '#ffcc00', true);
    shakeIntensity = 10;
    recentEats = []; // reset window
  }
}

// ============================================================
//  DEATH ANIMATION
// ============================================================

function triggerDeathAnim() {
  deathAnimActive = true;
  deathAnimTimer = 0.5; // 0.5s slow-mo before game over
  slowmoScale = 0.2;
  shakeIntensity = 15;
  haptic([30, 20, 60]);
  playHurt();
  // Burst particles from player
  if (player) {
    const c = getFishColors(player.tier, currentZone);
    spawnEatParticles(player.x, player.y, c.body, 30);
    spawnEatParticles(player.x, player.y, '#ff4444', 20);
  }
  // Intense red flash
  vignetteEl.style.opacity = '1';
}

// ============================================================
//  UPDATE
// ============================================================

function update(dt) {
  if (!running || !player) return;

  // Death animation countdown
  if (deathAnimActive) {
    deathAnimTimer -= dt; // real time
    if (deathAnimTimer <= 0) {
      deathAnimActive = false;
      slowmoScale = 1;
      player.alive = false;
      running = false;
      playGameOver();
      vignetteEl.style.opacity = '0';
      gameOver();
      return;
    }
    // Keep rendering but don't process game logic
    gameTime += dt * 0.2;
    // Fade player opacity via flash
    player.flashTimer += dt * 15;
    return;
  }

  // Apply slow-mo
  const effectiveDt = dt * slowmoScale;
  gameTime += effectiveDt;

  // Frenzy timer
  if (frenzyActive) {
    frenzyTimer -= dt; // real time, not slowed
    if (frenzyTimer <= 0) {
      frenzyActive = false;
      slowmoScale = 1;
    }
  }
  // Saturation flash decay
  if (saturationFlash > 0) {
    saturationFlash = Math.max(0, saturationFlash - dt * 3);
  }

  // Tier-up slow-mo timer (separate from frenzy)
  if (tierUpSlowmoTimer > 0) {
    tierUpSlowmoTimer -= dt;
    if (tierUpSlowmoTimer <= 0 && !frenzyActive) {
      slowmoScale = 1;
    }
  }

  // Grace period countdown
  if (graceTimer > 0) {
    graceTimer = Math.max(0, graceTimer - dt);
  }

  // Tier-up golden flash decay
  if (tierUpFlashTimer > 0) {
    tierUpFlashTimer = Math.max(0, tierUpFlashTimer - dt);
  }

  // Tier-up expansion ring animation
  if (tierUpRingAlpha > 0) {
    tierUpRingRadius += dt * 300; // expand outward fast
    tierUpRingAlpha = Math.max(0, tierUpRingAlpha - dt * 1.4);
  }

  // Adaptive danger: track time since last hit
  timeSinceLastHit += dt;

  // Difficulty wave oscillator (~42s period)
  difficultyWave = 0.7 + 0.3 * Math.sin(gameTime * 0.15);

  // Prestige animation
  if (inPrestige) {
    prestigeTimer -= dt;
    if (prestigeTimer <= 0) {
      completePrestige();
    }
    return; // freeze game during prestige
  }

  // Update zone based on player tier
  currentZone = getZoneForTier(player.tier);

  // Track max tier
  maxTierReached = Math.max(maxTierReached, player.tier);

  // --- Stun & slow timers ---
  if (playerStunTimer > 0) playerStunTimer = Math.max(0, playerStunTimer - effectiveDt);
  if (playerSlowTimer > 0) playerSlowTimer = Math.max(0, playerSlowTimer - effectiveDt);

  // --- Player movement (unified pointer for both touch and desktop) ---
  let hasDirectionalInput = false;
  let playerActualSpeed = 0;

  if (pointer.active) {
    const dx = pointer.x - player.x;
    const dy = pointer.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 2) {
      hasDirectionalInput = true;
      const targetAngle = Math.atan2(dy, dx);
      let angleDiff = targetAngle - player.angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      player.angle += angleDiff * Math.min(1, effectiveDt * 12);

      let speed = PLAYER_BASE_SPEED;
      if (boosting && boostFuel > 0) {
        speed *= BOOST_MULT;
        boostFuel = Math.max(0, boostFuel - BOOST_DRAIN);
        if (!hasEverBoosted) { hasEverBoosted = true; revealBoostBar(); }
      }
      if (playerStunTimer > 0) speed *= 0.6;
      if (playerSlowTimer > 0) speed *= 0.6;

      const move = Math.min(dist, speed * (60 * effectiveDt));
      player.x += (dx / dist) * move;
      player.y += (dy / dist) * move;
      playerActualSpeed = move / (60 * effectiveDt);
    }
  }

  if (!hasDirectionalInput) {
    // Idle auto-swim: drift forward at 40% speed
    let idleSpeed = PLAYER_BASE_SPEED * 0.4;
    if (playerStunTimer > 0) idleSpeed *= 0.6;
    if (playerSlowTimer > 0) idleSpeed *= 0.6;

    // Auto-dodge: nudge angle away from nearby predators
    let dodgeAngleX = 0, dodgeAngleY = 0;
    for (const f of fishes) {
      if (!f.alive || f.tier <= player.tier) continue;
      const ddx = player.x - f.x, ddy = player.y - f.y;
      const dd = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dd < 120 && dd > 0) {
        const strength = (120 - dd) / 120;
        dodgeAngleX += (ddx / dd) * strength;
        dodgeAngleY += (ddy / dd) * strength;
      }
    }
    if (dodgeAngleX !== 0 || dodgeAngleY !== 0) {
      const dodgeTarget = Math.atan2(dodgeAngleY, dodgeAngleX);
      let daDiff = dodgeTarget - player.angle;
      while (daDiff > Math.PI) daDiff -= Math.PI * 2;
      while (daDiff < -Math.PI) daDiff += Math.PI * 2;
      player.angle += daDiff * Math.min(1, effectiveDt * 3);
    }

    const idleMove = idleSpeed * (60 * effectiveDt);
    player.x += Math.cos(player.angle) * idleMove;
    player.y += Math.sin(player.angle) * idleMove;
  }

  if (!boosting) {
    boostFuel = Math.min(BOOST_MAX, boostFuel + BOOST_REGEN);
  }

  // --- Apply bounce velocity ---
  player.x += playerBounceVx;
  player.y += playerBounceVy;
  playerBounceVx *= 0.85;
  playerBounceVy *= 0.85;
  if (Math.abs(playerBounceVx) < 0.1) playerBounceVx = 0;
  if (Math.abs(playerBounceVy) < 0.1) playerBounceVy = 0;

  // --- Soft bounce screen edges ---
  const pr = player.radius;
  if (player.x < pr) {
    player.x = pr;
    playerBounceVx = 5 + Math.random() * 5;
    haptic(5);
  } else if (player.x > W - pr) {
    player.x = W - pr;
    playerBounceVx = -(5 + Math.random() * 5);
    haptic(5);
  }
  if (player.y < pr) {
    player.y = pr;
    playerBounceVy = 5 + Math.random() * 5;
    haptic(5);
  } else if (player.y > H - pr) {
    player.y = H - pr;
    playerBounceVy = -(5 + Math.random() * 5);
    haptic(5);
  }

  // Player animation — tail speed proportional to actual movement speed
  const tailSpeedMult = hasDirectionalInput ? (0.8 + (playerActualSpeed / PLAYER_BASE_SPEED) * 1.5) : 0.5;
  player.tailPhase += effectiveDt * 10 * tailSpeedMult;
  player.mouthOpen = Math.max(0, player.mouthOpen - effectiveDt * 2);

  // Smooth radius lerp toward targetRadius (0.3s transition)
  if (Math.abs(player.radius - player.targetRadius) > 0.5) {
    player.radius += (player.targetRadius - player.radius) * Math.min(1, effectiveDt * 8);
  } else {
    player.radius = player.targetRadius;
  }

  if (player.invincible > 0) {
    player.invincible -= effectiveDt;
    player.flashTimer += effectiveDt * 12;
  }

  frameCount++;

  // --- Jellyfish (twilight/abyss zone obstacle) ---
  if (currentZone === 'twilight' || currentZone === 'abyss') {
    // Spawn jellyfish
    if (Math.random() < effectiveDt * 0.3 && jellyfish.length < 5) {
      spawnJellyfish();
    }
    // Update & collision
    for (let i = jellyfish.length - 1; i >= 0; i--) {
      const j = jellyfish[i];
      j.x += j.vx * 60 * effectiveDt;
      j.y += j.vy * 60 * effectiveDt;
      j.phase += effectiveDt * 3;
      j.tentaclePhase += effectiveDt * 2;

      // Soft bounce
      if (j.x < 30) j.vx = Math.abs(j.vx);
      if (j.x > W - 30) j.vx = -Math.abs(j.vx);
      if (j.y < 30) j.vy = Math.abs(j.vy) * 0.5;
      if (j.y > H - 30) j.vy = -Math.abs(j.vy);

      // Remove if way off screen
      if (j.y < -100 || j.y > H + 100) { jellyfish.splice(i, 1); continue; }

      // Collision with player — damage + slow
      if (player.invincible <= 0) {
        const jdx = player.x - j.x, jdy = player.y - j.y;
        const jdist = Math.sqrt(jdx * jdx + jdy * jdy);
        if (jdist < player.radius + j.radius * 0.6) {
          // Jellyfish slow: 60% speed for 0.5s
          playerSlowTimer = 0.5;

          player.invincible = 1.5;
          player.eaten = Math.max(0, player.eaten - 2);

          if (player.tier <= 1) {
            triggerDeathAnim();
            return;
          }

          player.tier--;
          player.radius = TIER_RADIUS[player.tier] * radiusScale;
          player.targetRadius = player.radius;
          timeSinceLastHit = 0;
          adaptiveDangerSpawned = false;
          shakeIntensity = 12;
          spawnEatParticles(player.x, player.y, '#bb55ff', 15);

          const kAngle = Math.atan2(player.y - j.y, player.x - j.x);
          player.x += Math.cos(kAngle) * 40;
          player.y += Math.sin(kAngle) * 40;

          haptic(50);
          playHurt();
          vignetteEl.style.opacity = '1';
          setTimeout(() => vignetteEl.style.opacity = '0', 200);
        }
      }
    }
  } else {
    // Clear jellyfish in non-twilight zones
    jellyfish = [];
  }

  // --- Count active chasers for max chaser cap ---
  let activeChaserCount = 0;
  const MAX_CHASERS = 3;

  // --- Enemy fish AI ---
  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i];
    if (!f.alive) { fishes.splice(i, 1); continue; }

    if (f.eatCooldown > 0) f.eatCooldown -= effectiveDt;
    if (f.sizeBoost > 0) f.sizeBoost -= effectiveDt;
    if (f.chaseCooldown > 0) f.chaseCooldown -= effectiveDt;
    f.mouthOpen = Math.max(0, f.mouthOpen - effectiveDt * 4);
    f.tailPhase += effectiveDt * (8 + f.speed * 3);

    if (f.tier === 0) {
      // Plancton drift
      f.turnTimer -= effectiveDt;
      if (f.turnTimer <= 0) {
        f.turnTimer = 3 + Math.random() * 4;
        f.targetAngle = f.angle + (Math.random() - 0.5) * 2;
      }
      let aDiff = f.targetAngle - f.angle;
      while (aDiff > Math.PI) aDiff -= Math.PI * 2;
      while (aDiff < -Math.PI) aDiff += Math.PI * 2;
      f.angle += aDiff * Math.min(1, effectiveDt * 1.5);

      const spd = f.speed * 0.5 * 60 * effectiveDt;
      f.x += Math.cos(f.angle) * spd;
      f.y += Math.sin(f.angle) * spd;

      if (f.x < 20) f.targetAngle = 0;
      if (f.x > W - 20) f.targetAngle = Math.PI;
      if (f.y < 20) f.targetAngle = Math.PI / 2;
      if (f.y > H - 20) f.targetAngle = -Math.PI / 2;

      const margin = 150;
      if (f.x < -margin || f.x > W + margin || f.y < -margin || f.y > H + margin) {
        fishes.splice(i, 1);
        continue;
      }
    } else {
      // Normal fish AI
      const distToPlayer = distBetween(player, f);
      // Time-based detect range: +10px per 30s of game time
      const timeDetectBonus = Math.min(30, gameTime / 30 * 10);
      // Adaptive danger: +20% range if no damage for 20s
      const adaptiveRangeBonus = timeSinceLastHit > 20 ? 0.2 : 0;
      const detectRange = (PREDATOR_DETECT_RANGE + (depthLevel - 1) * PREDATOR_DEPTH_DETECT_BONUS + timeDetectBonus) * (1 + adaptiveRangeBonus);
      const isPredator = f.tier > player.tier;

      // Chase with timer, cooldown, and max chaser cap
      let isChasing = false;
      if (isPredator && f.chaseCooldown <= 0 && distToPlayer < detectRange) {
        if (f.chaseTimer > 0 || activeChaserCount < MAX_CHASERS) {
          isChasing = true;
          if (f.chaseTimer <= 0) f.chaseTimer = 4; // start new chase
          f.chaseTimer -= effectiveDt;
          activeChaserCount++;
          if (f.chaseTimer <= 0) {
            // Chase expired — lose interest
            isChasing = false;
            f.chaseTimer = 0;
            f.chaseCooldown = 3;
            f.targetAngle = f.angle + (Math.random() - 0.5) * 3;
          }
        }
      } else if (f.chaseTimer > 0 && (!isPredator || distToPlayer >= detectRange)) {
        // Lost sight — reset chase
        f.chaseTimer = 0;
      }

      // Active predator chase — continuous, bypasses turnTimer
      if (isChasing) {
        f.targetAngle = Math.atan2(player.y - f.y, player.x - f.x);
        f.fleeing = false;
      } else {
        f.turnTimer -= effectiveDt;
        if (f.turnTimer <= 0) {
          f.turnTimer = 2 + Math.random() * 4;
          if (player.tier > f.tier && distToPlayer < 250) {
            f.fleeing = true;
            f.fleeTimer = 1.5 + Math.random();
            f.targetAngle = Math.atan2(f.y - player.y, f.x - player.x);
          } else {
            f.targetAngle = f.angle + (Math.random() - 0.5) * 1.5;
          }
        }
      }

      if (f.fleeing) {
        f.fleeTimer -= effectiveDt;
        if (f.fleeTimer <= 0) f.fleeing = false;
        f.targetAngle = Math.atan2(f.y - player.y, f.x - player.x);
      }

      let aDiff = f.targetAngle - f.angle;
      while (aDiff > Math.PI) aDiff -= Math.PI * 2;
      while (aDiff < -Math.PI) aDiff += Math.PI * 2;
      f.angle += aDiff * Math.min(1, effectiveDt * (isChasing ? 5 : 3));

      // Predators chase at 70% player speed, with time/adaptive scaling
      const timeSpeedBonus = 1 + Math.min(0.15, gameTime / 30 * 0.02); // +2% per 30s, cap +15%
      const adaptiveSpeedBonus = timeSinceLastHit > 20 ? 1.1 : 1;      // +10% if no damage 20s
      let spdMult = f.fleeing ? 1.5 : 1;
      let spd;
      if (isChasing) {
        spd = PREDATOR_CHASE_SPEED_RATIO * PLAYER_BASE_SPEED * timeSpeedBonus * adaptiveSpeedBonus * 60 * effectiveDt;
      } else {
        spd = f.speed * spdMult * 60 * effectiveDt;
      }
      f.x += Math.cos(f.angle) * spd;
      f.y += Math.sin(f.angle) * spd;

      const margin = f.radius * 4 + 100;
      if (f.x < -margin || f.x > W + margin || f.y < -margin || f.y > H + margin) {
        fishes.splice(i, 1);
        continue;
      }

      if (f.x < f.radius) f.targetAngle = 0;
      if (f.x > W - f.radius) f.targetAngle = Math.PI;
      if (f.y < f.radius) f.targetAngle = Math.PI / 2;
      if (f.y > H - f.radius) f.targetAngle = -Math.PI / 2;
    }

    // --- Collision with player (asymmetric hitbox: easy to eat, hard to die) ---
    const dx = player.x - f.x, dy = player.y - f.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    // Generous hitbox for eating (0.8), tight hitbox for predators (0.55)
    const eatOverlap = f.tier === 0 ? 0.9 : 0.8;
    const hurtOverlap = 0.55;
    const canEat = f.tier < player.tier && dist < (player.radius + f.radius) * eatOverlap;
    const canHurt = f.tier > player.tier && dist < (player.radius + f.radius) * hurtOverlap;
    const canBump = f.tier === player.tier && dist < (player.radius + f.radius) * 0.65;
    if (canEat || canHurt || canBump) {
      if (canEat) {
        // EAT!
        f.alive = false;

        // Reveal size bar on first eat
        if (!hasEverEaten) { hasEverEaten = true; revealSizeBar(); }

        // Tier-based scoring with frenzy doubler and depth multiplier
        let pointValue = TIER_POINTS[f.tier] || 1;
        if (frenzyActive) pointValue *= 2;
        pointValue *= scoreMultiplier;
        score += pointValue;
        totalFishEaten++;
        player.totalEaten++;
        player.eaten++;
        player.mouthOpen = 1;

        // Oxygen refill proportional to tier
        oxygen = Math.min(OXYGEN_MAX, oxygen + (OXYGEN_REFILL_PER_TIER[f.tier] || 5));

        // Track eat time for frenzy
        recentEats.push(gameTime);
        checkFrenzy();

        // Level up check
        if (player.tier < TIER_COUNT - 1 && player.eaten >= TIER_THRESHOLDS[player.tier]) {
          player.tier++;
          player.eaten = 0;
          hasFirstTierUp = true;
          // Smooth radius transition via lerp (not instant)
          player.targetRadius = TIER_RADIUS[player.tier] * radiusScale;
          shakeIntensity = 10;
          spawnEatParticles(player.x, player.y, getFishColors(player.tier, currentZone).body, 25);
          maxTierReached = Math.max(maxTierReached, player.tier);

          // --- Tier-up celebration ---
          playTierUp();
          haptic([20, 15, 30]);

          // Big floating text: "TIER UP!" + new tier name
          spawnFloatingText(W / 2, H / 2 - 40, 'TIER UP!', '#ffcc00', true);
          const newTierColor = getFishColors(player.tier, getZoneForTier(player.tier)).body;
          spawnFloatingText(W / 2, H / 2, `→ ${TIER_NAMES[player.tier]}`, newTierColor, true);

          // Expansion ring from player
          tierUpRingRadius = player.radius;
          tierUpRingAlpha = 0.7;
          tierUpRingColor = newTierColor;

          // Golden flash on player body
          tierUpFlashTimer = 0.3;

          // Brief slow-mo (0.4s at 0.3x)
          tierUpSlowmoTimer = 0.4;
          slowmoScale = 0.3;

          // Grace period: 3s reduced predator spawns
          graceTimer = 3;

          // Zone change notification
          const newZone = getZoneForTier(player.tier);
          if (newZone !== currentZone) {
            spawnFloatingText(W / 2, H / 3 - 20, ZONE_NAMES[player.tier], '#80e0ff', true);
          }
        } else if (player.tier === TIER_COUNT - 1) {
          // At max tier — track prestige progress
          prestigeEats++;
          if (prestigeEats >= PRESTIGE_EXTRA_EATS) {
            triggerPrestige();
          }
        }

        const pCount = f.tier === 0 ? 3 : 6;
        spawnEatParticles(f.x, f.y, getFishColors(f.tier, currentZone).body, pCount);
        if (f.tier > 0) spawnBubble(f.x, f.y);
        shakeIntensity = Math.max(shakeIntensity, f.tier === 0 ? 1 : 3);

        const scoreText = frenzyActive ? `+${pointValue}!` : `+${pointValue}`;
        const bigText = pointValue >= 10;
        spawnFloatingText(f.x, f.y, scoreText, frenzyActive ? '#ffcc00' : getFishColors(f.tier, currentZone).body, bigText);
        playerScaleBump = 0.2;
        haptic(10);
        playEat();

        // Post-eat breathing pulse: push nearby predators back ~30px
        for (const pf of fishes) {
          if (!pf.alive || pf.tier <= player.tier) continue;
          const pdx = pf.x - player.x, pdy = pf.y - player.y;
          const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
          if (pdist < 120 && pdist > 0) {
            pf.x += (pdx / pdist) * 30;
            pf.y += (pdy / pdist) * 30;
          }
        }

      } else if (canBump && player.invincible <= 0) {
        // BUMP — same tier: knockback, stun, no damage
        const bumpAngle = Math.atan2(player.y - f.y, player.x - f.x);
        player.x += Math.cos(bumpAngle) * 30;
        player.y += Math.sin(bumpAngle) * 30;
        f.x -= Math.cos(bumpAngle) * 30;
        f.y -= Math.sin(bumpAngle) * 30;
        playerStunTimer = 0.4;
        player.invincible = 0.5; // brief immunity to avoid repeated bumps
        timeSinceLastHit = 0;
        adaptiveDangerSpawned = false;
        shakeIntensity = Math.max(shakeIntensity, 5);
        haptic(15);
        playBonk();

      } else if (canHurt && player.invincible <= 0) {
        // HURT
        player.invincible = 1.5;
        player.eaten = 0;
        timeSinceLastHit = 0;
        adaptiveDangerSpawned = false;

        if (player.tier <= 1) {
          // Dramatic death: slow-mo + particles, then game over
          triggerDeathAnim();
          return;
        }

        player.tier--;
        player.radius = TIER_RADIUS[player.tier] * radiusScale;
        player.targetRadius = player.radius;
        shakeIntensity = 12;
        spawnEatParticles(player.x, player.y, '#ff4444', 15);

        const kAngle = Math.atan2(player.y - f.y, player.x - f.x);
        player.x += Math.cos(kAngle) * 40;
        player.y += Math.sin(kAngle) * 40;

        haptic(50);
        playHurt();
        vignetteEl.style.opacity = '1';
        setTimeout(() => vignetteEl.style.opacity = '0', 200);
      }
    }
  }

  // --- Fish-fish eating ---
  if (frameCount % FISH_EAT_CHECK_INTERVAL === 0 && gameTime - lastFishEatTime >= FISH_EAT_GLOBAL_COOLDOWN) {
    fishFishEating:
    for (let i = 0; i < fishes.length; i++) {
      const a = fishes[i];
      if (!a.alive || a.tier <= 0 || a.eatCooldown > 0) continue;
      for (let j = 0; j < fishes.length; j++) {
        if (i === j) continue;
        const b = fishes[j];
        if (!b.alive || b.tier >= a.tier) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < (a.radius + b.radius) * 0.7) {
          b.alive = false;
          a.mouthOpen = 1;
          a.eatCooldown = FISH_EAT_PER_FISH_COOLDOWN;
          a.sizeBoost = 1.5;
          lastFishEatTime = gameTime;
          spawnEatParticles(b.x, b.y, getFishColors(b.tier, currentZone).body, 5);
          spawnBubble(b.x, b.y);
          const respawnTier = b.tier;
          const respawnDelay = 2 + Math.random();
          pendingRespawns.push({ tier: respawnTier, time: gameTime + respawnDelay });
          break fishFishEating;
        }
      }
    }
  }

  // --- Process pending respawns ---
  for (let i = pendingRespawns.length - 1; i >= 0; i--) {
    if (gameTime >= pendingRespawns[i].time && fishes.length < MAX_FISH) {
      fishes.push(createFish(pendingRespawns[i].tier, true));
      pendingRespawns.splice(i, 1);
    }
  }

  // --- Spawn new fish ---
  let visibleCount = 0;
  let planctonCount = 0;
  for (const f of fishes) {
    if (f.tier === 0) { planctonCount++; continue; }
    if (f.x > -50 && f.x < W + 50 && f.y > -50 && f.y < H + 50) visibleCount++;
  }

  while (planctonCount < PLANCTON_TARGET_COUNT && fishes.length < MAX_FISH) {
    fishes.push(createFish(0, true));
    planctonCount++;
  }

  while (visibleCount < MIN_VISIBLE && fishes.length < MAX_FISH) {
    const tier = chooseTier(player.tier, gameTime);
    fishes.push(createFish(tier, true));
    visibleCount++;
  }
  if (Math.random() < effectiveDt * 3 && fishes.length < MAX_FISH) {
    fishes.push(createFish(chooseTier(player.tier, gameTime), true));
  }

  // --- Adaptive danger: spawn predator near player if no damage for 30s ---
  if (timeSinceLastHit > 30 && !adaptiveDangerSpawned && fishes.length < MAX_FISH) {
    const spawnDist = 180 + Math.random() * 80;
    const spawnAngle = Math.random() * Math.PI * 2;
    const predTier = Math.min(TIER_COUNT - 1, player.tier + 1);
    const predator = createFish(predTier, true);
    predator.x = player.x + Math.cos(spawnAngle) * spawnDist;
    predator.y = player.y + Math.sin(spawnAngle) * spawnDist;
    predator.targetAngle = Math.atan2(player.y - predator.y, player.x - predator.x);
    predator.angle = predator.targetAngle;
    fishes.push(predator);
    adaptiveDangerSpawned = true; // only one per cycle, resets on damage
  }

  // --- Particles ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); }
  }

  // --- Bubbles ---
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y += b.vy;
    b.x += Math.sin(b.y * 0.05) * 0.3;
    b.life -= b.decay;
    if (b.life <= 0) { bubbles.splice(i, 1); }
  }

  if (Math.random() < effectiveDt * 2) {
    spawnBubble(Math.random() * W, H + 5);
  }

  // --- Floating texts ---
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= ft.big ? 0.6 : 1.2;
    ft.life -= ft.decay;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  // --- Player scale bump decay (visible ~0.3s) ---
  if (playerScaleBump > 0) {
    playerScaleBump = Math.max(0, playerScaleBump - effectiveDt * 0.5);
  }

  // --- Oxygen drain (only at depth >= 2) ---
  if (depthLevel >= 2) {
    const oxygenDrain = OXYGEN_DRAIN_RATE * (1 + (depthLevel - 1) * OXYGEN_DEPTH_DRAIN_MULT);
    oxygen = Math.max(0, oxygen - oxygenDrain * effectiveDt);
    oxygenBarEl.style.width = (oxygen / OXYGEN_MAX * 100) + '%';
    if (oxygen < OXYGEN_MAX * 0.92 && !hasEverLowOxygen) { hasEverLowOxygen = true; revealOxygenBar(); }
    if (oxygen <= 0) {
      triggerDeathAnim();
      return;
    }
  } else {
    oxygen = OXYGEN_MAX;
  }

  // --- Reef currents ---
  if (currentZone === 'reef') {
    // Spawn new currents
    if (reefCurrents.length < 3 && Math.random() < effectiveDt * 0.5) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      reefCurrents.push({
        x: dir > 0 ? -50 : W + 50,
        y: H * (0.2 + Math.random() * 0.6),
        dir,
        speed: 1.5 + Math.random() * 1.5,
        width: 150 + Math.random() * 200,
        life: 1,
      });
    }
    for (let i = reefCurrents.length - 1; i >= 0; i--) {
      const c = reefCurrents[i];
      c.x += c.dir * c.speed * 60 * effectiveDt;
      // Push player if within current band (80px wide)
      const inBandY = Math.abs(player.y - c.y) < 80;
      const inBandX = player.x > c.x - c.width / 2 && player.x < c.x + c.width / 2;
      if (inBandY && inBandX) {
        // Stronger base push
        player.x += c.dir * c.speed * 0.7 * 60 * effectiveDt;
        // Direction-aware: swimming with current = speed boost, against = slow
        const playerDirX = Math.cos(player.angle);
        const alignment = playerDirX * c.dir; // +1 = same dir, -1 = against
        if (alignment > 0.3) {
          // Swimming WITH current — 30% speed boost via position push
          player.x += c.dir * c.speed * 0.3 * 60 * effectiveDt;
        }
        // Against current: the base push already slows effective movement
      }
      // Push fish too (wider band)
      for (const f of fishes) {
        if (f.tier === 0) continue;
        const fInY = Math.abs(f.y - c.y) < 80;
        const fInX = f.x > c.x - c.width / 2 && f.x < c.x + c.width / 2;
        if (fInY && fInX) {
          f.x += c.dir * c.speed * 0.5 * 60 * effectiveDt;
        }
      }
      // Remove when off screen
      if ((c.dir > 0 && c.x > W + c.width) || (c.dir < 0 && c.x < -c.width)) {
        reefCurrents.splice(i, 1);
      }
    }
  } else {
    reefCurrents = [];
  }

  // --- Abyss ambush predators ---
  if (currentZone === 'abyss') {
    // Spawn ambush fish (quasi-invisible, activate when player is close)
    if (ambushFish.length < 4 && Math.random() < effectiveDt * 0.25) {
      // Place away from player
      let ax, ay;
      do {
        ax = 60 + Math.random() * (W - 120);
        ay = 60 + Math.random() * (H - 120);
      } while (Math.sqrt((ax - player.x) ** 2 + (ay - player.y) ** 2) < 250);
      ambushFish.push({
        x: ax, y: ay,
        tier: Math.min(TIER_COUNT - 1, player.tier + 1),
        radius: TIER_RADIUS[Math.min(TIER_COUNT - 1, player.tier + 1)] * radiusScale,
        angle: Math.random() * Math.PI * 2,
        tailPhase: Math.random() * Math.PI * 2,
        mouthOpen: 0,
        activated: false,
        warning: false,       // warning flash phase
        warningTimer: 0,      // 0.3s countdown before activation
        opacity: 0.06, // nearly invisible
        life: 15 + Math.random() * 10, // despawn timer
      });
    }
    for (let i = ambushFish.length - 1; i >= 0; i--) {
      const a = ambushFish[i];
      a.tailPhase += effectiveDt * 4;
      a.life -= effectiveDt;
      if (a.life <= 0) { ambushFish.splice(i, 1); continue; }

      const dToPlayer = Math.sqrt((a.x - player.x) ** 2 + (a.y - player.y) ** 2);

      // Warning phase: eyes glow 0.3s before activation (range 150px)
      if (!a.activated && !a.warning && dToPlayer < 150) {
        a.warning = true;
        a.warningTimer = 0.3;
      }
      if (a.warning && !a.activated) {
        a.warningTimer -= effectiveDt;
        // Pulse opacity for warning (eyes visible)
        a.opacity = 0.06 + 0.3 * Math.abs(Math.sin(gameTime * 20));
        if (a.warningTimer <= 0) {
          a.activated = true;
          shakeIntensity = Math.max(shakeIntensity, 5);
        }
      }
      if (a.activated) {
        a.opacity = Math.min(1, a.opacity + effectiveDt * 3);
        // Chase player
        const chaseAngle = Math.atan2(player.y - a.y, player.x - a.x);
        let ad = chaseAngle - a.angle;
        while (ad > Math.PI) ad -= Math.PI * 2;
        while (ad < -Math.PI) ad += Math.PI * 2;
        a.angle += ad * Math.min(1, effectiveDt * 5);
        const aSpd = PREDATOR_CHASE_SPEED_RATIO * PLAYER_BASE_SPEED * 0.9 * 60 * effectiveDt;
        a.x += Math.cos(a.angle) * aSpd;
        a.y += Math.sin(a.angle) * aSpd;

        // Collision with player — same as predator hit
        if (player.invincible <= 0 && dToPlayer < (player.radius + a.radius) * 0.55) {
          player.invincible = 1.5;
          player.eaten = 0;
          if (player.tier <= 1) {
            triggerDeathAnim();
            return;
          }
          player.tier--;
          player.radius = TIER_RADIUS[player.tier] * radiusScale;
          player.targetRadius = player.radius;
          timeSinceLastHit = 0;
          adaptiveDangerSpawned = false;
          shakeIntensity = 12;
          spawnEatParticles(player.x, player.y, '#ff4444', 15);
          const kAngle = Math.atan2(player.y - a.y, player.x - a.x);
          player.x += Math.cos(kAngle) * 40;
          player.y += Math.sin(kAngle) * 40;
          haptic(50);
          playHurt();
          vignetteEl.style.opacity = '1';
          setTimeout(() => vignetteEl.style.opacity = '0', 200);
          ambushFish.splice(i, 1);
          continue;
        }

        // Despawn if off screen
        if (a.x < -80 || a.x > W + 80 || a.y < -80 || a.y > H + 80) {
          ambushFish.splice(i, 1);
        }
      }
    }
  } else {
    ambushFish = [];
  }

  // --- Camera shake ---
  if (shakeIntensity > 0.5) {
    shakeX = (Math.random() - 0.5) * shakeIntensity;
    shakeY = (Math.random() - 0.5) * shakeIntensity;
    shakeIntensity *= SHAKE_DECAY;
  } else {
    shakeX = shakeY = 0;
    shakeIntensity = 0;
  }

  boostBarEl.style.width = (boostFuel / BOOST_MAX * 100) + '%';

  const now = performance.now();
  if (now - lastHUDTime > 250) {
    lastHUDTime = now;
    updateHUD();
  }
}

function distBetween(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

// ============================================================
//  RENDER
// ============================================================

function render() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // --- Zone-based background ---
  const bg = ZONE_BG[currentZone] || ZONE_BG.surface;
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, bg.top);
  bgGrad.addColorStop(0.5, bg.mid);
  bgGrad.addColorStop(1, bg.bot);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // Light rays from top (intensity varies by zone)
  ctx.save();
  ctx.globalAlpha = bg.rayAlpha;
  const rayCount = currentZone === 'abyss' ? 2 : 5;
  for (let i = 0; i < rayCount; i++) {
    const rx = W * (0.15 + i * (0.7 / rayCount));
    const rw = 40 + i * 20;
    const rayH = currentZone === 'abyss' ? H * 0.3 : H * 0.7;
    const grad = ctx.createLinearGradient(rx, 0, rx, rayH);
    grad.addColorStop(0, bg.rayColor);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(rx - rw / 2, 0);
    ctx.lineTo(rx - rw * 1.5, rayH);
    ctx.lineTo(rx + rw * 1.5, rayH);
    ctx.lineTo(rx + rw / 2, 0);
    ctx.fill();
  }
  ctx.restore();

  // Reef zone: visible currents (water streaks)
  if (currentZone === 'reef') {
    ctx.save();
    for (const c of reefCurrents) {
      ctx.globalAlpha = 0.08;
      ctx.strokeStyle = '#66ccbb';
      ctx.lineWidth = 2;
      const halfW = c.width / 2;
      for (let s = -3; s <= 3; s++) {
        const sy = c.y + s * 18;
        ctx.beginPath();
        ctx.moveTo(c.x - halfW, sy);
        ctx.bezierCurveTo(c.x - halfW * 0.3, sy - 5, c.x + halfW * 0.3, sy + 5, c.x + halfW, sy);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Reef zone: coral silhouettes at bottom
  if (currentZone === 'reef') {
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#44aa88';
    for (let i = 0; i < 8; i++) {
      const cx = W * (i / 8 + 0.02);
      const ch = 30 + Math.sin(i * 2.7) * 25;
      const cw = 20 + Math.sin(i * 1.3) * 12;
      ctx.beginPath();
      ctx.ellipse(cx, H - 5, cw, ch, 0, Math.PI, 0);
      ctx.fill();
    }
    ctx.restore();
  }

  // Abyss zone: scattered bioluminescent particles in background
  if (currentZone === 'abyss') {
    ctx.save();
    const bioTime = gameTime * 0.5;
    for (let i = 0; i < 15; i++) {
      const bx = (W * (0.1 + (i * 0.137) % 0.8) + Math.sin(bioTime + i * 1.7) * 30) % W;
      const by = (H * (0.1 + (i * 0.191) % 0.8) + Math.cos(bioTime + i * 2.3) * 20) % H;
      const pulse = 0.3 + 0.7 * Math.sin(bioTime * 2 + i * 0.9);
      ctx.globalAlpha = pulse * 0.15;
      const colors = ['#00ffcc', '#ff00ff', '#4488ff', '#ffff00'];
      ctx.fillStyle = colors[i % colors.length];
      ctx.beginPath();
      ctx.arc(bx, by, 2 + pulse * 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Bubbles (behind fish)
  for (const b of bubbles) {
    ctx.globalAlpha = b.life * 0.3;
    ctx.strokeStyle = '#88ccff';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(200,230,255,0.3)';
    ctx.beginPath();
    ctx.arc(b.x - b.size * 0.2, b.y - b.size * 0.2, b.size * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Jellyfish (between bubbles and fish)
  for (const j of jellyfish) {
    drawJellyfish(j);
  }

  // Enemy fish & plancton (with onboarding halos)
  for (const f of fishes) {
    if (!f.alive) continue;
    if (f.tier === 0) {
      drawPlancton(f.x, f.y, f.radius, f.tailPhase, currentZone);
    } else {
      const r = f.sizeBoost > 0 ? f.radius * (1 + 0.08 * f.sizeBoost) : f.radius;

      // Onboarding halo: green = edible, red = danger, none = same tier
      if (player && player.alive) {
        if (f.tier < player.tier) {
          // Subtle green halo — edible
          const haloGrad = ctx.createRadialGradient(f.x, f.y, r * 0.6, f.x, f.y, r * 2);
          haloGrad.addColorStop(0, 'rgba(80,255,80,0.12)');
          haloGrad.addColorStop(1, 'rgba(80,255,80,0)');
          ctx.fillStyle = haloGrad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, r * 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (f.tier > player.tier) {
          // Subtle red halo with micro pulsation — danger
          const dangerPulse = 0.08 + 0.04 * Math.sin(gameTime * 6 + f.x);
          const haloGrad = ctx.createRadialGradient(f.x, f.y, r * 0.6, f.x, f.y, r * 2.2);
          haloGrad.addColorStop(0, `rgba(255,60,60,${dangerPulse})`);
          haloGrad.addColorStop(1, 'rgba(255,60,60,0)');
          ctx.fillStyle = haloGrad;
          ctx.beginPath();
          ctx.arc(f.x, f.y, r * 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawFish(f.x, f.y, r, f.angle, f.tier, f.mouthOpen, f.tailPhase, false, currentZone);
    }
  }

  // Abyss ambush predators (drawn with variable opacity + warning eye glow)
  for (const a of ambushFish) {
    ctx.globalAlpha = a.opacity;
    drawFish(a.x, a.y, a.radius, a.angle, a.tier, a.mouthOpen, a.tailPhase, false, 'abyss');

    // Warning phase: bioluminescent eye glow before activation
    if (a.warning && !a.activated) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(gameTime * 25);
      const eyeOffX = Math.cos(a.angle) * a.radius * 0.4;
      const eyeOffY = Math.sin(a.angle) * a.radius * 0.4;
      const eyeGlow = ctx.createRadialGradient(
        a.x + eyeOffX, a.y + eyeOffY, 0,
        a.x + eyeOffX, a.y + eyeOffY, a.radius * 0.8
      );
      eyeGlow.addColorStop(0, 'rgba(255,50,50,0.8)');
      eyeGlow.addColorStop(0.5, 'rgba(255,50,50,0.2)');
      eyeGlow.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = eyeGlow;
      ctx.beginPath();
      ctx.arc(a.x + eyeOffX, a.y + eyeOffY, a.radius * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // Player
  if (player && player.alive) {
    // Abyss zone: player halo (visibility light)
    if (currentZone === 'abyss') {
      const haloR = player.radius * 5;
      const halo = ctx.createRadialGradient(player.x, player.y, player.radius * 0.5, player.x, player.y, haloR);
      halo.addColorStop(0, 'rgba(100,200,255,0.12)');
      halo.addColorStop(0.5, 'rgba(60,140,200,0.05)');
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(player.x, player.y, haloR, 0, Math.PI * 2);
      ctx.fill();

      // Darkness mask (reduce visibility away from player)
      // Radial gradient: transparent near player, dark far away
      const darkR = Math.max(W, H);
      const dark = ctx.createRadialGradient(player.x, player.y, haloR * 0.7, player.x, player.y, darkR);
      dark.addColorStop(0, 'rgba(0,2,8,0)');
      dark.addColorStop(0.3, 'rgba(0,2,8,0.4)');
      dark.addColorStop(1, 'rgba(0,2,8,0.7)');
      ctx.fillStyle = dark;
      ctx.fillRect(-10, -10, W + 20, H + 20);
    }

    // Flash when invincible
    if (player.invincible > 0 && Math.sin(player.flashTimer * Math.PI) > 0) {
      ctx.globalAlpha = 0.4;
    }
    const pDrawR = player.radius * (1 + playerScaleBump);
    drawFish(player.x, player.y, pDrawR, player.angle, player.tier,
             player.mouthOpen, player.tailPhase, true, currentZone);
    ctx.globalAlpha = 1;

    // Tier-up golden flash overlay on player body
    if (tierUpFlashTimer > 0) {
      ctx.globalAlpha = tierUpFlashTimer / 0.3 * 0.4;
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.arc(player.x, player.y, pDrawR * 1.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // XP ring — progress toward next tier (agar.io style)
    {
      const xpRadius = pDrawR * 1.7;
      let xpProgress, xpColor;
      if (player.tier < TIER_COUNT - 1) {
        xpProgress = player.eaten / TIER_THRESHOLDS[player.tier];
        xpColor = getFishColors(player.tier + 1, currentZone).body;
      } else {
        xpProgress = prestigeEats / PRESTIGE_EXTRA_EATS;
        xpColor = '#ffcc00';
      }
      // Background ring
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(player.x, player.y, xpRadius, 0, Math.PI * 2);
      ctx.stroke();
      // Progress arc
      if (xpProgress > 0) {
        const startA = -Math.PI / 2;
        const endA = startA + Math.min(1, xpProgress) * Math.PI * 2;
        ctx.strokeStyle = xpColor;
        ctx.lineWidth = 3;
        ctx.shadowColor = xpColor;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(player.x, player.y, xpRadius, startA, endA);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }

    // Player chevron — PERMANENT, large, white-gold, always visible
    {
      const chevronY = player.y - pDrawR * 1.9 - 16;
      const chevronSize = 10;
      // Always visible — slight pulse but NEVER below 0.7
      const chevronPulse = 0.8 + 0.15 * Math.sin(gameTime * 2.5);
      ctx.globalAlpha = chevronPulse;
      ctx.shadowColor = 'rgba(255,220,100,0.6)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#ffe8a0';
      ctx.beginPath();
      ctx.moveTo(player.x - chevronSize, chevronY - chevronSize * 0.6);
      ctx.lineTo(player.x + chevronSize, chevronY - chevronSize * 0.6);
      ctx.lineTo(player.x, chevronY + chevronSize * 0.5);
      ctx.closePath();
      ctx.fill();
      // White outline for extra visibility
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(player.x - chevronSize, chevronY - chevronSize * 0.6);
      ctx.lineTo(player.x + chevronSize, chevronY - chevronSize * 0.6);
      ctx.lineTo(player.x, chevronY + chevronSize * 0.5);
      ctx.closePath();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // Tier-up expansion ring (shockwave)
    if (tierUpRingAlpha > 0) {
      ctx.strokeStyle = tierUpRingColor;
      ctx.globalAlpha = tierUpRingAlpha;
      ctx.lineWidth = 3 * tierUpRingAlpha;
      ctx.beginPath();
      ctx.arc(player.x, player.y, tierUpRingRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Jellyfish slow: purple tint over player
    if (playerSlowTimer > 0) {
      ctx.globalAlpha = 0.25 * (playerSlowTimer / 0.5);
      ctx.fillStyle = '#9944ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, pDrawR * 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Boost trail
    if (boosting && boostFuel > 0) {
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = '#ffcc44';
      for (let i = 0; i < 3; i++) {
        const bx = player.x - Math.cos(player.angle) * (player.radius + 10 + i * 8) + (Math.random() - 0.5) * 6;
        const by = player.y - Math.sin(player.angle) * (player.radius + 10 + i * 8) + (Math.random() - 0.5) * 6;
        ctx.beginPath();
        ctx.arc(bx, by, 2 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating texts
  for (const ft of floatingTexts) {
    ctx.globalAlpha = ft.life;
    ctx.textAlign = 'center';
    if (ft.big) {
      ctx.font = 'bold 32px "Segoe UI", system-ui, sans-serif';
      if (ft.glow) {
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 20;
      }
    } else {
      ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
      ctx.shadowBlur = 0;
    }
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // Saturation flash overlay (frenzy effect)
  if (saturationFlash > 0) {
    ctx.globalAlpha = saturationFlash * 0.15;
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.globalAlpha = 1;
  }

  // Prestige zoom/darken animation
  if (inPrestige) {
    const t = 1 - (prestigeTimer / 1.5); // 0 → 1
    ctx.globalAlpha = t * 0.8;
    ctx.fillStyle = '#000010';
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Depth text
    ctx.globalAlpha = Math.min(1, t * 2);
    ctx.fillStyle = '#80e0ff';
    ctx.font = 'bold 28px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00aaff';
    ctx.shadowBlur = 20;
    ctx.fillText('Plongée...', W / 2, H / 2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ============================================================
//  GAME OVER
// ============================================================

function gameOver() {
  const finalScore = score;
  const isNewRecord = finalScore > highScore;

  if (isNewRecord) {
    highScore = finalScore;
    localStorage.setItem('deepfeed_hi', String(highScore));
  }

  const timeSurvived = ((performance.now() - startTime) / 1000).toFixed(1);

  // Build stats HTML
  let statsHTML = '';

  const addStat = (label, value, isRecord) => {
    const cls = isRecord ? 'stat-value record' : 'stat-value';
    statsHTML += `<div class="stat-row"><span class="stat-label">${label}</span><span class="${cls}">${value}</span></div>`;
  };

  addStat('Score', finalScore, isNewRecord);
  addStat('Poissons mangés', totalFishEaten, false);
  addStat('Taille max', TIER_NAMES[maxTierReached], false);
  addStat('Profondeur max', depthLevel > 1 ? `Profondeur ${maxDepthReached}` : 'Surface', false);
  if (bestFrenzy > 0) addStat('Meilleur Frenzy', `x${bestFrenzy}`, false);
  addStat('Temps', `${timeSurvived}s`, false);

  // Motivational message
  let motivMsg = '';
  if (isNewRecord) {
    motivMsg = `<div style="color:#ffcc00;font-weight:700;margin-bottom:8px;font-size:16px;text-shadow:0 0 12px rgba(255,200,0,.4)">🏆 Nouveau record !</div>`;
  } else if (player && player.tier < TIER_COUNT - 1) {
    const remaining = TIER_THRESHOLDS[player.tier] - player.eaten;
    if (remaining <= 3 && remaining > 0) {
      motivMsg = `<div style="color:#80e0ff;font-weight:600;margin-bottom:8px;font-size:14px">${remaining} poisson${remaining > 1 ? 's' : ''} de plus et tu montais de tier !</div>`;
    }
  }
  if (maxTierReached > 1 && !motivMsg) {
    const prevMax = parseInt(localStorage.getItem('deepfeed_maxTier') || '1', 10);
    if (maxTierReached > prevMax) {
      motivMsg = `<div style="color:#80e0ff;font-weight:600;margin-bottom:8px;font-size:14px">Tu as débloqué : ${ZONE_NAMES[maxTierReached]} !</div>`;
    }
  }
  if (!motivMsg) {
    const msgs = ['Presque ! Encore un essai ?', 'Tu t\'améliores !', 'La prochaine sera la bonne !', 'Plus profond, plus fort !'];
    motivMsg = `<div style="color:rgba(255,255,255,.6);font-weight:500;margin-bottom:8px;font-size:13px">${msgs[Math.floor(Math.random() * msgs.length)]}</div>`;
  }
  // Save max tier for future comparison
  const prevMaxTier = parseInt(localStorage.getItem('deepfeed_maxTier') || '1', 10);
  if (maxTierReached > prevMaxTier) localStorage.setItem('deepfeed_maxTier', String(maxTierReached));

  statsHTML = motivMsg + statsHTML;

  endStatsEl.innerHTML = statsHTML;
  playBtn.textContent = 'Replonger';
  overlay.classList.remove('hidden');
  updateHUD();

  initTitleAmbient();
  titleLastTime = performance.now();
  titleRafId = requestAnimationFrame(titleLoop);
}

// ============================================================
//  GAME LOOP
// ============================================================

let lastTime = 0;
let rafId = null;
let safetyInterval = null;

function loop(timestamp) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  update(dt);
  render();
}

function startLoop() {
  lastTime = performance.now();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);

  if (safetyInterval) clearInterval(safetyInterval);
  safetyInterval = setInterval(() => {
    if (running && !document.hidden) {
      lastTime = performance.now();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }
  }, 2000);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && running) {
    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
});

// ============================================================
//  START / RESTART
// ============================================================

let btnCooldown = false;

playBtn.addEventListener('click', (e) => {
  e.preventDefault();
  if (btnCooldown) return;
  btnCooldown = true;
  setTimeout(() => btnCooldown = false, 500);

  ensureAudio();
  overlay.classList.add('hidden');
  initGame();
  running = true;
  startLoop();
});

playBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  playBtn.click();
}, { passive: false });

// ============================================================
//  TITLE SCREEN AMBIENT ANIMATION
// ============================================================

function initTitleAmbient() {
  titleBubbles = [];
  titlePlancton = [];
  for (let i = 0; i < 8; i++) {
    titleBubbles.push({
      x: Math.random() * W, y: Math.random() * H,
      vy: -0.3 - Math.random() * 0.8,
      size: 1 + Math.random() * 3,
      life: Math.random(), decay: 0.002 + Math.random() * 0.003,
    });
  }
  for (let i = 0; i < 10; i++) {
    titlePlancton.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
      radius: 3 + Math.random() * 3, phase: Math.random() * Math.PI * 2,
    });
  }
}

let titleRafId = null;
let titleLastTime = 0;

function titleLoop(timestamp) {
  if (running) return;
  titleRafId = requestAnimationFrame(titleLoop);
  const dt = Math.min((timestamp - titleLastTime) / 1000, 0.05);
  titleLastTime = timestamp;

  for (let i = titleBubbles.length - 1; i >= 0; i--) {
    const b = titleBubbles[i];
    b.y += b.vy; b.x += Math.sin(b.y * 0.05) * 0.2;
    b.life -= b.decay;
    if (b.life <= 0) { b.x = Math.random() * W; b.y = H + 5; b.life = 1; }
  }
  for (const p of titlePlancton) {
    p.x += p.vx; p.y += p.vy; p.phase += dt * 2;
    if (p.x < 0) p.vx = Math.abs(p.vx);
    if (p.x > W) p.vx = -Math.abs(p.vx);
    if (p.y < 0) p.vy = Math.abs(p.vy);
    if (p.y > H) p.vy = -Math.abs(p.vy);
  }

  ctx.save();
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#1a6090');
  bgGrad.addColorStop(0.5, '#0d4070');
  bgGrad.addColorStop(1, '#062848');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 0.06;
  for (let i = 0; i < 5; i++) {
    const rx = W * (0.15 + i * 0.18);
    const rw = 40 + i * 20;
    const grad = ctx.createLinearGradient(rx, 0, rx, H * 0.7);
    grad.addColorStop(0, '#aaddff');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(rx - rw / 2, 0);
    ctx.lineTo(rx - rw * 1.5, H * 0.7);
    ctx.lineTo(rx + rw * 1.5, H * 0.7);
    ctx.lineTo(rx + rw / 2, 0);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const b of titleBubbles) {
    ctx.globalAlpha = b.life * 0.3;
    ctx.strokeStyle = '#88ccff'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const p of titlePlancton) { drawPlancton(p.x, p.y, p.radius, p.phase, 'surface'); }
  ctx.restore();
}

initTitleAmbient();
titleLastTime = performance.now();
titleRafId = requestAnimationFrame(titleLoop);

if (highScore > 0) highScoreEl.textContent = `Best: ${highScore}`;

// ============================================================
//  TESTS (run with ?test URL param)
// ============================================================

if (new URLSearchParams(window.location.search).has('test')) {
  const results = [];
  let passed = 0, failed = 0;

  function assert(name, condition) {
    if (condition) {
      passed++;
      results.push(`✓ ${name}`);
    } else {
      failed++;
      results.push(`✗ FAIL: ${name}`);
    }
  }

  // Setup test state
  player = createPlayer();
  gameTime = 0;
  graceTimer = 0;
  timeSinceLastHit = 0;

  // Test: chooseTier returns valid tiers
  for (let i = 0; i < 50; i++) {
    const t = chooseTier(2, 10);
    assert(`chooseTier returns valid tier (got ${t})`, t >= 0 && t < TIER_COUNT);
  }

  // Test: chooseTier respects grace period — predators reduced
  graceTimer = 3;
  let predatorCountGrace = 0;
  for (let i = 0; i < 200; i++) {
    const t = chooseTier(2, 30);
    if (t > 2) predatorCountGrace++;
  }
  graceTimer = 0;
  let predatorCountNormal = 0;
  for (let i = 0; i < 200; i++) {
    const t = chooseTier(2, 30);
    if (t > 2) predatorCountNormal++;
  }
  assert(`Grace period reduces predators (grace=${predatorCountGrace} < normal=${predatorCountNormal})`,
    predatorCountGrace < predatorCountNormal);

  // Test: timePressure calculation at various elapsed times
  // At elapsed=0: timePressure = 0, at elapsed=40: timePressure = 1, at elapsed=120: timePressure = 3
  assert('timePressure at 0s = 0', Math.min(3, 0 / 40) === 0);
  assert('timePressure at 40s = 1', Math.min(3, 40 / 40) === 1);
  assert('timePressure at 80s = 2', Math.min(3, 80 / 40) === 2);
  assert('timePressure at 120s = 3 (capped)', Math.min(3, 120 / 40) === 3);
  assert('timePressure at 200s = 3 (still capped)', Math.min(3, 200 / 40) === 3);

  // Test: Player glow ring oscillation math (white-gold permanent ring)
  const t1 = 0;
  const t2 = 1; // 1 second offset
  const glow1 = 0.55 + 0.2 * Math.sin(t1 * 3);
  const glow2 = 0.55 + 0.2 * Math.sin(t2 * 3);
  assert('Glow oscillation min >= 0.35', glow1 >= 0.35);
  assert('Glow oscillation max <= 0.75', glow1 <= 0.75 && glow2 <= 0.75);
  assert('Glow oscillation varies', Math.abs(glow1 - glow2) > 0.01);

  // Test: Radius oscillation
  const radOsc1 = 1 + 0.04 * Math.sin(0);
  const radOsc2 = 1 + 0.04 * Math.sin(1);
  assert('Radius oscillation centered at 1', radOsc1 === 1);
  assert('Radius oscillation range ±0.04', Math.abs(radOsc2 - 1) <= 0.04 + 1e-10);

  // Test: createPlayer has targetRadius
  const testPlayer = createPlayer();
  assert('createPlayer has targetRadius', testPlayer.targetRadius === testPlayer.radius);

  // Test: Grace period timer would reduce predator spawns
  graceTimer = 2;
  const graceMultTest = graceTimer > 0 ? 0.3 : 1;
  assert('Grace multiplier = 0.3 when active', graceMultTest === 0.3);
  graceTimer = 0;
  const noGraceMultTest = graceTimer > 0 ? 0.3 : 1;
  assert('Grace multiplier = 1 when inactive', noGraceMultTest === 1);

  // Test: Adaptive danger kicks in after threshold (toned down)
  timeSinceLastHit = 15;
  assert('No adaptive range bonus at 15s', (timeSinceLastHit > 20 ? 0.2 : 0) === 0);
  timeSinceLastHit = 25;
  assert('Adaptive range bonus at 25s', (timeSinceLastHit > 20 ? 0.2 : 0) === 0.2);
  timeSinceLastHit = 25;
  assert('Adaptive speed bonus at 25s', (timeSinceLastHit > 20 ? 1.1 : 1) === 1.1);
  timeSinceLastHit = 35;
  assert('Adaptive spawn at 35s (>30)', timeSinceLastHit > 30);
  timeSinceLastHit = 0;

  // Test: Tier-up triggers celebration state
  tierUpFlashTimer = 0.3;
  assert('Tier-up flash timer set', tierUpFlashTimer === 0.3);
  tierUpRingAlpha = 0.7;
  tierUpRingRadius = 20;
  assert('Tier-up ring initialized', tierUpRingAlpha > 0 && tierUpRingRadius > 0);

  // Test: playTierUp is a function
  assert('playTierUp function exists', typeof playTierUp === 'function');

  // Test: Idle drift moves player when pointer inactive
  {
    const tp = createPlayer();
    player = tp;
    pointer.active = false;
    const startX = tp.x, startY = tp.y;
    tp.angle = 0; // facing right
    // Simulate idle drift
    const idleSpeed = PLAYER_BASE_SPEED * 0.4;
    const idleMove = idleSpeed * (60 * 0.016); // ~1 frame
    tp.x += Math.cos(tp.angle) * idleMove;
    tp.y += Math.sin(tp.angle) * idleMove;
    assert('Idle drift moves player X', tp.x > startX);
    assert('Idle drift Y unchanged when angle=0', Math.abs(tp.y - startY) < 0.01);
  }

  // Test: Chase timer expires and predator stops chasing
  {
    const predator = createFish(3, true);
    predator.chaseTimer = 0.1; // almost expired
    predator.chaseTimer -= 0.15; // simulate dt
    assert('Chase timer expires below 0', predator.chaseTimer <= 0);
    predator.chaseCooldown = 3;
    assert('Chase cooldown set after timeout', predator.chaseCooldown === 3);
  }

  // Test: Max chaser cap works (max 3)
  {
    let chaserCount = 0;
    const maxChasers = 3;
    const testPredators = [1, 2, 3, 4, 5];
    const chasing = [];
    for (const p of testPredators) {
      if (chaserCount < maxChasers) {
        chasing.push(p);
        chaserCount++;
      }
    }
    assert('Max chaser cap limits to 3', chasing.length === 3);
    assert('4th predator not chasing', !chasing.includes(4));
  }

  // Test: Difficulty wave oscillates between 0.7 and 1.0
  {
    const samples = [];
    for (let t = 0; t < 100; t += 0.5) {
      samples.push(0.7 + 0.3 * Math.sin(t * 0.15));
    }
    const minWave = Math.min(...samples);
    const maxWave = Math.max(...samples);
    assert('Difficulty wave min >= 0.4 (0.7-0.3)', minWave >= 0.39);
    assert('Difficulty wave max <= 1.0', maxWave <= 1.001);
    assert('Difficulty wave varies', maxWave - minWave > 0.5);
  }

  // Test: Post-eat pulse pushes nearby predators
  {
    player = createPlayer();
    player.tier = 2;
    player.x = 200; player.y = 200;
    const nearPred = { x: 250, y: 200, alive: true, tier: 3, radius: 30 };
    const farPred = { x: 500, y: 200, alive: true, tier: 3, radius: 30 };
    const origNearX = nearPred.x;
    const origFarX = farPred.x;
    // Simulate pulse
    const testFishes = [nearPred, farPred];
    for (const pf of testFishes) {
      if (!pf.alive || pf.tier <= player.tier) continue;
      const pdx = pf.x - player.x, pdy = pf.y - player.y;
      const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
      if (pdist < 120 && pdist > 0) {
        pf.x += (pdx / pdist) * 30;
        pf.y += (pdy / pdist) * 30;
      }
    }
    assert('Post-eat pulse pushes near predator', nearPred.x > origNearX);
    assert('Post-eat pulse does not affect far predator', farPred.x === origFarX);
  }

  // Reset test state
  tierUpFlashTimer = 0;
  tierUpRingAlpha = 0;
  tierUpRingRadius = 0;
  player = null;

  // Output results
  console.log(`\n=== Deep Feed Tests: ${passed} passed, ${failed} failed ===`);
  results.forEach(r => console.log(r));
  if (failed > 0) console.error(`${failed} test(s) FAILED`);
}
