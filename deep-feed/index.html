function initTitleAmbient() {
  titleBubbles = [];
  titlePlancton = [];
  for (let i = 0; i < 8; i++) {
    titleBubbles.push({
      x: Math.random() * W, y: Math.random() * H,
      vy: -0.3 - Math.random() * 0.8,
      size: 1 + Math.random() * 3,
      life: Math.random(), decay: 0.002 + Math.random() * 0.003,
    });
  }
  for (let i = 0; i < 10; i++) {
    titlePlancton.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
      radius: 3 + Math.random() * 3, phase: Math.random() * Math.PI * 2,
    });
  }
}

let titleRafId = null;
let titleLastTime = 0;

function titleLoop(timestamp) {
  if (running) return;
  titleRafId = requestAnimationFrame(titleLoop);
  const dt = Math.min((timestamp - titleLastTime) / 1000, 0.05);
  titleLastTime = timestamp;

  for (let i = titleBubbles.length - 1; i >= 0; i--) {
    const b = titleBubbles[i];
    b.y += b.vy; b.x += Math.sin(b.y * 0.05) * 0.2;
    b.life -= b.decay;
    if (b.life <= 0) { b.x = Math.random() * W; b.y = H + 5; b.life = 1; }
  }
  for (const p of titlePlancton) {
    p.x += p.vx; p.y += p.vy; p.phase += dt * 2;
    if (p.x < 0) p.vx = Math.abs(p.vx);
    if (p.x > W) p.vx = -Math.abs(p.vx);
    if (p.y < 0) p.vy = Math.abs(p.vy);
    if (p.y > H) p.vy = -Math.abs(p.vy);
  }

  ctx.save();
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#1a6090');
  bgGrad.addColorStop(0.5, '#0d4070');
  bgGrad.addColorStop(1, '#062848');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.globalAlpha = 0.06;
  for (let i = 0; i < 5; i++) {
    const rx = W * (0.15 + i * 0.18);
    const rw = 40 + i * 20;
    const grad = ctx.createLinearGradient(rx, 0, rx, H * 0.7);
    grad.addColorStop(0, '#aaddff');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(rx - rw / 2, 0);
    ctx.lineTo(rx - rw * 1.5, H * 0.7);
    ctx.lineTo(rx + rw * 1.5, H * 0.7);
    ctx.lineTo(rx + rw / 2, 0);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const b of titleBubbles) {
    ctx.globalAlpha = b.life * 0.3;
    ctx.strokeStyle = '#88ccff'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const p of titlePlancton) { drawPlancton(p.x, p.y, p.radius, p.phase, 'surface'); }
  ctx.restore();
}

    // Simulate half-time (0.15s elapsed)
    tierUpSizeLerpTimer -= 0.15;
    const t = 1 - (tierUpSizeLerpTimer / 0.3);
    const ease = 1 - Math.pow(1 - t, 3);
    player.radius = tierUpSizeLerpFrom + (player.targetRadius - tierUpSizeLerpFrom) * ease;
    assert('Size lerp timer at half > old', player.radius > oldR);
    assert('Size lerp timer at half < new', player.radius < newR);
    // Simulate full time
    tierUpSizeLerpTimer = 0;
    player.radius = player.targetRadius;
    assert('Size lerp timer at end equals target', player.radius === newR);
    tierUpSizeLerpTimer = 0;
  }

  // Test: Golden flash timer decreases correctly (0.3s)
  {
    tierUpFlashTimer = 0.3;
    const prevFlash = tierUpFlashTimer;
    tierUpFlashTimer = Math.max(0, tierUpFlashTimer - 0.1);
    assert('Flash timer decreases', tierUpFlashTimer < prevFlash);
    tierUpFlashTimer = 0.05;
    tierUpFlashTimer = Math.max(0, tierUpFlashTimer - 0.1);
    assert('Flash timer clamps to 0', tierUpFlashTimer === 0);
  }

  // Test: Tier-up during frenzy doesn't crash (state coexistence)
  {
    frenzyActive = true;
    frenzyTimer = 3;
    tierUpSlowmoTimer = TIERUP_SLOWMO_DURATION;
    tierUpSizeLerpTimer = 0.3;
    tierUpFlashTimer = 0.3;
    tierUpTextTimer = 1.5;
    tierUpTextAlpha = 1;
    const frenzyWouldOverride = frenzyTimer < 3.5 && tierUpSlowmoTimer <= 0;
    assert('Frenzy does not override tier-up slowmo while active', !frenzyWouldOverride);
    frenzyActive = false;
    frenzyTimer = 0;
    tierUpSlowmoTimer = 0;
    tierUpSizeLerpTimer = 0;
    slowmoScale = 1;
  }

  // ---- Sprint 3: Dynamic Difficulty System Tests ----

  // Test: timePressure calculation at various elapsed times
  assert('timePressure at 0s = 0', Math.min(3, 0 / 40) === 0);
  assert('timePressure at 40s = 1', Math.min(3, 40 / 40) === 1);
  assert('timePressure at 80s = 2', Math.min(3, 80 / 40) === 2);
  assert('timePressure at 120s = 3 (capped)', Math.min(3, 120 / 40) === 3);

  // Test: Grace period shimmer fades correctly over 3 seconds
  {
    // graceTimer = 3: full shimmer
    const alpha3 = Math.min(1, 3 / 1.5) * 0.25;
    assert('Grace shimmer alpha at 3s = 0.25 (full)', Math.abs(alpha3 - 0.25) < 0.01);
    // graceTimer = 1: fading
    const alpha1 = Math.min(1, 1 / 1.5) * 0.25;
    assert('Grace shimmer alpha at 1s is reduced', alpha1 < 0.25 && alpha1 > 0);
    // graceTimer = 0: no shimmer
    const alpha0 = Math.min(1, 0 / 1.5) * 0.25;
    assert('Grace shimmer alpha at 0s = 0', alpha0 === 0);
  }

  // Test: Grace period reduces BOTH spawn weight AND detection range
  {
    graceTimer = 2;
    const graceSpawnMult = graceTimer > 0 ? 0.3 : 1;
    const graceDetectMult = graceTimer > 0 ? 0.5 : 1;
    assert('Grace spawn weight multiplier = 0.3', graceSpawnMult === 0.3);
    assert('Grace detect range multiplier = 0.5', graceDetectMult === 0.5);
    graceTimer = 0;
    const noGraceSpawn = graceTimer > 0 ? 0.3 : 1;
    const noGraceDetect = graceTimer > 0 ? 0.5 : 1;
    assert('No grace: spawn weight = 1', noGraceSpawn === 1);
    assert('No grace: detect range = 1', noGraceDetect === 1);
  }

  // Test: Within-tier progression spawns change at 50% and 80% thresholds
  {
    player = createPlayer();
    player.tier = 2;
    hasFirstTierUp = true;
    difficultyWave = 1;
    graceTimer = 0;

    // Test at 0% progress
    player.eaten = 0;
    let predCountLow = 0;
    for (let i = 0; i < 300; i++) {
      const t = chooseTier(2, 30);
      if (t > 2) predCountLow++;
    }

    // Test at 60% progress (>50%)
    player.eaten = Math.ceil(TIER_THRESHOLDS[2] * 0.6);
    let predCountMid = 0;
    for (let i = 0; i < 300; i++) {
      const t = chooseTier(2, 30);
      if (t > 2) predCountMid++;
    }

    // Test at 90% progress (>80%)
    player.eaten = Math.ceil(TIER_THRESHOLDS[2] * 0.9);
    let predCountHigh = 0;
    for (let i = 0; i < 300; i++) {
      const t = chooseTier(2, 30);
      if (t > 2) predCountHigh++;
    }

    assert('Predator spawns increase at 50% progress', predCountMid > predCountLow);
    assert('Predator spawns increase further at 80% progress', predCountHigh > predCountMid);
    player.eaten = 0;
  }

  // Test: Adaptive danger kicks in at correct thresholds (6s, 10s, 15s)
  {
    timeSinceLastHit = 5;
    assert('No detect bonus at 5s (<6s)', (timeSinceLastHit > 6 ? 0.15 : 0) === 0);
    timeSinceLastHit = 7;
    assert('Detect bonus at 7s (>6s)', (timeSinceLastHit > 6 ? 0.15 : 0) === 0.15);
    timeSinceLastHit = 11;
    assert('Predator spawn at 11s (>10s)', timeSinceLastHit > 10);
    timeSinceLastHit = 16;
    assert('Chase speed bonus at 16s (>15s)', (timeSinceLastHit > 15 ? 1.1 : 1) === 1.1);
    timeSinceLastHit = 9;
    assert('No chase speed bonus at 9s (<15s)', (timeSinceLastHit > 15 ? 1.1 : 1) === 1);
    timeSinceLastHit = 0;
  }

  // Test: Adaptive danger resets when player takes damage
  {
    timeSinceLastHit = 20;
    adaptiveDangerSpawned = true;
    // Simulate taking damage (same as in canHurt/canBump code)
    timeSinceLastHit = 0;
    adaptiveDangerSpawned = false;
    assert('Adaptive danger timer resets on damage', timeSinceLastHit === 0);
    assert('Adaptive danger spawn flag resets on damage', adaptiveDangerSpawned === false);
  }

  // Test: Difficulty wave oscillation produces values in correct range (0.6-1.0)
  {
    const waveSamples = [];
    for (let t = 0; t < 200; t += 0.3) {
      waveSamples.push(0.6 + 0.4 * Math.sin(t * 0.2));
    }
    const wMin = Math.min(...waveSamples);
    const wMax = Math.max(...waveSamples);
    assert('Wave min >= 0.2', wMin >= 0.19);
    assert('Wave max <= 1.0', wMax <= 1.001);
    assert('Wave range spans 0.6→1.0', wMax - wMin > 0.75);
  }

  // Test: All difficulty modifiers are non-negative and within sane bounds
  {
    for (let elapsed = 0; elapsed <= 200; elapsed += 10) {
      const tp = Math.min(3, elapsed / 40);
      assert(`timePressure non-negative at ${elapsed}s`, tp >= 0);
      assert(`timePressure <= 3 at ${elapsed}s`, tp <= 3);

      const detectBonus = tp * 15;
      assert(`detectBonus non-negative at ${elapsed}s`, detectBonus >= 0);
      assert(`detectBonus <= 45 at ${elapsed}s`, detectBonus <= 45);

      const speedBonus = 1 + Math.min(0.15, tp * 0.05);
      assert(`speedBonus >= 1 at ${elapsed}s`, speedBonus >= 1);
      assert(`speedBonus <= 1.15 at ${elapsed}s`, speedBonus <= 1.151);
    }
  }

  // Test: Tier-up micro-freeze duration is brief (0.05-0.08s range)
  {
    assert('Tier-up freeze duration is brief', TIERUP_FREEZE_DURATION >= 0.05 && TIERUP_FREEZE_DURATION <= 0.08);
    assert('Tier-up slow-mo is 0.5-0.6s', TIERUP_SLOWMO_DURATION >= 0.5 && TIERUP_SLOWMO_DURATION <= 0.6);
  }

  // Reset test state
  tierUpFlashTimer = 0;
  tierUpRingAlpha = 0;
  tierUpRingRadius = 0;
  tierUpTextTimer = 0;
  tierUpTextScale = 0;
  tierUpTextAlpha = 0;
  tierUpTextY = 0;
  tierUpSizeLerpTimer = 0;
  tierUpFreezeTimer = 0;
  player = null;

  // Output results
  console.log(`\n=== Deep Feed Tests: ${passed} passed, ${failed} failed ===`);
  results.forEach(r => console.log(r));
  if (failed > 0) console.error(`${failed} test(s) FAILED`);
}

</script>
