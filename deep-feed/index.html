<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Deep Feed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#ui{position:absolute;top:0;left:0;width:100%;pointer-events:none;padding:12px;font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
#score{font-size:24px;font-weight:bold;text-shadow:0 0 8px rgba(0,180,255,.6)}
#highscore{font-size:13px;opacity:.7;margin-top:2px;text-shadow:0 0 6px rgba(0,180,255,.4)}
#combo{font-size:14px;color:#ff0;opacity:0;margin-top:4px;text-shadow:0 0 8px rgba(255,200,0,.6);transition:opacity .2s}
#size-bar-wrap{margin-top:8px;width:140px;height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
#size-bar{height:100%;width:0%;background:linear-gradient(90deg,#0ff,#0f0);border-radius:4px;transition:width .3s}
#boost-wrap{margin-top:6px;width:140px;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
#boost-bar{height:100%;width:100%;background:linear-gradient(90deg,#ff0,#f80);border-radius:3px;transition:width .15s}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,10,30,.85);z-index:10;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;text-align:center}
#overlay h1{font-size:clamp(28px,6vw,52px);margin-bottom:8px;background:linear-gradient(135deg,#0ff,#08f,#0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 0 20px rgba(0,200,255,.4))}
#overlay .sub{font-size:clamp(14px,3vw,20px);opacity:.8;margin-bottom:24px}
#overlay .stats{font-size:16px;margin-bottom:16px;opacity:.7}
#play-btn{pointer-events:all;padding:14px 40px;font-size:clamp(16px,3.5vw,22px);border:2px solid rgba(0,220,255,.6);background:rgba(0,80,120,.4);color:#fff;border-radius:30px;cursor:pointer;transition:all .2s;backdrop-filter:blur(4px)}
#play-btn:hover{background:rgba(0,150,200,.5);border-color:#0ff;box-shadow:0 0 30px rgba(0,220,255,.3)}
#warning{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,0,.3) 100%);transition:opacity .15s}
.mobile-hint{font-size:12px;opacity:.5;margin-top:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score">Score: 0</div>
  <div id="highscore">Best: 0</div>
  <div id="combo"></div>
  <div id="size-bar-wrap"><div id="size-bar"></div></div>
  <div id="boost-wrap"><div id="boost-bar"></div></div>
</div>
<div id="warning"></div>
<div id="overlay">
  <h1>Deep Feed</h1>
  <div class="sub">Eat smaller fish to grow. Bigger fish shrink you!</div>
  <div class="stats" id="end-stats"></div>
  <button id="play-btn">Dive In</button>
  <div class="mobile-hint" id="hint"></div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const C = $('c'), ctx = C.getContext('2d');
const overlay = $('overlay'), playBtn = $('play-btn'), scoreEl = $('score');
const highEl = $('highscore'), sizeBar = $('size-bar'), boostBar = $('boost-bar');
const warningEl = $('warning'), endStats = $('end-stats'), hintEl = $('hint');
const comboEl = $('combo');

let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  C.width = W * dpr; C.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const isMobile = 'ontouchstart' in window;
hintEl.textContent = isMobile ? 'Drag to swim \u2022 Double-tap to dash' : 'Mouse to swim \u2022 Click/hold to boost';

// Audio — lazy init on first user gesture
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur, type, vol, detune) {
  if (!audioCtx) return;
  const g = audioCtx.createGain();
  const o = audioCtx.createOscillator();
  o.type = type || 'sine';
  o.frequency.value = freq;
  if (detune) o.detune.value = detune;
  g.gain.setValueAtTime(vol || .15, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + dur);
}

function bubblePop() { playTone(800 + Math.random() * 400, .08, 'sine', .12); }
function eatSound(big) {
  // Satisfying crunch + ascending tone
  playTone(150, .15, 'square', .12);
  playTone(200, .12, 'sawtooth', .1, -10);
  playTone(350, .1, 'sine', .08);
  playTone(500, .08, 'sine', .06);
  if (big) { playTone(80, .25, 'square', .15); playTone(120, .2, 'sawtooth', .1); }
}
function warnSound() { playTone(120, .3, 'sawtooth', .08); playTone(100, .35, 'square', .06); }
function deathSound() { playTone(60, .5, 'sawtooth', .15); playTone(40, .6, 'square', .1); }
function powerupSound() { playTone(400, .15, 'sine', .12); playTone(600, .15, 'sine', .1); playTone(800, .2, 'sine', .08); }
function dashSound() { playTone(200, .1, 'sawtooth', .08); playTone(300, .08, 'sine', .06); }
function comboSound() { playTone(500, .1, 'sine', .1); playTone(700, .12, 'sine', .08); }

let ambientNode = null, ambientGain = null;
function startAmbient() {
  if (ambientNode || !audioCtx) return;
  ambientGain = audioCtx.createGain();
  ambientGain.gain.value = .04;
  ambientNode = audioCtx.createOscillator();
  ambientNode.type = 'sine';
  ambientNode.frequency.value = 55;
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 120;
  ambientNode.connect(f); f.connect(ambientGain); ambientGain.connect(audioCtx.destination);
  ambientNode.start();
  const n = audioCtx.createOscillator();
  n.type = 'triangle'; n.frequency.value = 38;
  const ng = audioCtx.createGain(); ng.gain.value = .02;
  const lfo = audioCtx.createOscillator(); lfo.frequency.value = .3;
  const lfoG = audioCtx.createGain(); lfoG.gain.value = .015;
  lfo.connect(lfoG); lfoG.connect(ng.gain);
  n.connect(ng); ng.connect(audioCtx.destination);
  n.start(); lfo.start();
}

// Game state
let running = false, gameOver = false;
let score = 0, highScore = parseInt(localStorage.getItem('deepfeed_hi') || '0');
const PLAYER_MIN_SIZE = 6; // game over at this size
const PLAYER_START_SIZE = 14;
let player, fishes, bubbles, seaweeds, particles, powerups, floatingTexts, cam;
let mouseX, mouseY, boosting = false, boostFuel = 1;
let difficulty = 1, warnTimer = 0, lastWarn = 0;
let fishEaten = 0, maxSize = 0;
let comboCount = 0, comboTimer = 0;
let dashCooldown = 0, isDashing = false, dashTimer = 0;
let gracePeriod = 0; // invincibility at start
let gameTime = 0; // seconds since game start
let lastTapTime = 0;
let screenShake = 0, shakeIntensity = 0; // screen shake effect
let camZoom = 1, targetZoom = 1; // auto-zoom
let trailBubbles = []; // player trail bubbles
highEl.textContent = 'Best: ' + highScore;

// Haptic feedback wrapper (not supported on iOS Safari)
function haptic(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
}

// Species definitions — speed now inversely correlates with typical size
const SPECIES = [
  { name: 'minnow', color: '#7ec8e3', accent: '#aee1f5', bodyRatio: 2.8, finSize: .5, speed: 1.2, glow: false },
  { name: 'goldfish', color: '#f4a926', accent: '#ffe066', bodyRatio: 2.2, finSize: .6, speed: .9, glow: false },
  { name: 'clown', color: '#ff6633', accent: '#fff', bodyRatio: 2.4, finSize: .55, speed: 1, glow: false, stripes: true },
  { name: 'angel', color: '#c084fc', accent: '#e9d5ff', bodyRatio: 1.8, finSize: .8, speed: .7, glow: true },
  { name: 'neon', color: '#00ffcc', accent: '#66ffdd', bodyRatio: 3, finSize: .4, speed: 1.4, glow: true },
  { name: 'puffer', color: '#fbbf24', accent: '#fde68a', bodyRatio: 1.5, finSize: .35, speed: .5, glow: false },
  { name: 'barracuda', color: '#94a3b8', accent: '#cbd5e1', bodyRatio: 3.5, finSize: .45, speed: 1.3, glow: false },
  { name: 'lantern', color: '#1e3a5f', accent: '#0ea5e9', bodyRatio: 2.2, finSize: .5, speed: .8, glow: true, lantern: true },
  { name: 'red', color: '#ef4444', accent: '#fca5a5', bodyRatio: 2.5, finSize: .55, speed: 1.1, glow: false },
  { name: 'teal', color: '#14b8a6', accent: '#5eead4', bodyRatio: 2.6, finSize: .5, speed: 1, glow: true },
];

// Power-up types
const POWERUP_TYPES = [
  { name: 'speed', color: '#ffff00', accent: '#fff', icon: '\u26a1', duration: 5, desc: 'Speed Boost!' },
  { name: 'magnet', color: '#ff00ff', accent: '#faf', icon: '\ud83e\uddf2', duration: 6, desc: 'Fish Magnet!' },
  { name: 'shield', color: '#00ffff', accent: '#aff', icon: '\ud83d\udee1\ufe0f', duration: 4, desc: 'Shield!' },
];

// Dynamic player color based on current size
function getPlayerAppearance(size) {
  if (size <= 8) return { color: '#5ec8e3', accent: '#8ee1f5', glow: true }; // pale/small
  if (size <= 14) return { color: '#00ffcc', accent: '#66ffdd', glow: true }; // neon default
  if (size <= 22) return { color: '#00e5a0', accent: '#66ffc8', glow: true }; // stronger green
  if (size <= 35) return { color: '#0af', accent: '#6cf', glow: true }; // electric blue
  if (size <= 50) return { color: '#a855f7', accent: '#d8b4fe', glow: true }; // purple predator
  return { color: '#f43f5e', accent: '#fda4af', glow: true }; // red apex
}

function makeFish(x, y, size, sp, isPlayer) {
  const species = sp || SPECIES[Math.random() * SPECIES.length | 0];
  return {
    x, y, size, species, isPlayer: !!isPlayer,
    vx: 0, vy: 0,
    angle: Math.random() * Math.PI * 2,
    tailPhase: Math.random() * Math.PI * 2,
    finPhase: Math.random() * Math.PI * 2,
    mouthOpen: 0,
    targetX: x + (Math.random() - .5) * 300,
    targetY: y + (Math.random() - .5) * 300,
    wanderTimer: Math.random() * 3,
    alive: true, flash: 0,
    chasing: false,
    fleeing: false,
  };
}

const WORLD_W = 3000, WORLD_H = 2200;

function init() {
  score = 0; fishEaten = 0; difficulty = 1; boostFuel = 1; warnTimer = 0;
  comboCount = 0; comboTimer = 0; dashCooldown = 0; isDashing = false; dashTimer = 0;
  gameTime = 0;
  gracePeriod = 2.5; // 2.5s invincibility at start
  cam = { x: 0, y: 0 };
  camZoom = 1; targetZoom = 1;
  trailBubbles = [];
  player = makeFish(WORLD_W / 2, WORLD_H / 2, 14, SPECIES[4], true);
  player.angle = 0;
  player.activeEffects = {}; // { speed: timeLeft, magnet: timeLeft, shield: timeLeft }
  mouseX = W / 2; mouseY = H / 2;
  fishes = [];
  bubbles = [];
  particles = [];
  powerups = [];
  floatingTexts = [];
  seaweeds = [];
  maxSize = player.size;

  // Spawn initial fish — flood with tiny edible fish for a powerful start
  for (let i = 0; i < 70; i++) spawnFish(true);
  // Seaweed
  for (let i = 0; i < 30; i++) {
    seaweeds.push({
      x: Math.random() * WORLD_W,
      h: 40 + Math.random() * 100,
      segments: 5 + (Math.random() * 6 | 0),
      phase: Math.random() * Math.PI * 2,
      color: `hsl(${120 + Math.random() * 40}, ${50 + Math.random() * 30}%, ${15 + Math.random() * 15}%)`
    });
  }
  // Initial bubbles
  for (let i = 0; i < 20; i++) {
    bubbles.push(makeBubble(Math.random() * WORLD_H));
  }
}

function spawnFish(initialSpawn) {
  let size;
  const r = Math.random();

  if (initialSpawn) {
    // At game start: 85% tiny fish, almost no big ones — feel powerful!
    if (r < .85) size = 3 + Math.random() * 7;      // tiny, easy prey
    else if (r < .97) size = 7 + Math.random() * 5;  // small, still edible
    else size = 14 + Math.random() * 6;               // rare medium fish
  } else {
    // During game: progressively more big fish as difficulty ramps
    const ps = player ? player.size : PLAYER_START_SIZE;
    const dangerChance = Math.min(0.20, difficulty * 0.03); // starts ~3%, caps 20%
    const bigChance = Math.min(0.15, difficulty * 0.025);
    if (r < .50 - dangerChance) size = ps * (.15 + Math.random() * .5);       // clearly edible
    else if (r < .75 - dangerChance) size = ps * (.4 + Math.random() * .5);   // small-ish
    else if (r < 1 - bigChance - dangerChance) size = ps * (.7 + Math.random() * .4); // similar
    else if (r < 1 - dangerChance) size = ps * (1.2 + Math.random() * .6);    // bigger
    else size = ps * (1.5 + Math.random() * Math.min(difficulty, 3));          // dangerous
  }

  // Never spawn at exact player size — nudge away
  if (player) {
    const ps = player.size;
    if (Math.abs(size - ps) < 0.5) {
      size = Math.random() < 0.5 ? ps * 0.85 : ps * 1.2;
    }
  }

  // Spawn outside camera view + safety zone from player
  let x, y, attempts = 0;
  const safeZone = 350; // min distance from player
  do {
    const margin = 200;
    if (Math.random() < .5) {
      x = Math.random() * WORLD_W;
      y = Math.random() < .5 ? -margin : WORLD_H + margin;
    } else {
      x = Math.random() < .5 ? -margin : WORLD_W + margin;
      y = Math.random() * WORLD_H;
    }
    x = Math.max(0, Math.min(WORLD_W, x + (Math.random() - .5) * 400));
    y = Math.max(0, Math.min(WORLD_H, y + (Math.random() - .5) * 400));
    attempts++;
  } while (player && attempts < 10 &&
    Math.sqrt((x - player.x) ** 2 + (y - player.y) ** 2) < safeZone);

  fishes.push(makeFish(x, y, size));
}

function spawnPowerup() {
  const type = POWERUP_TYPES[Math.random() * POWERUP_TYPES.length | 0];
  // Spawn near-ish to player but not on top
  const angle = Math.random() * Math.PI * 2;
  const dist = 300 + Math.random() * 400;
  let x = player.x + Math.cos(angle) * dist;
  let y = player.y + Math.sin(angle) * dist;
  x = Math.max(50, Math.min(WORLD_W - 50, x));
  y = Math.max(50, Math.min(WORLD_H - 50, y));
  powerups.push({
    x, y, type,
    bobPhase: Math.random() * Math.PI * 2,
    life: 12, // disappears after 12s
    size: 12,
    collected: false,
  });
}

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 1, vy: -1.5 });
}

function makeBubble(startY) {
  return {
    x: Math.random() * WORLD_W,
    y: startY != null ? startY : WORLD_H + 10,
    r: 1 + Math.random() * 4,
    speed: .3 + Math.random() * .8,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: .5 + Math.random() * 1.5,
    opacity: .15 + Math.random() * .25
  };
}

// Input
let touchId = null;
function onPointerDown(px, py) {
  ensureAudio(); startAmbient();
  mouseX = px; mouseY = py;

  // Double-tap dash detection
  const now = performance.now();
  if (now - lastTapTime < 350 && dashCooldown <= 0 && running && !gameOver) {
    triggerDash();
  }
  lastTapTime = now;

  boosting = true;
}
function onPointerMove(px, py) { mouseX = px; mouseY = py; }
function onPointerUp() { boosting = false; }

function triggerDash() {
  if (dashCooldown > 0 || !player) return;
  isDashing = true;
  dashTimer = 0.2; // 200ms dash
  dashCooldown = 1.5; // 1.5s cooldown
  dashSound();
  // Burst of speed particles
  spawnParticles(player.x, player.y, player.species.accent, 8);
}

C.addEventListener('mousedown', e => { e.preventDefault(); onPointerDown(e.clientX, e.clientY); });
C.addEventListener('mousemove', e => { onPointerMove(e.clientX, e.clientY); });
C.addEventListener('mouseup', () => onPointerUp());
C.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0]; touchId = t.identifier;
  onPointerDown(t.clientX, t.clientY);
}, { passive: false });
C.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === touchId) onPointerMove(t.clientX, t.clientY);
}, { passive: false });
C.addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (t.identifier === touchId) { onPointerUp(); touchId = null; }
});

// Also listen on play button for touch
playBtn.addEventListener('touchstart', e => { ensureAudio(); }, { passive: true });

// Drawing
function drawFish(f, t) {
  // Dynamic color for player based on current size
  const sp = f.isPlayer ? { ...f.species, ...getPlayerAppearance(f.size) } : f.species;
  const s = f.size;
  const bw = s * sp.bodyRatio;
  const bh = s;

  ctx.save();
  ctx.translate(f.x - cam.x, f.y - cam.y);
  ctx.rotate(f.angle);

  // Flash effect
  if (f.flash > 0) {
    ctx.globalAlpha = .5 + f.flash * .5;
  }

  // Shield effect (player only)
  if (f.isPlayer && player.activeEffects.shield > 0) {
    const shieldGrd = ctx.createRadialGradient(0, 0, s * .8, 0, 0, s * 2.5);
    shieldGrd.addColorStop(0, 'rgba(0,255,255,0)');
    shieldGrd.addColorStop(.7, 'rgba(0,255,255,.08)');
    shieldGrd.addColorStop(1, 'rgba(0,255,255,.15)');
    ctx.fillStyle = shieldGrd;
    ctx.beginPath(); ctx.arc(0, 0, s * 2.5, 0, Math.PI * 2); ctx.fill();
    // Pulsing ring
    ctx.strokeStyle = `rgba(0,255,255,${.2 + Math.sin(t * 6) * .1})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, s * 2, 0, Math.PI * 2); ctx.stroke();
  }

  // Grace period glow (start invincibility)
  if (f.isPlayer && gracePeriod > 0) {
    ctx.globalAlpha = .5 + Math.sin(t * 10) * .3;
  }

  // Glow
  if (sp.glow || (f.isPlayer && player.activeEffects.speed > 0)) {
    const glowColor = (f.isPlayer && player.activeEffects.speed > 0) ? '#ffff00' : sp.accent;
    const grd = ctx.createRadialGradient(0, 0, s * .5, 0, 0, s * 3);
    grd.addColorStop(0, glowColor + '30');
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, s * 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Edible/dangerous indicator for non-player fish
  if (!f.isPlayer && player && running && !gameOver) {
    const indicatorColor = f.size < player.size ? 'rgba(0,255,80,' : 'rgba(255,40,40,';
    const indicatorAlpha = f.size < player.size ? 0.25 : 0.35;
    ctx.strokeStyle = indicatorColor + indicatorAlpha + ')';
    ctx.lineWidth = Math.max(1.5, s * 0.08);
    ctx.beginPath();
    ctx.ellipse(0, 0, bw * 0.55 + 3, bh + 3, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Subtle glow halo
    const haloGrd = ctx.createRadialGradient(0, 0, bw * 0.4, 0, 0, bw * 0.7);
    haloGrd.addColorStop(0, 'transparent');
    haloGrd.addColorStop(1, indicatorColor + (indicatorAlpha * 0.4) + ')');
    ctx.fillStyle = haloGrd;
    ctx.beginPath();
    ctx.ellipse(0, 0, bw * 0.7, bh * 1.3, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player trail
  if (f.isPlayer) {
    const trailLen = (boosting || isDashing) ? 10 : 4;
    for (let i = trailLen; i > 0; i--) {
      const a = .06 * (1 - i / trailLen);
      ctx.fillStyle = sp.accent + Math.floor(a * 255).toString(16).padStart(2, '0');
      ctx.beginPath();
      ctx.ellipse(-bw * .3 - i * s * .3, 0, s * .5 * (1 - i / trailLen * .5), s * .3 * (1 - i / trailLen * .5), 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (f.isPlayer && gracePeriod > 0) {
    ctx.globalAlpha = .6 + Math.sin(t * 10) * .3;
  }

  const tailSwing = Math.sin(f.tailPhase) * .35;
  const finBob = Math.sin(f.finPhase) * .3;

  // Tail fin
  ctx.fillStyle = sp.accent;
  ctx.beginPath();
  ctx.moveTo(-bw * .4, 0);
  const tailX = -bw * .55;
  const tailY = bh * .8;
  ctx.quadraticCurveTo(tailX + tailSwing * s, -tailY, tailX - s * .3 + tailSwing * s * .5, -tailY * 1.2);
  ctx.lineTo(tailX + tailSwing * s * .3, 0);
  ctx.lineTo(tailX - s * .3 + tailSwing * s * .5, tailY * 1.2);
  ctx.quadraticCurveTo(tailX + tailSwing * s, tailY, -bw * .4, 0);
  ctx.fill();

  // Body
  ctx.fillStyle = sp.color;
  ctx.beginPath();
  ctx.ellipse(0, 0, bw * .5, bh, 0, 0, Math.PI * 2);
  ctx.fill();

  // Belly
  ctx.fillStyle = sp.accent + '40';
  ctx.beginPath();
  ctx.ellipse(0, bh * .2, bw * .4, bh * .6, 0, 0, Math.PI);
  ctx.fill();

  // Stripes (clownfish)
  if (sp.stripes) {
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = s * .15;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * bw * .18, -bh * .9);
      ctx.lineTo(i * bw * .18, bh * .9);
      ctx.stroke();
    }
  }

  // Dorsal fin
  ctx.fillStyle = sp.accent;
  ctx.beginPath();
  ctx.moveTo(bw * .1, -bh * .7);
  ctx.quadraticCurveTo(0, -bh * (1.2 + finBob * .3), -bw * .2, -bh * .7);
  ctx.closePath();
  ctx.fill();

  // Pectoral fins
  const pFinSize = sp.finSize;
  ctx.fillStyle = sp.accent + 'aa';
  ctx.beginPath();
  ctx.moveTo(bw * .05, -bh * .3);
  ctx.quadraticCurveTo(bw * .05 - s * pFinSize * .5, -bh * .3 - s * pFinSize * (1 + finBob * .4), -bw * .1, -bh * .4);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bw * .05, bh * .3);
  ctx.quadraticCurveTo(bw * .05 - s * pFinSize * .5, bh * .3 + s * pFinSize * (1 - finBob * .4), -bw * .1, bh * .4);
  ctx.closePath();
  ctx.fill();

  // Lantern
  if (sp.lantern) {
    const lx = bw * .5 + s * .3;
    const ly = -bh * .8;
    ctx.strokeStyle = sp.accent + '80';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bw * .3, -bh * .5);
    ctx.quadraticCurveTo(bw * .5, -bh * 1.2, lx, ly);
    ctx.stroke();
    const gr = ctx.createRadialGradient(lx, ly, 0, lx, ly, s * .5);
    gr.addColorStop(0, '#0ea5e9');
    gr.addColorStop(.5, '#0ea5e966');
    gr.addColorStop(1, 'transparent');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(lx, ly, s * .5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(lx, ly, s * .12, 0, Math.PI * 2); ctx.fill();
  }

  // Eye
  const eyeX = bw * .25;
  const eyeY = -bh * .2;
  const eyeR = s * .18;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(eyeX + eyeR * .25, eyeY, eyeR * .55, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(eyeX + eyeR * .1, eyeY - eyeR * .2, eyeR * .2, 0, Math.PI * 2); ctx.fill();

  // Mouth
  const mouthOpen = f.mouthOpen || 0;
  ctx.strokeStyle = sp.color === '#1e3a5f' ? '#fff' : '#333';
  ctx.lineWidth = Math.max(1, s * .04);
  ctx.beginPath();
  const mx = bw * .48;
  ctx.moveTo(mx, -bh * .05 - mouthOpen * s * .1);
  ctx.quadraticCurveTo(mx + s * .05, bh * .05, mx, bh * .05 + mouthOpen * s * .1);
  ctx.stroke();

  // Puffer spikes
  if (sp.name === 'puffer') {
    ctx.strokeStyle = sp.color;
    ctx.lineWidth = 1;
    for (let a = 0; a < Math.PI * 2; a += .5) {
      const sx = Math.cos(a) * bw * .5;
      const sy = Math.sin(a) * bh;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx + Math.cos(a) * s * .25, sy + Math.sin(a) * s * .25);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawBubble(b) {
  const sx = b.x - cam.x, sy = b.y - cam.y;
  if (sx < -20 || sx > W + 20 || sy < -20 || sy > H + 20) return;
  ctx.strokeStyle = `rgba(150,220,255,${b.opacity})`;
  ctx.lineWidth = .5;
  ctx.beginPath();
  ctx.arc(sx, sy, b.r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = `rgba(200,240,255,${b.opacity * .5})`;
  ctx.beginPath();
  ctx.arc(sx - b.r * .3, sy - b.r * .3, b.r * .25, 0, Math.PI * 2);
  ctx.fill();
}

function drawSeaweed(sw, t) {
  const baseX = sw.x - cam.x;
  const baseY = WORLD_H - cam.y;
  if (baseX < -60 || baseX > W + 60) return;
  const segH = sw.h / sw.segments;
  ctx.strokeStyle = sw.color;
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  let cx = baseX, cy = baseY;
  for (let i = 0; i < sw.segments; i++) {
    const sway = Math.sin(t * 1.5 + sw.phase + i * .5) * (8 + i * 2);
    cx += sway / sw.segments;
    cy -= segH;
    ctx.lineTo(cx, cy);
  }
  ctx.stroke();
  ctx.fillStyle = sw.color;
  let lx = baseX, ly = baseY;
  for (let i = 0; i < sw.segments; i++) {
    const sway = Math.sin(t * 1.5 + sw.phase + i * .5) * (8 + i * 2);
    lx += sway / sw.segments;
    ly -= segH;
    if (i % 2 === 0) {
      ctx.beginPath();
      ctx.ellipse(lx + (i % 4 === 0 ? 6 : -6), ly, 5, 2.5, (i % 4 === 0 ? .3 : -.3) + Math.sin(t + sw.phase) * .2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawParticle(p) {
  const sx = p.x - cam.x, sy = p.y - cam.y;
  ctx.globalAlpha = p.life;
  ctx.fillStyle = p.color;
  ctx.beginPath();
  ctx.arc(sx, sy, p.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawPowerup(p, t) {
  const sx = p.x - cam.x, sy = p.y - cam.y + Math.sin(t * 3 + p.bobPhase) * 6;
  if (sx < -30 || sx > W + 30 || sy < -30 || sy > H + 30) return;

  // Glow
  const grd = ctx.createRadialGradient(sx, sy, 2, sx, sy, 25);
  grd.addColorStop(0, p.type.color + '60');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.arc(sx, sy, 25, 0, Math.PI * 2); ctx.fill();

  // Circle
  ctx.strokeStyle = p.type.color;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(sx, sy, 12, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = p.type.color + '40';
  ctx.beginPath(); ctx.arc(sx, sy, 12, 0, Math.PI * 2); ctx.fill();

  // Icon
  ctx.font = '14px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(p.type.icon, sx, sy);
}

function drawDangerArrows(t) {
  const vW = W / camZoom, vH = H / camZoom;
  // Show arrows pointing toward off-screen dangerous fish
  for (const f of fishes) {
    if (!f.alive || !f.chasing) continue;
    const sx = f.x - cam.x, sy = f.y - cam.y;
    // Only show for off-screen or edge fish
    const margin = 60;
    if (sx > margin && sx < vW - margin && sy > margin && sy < vH - margin) continue;

    // Arrow on screen edge pointing toward danger
    const px = player.x - cam.x, py = player.y - cam.y;
    const angle = Math.atan2(sy - py, sx - px);
    const edgeX = Math.max(30, Math.min(vW - 30, px + Math.cos(angle) * Math.min(vW, vH) * .4));
    const edgeY = Math.max(30, Math.min(vH - 30, py + Math.sin(angle) * Math.min(vW, vH) * .4));

    const pulse = .5 + Math.sin(t * 8) * .3;
    ctx.save();
    ctx.translate(edgeX, edgeY);
    ctx.rotate(angle);
    ctx.fillStyle = `rgba(255,60,60,${pulse})`;
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-6, -7);
    ctx.lineTo(-6, 7);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 1 + Math.random() * 3,
      life: 1,
      decay: .02 + Math.random() * .03,
      color
    });
  }
}

// Size-based speed: bigger fish are SLOWER (key game design fix)
// gameTime-based ramp: enemies start at 50% speed, reach full speed around 60s
function enemySpeedRamp() {
  return Math.min(1, 0.5 + gameTime / 120);
}
function fishSpeedForSize(size, speciesSpeed) {
  const sizeSpeedFactor = Math.max(0.35, 1.2 - size * 0.015);
  return 20 * speciesSpeed * sizeSpeedFactor * enemySpeedRamp();
}

// Update
function update(dt) {
  if (!running || gameOver) return;
  const t = performance.now() / 1000;

  // Time tracking & difficulty ramp
  gameTime += dt;
  // Difficulty ramps with both time and score
  difficulty = 1 + gameTime / 120 + score / 100; // slow ramp over ~2 min

  // Grace period countdown
  if (gracePeriod > 0) gracePeriod -= dt;

  // Combo timer
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) {
      comboCount = 0;
      comboEl.style.opacity = 0;
    }
  }

  // Dash cooldown
  if (dashCooldown > 0) dashCooldown -= dt;
  if (dashTimer > 0) {
    dashTimer -= dt;
    if (dashTimer <= 0) isDashing = false;
  }

  // Active effects countdown
  for (const key in player.activeEffects) {
    if (player.activeEffects[key] > 0) {
      player.activeEffects[key] -= dt;
      if (player.activeEffects[key] <= 0) delete player.activeEffects[key];
    }
  }

  // Player movement — with finger offset so fish leads ahead of touch point
  let worldMouseX = mouseX / camZoom + cam.x;
  let worldMouseY = mouseY / camZoom + cam.y;
  const rawDx = worldMouseX - player.x;
  const rawDy = worldMouseY - player.y;
  const rawDist = Math.sqrt(rawDx * rawDx + rawDy * rawDy);
  if (isMobile && rawDist > 10) {
    const offsetPx = 35 / camZoom;
    worldMouseX += (rawDx / rawDist) * offsetPx;
    worldMouseY += (rawDy / rawDist) * offsetPx;
  }
  const dx = worldMouseX - player.x;
  const dy = worldMouseY - player.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const targetAngle = Math.atan2(dy, dx);

  let angleDiff = targetAngle - player.angle;
  while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
  while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
  player.angle += angleDiff * Math.min(1, 14 * dt);

  // Player speed: ALWAYS faster than enemies of similar size — this is core to fun
  let baseSpeed = 420 - player.size * 0.5;
  let speed = Math.max(250, baseSpeed);

  // Speed power-up
  if (player.activeEffects.speed > 0) speed *= 1.4;

  // Boost (hold)
  if (boosting && boostFuel > 0) {
    speed *= 1.6;
    boostFuel = Math.max(0, boostFuel - dt * .35);
  } else if (!boosting) {
    boostFuel = Math.min(1, boostFuel + dt * .4); // recharges faster
  }

  // Dash (burst)
  if (isDashing) {
    speed *= 2.5;
  }

  boostBar.style.width = (boostFuel * 100) + '%';

  if (dist > 5) {
    // Direct movement — player fish goes where you point, minimal drift
    const moveAmt = Math.min(speed, dist * 4) * dt;
    const targetVx = Math.cos(player.angle) * moveAmt;
    const targetVy = Math.sin(player.angle) * moveAmt;
    // Very high lerp = instant response, fish goes where you point
    player.vx += (targetVx - player.vx) * .7;
    player.vy += (targetVy - player.vy) * .7;
  }
  player.x += player.vx * dt * 80;
  player.y += player.vy * dt * 80;
  // Very low friction = maintains momentum, feels fast and responsive
  player.vx *= .88;
  player.vy *= .88;

  // Clamp to world
  player.x = Math.max(player.size, Math.min(WORLD_W - player.size, player.x));
  player.y = Math.max(player.size, Math.min(WORLD_H - player.size, player.y));

  // Animate
  const swimSpeed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  player.tailPhase += (4 + swimSpeed * 2) * dt;
  player.finPhase += 3 * dt;

  // Auto-zoom: dezoom as player grows
  targetZoom = Math.max(0.55, 1.0 - (player.size - PLAYER_START_SIZE) * 0.008);
  camZoom += (targetZoom - camZoom) * 1.5 * dt; // smooth transition

  // Camera — accounts for zoom
  const viewW = W / camZoom, viewH = H / camZoom;
  cam.x += (player.x - viewW / 2 - cam.x) * 4 * dt;
  cam.y += (player.y - viewH / 2 - cam.y) * 4 * dt;
  cam.x = Math.max(0, Math.min(WORLD_W - viewW, cam.x));
  cam.y = Math.max(0, Math.min(WORLD_H - viewH, cam.y));

  // Trail bubbles behind player — proportional to speed
  const playerSpeed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  const trailRate = Math.min(1, playerSpeed * 0.15);
  if (Math.random() < trailRate) {
    const backAngle = player.angle + Math.PI;
    const spread = (Math.random() - 0.5) * 0.8;
    const bSize = player.size * 0.5;
    trailBubbles.push({
      x: player.x + Math.cos(backAngle + spread) * bSize,
      y: player.y + Math.sin(backAngle + spread) * bSize,
      r: 1 + Math.random() * 2.5,
      life: 0.6 + Math.random() * 0.4,
      vx: Math.cos(backAngle + spread) * (0.3 + Math.random() * 0.5),
      vy: Math.sin(backAngle + spread) * (0.3 + Math.random() * 0.5) - 0.3,
    });
  }
  for (let i = trailBubbles.length - 1; i >= 0; i--) {
    const tb = trailBubbles[i];
    tb.x += tb.vx; tb.y += tb.vy;
    tb.life -= dt * 1.5;
    if (tb.life <= 0) trailBubbles.splice(i, 1);
  }

  // Warning tracking
  let closestDanger = Infinity;

  // Magnet effect: pull small fish toward player
  const magnetActive = player.activeEffects.magnet > 0;

  // Fish AI
  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i];
    if (!f.alive) { fishes.splice(i, 1); continue; }

    const fdx = player.x - f.x;
    const fdy = player.y - f.y;
    const fdist = Math.sqrt(fdx * fdx + fdy * fdy);

    const canEatPlayer = f.size > player.size;
    const playerCanEat = player.size > f.size;

    // Enemies detect player at shorter range, giving more reaction time
    f.chasing = canEatPlayer && fdist < 280 + f.size * 2;
    f.fleeing = playerCanEat && fdist < 180 + player.size * 2;

    // Magnet pulls edible fish
    if (magnetActive && playerCanEat && fdist < 300) {
      const pullAngle = Math.atan2(fdx, fdy);
      f.vx += Math.cos(pullAngle) * 40 * dt;
      f.vy += Math.sin(pullAngle) * 40 * dt;
      f.fleeing = false; // override flee
    }

    if (f.chasing) {
      // Chase player — BIG fish are SLOW chasers (key fix!)
      const chaseAngle = Math.atan2(fdy, fdx);
      let ad = chaseAngle - f.angle;
      while (ad > Math.PI) ad -= Math.PI * 2;
      while (ad < -Math.PI) ad += Math.PI * 2;
      // Slower turning for big fish
      const turnRate = Math.max(2, 5 - f.size * 0.04);
      f.angle += ad * turnRate * dt;
      // Speed inversely proportional to size, ramps with game time
      const sizeSlowdown = Math.max(0.3, 1.1 - f.size * 0.012);
      const spd = (20 + f.size * .15) * f.species.speed * sizeSlowdown * enemySpeedRamp();
      f.vx += Math.cos(f.angle) * spd * dt;
      f.vy += Math.sin(f.angle) * spd * dt;
      f.mouthOpen = .5 + Math.sin(t * 8) * .3;

      if (canEatPlayer) closestDanger = Math.min(closestDanger, fdist);
    } else if (f.fleeing) {
      const fleeAngle = Math.atan2(-fdy, -fdx);
      let ad = fleeAngle - f.angle;
      while (ad > Math.PI) ad -= Math.PI * 2;
      while (ad < -Math.PI) ad += Math.PI * 2;
      f.angle += ad * 4 * dt;
      // Fleeing fish are a bit slower so player can catch them
      const spd = fishSpeedForSize(f.size, f.species.speed) * 1.2;
      f.vx += Math.cos(f.angle) * spd * dt;
      f.vy += Math.sin(f.angle) * spd * dt;
    } else {
      // Wander
      f.wanderTimer -= dt;
      if (f.wanderTimer <= 0) {
        f.wanderTimer = 2 + Math.random() * 4;
        f.targetX = f.x + (Math.random() - .5) * 500;
        f.targetY = f.y + (Math.random() - .5) * 400;
        f.targetX = Math.max(50, Math.min(WORLD_W - 50, f.targetX));
        f.targetY = Math.max(50, Math.min(WORLD_H - 50, f.targetY));
      }
      const wa = Math.atan2(f.targetY - f.y, f.targetX - f.x);
      let ad = wa - f.angle;
      while (ad > Math.PI) ad -= Math.PI * 2;
      while (ad < -Math.PI) ad += Math.PI * 2;
      f.angle += ad * 2 * dt;
      const spd = fishSpeedForSize(f.size, f.species.speed);
      f.vx += Math.cos(f.angle) * spd * dt;
      f.vy += Math.sin(f.angle) * spd * dt;
    }

    f.vx *= .94;
    f.vy *= .94;
    f.x += f.vx * dt * 35;
    f.y += f.vy * dt * 35;

    // Soft world bounds
    if (f.x < -100) f.vx += 2;
    if (f.x > WORLD_W + 100) f.vx -= 2;
    if (f.y < -100) f.vy += 2;
    if (f.y > WORLD_H + 100) f.vy -= 2;

    f.tailPhase += (3 + Math.abs(f.vx + f.vy) * 1.5) * dt;
    f.finPhase += 2.5 * dt;
    if (f.flash > 0) f.flash -= dt * 3;
    if (!f.chasing) f.mouthOpen *= .9;

    // Collision with player — generous hitbox matching visual body size
    const eatDist = (player.size + f.size) * 1.1;
    if (fdist < eatDist) {
      if (playerCanEat) {
        // Player eats fish — grow +1 unit
        f.alive = false;
        player.size += 1;
        maxSize = Math.max(maxSize, player.size);

        // Score = total fish eaten
        score++;
        fishEaten++;

        // Combo system
        comboCount++;
        comboTimer = 2.5;
        const comboText = comboCount > 1 ? ` x${comboCount}` : '';
        addFloatingText(f.x, f.y, `+1${comboText}`, comboCount > 2 ? '#ff0' : '#fff');

        if (comboCount > 1) {
          comboEl.textContent = `Combo x${comboCount}!`;
          comboEl.style.opacity = 1;
          if (comboCount > 2) comboSound();
        }

        // JUICY eat: burst of particles from eaten fish toward player (suction)
        const eatAngle = Math.atan2(player.y - f.y, player.x - f.x);
        for (let j = 0; j < 12 + f.size; j++) {
          const a = eatAngle + (Math.random() - .5) * 1.5;
          const spd = 2 + Math.random() * 4;
          particles.push({
            x: f.x, y: f.y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            r: 1 + Math.random() * 3,
            life: 1,
            decay: .03 + Math.random() * .03,
            color: f.species.accent
          });
        }
        // Sparkle ring at eat point
        for (let j = 0; j < 8; j++) {
          const a = (j / 8) * Math.PI * 2;
          particles.push({
            x: f.x, y: f.y,
            vx: Math.cos(a) * 3,
            vy: Math.sin(a) * 3,
            r: 2,
            life: .8,
            decay: .04,
            color: '#fff'
          });
        }
        // Brief screen pulse (tiny shake for satisfaction)
        screenShake = .1; shakeIntensity = 3;
        player.mouthOpen = 1;
        eatSound(f.size > 15);
        bubblePop();
        haptic(50);
        setTimeout(() => { if (player) player.mouthOpen = 0; }, 200);
      } else if (canEatPlayer && gracePeriod <= 0) {
        // Shield blocks hit
        if (player.activeEffects.shield > 0) {
          delete player.activeEffects.shield;
          spawnParticles(player.x, player.y, '#0ff', 20);
          addFloatingText(player.x, player.y - 30, 'Shield!', '#0ff');
          f.vx -= fdx * .05;
          f.vy -= fdy * .05;
        } else {
          // Shrink -1 unit, NOT instant death
          player.size -= 1;
          // JUICY hit: big screen shake + red particles burst
          screenShake = .35; shakeIntensity = 12;
          spawnParticles(player.x, player.y, '#ff4444', 20);
          spawnParticles(player.x, player.y, '#ff8800', 10);
          addFloatingText(player.x, player.y - 20, '-1', '#f44');
          warnSound();
          haptic(200);
          // Extra hit sound
          playTone(80, .2, 'square', .15);
          playTone(50, .3, 'sawtooth', .1);
          player.flash = 1;
          warningEl.style.opacity = 1; // flash red vignette
          // Brief invincibility after hit
          gracePeriod = 1.0;
          // Strong knockback away from attacker
          const pushAngle = Math.atan2(-fdy, -fdx);
          player.vx += Math.cos(pushAngle) * 15;
          player.vy += Math.sin(pushAngle) * 15;

          if (player.size <= PLAYER_MIN_SIZE) {
            die();
            return;
          }
        }
      }
    }
  }

  // Screen shake decay
  if (screenShake > 0) screenShake -= dt * 2;

  // Warning effect
  if (closestDanger < 300) {
    const intensity = 1 - closestDanger / 300;
    warningEl.style.opacity = intensity * .5;
    if (t - lastWarn > 1.5) { warnSound(); lastWarn = t; }
  } else {
    warningEl.style.opacity = 0;
  }

  // Maintain fish count — always plenty of fish to eat
  const targetCount = Math.min(65, 40 + difficulty * 4 | 0);
  while (fishes.length < targetCount) spawnFish(false);

  // Spawn power-ups periodically
  if (Math.random() < dt * 0.08 && powerups.length < 3) {
    spawnPowerup();
  }

  // Power-up collection
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.life -= dt;
    if (p.life <= 0 || p.collected) { powerups.splice(i, 1); continue; }
    const pdx = player.x - p.x;
    const pdy = player.y - p.y;
    const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
    if (pdist < player.size + 15) {
      p.collected = true;
      player.activeEffects[p.type.name] = p.type.duration;
      addFloatingText(p.x, p.y - 20, p.type.desc, p.type.color);
      powerupSound();
      spawnParticles(p.x, p.y, p.type.color, 15);
    }
  }

  // Remove far-away fish
  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i];
    const d = Math.abs(f.x - player.x) + Math.abs(f.y - player.y);
    if (d > 2500 && !f.chasing) { fishes.splice(i, 1); }
  }

  // Bubbles
  if (Math.random() < .3) bubbles.push(makeBubble());
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.speed;
    b.x += Math.sin(t * b.wobbleSpeed + b.wobble) * .3;
    if (b.y < -20) { bubbles.splice(i, 1); }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= .96;
    p.vy *= .96;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Floating texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.life -= dt * .8;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  // UI
  scoreEl.textContent = '🐟 ' + score;
  // Size bar shows how far from min size (danger) to max growth
  const sizeRange = maxSize > PLAYER_START_SIZE ? maxSize * 1.5 : 50;
  const sizePercent = Math.max(0, Math.min(100, ((player.size - PLAYER_MIN_SIZE) / (sizeRange - PLAYER_MIN_SIZE)) * 100));
  sizeBar.style.width = sizePercent + '%';
  // Color shifts to red when small
  if (player.size < PLAYER_START_SIZE * 0.7) {
    sizeBar.style.background = 'linear-gradient(90deg,#f44,#f80)';
  } else {
    sizeBar.style.background = 'linear-gradient(90deg,#0ff,#0f0)';
  }
}

function die() {
  gameOver = true;
  running = false;
  deathSound();
  haptic([200, 100, 200]);
  spawnParticles(player.x, player.y, '#ff4444', 30);
  warningEl.style.opacity = 0;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('deepfeed_hi', highScore);
    highEl.textContent = 'Best: ' + highScore;
  }
  endStats.innerHTML = `Fish eaten: ${score} &nbsp;|&nbsp; Max size: ${maxSize.toFixed(0)} &nbsp;|&nbsp; Time: ${Math.floor(gameTime)}s`;
  overlay.querySelector('h1').textContent = 'Eaten!';
  overlay.querySelector('.sub').textContent = 'The deep ocean claims another...';
  playBtn.textContent = 'Try Again';
  overlay.style.display = 'flex';
}

// Render
function render() {
  const t = performance.now() / 1000;
  ctx.clearRect(0, 0, W, H);

  // Screen shake offset
  if (screenShake > 0) {
    const shakeX = (Math.random() - .5) * shakeIntensity * screenShake;
    const shakeY = (Math.random() - .5) * shakeIntensity * screenShake;
    ctx.save();
    ctx.translate(shakeX, shakeY);
  }

  // Apply zoom
  ctx.save();
  ctx.scale(camZoom, camZoom);
  const effW = W / camZoom, effH = H / camZoom;

  // Ocean gradient background
  const bg = ctx.createLinearGradient(0, 0, 0, effH);
  bg.addColorStop(0, '#0a1628');
  bg.addColorStop(.4, '#061224');
  bg.addColorStop(.7, '#040e1a');
  bg.addColorStop(1, '#020810');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, effW, effH);

  // Light rays
  ctx.save();
  ctx.globalAlpha = .03;
  for (let i = 0; i < 5; i++) {
    const rx = (effW * .15 + i * effW * .18) - (cam.x * .1 % (effW * .3));
    ctx.fillStyle = '#4488cc';
    ctx.beginPath();
    ctx.moveTo(rx - 20, 0);
    ctx.lineTo(rx + 30 + i * 10, effH);
    ctx.lineTo(rx - 30 - i * 10, effH);
    ctx.fill();
  }
  ctx.restore();

  // Ocean floor
  const floorY = WORLD_H - cam.y;
  if (floorY < effH + 20) {
    const floorGrad = ctx.createLinearGradient(0, floorY - 30, 0, floorY + 20);
    floorGrad.addColorStop(0, '#0d1520');
    floorGrad.addColorStop(1, '#1a1510');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, floorY - 30, effW, effH - floorY + 50);
    ctx.fillStyle = '#2a2418';
    for (let x = (cam.x * .7 % 40); x < effW; x += 35 + Math.sin(x) * 10) {
      ctx.beginPath();
      ctx.arc(x, floorY - 5 + Math.sin(x * .3) * 4, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Seaweed
  for (const sw of seaweeds) drawSeaweed(sw, t);
  // Bubbles
  for (const b of bubbles) drawBubble(b);
  // Power-ups
  for (const p of powerups) drawPowerup(p, t);

  if (running || gameOver) {
    // Sort fish by size for depth
    const allFish = gameOver ? [...fishes] : [player, ...fishes];
    allFish.sort((a, b) => a.size - b.size);
    for (const f of allFish) {
      const sx = f.x - cam.x, sy = f.y - cam.y;
      const r = f.size * 4;
      if (sx > -r && sx < effW + r && sy > -r && sy < effH + r) {
        drawFish(f, t);
      }
    }

    // Danger arrows for off-screen threats
    if (running) drawDangerArrows(t);
  }

  // Floating texts
  for (const ft of floatingTexts) {
    const sx = ft.x - cam.x, sy = ft.y - cam.y;
    ctx.globalAlpha = ft.life;
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, sx, sy);
    ctx.globalAlpha = 1;
  }

  // Trail bubbles
  for (const tb of trailBubbles) {
    const sx = tb.x - cam.x, sy = tb.y - cam.y;
    ctx.globalAlpha = tb.life * 0.5;
    ctx.strokeStyle = 'rgba(180,230,255,0.6)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(sx, sy, tb.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Particles on top
  for (const p of particles) drawParticle(p);

  // Depth fog
  ctx.fillStyle = 'rgba(2,8,16,.3)';
  ctx.fillRect(0, 0, effW, 30);
  const edgeFog = ctx.createLinearGradient(0, effH - 40, 0, effH);
  edgeFog.addColorStop(0, 'transparent');
  edgeFog.addColorStop(1, 'rgba(2,8,16,.5)');
  ctx.fillStyle = edgeFog;
  ctx.fillRect(0, effH - 40, effW, 40);

  // Dash cooldown indicator (small arc near player)
  if (running && !gameOver && dashCooldown > 0) {
    const px = player.x - cam.x, py = player.y - cam.y;
    const progress = 1 - dashCooldown / 1.5;
    ctx.strokeStyle = `rgba(255,255,0,${.3})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py, player.size * 2.5, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
    ctx.stroke();
  }

  // Close zoom transform
  ctx.restore();

  // Close screen shake transform
  if (screenShake > 0) ctx.restore();
}

// Game loop with robustness
let lastTime = 0;
let loopId = 0;
let safetyInterval = null;

function loop(now) {
  loopId = requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  render();
}

// Visibility change: pause/resume gracefully
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    cancelAnimationFrame(loopId);
    loopId = 0;
  } else {
    if (!loopId) {
      lastTime = performance.now();
      loopId = requestAnimationFrame(loop);
    }
  }
});

// Safety net: restart loop if it stops
function ensureLoop() {
  if (!loopId && !document.hidden) {
    lastTime = performance.now();
    loopId = requestAnimationFrame(loop);
  }
}
safetyInterval = setInterval(ensureLoop, 1000);

let playBtnDebounce = false;
playBtn.addEventListener('click', () => {
  if (playBtnDebounce) return;
  playBtnDebounce = true;
  setTimeout(() => { playBtnDebounce = false; }, 500);
  ensureAudio(); startAmbient();
  overlay.style.display = 'none';
  gameOver = false;
  running = true;
  init();
});
playBtn.addEventListener('touchstart', (e) => {
  ensureAudio();
}, { passive: true });

// Start rendering even on menu
init();
lastTime = performance.now();
loopId = requestAnimationFrame(loop);
</script>
</body>
