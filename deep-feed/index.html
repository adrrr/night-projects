<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Deep Feed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#001020;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}

/* HUD */
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;padding:14px 16px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;z-index:5}
#score-center{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:6}
#score{font-size:28px;font-weight:700;text-shadow:0 2px 8px rgba(0,160,255,.5)}
@keyframes scorePulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
#score.pulse{animation:scorePulse .3s ease}
#highscore{font-size:12px;opacity:.6;margin-top:2px}
#depth-info{font-size:13px;opacity:.7;margin-top:2px;color:#80e0ff}
#size-info{font-size:13px;opacity:.8}
#size-bar-wrap{margin-top:4px;width:130px;height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
#size-bar{height:100%;width:0%;border-radius:4px;transition:width .3s ease}
#boost-wrap{margin-top:5px;width:130px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#boost-bar{height:100%;width:100%;background:linear-gradient(90deg,#ffcc00,#ff8800);border-radius:3px;transition:width .1s}
#oxygen-wrap{margin-top:5px;width:130px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#oxygen-bar{height:100%;width:100%;background:linear-gradient(90deg,#44bbff,#0088ff);border-radius:3px;transition:width .15s}

/* Overlay screens */
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,8,24,.88);z-index:10;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;text-align:center;transition:opacity .4s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(32px,7vw,56px);margin-bottom:6px;background:linear-gradient(135deg,#00e0ff,#0080ff,#00e0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(0,180,255,.4))}
#overlay .sub{font-size:clamp(13px,3vw,18px);opacity:.7;margin-bottom:24px;max-width:300px;line-height:1.4}
#overlay .stats{font-size:15px;margin-bottom:16px;opacity:.65;line-height:1.6}
.play-btn{pointer-events:all;padding:14px 44px;font-size:clamp(16px,3.5vw,22px);font-weight:600;border:2px solid rgba(0,200,255,.5);background:rgba(0,60,100,.4);color:#fff;border-radius:30px;cursor:pointer;transition:all .25s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.play-btn:hover,.play-btn:active{background:rgba(0,120,180,.5);border-color:#0ff;box-shadow:0 0 30px rgba(0,200,255,.3)}
.hint{font-size:11px;opacity:.4;margin-top:12px}

/* End stats card */
#end-stats{max-width:320px;width:90%;margin:0 auto 16px}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.stat-row:last-child{border-bottom:none}
.stat-label{opacity:.5}
.stat-value{font-weight:600}
.stat-value.record{color:#ffcc00;text-shadow:0 0 10px rgba(255,200,0,.4)}

/* Damage vignette */
#vignette{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,.35) 100%);transition:opacity .15s;z-index:4}

/* Prestige flash overlay */
#prestige-flash{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;background:#fff;z-index:8;transition:opacity .3s}

/* Orientation hint */
#orient-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:rgba(255,255,255,.6);background:rgba(0,30,60,.7);padding:8px 16px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .4s;z-index:6;white-space:nowrap}
#orient-hint.visible{opacity:1}

/* Boost button */
#boost-btn{position:absolute;bottom:44px;right:24px;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,200,0,.35);background:radial-gradient(circle,rgba(255,180,0,.2),rgba(200,100,0,.1));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:7;display:none;pointer-events:all;touch-action:none;-webkit-touch-callout:none}
#boost-btn::after{content:'⚡';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;pointer-events:none}
#boost-btn.active{border-color:rgba(255,220,0,.7);background:radial-gradient(circle,rgba(255,200,0,.45),rgba(255,120,0,.25));box-shadow:0 0 20px rgba(255,180,0,.3)}
@keyframes boostPulse{0%{transform:scale(1);box-shadow:0 0 0 rgba(255,200,0,0)}50%{transform:scale(1.08);box-shadow:0 0 20px rgba(255,200,0,.4)}100%{transform:scale(1);box-shadow:0 0 0 rgba(255,200,0,0)}}
#boost-btn.pulse-ready{animation:boostPulse 1.5s ease infinite}
@keyframes boostVibrate{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,1px)}50%{transform:translate(1px,-1px)}75%{transform:translate(-1px,-1px)}}
#boost-btn.vibrating{animation:boostVibrate .05s linear infinite}
#boost-btn.vibrating::after{text-shadow:0 0 12px rgba(255,200,0,.8)}

/* Control zone (mobile) */
#control-zone{position:absolute;bottom:0;left:0;width:100%;height:30%;pointer-events:none;z-index:3;overflow:hidden;display:none}
#control-zone.visible{display:block}

/* Boost vignette tunnel effect */
#boost-vignette{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;z-index:4;transition:opacity .15s}

/* HUD progressive reveal */
#size-group,#boost-group,#oxygen-group{opacity:0;max-height:0;overflow:hidden;transform:translateX(-20px);transition:opacity .5s ease,transform .5s ease,max-height .5s ease;pointer-events:none}
#size-group.revealed,#boost-group.revealed,#oxygen-group.revealed{opacity:1;max-height:60px;transform:translateX(0)}
.bar-label{font-size:12px;opacity:.7;display:flex;align-items:center;gap:4px;margin-top:5px}
.bar-icon{font-size:14px;line-height:1}
.bar-label.pulse{animation:labelPulse .8s ease}
@keyframes labelPulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.15);text-shadow:0 0 8px rgba(255,255,255,.4)}}

#zone-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Segoe UI',system-ui,sans-serif;font-size:clamp(28px,6vw,48px);font-weight:700;color:#fff;text-shadow:0 0 30px rgba(0,180,255,.5);pointer-events:none;opacity:0;transition:opacity .6s;z-index:6;text-align:center}
#zone-text.visible{opacity:1}

#overlay .death-title{font-size:clamp(22px,5vw,36px);margin-bottom:12px;font-weight:700}
#overlay .final-score{font-size:clamp(36px,8vw,64px);font-weight:800;background:linear-gradient(135deg,#00e0ff,#0080ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
#overlay .final-score.record{background:linear-gradient(135deg,#ffcc00,#ff8800);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#overlay .record-badge{color:#ffcc00;font-size:18px;font-weight:700;text-shadow:0 0 12px rgba(255,200,0,.4);margin-bottom:8px}
.fish-summary{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px 0 12px}
.fish-summary-item{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600}
.fish-dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.progress-hint{color:#80e0ff;font-size:14px;font-weight:600;margin-bottom:8px}
.progress-bar-wrap{width:80%;max-width:200px;height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden;margin:0 auto 12px}
.progress-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#00e0ff,#0080ff)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="score-center">
  <div id="score">0</div>
  <div id="highscore"></div>
</div>

<div id="hud">
  <div id="depth-info"></div>
  <div id="size-group">
    <div class="bar-label"><span class="bar-icon">🐟</span> <span id="size-info">Taille: Alevin</span></div>
    <div id="size-bar-wrap"><div id="size-bar"></div></div>
  </div>
  <div id="boost-group">
    <div class="bar-label"><span class="bar-icon">⚡</span> Boost</div>
    <div id="boost-wrap"><div id="boost-bar"></div></div>
  </div>
  <div id="oxygen-group">
    <div class="bar-label"><span class="bar-icon">🫧</span> O₂</div>
    <div id="oxygen-wrap"><div id="oxygen-bar"></div></div>
  </div>
</div>

<div id="vignette"></div>
<div id="prestige-flash"></div>
<div id="orient-hint">Rotate to portrait for a better experience</div>

<div id="boost-btn"></div>
<div id="control-zone"></div>
<div id="boost-vignette"></div>

<div id="zone-text"></div>

<div id="overlay">
  <h1>Deep Feed</h1>
  <div class="sub">Mange les poissons plus petits pour grandir. Évite les gros !</div>
  <div class="stats" id="end-stats"></div>
  <button class="play-btn" id="play-btn">Dive In</button>
  <div class="hint" id="control-hint">Touch &amp; drag to move &bull; Tap ⚡ to boost</div>
</div>

<script>
'use strict';

// ============================================================
//  CONSTANTS & CONFIG
// ============================================================

const TIER_COUNT = 6;
const TIER_NAMES = ['Plancton', 'Alevin', 'Petit', 'Moyen', 'Grand', 'Énorme'];

// Zone names for depth display
const ZONE_NAMES = ['Surface', 'Surface', 'Récif', 'Crépusculaire', 'Abysses', 'Abysses'];

// Base tier colors (Surface defaults — overridden per zone)
const TIER_COLORS = [
  { body: '#88ffff', fin: '#88ffff', eye: '#fff' },  // 0 plancton
  { body: '#66ee66', fin: '#44cc44', eye: '#fff' },  // 1 fry
  { body: '#44aaff', fin: '#2288dd', eye: '#fff' },  // 2 blue
  { body: '#ff9933', fin: '#dd7711', eye: '#fff' },  // 3 orange
  { body: '#ff4444', fin: '#cc2222', eye: '#fff' },  // 4 red
  { body: '#bb55ff', fin: '#9933dd', eye: '#ff0' },  // 5 purple boss
];

// Zone-themed fish palettes — each zone defines alternate colors for food fish
const ZONE_PALETTES = {
  // Surface (tier 1-2): bright tropical
  surface: [
    { body: '#88ffff', fin: '#88ffff', eye: '#fff' },   // plancton - green glow
    { body: '#77ff77', fin: '#55dd55', eye: '#fff' },    // bright green fry
    { body: '#55bbff', fin: '#3399dd', eye: '#fff' },    // sky blue
    { body: '#ff9933', fin: '#dd7711', eye: '#fff' },
    { body: '#ff4444', fin: '#cc2222', eye: '#fff' },
    { body: '#bb55ff', fin: '#9933dd', eye: '#ff0' },
  ],
  // Reef (tier 3): tropical, coral colors
  reef: [
    { body: '#66ffaa', fin: '#44dd88', eye: '#fff' },   // green plancton
    { body: '#ffaa44', fin: '#dd8822', eye: '#fff' },    // clownfish orange
    { body: '#ff66aa', fin: '#dd4488', eye: '#fff' },    // pink reef
    { body: '#44dddd', fin: '#22bbbb', eye: '#fff' },    // teal
    { body: '#ff5555', fin: '#dd3333', eye: '#fff' },
    { body: '#cc66ff', fin: '#aa44dd', eye: '#ff0' },
  ],
  // Twilight (tier 4): pale, eerie
  twilight: [
    { body: '#aaddff', fin: '#88bbdd', eye: '#ddf' },   // pale blue plancton
    { body: '#8899bb', fin: '#667799', eye: '#ddf' },    // steel
    { body: '#aa88cc', fin: '#886aaa', eye: '#ddf' },    // muted purple
    { body: '#77aaaa', fin: '#558888', eye: '#ddf' },    // dull teal
    { body: '#cc6666', fin: '#aa4444', eye: '#ddf' },
    { body: '#9966cc', fin: '#7744aa', eye: '#ff0' },
  ],
  // Abyss (tier 5): bioluminescent, dark bodies with glowing accents
  abyss: [
    { body: '#00ffcc', fin: '#00ddaa', eye: '#0ff' },    // neon plancton
    { body: '#334455', fin: '#223344', eye: '#0ff' },    // dark w/ glow eyes
    { body: '#443355', fin: '#332244', eye: '#f0f' },    // dark purple
    { body: '#224455', fin: '#113344', eye: '#0ff' },    // dark teal
    { body: '#553333', fin: '#442222', eye: '#f44' },    // dark red
    { body: '#442255', fin: '#331144', eye: '#ff0' },    // dark violet
  ],
};

// Base radius per tier (scaled down for mobile)
const TIER_RADIUS = [8, 12, 18, 26, 36, 48];

// Joystick config
const JOYSTICK_DEAD_ZONE = 15;
const JOYSTICK_MAX_RADIUS = 60;
const JOYSTICK_BASE_RADIUS = 40; // visual base circle
const JOYSTICK_KNOB_RADIUS = 18; // visual knob

// Inertia config
const INERTIA_FRICTION = 0.85;
const INERTIA_DURATION = 0.3; // seconds of glide after release

// Tail flick config
const TAIL_FLICK_VELOCITY_THRESHOLD = 8; // px/frame velocity for swipe detection
const TAIL_FLICK_SPEED_MULT = 1.5;
const TAIL_FLICK_DURATION = 0.15; // seconds
const TAIL_FLICK_COOLDOWN = 0.8; // seconds

// Camera zoom-out for large tiers
const CAMERA_ZOOM_T4 = 0.92;
const CAMERA_ZOOM_T5 = 0.85;

// V3: faster progression — target 60-90s runs
const TIER_THRESHOLDS = [5, 3, 6, 10, 15];

// Tier-based scoring: points per tier eaten
const TIER_POINTS = [1, 3, 8, 15, 25, 40];

// Eat feedback scaling per eaten tier (T0–T4)
const EAT_FEEDBACK = [
  { particles: 3, shake: 0.5, scaleBump: 0.05, textSize: 16, haptic: 5 },
  { particles: 6, shake: 2, scaleBump: 0.15, textSize: 20, haptic: 10 },
  { particles: 10, shake: 4, scaleBump: 0.25, textSize: 26, haptic: 15 },
  { particles: 15, shake: 7, scaleBump: 0.35, textSize: 32, haptic: [10,5,20] },
  { particles: 25, shake: 12, scaleBump: 0.5, textSize: 38, haptic: [15,10,30] },
];

// Score milestones
const SCORE_MILESTONES = [50, 100, 250, 500, 1000];

// Enemy speed multiplier per tier
const ENEMY_SPEED = [0.5, 0.7, 0.65, 0.55, 0.5, 0.4];

// Predator chase config
const PREDATOR_DETECT_RANGE = 200;   // base detection range in px
const PREDATOR_CHASE_SPEED_RATIO = 0.70; // 70% of player base speed (without boost)
const PREDATOR_DEPTH_DETECT_BONUS = 30;  // extra detect range per depth level

// Desktop balance: predator speed bonus on non-touch
const DESKTOP_PREDATOR_BUFF = 1.15;

// Oxygen config
const OXYGEN_MAX = 100;
const OXYGEN_DRAIN_RATE = 1.2;        // per second — very slow base drain
const OXYGEN_DEPTH_DRAIN_MULT = 0.15; // extra drain per depth level
const OXYGEN_REFILL_PER_TIER = [8, 15, 20, 25, 30, 35]; // refill on eat by tier

// Prestige config
const PRESTIGE_EXTRA_EATS = 8; // eat 8 more after reaching Huge to prestige
const PRESTIGE_SPEED_BUFF = 0.12; // +12% enemy speed per depth

// Festin (frenzy) config
const FRENZY_WINDOW = 3.0;    // seconds window
const FRENZY_THRESHOLD = 5;   // eats needed
const FRENZY_SLOWMO_DURATION = 0.5;
const FRENZY_SLOWMO_SCALE = 0.3;

// Plancton config
const PLANCTON_TARGET_COUNT = 15;
const MAX_PLANCTON = 25;

const MAX_FISH = 60;
const MAX_PARTICLES = 120;
const MAX_BUBBLES = 40;
const MIN_VISIBLE = 24; // more fish on screen = faster games

// Fish-fish eating config
const FISH_EAT_CHECK_INTERVAL = 10;
const FISH_EAT_GLOBAL_COOLDOWN = 1.0;
const FISH_EAT_PER_FISH_COOLDOWN = 4;

const PLAYER_BASE_SPEED = 4.5;
const BOOST_MULT = 1.7;
const BOOST_MAX = 100;
const BOOST_DRAIN = 1.2;
const BOOST_REGEN = 0.35;

const SHAKE_DECAY = 0.88;

// Reference screen size for radius scaling
const REF_SCREEN = 900;

// Zone background configs
const ZONE_BG = {
  surface: {
    top: '#1a6090', mid: '#0d4070', bot: '#062848',
    rayColor: '#aaddff', rayAlpha: 0.07,
  },
  reef: {
    top: '#0d5a6a', mid: '#0a3a50', bot: '#042030',
    rayColor: '#66ccbb', rayAlpha: 0.05,
  },
  twilight: {
    top: '#0a1a30', mid: '#06102a', bot: '#030818',
    rayColor: '#5566aa', rayAlpha: 0.025,
  },
  abyss: {
    top: '#020610', mid: '#010408', bot: '#000204',
    rayColor: '#223355', rayAlpha: 0.01,
  },
};

// ============================================================
//  DOM REFS
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const playBtn = document.getElementById('play-btn');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highscore');
const depthInfoEl = document.getElementById('depth-info');
const sizeInfoEl = document.getElementById('size-info');
const sizeBarEl = document.getElementById('size-bar');
const boostBarEl = document.getElementById('boost-bar');
const vignetteEl = document.getElementById('vignette');
const endStatsEl = document.getElementById('end-stats');
const oxygenBarEl = document.getElementById('oxygen-bar');
const orientHintEl = document.getElementById('orient-hint');
const prestigeFlashEl = document.getElementById('prestige-flash');
const boostBtnEl = document.getElementById('boost-btn');
const sizeGroupEl = document.getElementById('size-group');
const boostGroupEl = document.getElementById('boost-group');
const oxygenGroupEl = document.getElementById('oxygen-group');
const controlHintEl = document.getElementById('control-hint');
const zoneTextEl = document.getElementById('zone-text');
const scoreCenterEl = document.getElementById('score-center');
const controlZoneEl = document.getElementById('control-zone');
const boostVignetteEl = document.getElementById('boost-vignette');

// ============================================================
//  AUDIO (Web Audio API — lazy init)
// ============================================================

let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playEat(pitchMult) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const pm = pitchMult || 1;
  // Deep bass 'gulp' — satisfying pop (pitch scales with combo)
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(250 * pm, t);
  o.frequency.exponentialRampToValueAtTime(120 * pm, t + 0.08);
  o.frequency.exponentialRampToValueAtTime(200 * pm, t + 0.15);
  o.frequency.exponentialRampToValueAtTime(80 * pm, t + 0.2);
  g.gain.setValueAtTime(0.22, t);
  g.gain.linearRampToValueAtTime(0.18, t + 0.05);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.2);
  // Higher harmonic 'pop' layer
  const o2 = audioCtx.createOscillator();
  const g2 = audioCtx.createGain();
  o2.type = 'sine';
  o2.frequency.setValueAtTime(500 * pm, t);
  o2.frequency.exponentialRampToValueAtTime(300 * pm, t + 0.06);
  g2.gain.setValueAtTime(0.1, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  o2.connect(g2).connect(audioCtx.destination);
  o2.start(t);
  o2.stop(t + 0.1);
  // Soft noise burst for texture
  const bufSize = audioCtx.sampleRate * 0.05;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.2 * (1 - i / bufSize);
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.1, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  noise.connect(ng).connect(audioCtx.destination);
  noise.start(t);
  noise.stop(t + 0.05);
}

function playHurt() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(300, t);
  o.frequency.exponentialRampToValueAtTime(100, t + 0.25);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.3);
}

function playGameOver() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [260, 220, 180, 140].forEach((freq, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t + i * 0.2);
    g.gain.setValueAtTime(0.12, t + i * 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.2 + 0.3);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.2);
    o.stop(t + i * 0.2 + 0.35);
  });
}

function playFrenzy() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // Ascending triumphant arpeggio
  [523, 659, 784, 1047].forEach((freq, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t + i * 0.06);
    g.gain.setValueAtTime(0.15, t + i * 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.2);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.06);
    o.stop(t + i * 0.06 + 0.25);
  });
}

function playPrestige() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // Deep descending sweep with reverb-like tail
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(800, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.6);
  o.frequency.exponentialRampToValueAtTime(400, t + 1.2);
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 1.5);
  // Sub bass
  const sub = audioCtx.createOscillator();
  const sg = audioCtx.createGain();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(50, t);
  sg.gain.setValueAtTime(0.2, t);
  sg.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
  sub.connect(sg).connect(audioCtx.destination);
  sub.start(t);
  sub.stop(t + 0.8);
  // Bubble pops (rising)
  for (let i = 0; i < 5; i++) {
    const bo = audioCtx.createOscillator();
    const bg = audioCtx.createGain();
    bo.type = 'sine';
    const bt = t + 0.3 + i * 0.15;
    bo.frequency.setValueAtTime(1200 + Math.random() * 800, bt);
    bo.frequency.exponentialRampToValueAtTime(600, bt + 0.05);
    bg.gain.setValueAtTime(0.06, bt);
    bg.gain.exponentialRampToValueAtTime(0.001, bt + 0.06);
    bo.connect(bg).connect(audioCtx.destination);
    bo.start(bt);
    bo.stop(bt + 0.07);
  }
}

function playBonk() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.08);
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.1);
}

function playTierUp() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // Celebratory 3-note arpeggio: C5→E5→G5 (distinct from frenzy's 4-note sine)
  // Uses saw+sine layering with crescendo and reverb tail on last note
  const notes = [523, 659, 784]; // C5, E5, G5
  notes.forEach((freq, i) => {
    const vol = 0.18 + i * 0.06; // crescendo: each note louder
    // Warm saw layer
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(freq, t + i * 0.12);
    g.gain.setValueAtTime(vol * 0.5, t + i * 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + (i === 2 ? 0.4 : 0.2));
    // Low-pass filter for warmth
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 2000;
    o.connect(lp).connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.12);
    o.stop(t + i * 0.12 + (i === 2 ? 0.45 : 0.25));
    // Clean sine layer
    const o2 = audioCtx.createOscillator();
    const g2 = audioCtx.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(freq, t + i * 0.12);
    g2.gain.setValueAtTime(vol, t + i * 0.12);
    g2.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + (i === 2 ? 0.4 : 0.2));
    o2.connect(g2).connect(audioCtx.destination);
    o2.start(t + i * 0.12);
    o2.stop(t + i * 0.12 + (i === 2 ? 0.45 : 0.25));
  });
  // Reverb tail on last note: delayed echo at half volume
  const echo = audioCtx.createOscillator();
  const eg = audioCtx.createGain();
  echo.type = 'sine';
  echo.frequency.setValueAtTime(784, t + 0.30);
  eg.gain.setValueAtTime(0.12, t + 0.30);
  eg.gain.exponentialRampToValueAtTime(0.001, t + 0.50);
  echo.connect(eg).connect(audioCtx.destination);
  echo.start(t + 0.30);
  echo.stop(t + 0.50);
  // Sub-bass punch
  const sub = audioCtx.createOscillator();
  const sg = audioCtx.createGain();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(60, t);
  sg.gain.setValueAtTime(0.25, t);
  sg.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  sub.connect(sg).connect(audioCtx.destination);
  sub.start(t);
  sub.stop(t + 0.12);
}

function playZoneSound(zone) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  if (zone === 'reef') {
    // Tropical marimba-like high notes
    [880, 1100, 1320, 880].forEach((freq, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq, t + i * 0.08);
      g.gain.setValueAtTime(0.12, t + i * 0.08);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.15);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + i * 0.08);
      o.stop(t + i * 0.08 + 0.2);
    });
  } else if (zone === 'twilight') {
    // Minor descending chord
    [440, 392, 330, 294].forEach((freq, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(freq, t + i * 0.12);
      g.gain.setValueAtTime(0.1, t + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.3);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + i * 0.12);
      o.stop(t + i * 0.12 + 0.35);
    });
  } else if (zone === 'abyss') {
    // Grave drone + crystalline note
    const drone = audioCtx.createOscillator();
    const dg = audioCtx.createGain();
    drone.type = 'sine';
    drone.frequency.setValueAtTime(55, t);
    dg.gain.setValueAtTime(0.15, t);
    dg.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    drone.connect(dg).connect(audioCtx.destination);
    drone.start(t);
    drone.stop(t + 0.8);
    const crystal = audioCtx.createOscillator();
    const cg = audioCtx.createGain();
    crystal.type = 'sine';
    crystal.frequency.setValueAtTime(2000, t + 0.2);
    cg.gain.setValueAtTime(0.08, t + 0.2);
    cg.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    crystal.connect(cg).connect(audioCtx.destination);
    crystal.start(t + 0.2);
    crystal.stop(t + 0.7);
  }
}

function playMilestone() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // Crystalline 'ching'
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(2400, t);
  o.frequency.exponentialRampToValueAtTime(1800, t + 0.15);
  g.gain.setValueAtTime(0.1, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.25);
}

function playTailFlick() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // Short aquatic swoosh: filtered noise + pitch sweep
  const bufSize = Math.floor(audioCtx.sampleRate * 0.12);
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) {
    const env = Math.exp(-i / (bufSize * 0.3)) * (1 - i / bufSize);
    data[i] = (Math.random() * 2 - 1) * env * 0.3;
  }
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(2000, t);
  filter.frequency.exponentialRampToValueAtTime(800, t + 0.1);
  filter.Q.value = 2;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.18, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  noise.connect(filter).connect(ng).connect(audioCtx.destination);
  noise.start(t);
  noise.stop(t + 0.12);
  // Subtle pitch sweep undertone
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(400, t);
  o.frequency.exponentialRampToValueAtTime(200, t + 0.1);
  g.gain.setValueAtTime(0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.1);
}

function startFestinDrone() {
  if (!audioCtx || festinDroneNode) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(80, audioCtx.currentTime);
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.5);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  festinDroneNode = osc;
  festinDroneGain = gain;
}

function stopFestinDrone() {
  if (festinDroneNode && festinDroneGain) {
    festinDroneGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
    const node = festinDroneNode;
    setTimeout(() => { try { node.stop(); } catch(e) {} }, 600);
    festinDroneNode = null;
    festinDroneGain = null;
  }
}

// ============================================================
//  RESIZE
// ============================================================

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Viewport-based radius scaling: small screens get smaller fish
  if (W < 400) {
    radiusScale = 0.75;
  } else if (W < 500) {
    radiusScale = 0.75 + ((W - 400) / 100) * 0.25; // interpolate 0.75 to 1.0
  } else {
    radiusScale = Math.max(0.6, Math.min(1, Math.min(W, H) / REF_SCREEN));
  }

  // Mobile layout zones
  gameAreaHeight = H * 0.72;
  controlAreaTop = gameAreaHeight;

  if (orientHintEl) {
    const isMobileSize = Math.min(W, H) < 500;
    const isLandscape = W > H * 1.2;
    orientHintEl.classList.toggle('visible', isMobileSize && isLandscape);
  }
  if (zoneDecor) generateZoneDecor();
}
window.addEventListener('resize', resize);
resize();

// ============================================================
//  ZONE HELPERS
// ============================================================

function getZoneForTier(tier) {
  if (tier <= 2) return 'surface';
  if (tier === 3) return 'reef';
  if (tier === 4) return 'twilight';
  return 'abyss';
}

function getZonePalette(zone) {
  return ZONE_PALETTES[zone] || ZONE_PALETTES.surface;
}

function getFishColors(tier, zone) {
  const palette = getZonePalette(zone);
  return palette[tier] || TIER_COLORS[tier];
}

// Lerp hex colors for zone transitions
function lerpColor(a, b, t) {
  const ah = parseInt(a.slice(1), 16);
  const bh = parseInt(b.slice(1), 16);
  const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
  const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
  const rr = Math.round(ar + (br - ar) * t);
  const rg = Math.round(ag + (bg - ag) * t);
  const rb = Math.round(ab + (bb - ab) * t);
  return '#' + ((1 << 24) + (rr << 16) + (rg << 8) + rb).toString(16).slice(1);
}

// ============================================================
//  FISH DRAWING
// ============================================================

function drawFish(x, y, radius, angle, tier, mouthOpen, tailPhase, isPlayer, zone, bodyRatioW, bodyRatioH) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  const c = getFishColors(tier, zone || currentZone);
  const r = radius;
  const rawBodyLen = r * 2.2;
  const rawBodyH = r * 1.1;
  // Per-fish variation + tier-based elongation
  const bw = (bodyRatioW || 1) * (tier >= 3 ? 1.1 : 1);
  const bh = (bodyRatioH || 1) * (tier >= 3 ? 0.95 : 1);
  const bodyLen = rawBodyLen * bw;
  const bodyH = rawBodyH * bh;
  const tailWag = Math.sin(tailPhase) * 0.3;

  // Shadow beneath
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(2, 3, bodyLen * 0.48, bodyH * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tail fin
  ctx.save();
  ctx.translate(-bodyLen * 0.4, 0);
  ctx.rotate(tailWag);
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-r * 0.9, -r * 0.7);
  ctx.quadraticCurveTo(-r * 0.5, 0, -r * 0.9, r * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Body
  ctx.fillStyle = c.body;
  ctx.beginPath();
  ctx.ellipse(0, 0, bodyLen * 0.45, bodyH, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body shine
  const grad = ctx.createRadialGradient(-r * 0.2, -r * 0.3, 0, 0, 0, r * 1.2);
  grad.addColorStop(0, 'rgba(255,255,255,0.25)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, bodyLen * 0.45, bodyH, 0, 0, Math.PI * 2);
  ctx.fill();

  // Player body highlight — white inner gradient overlay (brighter than enemies)
  if (isPlayer) {
    // White inner glow (10-15% opacity)
    const playerGrad = ctx.createRadialGradient(-r * 0.15, -r * 0.25, 0, 0, 0, r * 1.2);
    playerGrad.addColorStop(0, 'rgba(255,255,255,0.15)');
    playerGrad.addColorStop(0.6, 'rgba(255,255,255,0.07)');
    playerGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = playerGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyLen * 0.45, bodyH, 0, 0, Math.PI * 2);
    ctx.fill();

    // Subtle warm shimmer (unique to player)
    const shimmerPhase = typeof gameTime !== 'undefined' ? gameTime : 0;
    const shimmer = 0.04 + 0.03 * Math.sin(shimmerPhase * 4);
    ctx.fillStyle = `rgba(255,230,180,${shimmer})`;
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyLen * 0.45, bodyH, 0, 0, Math.PI * 2);
    ctx.fill();

    // White outline stroke (always visible, unique to player)
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyLen * 0.46, bodyH * 1.01, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Dorsal fin
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(-r * 0.2, -bodyH * 0.85);
  ctx.quadraticCurveTo(r * 0.1, -bodyH * 1.5, r * 0.4, -bodyH * 0.85);
  ctx.closePath();
  ctx.fill();

  // Pectoral fin (bottom)
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(r * 0.05, bodyH * 0.6);
  ctx.quadraticCurveTo(r * 0.1, bodyH * 1.3, -r * 0.3, bodyH * 0.9);
  ctx.closePath();
  ctx.fill();

  // Abyss zone: bioluminescent glow on fish bodies
  if ((zone || currentZone) === 'abyss' && !isPlayer) {
    const bioGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2);
    bioGlow.addColorStop(0, `rgba(100,200,255,0.12)`);
    bioGlow.addColorStop(1, 'rgba(100,200,255,0)');
    ctx.fillStyle = bioGlow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Anglerfish lantern for tier 4-5 in abyss
  if ((zone || currentZone) === 'abyss' && tier >= 4 && !isPlayer) {
    ctx.save();
    const lx = bodyLen * 0.5;
    const ly = -bodyH * 1.2;
    // Stalk
    ctx.strokeStyle = c.fin;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(r * 0.1, -bodyH * 0.8);
    ctx.quadraticCurveTo(lx * 0.8, ly * 0.6, lx, ly);
    ctx.stroke();
    // Lantern glow
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, r * 0.8);
    lg.addColorStop(0, 'rgba(255,255,100,0.6)');
    lg.addColorStop(0.5, 'rgba(255,200,50,0.15)');
    lg.addColorStop(1, 'rgba(255,200,50,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.arc(lx, ly, r * 0.8, 0, Math.PI * 2);
    ctx.fill();
    // Bright dot
    ctx.fillStyle = '#ffffaa';
    ctx.beginPath();
    ctx.arc(lx, ly, r * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Mouth
  if (mouthOpen > 0) {
    ctx.fillStyle = '#331111';
    ctx.beginPath();
    const mx = bodyLen * 0.42;
    const mo = mouthOpen * r * 0.35;
    ctx.ellipse(mx, 0, r * 0.15, mo, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Jaw for larger fish (tier 4+)
  if (tier >= 4 && !isPlayer) {
    ctx.fillStyle = c.fin;
    ctx.beginPath();
    ctx.moveTo(bodyLen * 0.35, bodyH * 0.3);
    ctx.quadraticCurveTo(bodyLen * 0.5, bodyH * 0.65, bodyLen * 0.3, bodyH * 0.5);
    ctx.closePath();
    ctx.fill();
  }

  // Eye (player eyes slightly larger with sparkle glint)
  const eyeX = r * 0.4;
  const eyeY = -r * 0.25;
  const eyeR = r * (isPlayer ? 0.25 : 0.2);
  ctx.fillStyle = c.eye;
  ctx.beginPath();
  ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(eyeX + eyeR * 0.25, eyeY, eyeR * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(eyeX + eyeR * 0.45, eyeY - eyeR * 0.25, eyeR * 0.2, 0, Math.PI * 2);
  ctx.fill();
  // Player sparkle glint — animated twinkle on the eye
  if (isPlayer) {
    const glintPhase = typeof gameTime !== 'undefined' ? gameTime : 0;
    const glintAlpha = 0.5 + 0.5 * Math.sin(glintPhase * 4);
    ctx.fillStyle = `rgba(255,255,255,${glintAlpha})`;
    ctx.beginPath();
    ctx.arc(eyeX + eyeR * 0.15, eyeY - eyeR * 0.4, eyeR * 0.15, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player PERMANENT pulsing glow ring — tier-colored, breathing heartbeat
  if (isPlayer) {
    // Parse tier color for glow
    const tierCol = c.body;
    const _tc = parseInt(tierCol.slice(1), 16);
    const _tr = (_tc >> 16) & 0xff, _tg = (_tc >> 8) & 0xff, _tb = _tc & 0xff;

    // Breathing oscillation: opacity 0.3→0.6→0.3, radius ±3px
    const glowPhase = typeof gameTime !== 'undefined' ? gameTime : 0;
    const breathT = Math.sin(glowPhase * 2.5); // smooth heartbeat
    const glowOpacity = 0.3 + 0.15 * (1 + breathT); // 0.3→0.6
    const glowRadOff = 3 * breathT; // ±3px

    // Outer tier-colored halo
    ctx.shadowColor = `rgba(${_tr},${_tg},${_tb},0.6)`;
    ctx.shadowBlur = 16 + 4 * breathT;
    ctx.strokeStyle = `rgba(${_tr},${_tg},${_tb},${glowOpacity})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyLen * 0.52 + 6 + glowRadOff, bodyH + 6 + glowRadOff, 0, 0, Math.PI * 2);
    ctx.stroke();
    // Thin white inner ring for extra pop
    ctx.shadowColor = 'rgba(255,255,255,0.3)';
    ctx.shadowBlur = 6;
    ctx.strokeStyle = `rgba(255,255,255,${glowOpacity * 0.5})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyLen * 0.52 + 2 + glowRadOff * 0.5, bodyH + 2 + glowRadOff * 0.5, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// ============================================================
//  PLANCTON DRAWING
// ============================================================

function drawPlancton(x, y, radius, phase, zone) {
  const pulse = 0.7 + 0.3 * Math.sin(phase);
  const glowR = radius * 2.5 * pulse;
  const z = zone || currentZone;

  // Zone-specific plancton colors
  let inner, mid, outer;
  if (z === 'abyss') {
    inner = 'rgba(0,255,200,0.6)';
    mid = 'rgba(0,200,180,0.25)';
    outer = 'rgba(0,150,150,0)';
  } else if (z === 'twilight') {
    inner = 'rgba(160,180,255,0.5)';
    mid = 'rgba(120,140,220,0.2)';
    outer = 'rgba(80,100,180,0)';
  } else if (z === 'reef') {
    inner = 'rgba(100,255,180,0.5)';
    mid = 'rgba(80,220,160,0.2)';
    outer = 'rgba(50,180,120,0)';
  } else {
    inner = 'rgba(140,255,255,0.5)';
    mid = 'rgba(100,220,255,0.2)';
    outer = 'rgba(60,180,255,0)';
  }

  const grad = ctx.createRadialGradient(x, y, 0, x, y, glowR);
  grad.addColorStop(0, inner);
  grad.addColorStop(0.4, mid);
  grad.addColorStop(1, outer);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, glowR, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = `rgba(220,255,255,${0.6 + 0.4 * pulse})`;
  ctx.beginPath();
  ctx.arc(x, y, radius * pulse, 0, Math.PI * 2);
  ctx.fill();
}

// ============================================================
//  JELLYFISH DRAWING & MANAGEMENT (twilight zone obstacle)
// ============================================================

function spawnJellyfish() {
  if (jellyfish.length >= 6) return;
  const side = Math.floor(Math.random() * 4);
  let x, y;
  switch (side) {
    case 0: x = -40; y = Math.random() * H; break;
    case 1: x = W + 40; y = Math.random() * H; break;
    case 2: x = Math.random() * W; y = -40; break;
    default: x = Math.random() * W; y = H + 40; break;
  }
  jellyfish.push({
    x, y,
    vx: (Math.random() - 0.5) * 0.5,
    vy: -0.3 + Math.random() * 0.2,
    radius: 18 + Math.random() * 14,
    phase: Math.random() * Math.PI * 2,
    tentaclePhase: Math.random() * Math.PI * 2,
  });
}

function drawJellyfish(j) {
  const pulse = 0.85 + 0.15 * Math.sin(j.phase);
  const r = j.radius * pulse;

  // Glow
  const glow = ctx.createRadialGradient(j.x, j.y, 0, j.x, j.y, r * 3);
  glow.addColorStop(0, 'rgba(180,100,255,0.15)');
  glow.addColorStop(1, 'rgba(180,100,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(j.x, j.y, r * 3, 0, Math.PI * 2);
  ctx.fill();

  // Bell (dome)
  ctx.fillStyle = 'rgba(180,130,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(j.x, j.y, r * 0.8, r * 0.6, 0, Math.PI, 0);
  ctx.fill();

  // Inner glow
  ctx.fillStyle = 'rgba(220,180,255,0.2)';
  ctx.beginPath();
  ctx.ellipse(j.x, j.y - r * 0.1, r * 0.4, r * 0.3, 0, Math.PI, 0);
  ctx.fill();

  // Tentacles
  ctx.strokeStyle = 'rgba(180,130,255,0.3)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const tx = j.x + (i - 2) * r * 0.3;
    const waveOff = Math.sin(j.tentaclePhase + i * 0.8) * 6;
    ctx.beginPath();
    ctx.moveTo(tx, j.y);
    ctx.quadraticCurveTo(tx + waveOff, j.y + r * 0.8, tx - waveOff * 0.5, j.y + r * 1.5);
    ctx.stroke();
  }
}

//  PARTICLE & BUBBLE

function spawnEatParticles(x, y, color, count, magnetic, sizeMin, sizeMax) {
  const sMin = sizeMin || 2;
  const sMax = sizeMax || 6;
  for (let i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      size: sMin + Math.random() * (sMax - sMin),
      color,
      magnetic: magnetic || false,
      magnetTimer: magnetic ? 0.3 : 0,
    });
  }
}

function spawnBubble(x, y) {
  if (bubbles.length >= MAX_BUBBLES) return;
  bubbles.push({
    x: x + (Math.random() - 0.5) * 10,
    y,
    vy: -0.5 - Math.random() * 1.5,
    size: 1 + Math.random() * 3,
    life: 1,
    decay: 0.005 + Math.random() * 0.005,
  });
}

// ============================================================
//  ENEMY FISH
// ============================================================

function createFish(tier, forceEdge, scatterOnScreen) {
  const r = TIER_RADIUS[tier] * radiusScale * (0.85 + Math.random() * 0.3);
  let x, y, angle;

  if (scatterOnScreen) {
    x = r + Math.random() * (W - r * 2);
    y = r + Math.random() * (H - r * 2);
    angle = Math.random() * Math.PI * 2;
  } else if (forceEdge || !player) {
    const side = Math.floor(Math.random() * 4);
    const margin = r * 2;
    switch (side) {
      case 0: x = -margin;          y = Math.random() * H; break;
      case 1: x = W + margin;       y = Math.random() * H; break;
      case 2: x = Math.random() * W; y = -margin; break;
      case 3: x = Math.random() * W; y = H + margin; break;
    }
    const tx = W * (0.2 + Math.random() * 0.6);
    const ty = H * (0.2 + Math.random() * 0.6);
    angle = Math.atan2(ty - y, tx - x);
  } else {
    x = Math.random() * W;
    y = Math.random() * H;
    angle = Math.random() * Math.PI * 2;
  }

  // Speed increases with depth (prestige) + desktop buff
  const depthSpeedMult = 1 + (depthLevel - 1) * PRESTIGE_SPEED_BUFF;
  const desktopBuff = (!isTouch && tier > 0) ? DESKTOP_PREDATOR_BUFF : 1;
  const baseSpeed = (1.2 + Math.random() * 0.8) * ENEMY_SPEED[tier] * depthSpeedMult * desktopBuff;

  return {
    x, y, angle,
    radius: r,
    tier,
    speed: baseSpeed,
    tailPhase: Math.random() * Math.PI * 2,
    mouthOpen: 0,
    alive: true,
    turnTimer: 1 + Math.random() * 3,
    targetAngle: angle,
    fleeing: false,
    fleeTimer: 0,
    eatCooldown: 0,
    sizeBoost: 0,
    chaseTimer: 0,
    chaseCooldown: 0,
    bodyRatioW: 1 + (Math.random() - 0.5) * 0.3, // ±15%
    bodyRatioH: 1 + (Math.random() - 0.5) * 0.3,
  };
}

function chooseTier(playerTier, elapsed) {
  // Don't spawn tier 2+ until the player has had their first tier-up
  const maxSpawnTier = !hasFirstTierUp ? 1 : Math.min(TIER_COUNT - 1, playerTier + 1);

  // Continuous time pressure: scales up to 3x over ~2 minutes
  const timePressure = Math.min(3, elapsed / 40);

  // Grace period after tier-up: 70% reduction in predator spawn weight
  const graceMultiplier = graceTimer > 0 ? 0.3 : 1;

  // Within-tier progression pressure
  const progressRatio = player && playerTier < TIER_COUNT - 1
    ? player.eaten / TIER_THRESHOLDS[playerTier]
    : player ? prestigeEats / PRESTIGE_EXTRA_EATS : 0;

  const weights = [];
  for (let t = 0; t < TIER_COUNT; t++) {
    if (t === 0 || t > maxSpawnTier) { weights.push(0); continue; }
    if (t < playerTier) {
      // Food fish — reduce availability as progress increases
      let w = t === playerTier - 1 ? 4 : 2;
      if (progressRatio > 0.5) w *= 0.7;
      if (progressRatio > 0.8) w *= 0.6; // gauntlet: even fewer easy prey
      weights.push(w);
    } else if (t === playerTier) {
      // Same tier — bump hazards increase with progress
      let w = 1.5;
      if (progressRatio > 0.5) w += 1.5; // more same-tier = more bump hazards
      if (progressRatio > 0.8) w += 1.0; // gauntlet: crowded with same-tier
      weights.push(w);
    } else {
      // Predators — scale with time & progress, reduced by grace & wave
      let w = (0.5 + timePressure * 0.3) * graceMultiplier * difficultyWave;
      // At 50%: start spawning +1 tier fish as threat preview
      if (progressRatio > 0.5) w *= 1.3;
      // At 80%: gauntlet before evolution — significantly more danger
      if (progressRatio > 0.8) w *= 1.8;
      weights.push(w);
    }
  }
  const total = weights.reduce((a, b) => a + b, 0);
  if (total <= 0) return 1;
  let r = Math.random() * total;
  for (let t = 0; t < TIER_COUNT; t++) {
    r -= weights[t];
    if (r <= 0) return t;
  }
  return 1;
}

function createPlayer() {
  const r = TIER_RADIUS[1] * radiusScale;
  // On mobile, center in the game area (top 72%), not the full screen
  const touchDevice = typeof isTouchDevice !== 'undefined' && isTouchDevice;
  const centerY = touchDevice && gameAreaHeight > 0 ? gameAreaHeight * 0.45 : H / 2;
  return {
    x: W / 2,
    y: centerY,
    angle: 0,
    tier: 1,
    radius: r,
    targetRadius: r,   // for smooth lerp on tier-up
    tailPhase: 0,
    mouthOpen: 0,
    eaten: 0,
    totalEaten: 0,
    alive: true,
    invincible: 0,
    flashTimer: 0,
  };
}

// --- Mobile: floating joystick via touch events ---

function updateJoystickFromTouch(tx, ty) {
  const dx = tx - joystick.originX;
  const dy = ty - joystick.originY;
  const dist = Math.sqrt(dx * dx + dy * dy);

  // Clamp to max radius
  const clampedDist = Math.min(dist, JOYSTICK_MAX_RADIUS);
  const angle = Math.atan2(dy, dx);

  joystick.currentX = joystick.originX + Math.cos(angle) * clampedDist;
  joystick.currentY = joystick.originY + Math.sin(angle) * clampedDist;

  // Dead zone
  if (dist < JOYSTICK_DEAD_ZONE) {
    joystick.dx = 0;
    joystick.dy = 0;
    joystick.tilt = 0;
  } else {
    const effectiveDist = clampedDist - JOYSTICK_DEAD_ZONE;
    const maxEffective = JOYSTICK_MAX_RADIUS - JOYSTICK_DEAD_ZONE;
    joystick.tilt = Math.min(1, effectiveDist / maxEffective);
    joystick.dx = Math.cos(angle) * joystick.tilt;
    joystick.dy = Math.sin(angle) * joystick.tilt;
  }
  joystick.angle = angle;
  joystick.glowDir = angle;

  // Track velocity for tail flick detection
  joystickVelocity.x = tx - joystickPrevPos.x;
  joystickVelocity.y = ty - joystickPrevPos.y;
  joystickPrevPos.x = tx;
  joystickPrevPos.y = ty;
}

function releaseJoystick() {
  // Store release position for elastic animation
  joystick.releaseFromX = joystick.currentX - joystick.originX;
  joystick.releaseFromY = joystick.currentY - joystick.originY;
  joystick.releaseAnimT = 1.0;

  // Calculate inertia from current joystick state
  if (joystick.tilt > 0.2 && player) {
    const speed = PLAYER_BASE_SPEED * joystick.tilt;
    playerInertiaVx = Math.cos(joystick.angle) * speed;
    playerInertiaVy = Math.sin(joystick.angle) * speed;
    playerInertiaTimer = INERTIA_DURATION;
  }

  // Check for tail flick (fast swipe on release)
  const swipeVel = Math.sqrt(joystickVelocity.x * joystickVelocity.x + joystickVelocity.y * joystickVelocity.y);
  if (swipeVel > TAIL_FLICK_VELOCITY_THRESHOLD && tailFlickCooldown <= 0) {
    const flickAngle = Math.atan2(joystickVelocity.y, joystickVelocity.x);
    tailFlickActive = true;
    tailFlickTimer = TAIL_FLICK_DURATION;
    tailFlickCooldown = TAIL_FLICK_COOLDOWN;
    tailFlickDirX = Math.cos(flickAngle);
    tailFlickDirY = Math.sin(flickAngle);
    tailFlickSquash = 1.0;
    playTailFlick();
    haptic(20);
    // Bubble trail
    if (player) {
      for (let i = 0; i < 5; i++) spawnBubble(player.x - tailFlickDirX * player.radius, player.y - tailFlickDirY * player.radius);
    }
  }

  joystick.active = false;
  joystick.touchId = -1;
  joystick.dx = 0;
  joystick.dy = 0;
  joystick.tilt = 0;
  pointer.active = false;
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (!running) return;
  ensureAudio();
  for (const touch of e.changedTouches) {
    const tx = touch.clientX;
    const ty = touch.clientY;

    // Only activate joystick in left half, lower portion of screen
    if (joystick.touchId === -1 && tx < W * 0.5 && ty > H * 0.4) {
      isTouch = true;
      joystick.active = true;
      joystick.touchId = touch.identifier;
      joystick.originX = tx;
      joystick.originY = ty;
      joystick.currentX = tx;
      joystick.currentY = ty;
      joystick.dx = 0;
      joystick.dy = 0;
      joystick.tilt = 0;
      joystick.releaseAnimT = 0;
      joystickPrevPos.x = tx;
      joystickPrevPos.y = ty;
      joystickVelocity.x = 0;
      joystickVelocity.y = 0;
      moveTouchId = touch.identifier;
      pointer.active = true;
    } else if (moveTouchId === -1 && joystick.touchId === -1) {
      // Fallback: non-joystick touch for movement (right side or upper area)
      isTouch = true;
      moveTouchId = touch.identifier;
      pointer.x = tx;
      pointer.y = ty - TOUCH_OFFSET_Y;
      pointer.active = true;
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystick.touchId) {
      updateJoystickFromTouch(touch.clientX, touch.clientY);
    } else if (touch.identifier === moveTouchId) {
      pointer.x = touch.clientX;
      pointer.y = touch.clientY - TOUCH_OFFSET_Y;
      pointer.active = true;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystick.touchId) {
      releaseJoystick();
      moveTouchId = -1;
    } else if (touch.identifier === moveTouchId) {
      moveTouchId = -1;
      pointer.active = false;
    }

function circlesOverlap(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  const dist = Math.sqrt(dx * dx + dy * dy);
  return dist < (ar + br) * 0.7;
}

// ============================================================

function checkFrenzy() {
  const now = gameTime;
  // Prune old eats
  while (recentEats.length > 0 && now - recentEats[0] > FRENZY_WINDOW) {
    recentEats.shift();
  }

  if (recentEats.length >= FRENZY_THRESHOLD && !frenzyActive) {
    // Trigger FESTIN — golden time!
    frenzyActive = true;
    frenzyTimer = 4; // 4 seconds of golden time
    frenzyCount = recentEats.length;
    bestFrenzy = Math.max(bestFrenzy, frenzyCount);
    festinPointsAccum = 0;

    // Brief initial slow-mo
    slowmoScale = FRENZY_SLOWMO_SCALE;
    saturationFlash = 1;

    playFrenzy();
    startFestinDrone();
    haptic([20, 10, 20, 10, 40]);
    if (!firstFestinTriggered) {
      firstFestinTriggered = true;
      spawnFloatingText(W / 2, H / 3, 'FESTIN !', '#ffd700', true, 42);
      spawnFloatingText(W / 2, H / 3 + 36, 'Mange vite pour doubler !', '#ffd700', true, 22);
    } else {
      spawnFloatingText(W / 2, H / 3, `FESTIN ×${frenzyCount}`, '#ffd700', true, 42);
    }
    shakeIntensity = 10;
    recentEats = [];
  }
}

    const bodyLen = player.radius * 2.2;
    const bodyH = player.radius * 1.1;
    const cosA = Math.cos(player.angle);

    for (let i = 0; i < 40 && particles.length < MAX_PARTICLES; i++) {
      const a = Math.random() * Math.PI * 2;
      const rx = bodyLen * 0.45 * Math.cos(a);
      const ry = bodyH * Math.sin(a);
      const px = player.x + rx * cosA - ry * sinA;
      const py = player.y + rx * sinA + ry * cosA;
      const pAngle = Math.atan2(py - player.y, px - player.x) + (Math.random() - 0.5) * 0.5;
      const speed = 1 + Math.random() * 2;
      particles.push({
        x: px, y: py,
        vx: Math.cos(pAngle) * speed,
        vy: Math.sin(pAngle) * speed,
        life: 1,
        decay: 0.01 + Math.random() * 0.01, // persist ~1.5s
