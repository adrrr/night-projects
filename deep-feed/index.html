<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Deep Feed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#001020;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}

/* HUD */
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;padding:14px 16px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;z-index:5}
#score{font-size:22px;font-weight:700;text-shadow:0 2px 8px rgba(0,160,255,.5)}
#highscore{font-size:12px;opacity:.6;margin-top:2px}
#depth-info{font-size:13px;opacity:.7;margin-top:2px;color:#80e0ff}
#size-info{margin-top:8px;font-size:13px;opacity:.8}
#size-bar-wrap{margin-top:4px;width:130px;height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
#size-bar{height:100%;width:0%;border-radius:4px;transition:width .3s ease}
#boost-wrap{margin-top:5px;width:130px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#boost-bar{height:100%;width:100%;background:linear-gradient(90deg,#ffcc00,#ff8800);border-radius:3px;transition:width .1s}
#oxygen-wrap{margin-top:5px;width:130px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#oxygen-bar{height:100%;width:100%;background:linear-gradient(90deg,#44bbff,#0088ff);border-radius:3px;transition:width .15s}

/* Overlay screens */
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,8,24,.88);z-index:10;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;text-align:center;transition:opacity .4s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(32px,7vw,56px);margin-bottom:6px;background:linear-gradient(135deg,#00e0ff,#0080ff,#00e0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(0,180,255,.4))}
#overlay .sub{font-size:clamp(13px,3vw,18px);opacity:.7;margin-bottom:24px;max-width:300px;line-height:1.4}
#overlay .stats{font-size:15px;margin-bottom:16px;opacity:.65;line-height:1.6}
.play-btn{pointer-events:all;padding:14px 44px;font-size:clamp(16px,3.5vw,22px);font-weight:600;border:2px solid rgba(0,200,255,.5);background:rgba(0,60,100,.4);color:#fff;border-radius:30px;cursor:pointer;transition:all .25s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.play-btn:hover,.play-btn:active{background:rgba(0,120,180,.5);border-color:#0ff;box-shadow:0 0 30px rgba(0,200,255,.3)}
.hint{font-size:11px;opacity:.4;margin-top:12px}

/* End stats card */
#end-stats{max-width:320px;width:90%;margin:0 auto 16px}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.stat-row:last-child{border-bottom:none}
.stat-label{opacity:.5}
.stat-value{font-weight:600}
.stat-value.record{color:#ffcc00;text-shadow:0 0 10px rgba(255,200,0,.4)}

/* Damage vignette */
#vignette{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,.35) 100%);transition:opacity .15s;z-index:4}

/* Prestige flash overlay */
#prestige-flash{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;background:#fff;z-index:8;transition:opacity .3s}

/* Orientation hint */
#orient-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:rgba(255,255,255,.6);background:rgba(0,30,60,.7);padding:8px 16px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .4s;z-index:6;white-space:nowrap}
#orient-hint.visible{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="score">Score: 0</div>
  <div id="highscore"></div>
  <div id="depth-info"></div>
  <div id="size-info">Size: Tiny</div>
  <div id="size-bar-wrap"><div id="size-bar"></div></div>
  <div id="boost-wrap"><div id="boost-bar"></div></div>
  <div id="oxygen-wrap"><div id="oxygen-bar"></div></div>
</div>

<div id="vignette"></div>
<div id="prestige-flash"></div>
<div id="orient-hint">Rotate to portrait for a better experience</div>

<div id="overlay">
  <h1>Deep Feed</h1>
  <div class="sub">Eat smaller fish to grow bigger. Avoid the big ones!</div>
  <div class="stats" id="end-stats"></div>
  <button class="play-btn" id="play-btn">Dive In</button>
  <div class="hint">Tap &amp; hold to boost</div>
</div>

<script>
'use strict';

// ============================================================
//  CONSTANTS & CONFIG
// ============================================================

const TIER_COUNT = 6;
const TIER_NAMES = ['Plancton', 'Fry', 'Small', 'Medium', 'Large', 'Huge'];

// Zone names for depth display
const ZONE_NAMES = ['Surface', 'Surface', 'Récif', 'Crépusculaire', 'Abysses', 'Abysses'];

// Base tier colors (Surface defaults — overridden per zone)
const TIER_COLORS = [
  { body: '#88ffff', fin: '#88ffff', eye: '#fff' },  // 0 plancton
  { body: '#66ee66', fin: '#44cc44', eye: '#fff' },  // 1 fry
  { body: '#44aaff', fin: '#2288dd', eye: '#fff' },  // 2 blue
  { body: '#ff9933', fin: '#dd7711', eye: '#fff' },  // 3 orange
  { body: '#ff4444', fin: '#cc2222', eye: '#fff' },  // 4 red
  { body: '#bb55ff', fin: '#9933dd', eye: '#ff0' },  // 5 purple boss
];

// Zone-themed fish palettes — each zone defines alternate colors for food fish
const ZONE_PALETTES = {
  // Surface (tier 1-2): bright tropical
  surface: [
    { body: '#88ffff', fin: '#88ffff', eye: '#fff' },   // plancton - green glow
    { body: '#77ff77', fin: '#55dd55', eye: '#fff' },    // bright green fry
    { body: '#55bbff', fin: '#3399dd', eye: '#fff' },    // sky blue
    { body: '#ff9933', fin: '#dd7711', eye: '#fff' },
    { body: '#ff4444', fin: '#cc2222', eye: '#fff' },
    { body: '#bb55ff', fin: '#9933dd', eye: '#ff0' },
  ],
  // Reef (tier 3): tropical, coral colors
  reef: [
    { body: '#66ffaa', fin: '#44dd88', eye: '#fff' },   // green plancton
    { body: '#ffaa44', fin: '#dd8822', eye: '#fff' },    // clownfish orange
    { body: '#ff66aa', fin: '#dd4488', eye: '#fff' },    // pink reef
    { body: '#44dddd', fin: '#22bbbb', eye: '#fff' },    // teal
    { body: '#ff5555', fin: '#dd3333', eye: '#fff' },
    { body: '#cc66ff', fin: '#aa44dd', eye: '#ff0' },
  ],
  // Twilight (tier 4): pale, eerie
  twilight: [
    { body: '#aaddff', fin: '#88bbdd', eye: '#ddf' },   // pale blue plancton
    { body: '#8899bb', fin: '#667799', eye: '#ddf' },    // steel
    { body: '#aa88cc', fin: '#886aaa', eye: '#ddf' },    // muted purple
    { body: '#77aaaa', fin: '#558888', eye: '#ddf' },    // dull teal
    { body: '#cc6666', fin: '#aa4444', eye: '#ddf' },
    { body: '#9966cc', fin: '#7744aa', eye: '#ff0' },
  ],
  // Abyss (tier 5): bioluminescent, dark bodies with glowing accents
  abyss: [
    { body: '#00ffcc', fin: '#00ddaa', eye: '#0ff' },    // neon plancton
    { body: '#334455', fin: '#223344', eye: '#0ff' },    // dark w/ glow eyes
    { body: '#443355', fin: '#332244', eye: '#f0f' },    // dark purple
    { body: '#224455', fin: '#113344', eye: '#0ff' },    // dark teal
    { body: '#553333', fin: '#442222', eye: '#f44' },    // dark red
    { body: '#442255', fin: '#331144', eye: '#ff0' },    // dark violet
  ],
};

// Base radius per tier
const TIER_RADIUS = [7, 14, 22, 34, 50, 72];

// V3: faster progression — target 60-90s runs
const TIER_THRESHOLDS = [5, 3, 6, 10, 15];

// Tier-based scoring: points per tier eaten
const TIER_POINTS = [1, 3, 8, 15, 25, 40];

// Enemy speed multiplier per tier
const ENEMY_SPEED = [0.5, 0.7, 0.65, 0.55, 0.5, 0.4];

// Predator chase config
const PREDATOR_DETECT_RANGE = 200;   // base detection range in px
const PREDATOR_CHASE_SPEED_RATIO = 0.70; // 70% of player base speed (without boost)
const PREDATOR_DEPTH_DETECT_BONUS = 30;  // extra detect range per depth level

// Desktop balance: predator speed bonus on non-touch
const DESKTOP_PREDATOR_BUFF = 1.15;

// Oxygen config
const OXYGEN_MAX = 100;
const OXYGEN_DRAIN_RATE = 1.2;        // per second — very slow base drain
const OXYGEN_DEPTH_DRAIN_MULT = 0.15; // extra drain per depth level
const OXYGEN_REFILL_PER_TIER = [8, 15, 20, 25, 30, 35]; // refill on eat by tier

// Prestige config
const PRESTIGE_EXTRA_EATS = 8; // eat 8 more after reaching Huge to prestige
const PRESTIGE_SPEED_BUFF = 0.12; // +12% enemy speed per depth

// Frenzy config
const FRENZY_WINDOW = 3.0;    // seconds window
const FRENZY_THRESHOLD = 5;   // eats needed
const FRENZY_SLOWMO_DURATION = 0.5;
const FRENZY_SLOWMO_SCALE = 0.3;

// Plancton config
const PLANCTON_TARGET_COUNT = 15;
const MAX_PLANCTON = 25;

const MAX_FISH = 60;
const MAX_PARTICLES = 120;
const MAX_BUBBLES = 40;
const MIN_VISIBLE = 24; // more fish on screen = faster games

// Fish-fish eating config
const FISH_EAT_CHECK_INTERVAL = 10;
const FISH_EAT_GLOBAL_COOLDOWN = 1.0;
const FISH_EAT_PER_FISH_COOLDOWN = 4;

const PLAYER_BASE_SPEED = 4.5;
const BOOST_MULT = 1.7;
const BOOST_MAX = 100;
const BOOST_DRAIN = 1.2;
const BOOST_REGEN = 0.35;

const SHAKE_DECAY = 0.88;

// Reference screen size for radius scaling
const REF_SCREEN = 900;

// Zone background configs
const ZONE_BG = {
  surface: {
    top: '#1a6090', mid: '#0d4070', bot: '#062848',
    rayColor: '#aaddff', rayAlpha: 0.07,
  },
  reef: {
    top: '#0d5a6a', mid: '#0a3a50', bot: '#042030',
    rayColor: '#66ccbb', rayAlpha: 0.05,
  },
  twilight: {
    top: '#0a1a30', mid: '#06102a', bot: '#030818',
    rayColor: '#5566aa', rayAlpha: 0.025,
  },
  abyss: {
    top: '#020610', mid: '#010408', bot: '#000204',
    rayColor: '#223355', rayAlpha: 0.01,
  },
};

// ============================================================
//  DOM REFS
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const playBtn = document.getElementById('play-btn');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highscore');
const depthInfoEl = document.getElementById('depth-info');
const sizeInfoEl = document.getElementById('size-info');
const sizeBarEl = document.getElementById('size-bar');
const boostBarEl = document.getElementById('boost-bar');
const vignetteEl = document.getElementById('vignette');
const endStatsEl = document.getElementById('end-stats');
const oxygenBarEl = document.getElementById('oxygen-bar');
const orientHintEl = document.getElementById('orient-hint');
const prestigeFlashEl = document.getElementById('prestige-flash');

// ============================================================
//  AUDIO (Web Audio API — lazy init)
// ============================================================

let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playEat() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(400, t);
  o.frequency.exponentialRampToValueAtTime(800, t + 0.06);
  o.frequency.exponentialRampToValueAtTime(500, t + 0.12);
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.15);
  const bufSize = audioCtx.sampleRate * 0.04;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3 * (1 - i / bufSize);
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.15, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  noise.connect(ng).connect(audioCtx.destination);
  noise.start(t);
  noise.stop(t + 0.06);
}

function playHurt() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(300, t);
  o.frequency.exponentialRampToValueAtTime(100, t + 0.25);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.3);
}

function playGameOver() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [260, 220, 180, 140].forEach((freq, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t + i * 0.2);
    g.gain.setValueAtTime(0.12, t + i * 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.2 + 0.3);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.2);
    o.stop(t + i * 0.2 + 0.35);
  });
}

function playFrenzy() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // Ascending triumphant arpeggio
  [523, 659, 784, 1047].forEach((freq, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t + i * 0.06);
    g.gain.setValueAtTime(0.15, t + i * 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.2);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.06);
    o.stop(t + i * 0.06 + 0.25);
  });
}

function playPrestige() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // Deep descending + rising sweep
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(800, t);
  o.frequency.exponentialRampToValueAtTime(100, t + 0.4);
  o.frequency.exponentialRampToValueAtTime(600, t + 0.8);
  g.gain.setValueAtTime(0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 1.0);
}

function playBonk() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.08);
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.1);
}

function playTierUp() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  // C5 → E5 → G5 ascending triumphant arpeggio
  [523, 659, 784].forEach((freq, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, t + i * 0.1);
    g.gain.setValueAtTime(0.2, t + i * 0.1);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.3);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.1);
    o.stop(t + i * 0.1 + 0.35);
  });
}

// ============================================================
//  HAPTIC FEEDBACK
// ============================================================

function haptic(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
}

// ============================================================
//  FLOATING SCORE TEXT
// ============================================================

function spawnFloatingText(x, y, text, color, big) {
  if (floatingTexts.length >= MAX_FLOATING_TEXTS) return;
  floatingTexts.push({
    x, y, text,
    color: color || '#fff',
    life: 1,
    decay: big ? 0.008 : 0.015,
    big: big || false,
    glow: big || false,
  });
}

// ============================================================
//  GAME STATE
// ============================================================

let W, H;
let running = false;
let gameTime = 0;
let score = 0;
let highScore = parseInt(localStorage.getItem('deepfeed_hi') || '0', 10);

// Player
let player = null;

// Entities
let fishes = [];
let particles = [];
let bubbles = [];
let jellyfish = []; // twilight zone obstacles

// Input
let pointer = { x: 0, y: 0, active: false };
let boosting = false;
let boostFuel = BOOST_MAX;

// Camera shake
let shakeX = 0, shakeY = 0, shakeIntensity = 0;

// Fish-fish eating state
let frameCount = 0;
let lastFishEatTime = 0;
let pendingRespawns = [];

// Touch detection & finger offset
let isTouch = false;
const TOUCH_OFFSET_Y = 80;

// Radius scale factor
let radiusScale = 1;

// HUD throttle
let lastHUDTime = 0;

// Floating score texts
let floatingTexts = [];
const MAX_FLOATING_TEXTS = 30;

// Player eat scale bump
let playerScaleBump = 0;

// Title screen ambient state
let titleBubbles = [];
let titlePlancton = [];

// Prestige / Depth state
let depthLevel = 1;
let maxDepthReached = 1;
let scoreMultiplier = 1;
let prestigeEats = 0; // eats after reaching tier 5
let inPrestige = false; // prestige animation active
let prestigeTimer = 0;

// Frenzy state
let recentEats = []; // timestamps of recent eats
let frenzyActive = false;
let frenzyTimer = 0;
let frenzyCount = 0;
let bestFrenzy = 0;
let slowmoScale = 1; // time scale for bullet time
let saturationFlash = 0; // 0-1 for saturation overlay

// Oxygen
let oxygen = OXYGEN_MAX;

// Reef currents
let reefCurrents = [];

// Abyss ambush predators
let ambushFish = [];

// Bump stun (same-tier collision)
let playerStunTimer = 0;

// Jellyfish slow
let playerSlowTimer = 0;

// Soft bounce velocity
let playerBounceVx = 0;
let playerBounceVy = 0;

// Current zone (computed from player tier)
let currentZone = 'surface';
let zoneTransition = 0; // 0-1 blend to next zone

// Tier-up celebration state
let tierUpRingRadius = 0;
let tierUpRingAlpha = 0;
let tierUpRingColor = '#fff';
let tierUpFlashTimer = 0;
let tierUpSlowmoTimer = 0;

// Difficulty system state
let graceTimer = 0;         // grace period after tier-up (seconds)
let timeSinceLastHit = 0;   // adaptive danger tracker
let adaptiveDangerSpawned = false; // prevent spam-spawning

// Stats tracking
let maxTierReached = 1;
let totalFishEaten = 0;
let startTime = 0;

// ============================================================
//  RESIZE
// ============================================================

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  radiusScale = Math.max(0.45, Math.min(1, Math.min(W, H) / REF_SCREEN));

  if (orientHintEl) {
    const isMobileSize = Math.min(W, H) < 500;
    const isLandscape = W > H * 1.2;
    orientHintEl.classList.toggle('visible', isMobileSize && isLandscape);
  }
}
window.addEventListener('resize', resize);
resize();

// ============================================================
//  ZONE HELPERS
// ============================================================

function getZoneForTier(tier) {
  if (tier <= 2) return 'surface';
  if (tier === 3) return 'reef';
  if (tier === 4) return 'twilight';
  return 'abyss';
}

function getZonePalette(zone) {
  return ZONE_PALETTES[zone] || ZONE_PALETTES.surface;
}

function getFishColors(tier, zone) {
  const palette = getZonePalette(zone);
  return palette[tier] || TIER_COLORS[tier];
}

// Lerp hex colors for zone transitions
function lerpColor(a, b, t) {
  const ah = parseInt(a.slice(1), 16);
  const bh = parseInt(b.slice(1), 16);
  const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
  const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
  const rr = Math.round(ar + (br - ar) * t);
  const rg = Math.round(ag + (bg - ag) * t);
  const rb = Math.round(ab + (bb - ab) * t);
  return '#' + ((1 << 24) + (rr << 16) + (rg << 8) + rb).toString(16).slice(1);
}

// ============================================================
//  FISH DRAWING
// ============================================================

function drawFish(x, y, radius, angle, tier, mouthOpen, tailPhase, isPlayer, zone) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  const c = getFishColors(tier, zone || currentZone);
  const r = radius;
  const bodyLen = r * 2.2;
  const bodyH = r * 1.1;
  const tailWag = Math.sin(tailPhase) * 0.3;

  // Shadow beneath
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(2, 3, bodyLen * 0.48, bodyH * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tail fin
  ctx.save();
  ctx.translate(-bodyLen * 0.4, 0);
  ctx.rotate(tailWag);
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-r * 0.9, -r * 0.7);
  ctx.quadraticCurveTo(-r * 0.5, 0, -r * 0.9, r * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Body
  ctx.fillStyle = c.body;
  ctx.beginPath();
  ctx.ellipse(0, 0, bodyLen * 0.45, bodyH, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body shine
  const grad = ctx.createRadialGradient(-r * 0.2, -r * 0.3, 0, 0, 0, r * 1.2);
  grad.addColorStop(0, 'rgba(255,255,255,0.25)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, bodyLen * 0.45, bodyH, 0, 0, Math.PI * 2);
  ctx.fill();

  // Player body highlight — brighter than enemies (white inner overlay)
  if (isPlayer) {
    const playerGrad = ctx.createRadialGradient(-r * 0.1, -r * 0.2, 0, 0, 0, r * 1.3);
    playerGrad.addColorStop(0, 'rgba(255,255,255,0.15)');
    playerGrad.addColorStop(0.6, 'rgba(255,255,255,0.06)');
    playerGrad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = playerGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyLen * 0.45, bodyH, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Dorsal fin
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(-r * 0.2, -bodyH * 0.85);
  ctx.quadraticCurveTo(r * 0.1, -bodyH * 1.5, r * 0.4, -bodyH * 0.85);
  ctx.closePath();
  ctx.fill();

  // Pectoral fin (bottom)
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(r * 0.05, bodyH * 0.6);
  ctx.quadraticCurveTo(r * 0.1, bodyH * 1.3, -r * 0.3, bodyH * 0.9);
  ctx.closePath();
  ctx.fill();

  // Abyss zone: bioluminescent glow on fish bodies
  if ((zone || currentZone) === 'abyss' && !isPlayer) {
    const bioGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2);
    bioGlow.addColorStop(0, `rgba(100,200,255,0.12)`);
    bioGlow.addColorStop(1, 'rgba(100,200,255,0)');
    ctx.fillStyle = bioGlow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Anglerfish lantern for tier 4-5 in abyss
  if ((zone || currentZone) === 'abyss' && tier >= 4 && !isPlayer) {
    ctx.save();
    const lx = bodyLen * 0.5;
    const ly = -bodyH * 1.2;
    // Stalk
    ctx.strokeStyle = c.fin;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(r * 0.1, -bodyH * 0.8);
    ctx.quadraticCurveTo(lx * 0.8, ly * 0.6, lx, ly);
    ctx.stroke();
    // Lantern glow
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, r * 0.8);
    lg.addColorStop(0, 'rgba(255,255,100,0.6)');
    lg.addColorStop(0.5, 'rgba(255,200,50,0.15)');
    lg.addColorStop(1, 'rgba(255,200,50,0)');
    ctx.fillStyle = lg;
    ctx.beginPath();
    ctx.arc(lx, ly, r * 0.8, 0, Math.PI * 2);
    ctx.fill();
    // Bright dot
    ctx.fillStyle = '#ffffaa';
    ctx.beginPath();
    ctx.arc(lx, ly, r * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Mouth
  if (mouthOpen > 0) {
    ctx.fillStyle = '#331111';
    ctx.beginPath();
    const mx = bodyLen * 0.42;
    const mo = mouthOpen * r * 0.35;
    ctx.ellipse(mx, 0, r * 0.15, mo, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Eye
  const eyeX = r * 0.4;
  const eyeY = -r * 0.25;
  const eyeR = r * 0.2;
  ctx.fillStyle = c.eye;
  ctx.beginPath();
  ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(eyeX + eyeR * 0.25, eyeY, eyeR * 0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(eyeX + eyeR * 0.45, eyeY - eyeR * 0.25, eyeR * 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Player pulsing glow ring — uses tier color, breathes in/out
  if (isPlayer) {
    const glowPulse = 0.3 + 0.3 * Math.sin(gameTime * 4);
    const glowRadOsc = 1 + 0.06 * Math.sin(gameTime * 3);
    const tierGlowColor = c.body;
    // Parse hex to get RGB for rgba
    const gh = parseInt(tierGlowColor.slice(1), 16);
    const gr = (gh >> 16) & 0xff, gg = (gh >> 8) & 0xff, gb = gh & 0xff;
    // Outer glow
    ctx.shadowColor = `rgba(${gr},${gg},${gb},${glowPulse})`;
    ctx.shadowBlur = 12 + 6 * Math.sin(gameTime * 4);
    ctx.strokeStyle = `rgba(${gr},${gg},${gb},${glowPulse})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, (bodyLen * 0.5 + 5) * glowRadOsc, (bodyH + 5) * glowRadOsc, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  ctx.restore();
}

// ============================================================
//  PLANCTON DRAWING
// ============================================================

function drawPlancton(x, y, radius, phase, zone) {
  const pulse = 0.7 + 0.3 * Math.sin(phase);
  const glowR = radius * 2.5 * pulse;
  const z = zone || currentZone;

  // Zone-specific plancton colors
  let inner, mid, outer;
  if (z === 'abyss') {
    inner = 'rgba(0,255,200,0.6)';
    mid = 'rgba(0,200,180,0.25)';
    outer = 'rgba(0,150,150,0)';
  } else if (z === 'twilight') {
    inner = 'rgba(160,180,255,0.5)';
    mid = 'rgba(120,140,220,0.2)';
    outer = 'rgba(80,100,180,0)';
  } else if (z === 'reef') {
    inner = 'rgba(100,255,180,0.5)';
    mid = 'rgba(80,220,160,0.2)';
    outer = 'rgba(50,180,120,0)';
  } else {
    inner = 'rgba(140,255,255,0.5)';
    mid = 'rgba(100,220,255,0.2)';
    outer = 'rgba(60,180,255,0)';
  }

  const grad = ctx.createRadialGradient(x, y, 0, x, y, glowR);
  grad.addColorStop(0, inner);
  grad.addColorStop(0.4, mid);
  grad.addColorStop(1, outer);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, glowR, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = `rgba(220,255,255,${0.6 + 0.4 * pulse})`;
  ctx.beginPath();
  ctx.arc(x, y, radius * pulse, 0, Math.PI * 2);
  ctx.fill();
}

// ============================================================
//  JELLYFISH DRAWING & MANAGEMENT (twilight zone obstacle)
// ============================================================

function spawnJellyfish() {
  if (jellyfish.length >= 6) return;
  const side = Math.floor(Math.random() * 4);
  let x, y;
  switch (side) {
    case 0: x = -40; y = Math.random() * H; break;
    case 1: x = W + 40; y = Math.random() * H; break;
    case 2: x = Math.random() * W; y = -40; break;
    default: x = Math.random() * W; y = H + 40; break;
  }
  jellyfish.push({
    x, y,
    vx: (Math.random() - 0.5) * 0.5,
    vy: -0.3 + Math.random() * 0.2,
    radius: 18 + Math.random() * 14,
    phase: Math.random() * Math.PI * 2,
    tentaclePhase: Math.random() * Math.PI * 2,
  });
}

function drawJellyfish(j) {
  const pulse = 0.85 + 0.15 * Math.sin(j.phase);
  const r = j.radius * pulse;

  // Glow
  const glow = ctx.createRadialGradient(j.x, j.y, 0, j.x, j.y, r * 3);
  glow.addColorStop(0, 'rgba(180,100,255,0.15)');
  glow.addColorStop(1, 'rgba(180,100,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(j.x, j.y, r * 3, 0, Math.PI * 2);
  ctx.fill();

  // Bell (dome)
  ctx.fillStyle = 'rgba(180,130,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(j.x, j.y, r * 0.8, r * 0.6, 0, Math.PI, 0);
  ctx.fill();

  // Inner glow
  ctx.fillStyle = 'rgba(220,180,255,0.2)';
  ctx.beginPath();
  ctx.ellipse(j.x, j.y - r * 0.1, r * 0.4, r * 0.3, 0, Math.PI, 0);
  ctx.fill();

  // Tentacles
  ctx.strokeStyle = 'rgba(180,130,255,0.3)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 5; i++) {
    const tx = j.x + (i - 2) * r * 0.3;
    const waveOff = Math.sin(j.tentaclePhase + i * 0.8) * 6;
    ctx.beginPath();
    ctx.moveTo(tx, j.y);
    ctx.quadraticCurveTo(tx + waveOff, j.y + r * 0.8, tx - waveOff * 0.5, j.y + r * 1.5);
    ctx.stroke();
  }
}

// ============================================================
//  PARTICLE & BUBBLE
// ============================================================

function spawnEatParticles(x, y, color, count) {
  for (let i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      size: 2 + Math.random() * 4,
      color,
    });
  }
}

function spawnBubble(x, y) {
  if (bubbles.length >= MAX_BUBBLES) return;
  bubbles.push({
    x: x + (Math.random() - 0.5) * 10,
    y,
    vy: -0.5 - Math.random() * 1.5,
    size: 1 + Math.random() * 3,
    life: 1,
    decay: 0.005 + Math.random() * 0.005,
  });
}

// ============================================================
//  ENEMY FISH
// ============================================================

function createFish(tier, forceEdge, scatterOnScreen) {
  const r = TIER_RADIUS[tier] * radiusScale * (0.85 + Math.random() * 0.3);
  let x, y, angle;

  if (scatterOnScreen) {
    x = r + Math.random() * (W - r * 2);
    y = r + Math.random() * (H - r * 2);
    angle = Math.random() * Math.PI * 2;
  } else if (forceEdge || !player) {
    const side = Math.floor(Math.random() * 4);
    const margin = r * 2;
    switch (side) {
      case 0: x = -margin;          y = Math.random() * H; break;
      case 1: x = W + margin;       y = Math.random() * H; break;
      case 2: x = Math.random() * W; y = -margin; break;
      case 3: x = Math.random() * W; y = H + margin; break;
    }
    const tx = W * (0.2 + Math.random() * 0.6);
    const ty = H * (0.2 + Math.random() * 0.6);
    angle = Math.atan2(ty - y, tx - x);
  } else {
    x = Math.random() * W;
    y = Math.random() * H;
    angle = Math.random() * Math.PI * 2;
  }

  // Speed increases with depth (prestige) + desktop buff
  const depthSpeedMult = 1 + (depthLevel - 1) * PRESTIGE_SPEED_BUFF;
  const desktopBuff = (!isTouch && tier > 0) ? DESKTOP_PREDATOR_BUFF : 1;
  const baseSpeed = (1.2 + Math.random() * 0.8) * ENEMY_SPEED[tier] * depthSpeedMult * desktopBuff;

  return {
    x, y, angle,
    radius: r,
    tier,
    speed: baseSpeed,
    tailPhase: Math.random() * Math.PI * 2,
    mouthOpen: 0,
    alive: true,
    turnTimer: 1 + Math.random() * 3,
    targetAngle: angle,
    fleeing: false,
    fleeTimer: 0,
    eatCooldown: 0,
    sizeBoost: 0,
  };
}

function chooseTier(playerTier, elapsed) {
  const maxSpawnTier = Math.min(TIER_COUNT - 1, playerTier + 1);

  // Continuous time pressure: scales up to 3x over ~2 minutes
  const timePressure = Math.min(3, elapsed / 40);

  // Grace period after tier-up: 70% reduction in predator spawn weight
  const graceMultiplier = graceTimer > 0 ? 0.3 : 1;

  // Within-tier progression pressure
  const progressRatio = player && playerTier < TIER_COUNT - 1
    ? player.eaten / TIER_THRESHOLDS[playerTier]
    : player ? prestigeEats / PRESTIGE_EXTRA_EATS : 0;

  const weights = [];
  for (let t = 0; t < TIER_COUNT; t++) {
    if (t === 0 || t > maxSpawnTier) { weights.push(0); continue; }
    if (t < playerTier) {
      // Food fish — reduce availability as progress increases
      let w = t === playerTier - 1 ? 4 : 2;
      if (progressRatio > 0.5) w *= 0.7;
      weights.push(w);
    } else if (t === playerTier) {
      // Same tier — bump hazards increase with progress
      let w = 1.5;
      if (progressRatio > 0.5) w += 1.0;
      weights.push(w);
    } else {
      // Predators — scale with time & progress, reduced by grace
      let w = (0.5 + timePressure * 1.5) * graceMultiplier;
      if (progressRatio > 0.8) w *= 1.5;
      weights.push(w);
    }
  }
  const total = weights.reduce((a, b) => a + b, 0);
  if (total <= 0) return 1;
  let r = Math.random() * total;
  for (let t = 0; t < TIER_COUNT; t++) {
    r -= weights[t];
    if (r <= 0) return t;
  }
  return 1;
}

// ============================================================
//  PLAYER
// ============================================================

function createPlayer() {
  const r = TIER_RADIUS[1] * radiusScale;
  return {
    x: W / 2,
    y: H / 2,
    angle: 0,
    tier: 1,
    radius: r,
    targetRadius: r,   // for smooth lerp on tier-up
    tailPhase: 0,
    mouthOpen: 0,
    eaten: 0,
    totalEaten: 0,
    alive: true,
    invincible: 0,
    flashTimer: 0,
  };
}

// ============================================================
//  INPUT HANDLING
// ============================================================

function getPointerPos(e) {
  const touch = e.touches ? e.touches[0] : e;
  if (!touch) return;
  if (e.pointerType) {
    isTouch = e.pointerType === 'touch';
  } else if (e.type) {
    if (e.type.startsWith('touch')) isTouch = true;
    else if (e.type.startsWith('mouse')) isTouch = false;
  }
  pointer.x = touch.clientX;
  pointer.y = touch.clientY - (isTouch ? TOUCH_OFFSET_Y : 0);
  pointer.active = true;
}

function onPointerDown(e) {
  e.preventDefault();
  ensureAudio();
  getPointerPos(e);
  boosting = true;
}
function onPointerMove(e) {
  e.preventDefault();
  getPointerPos(e);
}
function onPointerUp(e) {
  e.preventDefault();
  boosting = false;
}

canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
canvas.addEventListener('pointermove', onPointerMove, { passive: false });
canvas.addEventListener('pointerup', onPointerUp, { passive: false });
canvas.addEventListener('pointercancel', onPointerUp, { passive: false });
canvas.addEventListener('touchstart', onPointerDown, { passive: false });
canvas.addEventListener('touchmove', onPointerMove, { passive: false });
canvas.addEventListener('touchend', onPointerUp, { passive: false });
canvas.addEventListener('touchcancel', onPointerUp, { passive: false });
canvas.addEventListener('mousedown', (e) => { isTouch = false; ensureAudio(); pointer.active = true; boosting = true; });
canvas.addEventListener('mouseup', () => { boosting = false; });
canvas.addEventListener('mousemove', (e) => { isTouch = false; pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });

// ============================================================
//  HUD UPDATE
// ============================================================

function updateHUD() {
  scoreEl.textContent = `Score: ${score}`;
  if (highScore > 0) highScoreEl.textContent = `Best: ${highScore}`;

  if (depthLevel > 1) {
    depthInfoEl.textContent = `Profondeur ${depthLevel} — x${scoreMultiplier}`;
    depthInfoEl.style.display = 'block';
  } else {
    depthInfoEl.style.display = 'none';
  }

  if (player) {
    const zoneName = ZONE_NAMES[player.tier] || 'Surface';
    sizeInfoEl.textContent = `${TIER_NAMES[player.tier]} — ${zoneName}`;
    if (player.tier < TIER_COUNT - 1) {
      const progress = (player.eaten / TIER_THRESHOLDS[player.tier]) * 100;
      sizeBarEl.style.width = Math.min(100, progress) + '%';
      const c1 = getFishColors(player.tier, currentZone);
      const c2 = getFishColors(player.tier + 1, currentZone);
      sizeBarEl.style.background = `linear-gradient(90deg, ${c1.body}, ${c2.body})`;
    } else {
      // At max tier — show prestige progress
      const progress = (prestigeEats / PRESTIGE_EXTRA_EATS) * 100;
      sizeBarEl.style.width = Math.min(100, progress) + '%';
      sizeBarEl.style.background = 'linear-gradient(90deg, #bb55ff, #ffcc00)';
    }
  }
  boostBarEl.style.width = (boostFuel / BOOST_MAX * 100) + '%';
}

// ============================================================
//  COLLISION
// ============================================================

function circlesOverlap(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  const dist = Math.sqrt(dx * dx + dy * dy);
  return dist < (ar + br) * 0.7;
}

// ============================================================
//  PRESTIGE ANIMATION
// ============================================================

function triggerPrestige() {
  inPrestige = true;
  prestigeTimer = 1.5; // 1.5s animation
  playPrestige();
  haptic([50, 30, 50, 30, 100]);

  // Flash
  prestigeFlashEl.style.opacity = '0.8';
  setTimeout(() => { prestigeFlashEl.style.opacity = '0'; }, 300);
}

function completePrestige() {
  inPrestige = false;
  depthLevel++;
  maxDepthReached = Math.max(maxDepthReached, depthLevel);
  scoreMultiplier = depthLevel;
  prestigeEats = 0;

  // Reset player to Fry but keep score
  oxygen = OXYGEN_MAX; // refill oxygen on prestige
  player.tier = 1;
  player.eaten = 0;
  player.radius = TIER_RADIUS[1] * radiusScale;
  player.targetRadius = player.radius;
  player.invincible = 2; // brief immunity after prestige
  graceTimer = 3; // grace period after prestige too

  // Clear fish and respawn fresh (faster ones)
  fishes = [];
  jellyfish = [];
  ambushFish = [];
  reefCurrents = [];
  const planctonCount = 12 + Math.floor(Math.random() * 6);
  for (let i = 0; i < planctonCount; i++) {
    fishes.push(createFish(0, false, true));
  }
  const fryCount = 6 + Math.floor(Math.random() * 5);
  for (let i = 0; i < fryCount; i++) {
    fishes.push(createFish(1, true));
  }
  const smallCount = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < smallCount; i++) {
    fishes.push(createFish(2, true));
  }

  currentZone = 'surface';
  spawnFloatingText(W / 2, H / 2 - 30, `PROFONDEUR ${depthLevel}`, '#ffcc00', true);
  spawnFloatingText(W / 2, H / 2 + 10, `Score x${scoreMultiplier}`, '#80e0ff', true);
  shakeIntensity = 15;
}

// ============================================================
//  FRENZY CHECK
// ============================================================

function checkFrenzy() {
  const now = gameTime;
  // Prune old eats
  while (recentEats.length > 0 && now - recentEats[0] > FRENZY_WINDOW) {
    recentEats.shift();
  }

  if (recentEats.length >= FRENZY_THRESHOLD && !frenzyActive) {
    // Trigger frenzy!
    frenzyActive = true;
    frenzyTimer = FRENZY_SLOWMO_DURATION;
    frenzyCount = recentEats.length;
    bestFrenzy = Math.max(bestFrenzy, frenzyCount);
    slowmoScale = FRENZY_SLOWMO_SCALE;
    saturationFlash = 1;

    playFrenzy();
    haptic([20, 10, 20, 10, 40]);
    spawnFloatingText(W / 2, H / 3, `FRENZY x${frenzyCount}!`, '#ffcc00', true);
    shakeIntensity = 10;
    recentEats = []; // reset window
  }
}

// ============================================================
//  UPDATE
// ============================================================

function update(dt) {
  if (!running || !player) return;

  // Apply slow-mo
  const effectiveDt = dt * slowmoScale;
  gameTime += effectiveDt;

  // Frenzy timer
  if (frenzyActive) {
    frenzyTimer -= dt; // real time, not slowed
    if (frenzyTimer <= 0) {
      frenzyActive = false;
      slowmoScale = 1;
    }
  }
  // Saturation flash decay
  if (saturationFlash > 0) {
    saturationFlash = Math.max(0, saturationFlash - dt * 3);
  }

  // Tier-up slow-mo timer (separate from frenzy)
  if (tierUpSlowmoTimer > 0) {
    tierUpSlowmoTimer -= dt;
    if (tierUpSlowmoTimer <= 0 && !frenzyActive) {
      slowmoScale = 1;
    }
  }

  // Grace period countdown
  if (graceTimer > 0) {
    graceTimer = Math.max(0, graceTimer - dt);
  }

  // Tier-up golden flash decay
  if (tierUpFlashTimer > 0) {
    tierUpFlashTimer = Math.max(0, tierUpFlashTimer - dt);
  }

  // Tier-up expansion ring animation
  if (tierUpRingAlpha > 0) {
    tierUpRingRadius += dt * 300; // expand outward fast
    tierUpRingAlpha = Math.max(0, tierUpRingAlpha - dt * 1.4);
  }

  // Adaptive danger: track time since last hit
  timeSinceLastHit += dt;

  // Prestige animation
  if (inPrestige) {
    prestigeTimer -= dt;
    if (prestigeTimer <= 0) {
      completePrestige();
    }
    return; // freeze game during prestige
  }

  // Update zone based on player tier
  currentZone = getZoneForTier(player.tier);

  // Track max tier
  maxTierReached = Math.max(maxTierReached, player.tier);

  // --- Stun & slow timers ---
  if (playerStunTimer > 0) playerStunTimer = Math.max(0, playerStunTimer - effectiveDt);
  if (playerSlowTimer > 0) playerSlowTimer = Math.max(0, playerSlowTimer - effectiveDt);

  // --- Player movement ---
  if (pointer.active) {
    const dx = pointer.x - player.x;
    const dy = pointer.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 2) {
      const targetAngle = Math.atan2(dy, dx);
      let angleDiff = targetAngle - player.angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      player.angle += angleDiff * Math.min(1, effectiveDt * 12);

      let speed = PLAYER_BASE_SPEED;
      if (boosting && boostFuel > 0) {
        speed *= BOOST_MULT;
        boostFuel = Math.max(0, boostFuel - BOOST_DRAIN);
      }
      // Apply stun slow (60% speed)
      if (playerStunTimer > 0) speed *= 0.6;
      // Apply jellyfish slow (60% speed)
      if (playerSlowTimer > 0) speed *= 0.6;

      const move = Math.min(dist, speed * (60 * effectiveDt));
      player.x += (dx / dist) * move;
      player.y += (dy / dist) * move;
    }
  }

  if (!boosting) {
    boostFuel = Math.min(BOOST_MAX, boostFuel + BOOST_REGEN);
  }

  // --- Apply bounce velocity ---
  player.x += playerBounceVx;
  player.y += playerBounceVy;
  playerBounceVx *= 0.85;
  playerBounceVy *= 0.85;
  if (Math.abs(playerBounceVx) < 0.1) playerBounceVx = 0;
  if (Math.abs(playerBounceVy) < 0.1) playerBounceVy = 0;

  // --- Soft bounce screen edges ---
  const pr = player.radius;
  if (player.x < pr) {
    player.x = pr;
    playerBounceVx = 5 + Math.random() * 5;
    haptic(5);
  } else if (player.x > W - pr) {
    player.x = W - pr;
    playerBounceVx = -(5 + Math.random() * 5);
    haptic(5);
  }
  if (player.y < pr) {
    player.y = pr;
    playerBounceVy = 5 + Math.random() * 5;
    haptic(5);
  } else if (player.y > H - pr) {
    player.y = H - pr;
    playerBounceVy = -(5 + Math.random() * 5);
    haptic(5);
  }

  // Player animation
  player.tailPhase += effectiveDt * (boosting ? 18 : 10);
  player.mouthOpen = Math.max(0, player.mouthOpen - effectiveDt * 4);

  // Smooth radius lerp toward targetRadius (0.3s transition)
  if (Math.abs(player.radius - player.targetRadius) > 0.5) {
    player.radius += (player.targetRadius - player.radius) * Math.min(1, effectiveDt * 8);
  } else {
    player.radius = player.targetRadius;
  }

  if (player.invincible > 0) {
    player.invincible -= effectiveDt;
    player.flashTimer += effectiveDt * 12;
  }

  frameCount++;

  // --- Jellyfish (twilight/abyss zone obstacle) ---
  if (currentZone === 'twilight' || currentZone === 'abyss') {
    // Spawn jellyfish
    if (Math.random() < effectiveDt * 0.3 && jellyfish.length < 5) {
      spawnJellyfish();
    }
    // Update & collision
    for (let i = jellyfish.length - 1; i >= 0; i--) {
      const j = jellyfish[i];
      j.x += j.vx * 60 * effectiveDt;
      j.y += j.vy * 60 * effectiveDt;
      j.phase += effectiveDt * 3;
      j.tentaclePhase += effectiveDt * 2;

      // Soft bounce
      if (j.x < 30) j.vx = Math.abs(j.vx);
      if (j.x > W - 30) j.vx = -Math.abs(j.vx);
      if (j.y < 30) j.vy = Math.abs(j.vy) * 0.5;
      if (j.y > H - 30) j.vy = -Math.abs(j.vy);

      // Remove if way off screen
      if (j.y < -100 || j.y > H + 100) { jellyfish.splice(i, 1); continue; }

      // Collision with player — damage + slow
      if (player.invincible <= 0) {
        const jdx = player.x - j.x, jdy = player.y - j.y;
        const jdist = Math.sqrt(jdx * jdx + jdy * jdy);
        if (jdist < player.radius + j.radius * 0.6) {
          // Jellyfish slow: 60% speed for 0.5s
          playerSlowTimer = 0.5;

          player.invincible = 1.5;
          player.eaten = Math.max(0, player.eaten - 2);

          if (player.tier <= 1) {
            player.alive = false;
            running = false;
            haptic([30, 20, 60]);
            playGameOver();
            gameOver();
            return;
          }

          player.tier--;
          player.radius = TIER_RADIUS[player.tier] * radiusScale;
          player.targetRadius = player.radius;
          timeSinceLastHit = 0;
          adaptiveDangerSpawned = false;
          shakeIntensity = 12;
          spawnEatParticles(player.x, player.y, '#bb55ff', 15);

          const kAngle = Math.atan2(player.y - j.y, player.x - j.x);
          player.x += Math.cos(kAngle) * 40;
          player.y += Math.sin(kAngle) * 40;

          haptic(50);
          playHurt();
          vignetteEl.style.opacity = '1';
          setTimeout(() => vignetteEl.style.opacity = '0', 200);
        }
      }
    }
  } else {
    // Clear jellyfish in non-twilight zones
    jellyfish = [];
  }

  // --- Enemy fish AI ---
  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i];
    if (!f.alive) { fishes.splice(i, 1); continue; }

    if (f.eatCooldown > 0) f.eatCooldown -= effectiveDt;
    if (f.sizeBoost > 0) f.sizeBoost -= effectiveDt;
    f.mouthOpen = Math.max(0, f.mouthOpen - effectiveDt * 4);
    f.tailPhase += effectiveDt * (8 + f.speed * 3);

    if (f.tier === 0) {
      // Plancton drift
      f.turnTimer -= effectiveDt;
      if (f.turnTimer <= 0) {
        f.turnTimer = 3 + Math.random() * 4;
        f.targetAngle = f.angle + (Math.random() - 0.5) * 2;
      }
      let aDiff = f.targetAngle - f.angle;
      while (aDiff > Math.PI) aDiff -= Math.PI * 2;
      while (aDiff < -Math.PI) aDiff += Math.PI * 2;
      f.angle += aDiff * Math.min(1, effectiveDt * 1.5);

      const spd = f.speed * 0.5 * 60 * effectiveDt;
      f.x += Math.cos(f.angle) * spd;
      f.y += Math.sin(f.angle) * spd;

      if (f.x < 20) f.targetAngle = 0;
      if (f.x > W - 20) f.targetAngle = Math.PI;
      if (f.y < 20) f.targetAngle = Math.PI / 2;
      if (f.y > H - 20) f.targetAngle = -Math.PI / 2;

      const margin = 150;
      if (f.x < -margin || f.x > W + margin || f.y < -margin || f.y > H + margin) {
        fishes.splice(i, 1);
        continue;
      }
    } else {
      // Normal fish AI
      const distToPlayer = distBetween(player, f);
      // Time-based detect range: +10px per 30s of game time
      const timeDetectBonus = Math.min(30, gameTime / 30 * 10);
      // Adaptive danger: +20% range if no damage for 8s
      const adaptiveRangeBonus = timeSinceLastHit > 8 ? 0.2 : 0;
      const detectRange = (PREDATOR_DETECT_RANGE + (depthLevel - 1) * PREDATOR_DEPTH_DETECT_BONUS + timeDetectBonus) * (1 + adaptiveRangeBonus);
      const isPredator = f.tier > player.tier;
      const isChasing = isPredator && distToPlayer < detectRange;

      // Active predator chase — continuous, bypasses turnTimer
      if (isChasing) {
        f.targetAngle = Math.atan2(player.y - f.y, player.x - f.x);
        f.fleeing = false;
      } else {
        f.turnTimer -= effectiveDt;
        if (f.turnTimer <= 0) {
          f.turnTimer = 2 + Math.random() * 4;
          if (player.tier > f.tier && distToPlayer < 250) {
            f.fleeing = true;
            f.fleeTimer = 1.5 + Math.random();
            f.targetAngle = Math.atan2(f.y - player.y, f.x - player.x);
          } else {
            f.targetAngle = f.angle + (Math.random() - 0.5) * 1.5;
          }
        }
      }

      if (f.fleeing) {
        f.fleeTimer -= effectiveDt;
        if (f.fleeTimer <= 0) f.fleeing = false;
        f.targetAngle = Math.atan2(f.y - player.y, f.x - player.x);
      }

      let aDiff = f.targetAngle - f.angle;
      while (aDiff > Math.PI) aDiff -= Math.PI * 2;
      while (aDiff < -Math.PI) aDiff += Math.PI * 2;
      f.angle += aDiff * Math.min(1, effectiveDt * (isChasing ? 5 : 3));

      // Predators chase at 70% player speed, with time/adaptive scaling
      const timeSpeedBonus = 1 + Math.min(0.15, gameTime / 30 * 0.02); // +2% per 30s, cap +15%
      const adaptiveSpeedBonus = timeSinceLastHit > 8 ? 1.1 : 1;       // +10% if no damage 8s
      let spdMult = f.fleeing ? 1.5 : 1;
      let spd;
      if (isChasing) {
        spd = PREDATOR_CHASE_SPEED_RATIO * PLAYER_BASE_SPEED * timeSpeedBonus * adaptiveSpeedBonus * 60 * effectiveDt;
      } else {
        spd = f.speed * spdMult * 60 * effectiveDt;
      }
      f.x += Math.cos(f.angle) * spd;
      f.y += Math.sin(f.angle) * spd;

      const margin = f.radius * 4 + 100;
      if (f.x < -margin || f.x > W + margin || f.y < -margin || f.y > H + margin) {
        fishes.splice(i, 1);
        continue;
      }

      if (f.x < f.radius) f.targetAngle = 0;
      if (f.x > W - f.radius) f.targetAngle = Math.PI;
      if (f.y < f.radius) f.targetAngle = Math.PI / 2;
      if (f.y > H - f.radius) f.targetAngle = -Math.PI / 2;
    }

    // --- Collision with player ---
    const overlapFactor = f.tier === 0 ? 0.9 : 0.7;
    const dx = player.x - f.x, dy = player.y - f.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < (player.radius + f.radius) * overlapFactor) {
      if (f.tier < player.tier) {
        // EAT!
        f.alive = false;

        // Tier-based scoring with frenzy doubler and depth multiplier
        let pointValue = TIER_POINTS[f.tier] || 1;
        if (frenzyActive) pointValue *= 2;
        pointValue *= scoreMultiplier;
        score += pointValue;
        totalFishEaten++;
        player.totalEaten++;
        player.eaten++;
        player.mouthOpen = 1;

        // Oxygen refill proportional to tier
        oxygen = Math.min(OXYGEN_MAX, oxygen + (OXYGEN_REFILL_PER_TIER[f.tier] || 5));

        // Track eat time for frenzy
        recentEats.push(gameTime);
        checkFrenzy();

        // Level up check
        if (player.tier < TIER_COUNT - 1 && player.eaten >= TIER_THRESHOLDS[player.tier]) {
          player.tier++;
          player.eaten = 0;
          // Smooth radius transition via lerp (not instant)
          player.targetRadius = TIER_RADIUS[player.tier] * radiusScale;
          shakeIntensity = 10;
          spawnEatParticles(player.x, player.y, getFishColors(player.tier, currentZone).body, 25);
          maxTierReached = Math.max(maxTierReached, player.tier);

          // --- Tier-up celebration ---
          playTierUp();
          haptic([20, 15, 30]);

          // Big floating text: "TIER UP!" + new tier name
          spawnFloatingText(W / 2, H / 2 - 40, 'TIER UP!', '#ffcc00', true);
          const newTierColor = getFishColors(player.tier, getZoneForTier(player.tier)).body;
          spawnFloatingText(W / 2, H / 2, `→ ${TIER_NAMES[player.tier]}`, newTierColor, true);

          // Expansion ring from player
          tierUpRingRadius = player.radius;
          tierUpRingAlpha = 0.7;
          tierUpRingColor = newTierColor;

          // Golden flash on player body
          tierUpFlashTimer = 0.3;

          // Brief slow-mo (0.4s at 0.3x)
          tierUpSlowmoTimer = 0.4;
          slowmoScale = 0.3;

          // Grace period: 3s reduced predator spawns
          graceTimer = 3;

          // Zone change notification
          const newZone = getZoneForTier(player.tier);
          if (newZone !== currentZone) {
            spawnFloatingText(W / 2, H / 3 - 20, ZONE_NAMES[player.tier], '#80e0ff', true);
          }
        } else if (player.tier === TIER_COUNT - 1) {
          // At max tier — track prestige progress
          prestigeEats++;
          if (prestigeEats >= PRESTIGE_EXTRA_EATS) {
            triggerPrestige();
          }
        }

        const pCount = f.tier === 0 ? 3 : 6;
        spawnEatParticles(f.x, f.y, getFishColors(f.tier, currentZone).body, pCount);
        if (f.tier > 0) spawnBubble(f.x, f.y);
        shakeIntensity = Math.max(shakeIntensity, f.tier === 0 ? 1 : 3);

        const scoreText = frenzyActive ? `+${pointValue}!` : `+${pointValue}`;
        const bigText = pointValue >= 10;
        spawnFloatingText(f.x, f.y, scoreText, frenzyActive ? '#ffcc00' : getFishColors(f.tier, currentZone).body, bigText);
        playerScaleBump = 0.15;
        haptic(10);
        playEat();

      } else if (f.tier === player.tier && player.invincible <= 0) {
        // BUMP — same tier: knockback, stun, no damage
        const bumpAngle = Math.atan2(player.y - f.y, player.x - f.x);
        player.x += Math.cos(bumpAngle) * 30;
        player.y += Math.sin(bumpAngle) * 30;
        f.x -= Math.cos(bumpAngle) * 30;
        f.y -= Math.sin(bumpAngle) * 30;
        playerStunTimer = 0.4;
        player.invincible = 0.5; // brief immunity to avoid repeated bumps
        timeSinceLastHit = 0;
        adaptiveDangerSpawned = false;
        shakeIntensity = Math.max(shakeIntensity, 5);
        haptic(15);
        playBonk();

      } else if (f.tier > player.tier && player.invincible <= 0) {
        // HURT
        player.invincible = 1.5;
        player.eaten = 0;
        timeSinceLastHit = 0;
        adaptiveDangerSpawned = false;

        if (player.tier <= 1) {
          player.alive = false;
          running = false;
          haptic([30, 20, 60]);
          playGameOver();
          gameOver();
          return;
        }

        player.tier--;
        player.radius = TIER_RADIUS[player.tier] * radiusScale;
        player.targetRadius = player.radius;
        shakeIntensity = 12;
        spawnEatParticles(player.x, player.y, '#ff4444', 15);

        const kAngle = Math.atan2(player.y - f.y, player.x - f.x);
        player.x += Math.cos(kAngle) * 40;
        player.y += Math.sin(kAngle) * 40;

        haptic(50);
        playHurt();
        vignetteEl.style.opacity = '1';
        setTimeout(() => vignetteEl.style.opacity = '0', 200);
      }
    }
  }

  // --- Fish-fish eating ---
  if (frameCount % FISH_EAT_CHECK_INTERVAL === 0 && gameTime - lastFishEatTime >= FISH_EAT_GLOBAL_COOLDOWN) {
    fishFishEating:
    for (let i = 0; i < fishes.length; i++) {
      const a = fishes[i];
      if (!a.alive || a.tier <= 0 || a.eatCooldown > 0) continue;
      for (let j = 0; j < fishes.length; j++) {
        if (i === j) continue;
        const b = fishes[j];
        if (!b.alive || b.tier >= a.tier) continue;
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < (a.radius + b.radius) * 0.7) {
          b.alive = false;
          a.mouthOpen = 1;
          a.eatCooldown = FISH_EAT_PER_FISH_COOLDOWN;
          a.sizeBoost = 1.5;
          lastFishEatTime = gameTime;
          spawnEatParticles(b.x, b.y, getFishColors(b.tier, currentZone).body, 5);
          spawnBubble(b.x, b.y);
          const respawnTier = b.tier;
          const respawnDelay = 2 + Math.random();
          pendingRespawns.push({ tier: respawnTier, time: gameTime + respawnDelay });
          break fishFishEating;
        }
      }
    }
  }

  // --- Process pending respawns ---
  for (let i = pendingRespawns.length - 1; i >= 0; i--) {
    if (gameTime >= pendingRespawns[i].time && fishes.length < MAX_FISH) {
      fishes.push(createFish(pendingRespawns[i].tier, true));
      pendingRespawns.splice(i, 1);
    }
  }

  // --- Spawn new fish ---
  let visibleCount = 0;
  let planctonCount = 0;
  for (const f of fishes) {
    if (f.tier === 0) { planctonCount++; continue; }
    if (f.x > -50 && f.x < W + 50 && f.y > -50 && f.y < H + 50) visibleCount++;
  }

  while (planctonCount < PLANCTON_TARGET_COUNT && fishes.length < MAX_FISH) {
    fishes.push(createFish(0, true));
    planctonCount++;
  }

  while (visibleCount < MIN_VISIBLE && fishes.length < MAX_FISH) {
    const tier = chooseTier(player.tier, gameTime);
    fishes.push(createFish(tier, true));
    visibleCount++;
  }
  if (Math.random() < effectiveDt * 3 && fishes.length < MAX_FISH) {
    fishes.push(createFish(chooseTier(player.tier, gameTime), true));
  }

  // --- Adaptive danger: spawn predator near player if no damage for 15s ---
  if (timeSinceLastHit > 15 && !adaptiveDangerSpawned && fishes.length < MAX_FISH) {
    const spawnDist = 180 + Math.random() * 80;
    const spawnAngle = Math.random() * Math.PI * 2;
    const predTier = Math.min(TIER_COUNT - 1, player.tier + 1);
    const predator = createFish(predTier, true);
    predator.x = player.x + Math.cos(spawnAngle) * spawnDist;
    predator.y = player.y + Math.sin(spawnAngle) * spawnDist;
    predator.targetAngle = Math.atan2(player.y - predator.y, player.x - predator.x);
    predator.angle = predator.targetAngle;
    fishes.push(predator);
    adaptiveDangerSpawned = true; // only one per cycle, resets on damage
  }

  // --- Particles ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); }
  }

  // --- Bubbles ---
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y += b.vy;
    b.x += Math.sin(b.y * 0.05) * 0.3;
    b.life -= b.decay;
    if (b.life <= 0) { bubbles.splice(i, 1); }
  }

  if (Math.random() < effectiveDt * 2) {
    spawnBubble(Math.random() * W, H + 5);
  }

  // --- Floating texts ---
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= ft.big ? 0.6 : 1.2;
    ft.life -= ft.decay;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  // --- Player scale bump decay ---
  if (playerScaleBump > 0) {
    playerScaleBump = Math.max(0, playerScaleBump - effectiveDt * 0.75);
  }

  // --- Oxygen drain ---
  const oxygenDrain = OXYGEN_DRAIN_RATE * (1 + (depthLevel - 1) * OXYGEN_DEPTH_DRAIN_MULT);
  oxygen = Math.max(0, oxygen - oxygenDrain * effectiveDt);
  oxygenBarEl.style.width = (oxygen / OXYGEN_MAX * 100) + '%';
  if (oxygen <= 0) {
    player.alive = false;
    running = false;
    haptic([30, 20, 60]);
    playGameOver();
    gameOver();
    return;
  }

  // --- Reef currents ---
  if (currentZone === 'reef') {
    // Spawn new currents
    if (reefCurrents.length < 3 && Math.random() < effectiveDt * 0.5) {
      const dir = Math.random() < 0.5 ? 1 : -1;
      reefCurrents.push({
        x: dir > 0 ? -50 : W + 50,
        y: H * (0.2 + Math.random() * 0.6),
        dir,
        speed: 1.5 + Math.random() * 1.5,
        width: 150 + Math.random() * 200,
        life: 1,
      });
    }
    for (let i = reefCurrents.length - 1; i >= 0; i--) {
      const c = reefCurrents[i];
      c.x += c.dir * c.speed * 60 * effectiveDt;
      // Push player if within current band (80px wide)
      const inBandY = Math.abs(player.y - c.y) < 80;
      const inBandX = player.x > c.x - c.width / 2 && player.x < c.x + c.width / 2;
      if (inBandY && inBandX) {
        // Stronger base push
        player.x += c.dir * c.speed * 0.7 * 60 * effectiveDt;
        // Direction-aware: swimming with current = speed boost, against = slow
        const playerDirX = Math.cos(player.angle);
        const alignment = playerDirX * c.dir; // +1 = same dir, -1 = against
        if (alignment > 0.3) {
          // Swimming WITH current — 30% speed boost via position push
          player.x += c.dir * c.speed * 0.3 * 60 * effectiveDt;
        }
        // Against current: the base push already slows effective movement
      }
      // Push fish too (wider band)
      for (const f of fishes) {
        if (f.tier === 0) continue;
        const fInY = Math.abs(f.y - c.y) < 80;
        const fInX = f.x > c.x - c.width / 2 && f.x < c.x + c.width / 2;
        if (fInY && fInX) {
          f.x += c.dir * c.speed * 0.5 * 60 * effectiveDt;
        }
      }
      // Remove when off screen
      if ((c.dir > 0 && c.x > W + c.width) || (c.dir < 0 && c.x < -c.width)) {
        reefCurrents.splice(i, 1);
      }
    }
  } else {
    reefCurrents = [];
  }

  // --- Abyss ambush predators ---
  if (currentZone === 'abyss') {
    // Spawn ambush fish (quasi-invisible, activate when player is close)
    if (ambushFish.length < 4 && Math.random() < effectiveDt * 0.25) {
      // Place away from player
      let ax, ay;
      do {
        ax = 60 + Math.random() * (W - 120);
        ay = 60 + Math.random() * (H - 120);
      } while (Math.sqrt((ax - player.x) ** 2 + (ay - player.y) ** 2) < 250);
      ambushFish.push({
        x: ax, y: ay,
        tier: Math.min(TIER_COUNT - 1, player.tier + 1),
        radius: TIER_RADIUS[Math.min(TIER_COUNT - 1, player.tier + 1)] * radiusScale,
        angle: Math.random() * Math.PI * 2,
        tailPhase: Math.random() * Math.PI * 2,
        mouthOpen: 0,
        activated: false,
        warning: false,       // warning flash phase
        warningTimer: 0,      // 0.3s countdown before activation
        opacity: 0.06, // nearly invisible
        life: 15 + Math.random() * 10, // despawn timer
      });
    }
    for (let i = ambushFish.length - 1; i >= 0; i--) {
      const a = ambushFish[i];
      a.tailPhase += effectiveDt * 4;
      a.life -= effectiveDt;
      if (a.life <= 0) { ambushFish.splice(i, 1); continue; }

      const dToPlayer = Math.sqrt((a.x - player.x) ** 2 + (a.y - player.y) ** 2);

      // Warning phase: eyes glow 0.3s before activation (range 150px)
      if (!a.activated && !a.warning && dToPlayer < 150) {
        a.warning = true;
        a.warningTimer = 0.3;
      }
      if (a.warning && !a.activated) {
        a.warningTimer -= effectiveDt;
        // Pulse opacity for warning (eyes visible)
        a.opacity = 0.06 + 0.3 * Math.abs(Math.sin(gameTime * 20));
        if (a.warningTimer <= 0) {
          a.activated = true;
          shakeIntensity = Math.max(shakeIntensity, 5);
        }
      }
      if (a.activated) {
        a.opacity = Math.min(1, a.opacity + effectiveDt * 3);
        // Chase player
        const chaseAngle = Math.atan2(player.y - a.y, player.x - a.x);
        let ad = chaseAngle - a.angle;
        while (ad > Math.PI) ad -= Math.PI * 2;
        while (ad < -Math.PI) ad += Math.PI * 2;
        a.angle += ad * Math.min(1, effectiveDt * 5);
        const aSpd = PREDATOR_CHASE_SPEED_RATIO * PLAYER_BASE_SPEED * 0.9 * 60 * effectiveDt;
        a.x += Math.cos(a.angle) * aSpd;
        a.y += Math.sin(a.angle) * aSpd;

        // Collision with player — same as predator hit
        if (player.invincible <= 0 && dToPlayer < (player.radius + a.radius) * 0.7) {
          player.invincible = 1.5;
          player.eaten = 0;
          if (player.tier <= 1) {
            player.alive = false;
            running = false;
            haptic([30, 20, 60]);
            playGameOver();
            gameOver();
            return;
          }
          player.tier--;
          player.radius = TIER_RADIUS[player.tier] * radiusScale;
          player.targetRadius = player.radius;
          timeSinceLastHit = 0;
          adaptiveDangerSpawned = false;
          shakeIntensity = 12;
          spawnEatParticles(player.x, player.y, '#ff4444', 15);
          const kAngle = Math.atan2(player.y - a.y, player.x - a.x);
          player.x += Math.cos(kAngle) * 40;
          player.y += Math.sin(kAngle) * 40;
          haptic(50);
          playHurt();
          vignetteEl.style.opacity = '1';
          setTimeout(() => vignetteEl.style.opacity = '0', 200);
          ambushFish.splice(i, 1);
          continue;
        }

        // Despawn if off screen
        if (a.x < -80 || a.x > W + 80 || a.y < -80 || a.y > H + 80) {
          ambushFish.splice(i, 1);
        }
      }
    }
  } else {
    ambushFish = [];
  }

  // --- Camera shake ---
  if (shakeIntensity > 0.5) {
    shakeX = (Math.random() - 0.5) * shakeIntensity;
    shakeY = (Math.random() - 0.5) * shakeIntensity;
    shakeIntensity *= SHAKE_DECAY;
  } else {
    shakeX = shakeY = 0;
    shakeIntensity = 0;
  }

  boostBarEl.style.width = (boostFuel / BOOST_MAX * 100) + '%';

  const now = performance.now();
  if (now - lastHUDTime > 250) {
    lastHUDTime = now;
    updateHUD();
  }
}

function distBetween(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

// ============================================================
//  RENDER
// ============================================================

function render() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // --- Zone-based background ---
  const bg = ZONE_BG[currentZone] || ZONE_BG.surface;
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, bg.top);
  bgGrad.addColorStop(0.5, bg.mid);
  bgGrad.addColorStop(1, bg.bot);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // Light rays from top (intensity varies by zone)
  ctx.save();
  ctx.globalAlpha = bg.rayAlpha;
  const rayCount = currentZone === 'abyss' ? 2 : 5;
  for (let i = 0; i < rayCount; i++) {
    const rx = W * (0.15 + i * (0.7 / rayCount));
    const rw = 40 + i * 20;
    const rayH = currentZone === 'abyss' ? H * 0.3 : H * 0.7;
    const grad = ctx.createLinearGradient(rx, 0, rx, rayH);
    grad.addColorStop(0, bg.rayColor);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(rx - rw / 2, 0);
    ctx.lineTo(rx - rw * 1.5, rayH);
    ctx.lineTo(rx + rw * 1.5, rayH);
    ctx.lineTo(rx + rw / 2, 0);
    ctx.fill();
  }
  ctx.restore();

  // Reef zone: visible currents (water streaks)
  if (currentZone === 'reef') {
    ctx.save();
    for (const c of reefCurrents) {
      ctx.globalAlpha = 0.08;
      ctx.strokeStyle = '#66ccbb';
      ctx.lineWidth = 2;
      const halfW = c.width / 2;
      for (let s = -3; s <= 3; s++) {
        const sy = c.y + s * 18;
        ctx.beginPath();
        ctx.moveTo(c.x - halfW, sy);
        ctx.bezierCurveTo(c.x - halfW * 0.3, sy - 5, c.x + halfW * 0.3, sy + 5, c.x + halfW, sy);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // Reef zone: coral silhouettes at bottom
  if (currentZone === 'reef') {
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#44aa88';
    for (let i = 0; i < 8; i++) {
      const cx = W * (i / 8 + 0.02);
      const ch = 30 + Math.sin(i * 2.7) * 25;
      const cw = 20 + Math.sin(i * 1.3) * 12;
      ctx.beginPath();
      ctx.ellipse(cx, H - 5, cw, ch, 0, Math.PI, 0);
      ctx.fill();
    }
    ctx.restore();
  }

  // Abyss zone: scattered bioluminescent particles in background
  if (currentZone === 'abyss') {
    ctx.save();
    const bioTime = gameTime * 0.5;
    for (let i = 0; i < 15; i++) {
      const bx = (W * (0.1 + (i * 0.137) % 0.8) + Math.sin(bioTime + i * 1.7) * 30) % W;
      const by = (H * (0.1 + (i * 0.191) % 0.8) + Math.cos(bioTime + i * 2.3) * 20) % H;
      const pulse = 0.3 + 0.7 * Math.sin(bioTime * 2 + i * 0.9);
      ctx.globalAlpha = pulse * 0.15;
      const colors = ['#00ffcc', '#ff00ff', '#4488ff', '#ffff00'];
      ctx.fillStyle = colors[i % colors.length];
      ctx.beginPath();
      ctx.arc(bx, by, 2 + pulse * 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Bubbles (behind fish)
  for (const b of bubbles) {
    ctx.globalAlpha = b.life * 0.3;
    ctx.strokeStyle = '#88ccff';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(200,230,255,0.3)';
    ctx.beginPath();
    ctx.arc(b.x - b.size * 0.2, b.y - b.size * 0.2, b.size * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Jellyfish (between bubbles and fish)
  for (const j of jellyfish) {
    drawJellyfish(j);
  }

  // Enemy fish & plancton
  for (const f of fishes) {
    if (!f.alive) continue;
    if (f.tier === 0) {
      drawPlancton(f.x, f.y, f.radius, f.tailPhase, currentZone);
    } else {
      const r = f.sizeBoost > 0 ? f.radius * (1 + 0.08 * f.sizeBoost) : f.radius;
      drawFish(f.x, f.y, r, f.angle, f.tier, f.mouthOpen, f.tailPhase, false, currentZone);
    }
  }

  // Abyss ambush predators (drawn with variable opacity + warning eye glow)
  for (const a of ambushFish) {
    ctx.globalAlpha = a.opacity;
    drawFish(a.x, a.y, a.radius, a.angle, a.tier, a.mouthOpen, a.tailPhase, false, 'abyss');

    // Warning phase: bioluminescent eye glow before activation
    if (a.warning && !a.activated) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(gameTime * 25);
      const eyeOffX = Math.cos(a.angle) * a.radius * 0.4;
      const eyeOffY = Math.sin(a.angle) * a.radius * 0.4;
      const eyeGlow = ctx.createRadialGradient(
        a.x + eyeOffX, a.y + eyeOffY, 0,
        a.x + eyeOffX, a.y + eyeOffY, a.radius * 0.8
      );
      eyeGlow.addColorStop(0, 'rgba(255,50,50,0.8)');
      eyeGlow.addColorStop(0.5, 'rgba(255,50,50,0.2)');
      eyeGlow.addColorStop(1, 'rgba(255,0,0,0)');
      ctx.fillStyle = eyeGlow;
      ctx.beginPath();
      ctx.arc(a.x + eyeOffX, a.y + eyeOffY, a.radius * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // Player
  if (player && player.alive) {
    // Abyss zone: player halo (visibility light)
    if (currentZone === 'abyss') {
      const haloR = player.radius * 5;
      const halo = ctx.createRadialGradient(player.x, player.y, player.radius * 0.5, player.x, player.y, haloR);
      halo.addColorStop(0, 'rgba(100,200,255,0.12)');
      halo.addColorStop(0.5, 'rgba(60,140,200,0.05)');
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(player.x, player.y, haloR, 0, Math.PI * 2);
      ctx.fill();

      // Darkness mask (reduce visibility away from player)
      // Radial gradient: transparent near player, dark far away
      const darkR = Math.max(W, H);
      const dark = ctx.createRadialGradient(player.x, player.y, haloR * 0.7, player.x, player.y, darkR);
      dark.addColorStop(0, 'rgba(0,2,8,0)');
      dark.addColorStop(0.3, 'rgba(0,2,8,0.4)');
      dark.addColorStop(1, 'rgba(0,2,8,0.7)');
      ctx.fillStyle = dark;
      ctx.fillRect(-10, -10, W + 20, H + 20);
    }

    // Flash when invincible
    if (player.invincible > 0 && Math.sin(player.flashTimer * Math.PI) > 0) {
      ctx.globalAlpha = 0.4;
    }
    const pDrawR = player.radius * (1 + playerScaleBump);
    drawFish(player.x, player.y, pDrawR, player.angle, player.tier,
             player.mouthOpen, player.tailPhase, true, currentZone);
    ctx.globalAlpha = 1;

    // Tier-up golden flash overlay on player body
    if (tierUpFlashTimer > 0) {
      ctx.globalAlpha = tierUpFlashTimer / 0.3 * 0.4;
      ctx.fillStyle = '#ffcc00';
      ctx.beginPath();
      ctx.arc(player.x, player.y, pDrawR * 1.3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Player chevron indicator — small downward triangle above fish
    {
      const chevronY = player.y - pDrawR * 1.8 - 12;
      const chevronSize = 6;
      const pc = getFishColors(player.tier, currentZone);
      const pch = parseInt(pc.body.slice(1), 16);
      const pcr = (pch >> 16) & 0xff, pcg = (pch >> 8) & 0xff, pcb = pch & 0xff;
      const chevronPulse = 0.5 + 0.3 * Math.sin(gameTime * 3);
      ctx.globalAlpha = chevronPulse;
      ctx.fillStyle = `rgb(${pcr},${pcg},${pcb})`;
      ctx.beginPath();
      ctx.moveTo(player.x - chevronSize, chevronY - chevronSize);
      ctx.lineTo(player.x + chevronSize, chevronY - chevronSize);
      ctx.lineTo(player.x, chevronY + chevronSize * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Tier-up expansion ring (shockwave)
    if (tierUpRingAlpha > 0) {
      ctx.strokeStyle = tierUpRingColor;
      ctx.globalAlpha = tierUpRingAlpha;
      ctx.lineWidth = 3 * tierUpRingAlpha;
      ctx.beginPath();
      ctx.arc(player.x, player.y, tierUpRingRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // Jellyfish slow: purple tint over player
    if (playerSlowTimer > 0) {
      ctx.globalAlpha = 0.25 * (playerSlowTimer / 0.5);
      ctx.fillStyle = '#9944ff';
      ctx.beginPath();
      ctx.arc(player.x, player.y, pDrawR * 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // Boost trail
    if (boosting && boostFuel > 0) {
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = '#ffcc44';
      for (let i = 0; i < 3; i++) {
        const bx = player.x - Math.cos(player.angle) * (player.radius + 10 + i * 8) + (Math.random() - 0.5) * 6;
        const by = player.y - Math.sin(player.angle) * (player.radius + 10 + i * 8) + (Math.random() - 0.5) * 6;
        ctx.beginPath();
        ctx.arc(bx, by, 2 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating texts
  for (const ft of floatingTexts) {
    ctx.globalAlpha = ft.life;
    ctx.textAlign = 'center';
    if (ft.big) {
      ctx.font = 'bold 32px "Segoe UI", system-ui, sans-serif';
      if (ft.glow) {
        ctx.shadowColor = ft.color;
        ctx.shadowBlur = 20;
      }
    } else {
      ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
      ctx.shadowBlur = 0;
    }
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // Saturation flash overlay (frenzy effect)
  if (saturationFlash > 0) {
    ctx.globalAlpha = saturationFlash * 0.15;
    ctx.fillStyle = '#ffcc00';
    ctx.fillRect(-10, -10, W + 20, H + 20);
    ctx.globalAlpha = 1;
  }

  // Prestige zoom/darken animation
  if (inPrestige) {
    const t = 1 - (prestigeTimer / 1.5); // 0 → 1
    ctx.globalAlpha = t * 0.8;
    ctx.fillStyle = '#000010';
    ctx.fillRect(-10, -10, W + 20, H + 20);

    // Depth text
    ctx.globalAlpha = Math.min(1, t * 2);
    ctx.fillStyle = '#80e0ff';
    ctx.font = 'bold 28px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00aaff';
    ctx.shadowBlur = 20;
    ctx.fillText('Plongée...', W / 2, H / 2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ============================================================
//  GAME OVER
// ============================================================

function gameOver() {
  const finalScore = score;
  const isNewRecord = finalScore > highScore;

  if (isNewRecord) {
    highScore = finalScore;
    localStorage.setItem('deepfeed_hi', String(highScore));
  }

  const timeSurvived = ((performance.now() - startTime) / 1000).toFixed(1);

  // Build stats HTML
  let statsHTML = '';

  const addStat = (label, value, isRecord) => {
    const cls = isRecord ? 'stat-value record' : 'stat-value';
    statsHTML += `<div class="stat-row"><span class="stat-label">${label}</span><span class="${cls}">${value}</span></div>`;
  };

  addStat('Score', finalScore, isNewRecord);
  addStat('Poissons mangés', totalFishEaten, false);
  addStat('Taille max', TIER_NAMES[maxTierReached], false);
  addStat('Profondeur max', depthLevel > 1 ? `Profondeur ${maxDepthReached}` : 'Surface', false);
  if (bestFrenzy > 0) addStat('Meilleur Frenzy', `x${bestFrenzy}`, false);
  addStat('Temps', `${timeSurvived}s`, false);

  if (isNewRecord) {
    statsHTML = `<div style="color:#ffcc00;font-weight:700;margin-bottom:8px;font-size:16px;text-shadow:0 0 12px rgba(255,200,0,.4)">NOUVEAU RECORD!</div>` + statsHTML;
  }

  endStatsEl.innerHTML = statsHTML;
  playBtn.textContent = 'Replonger';
  overlay.classList.remove('hidden');
  updateHUD();

  initTitleAmbient();
  titleLastTime = performance.now();
  titleRafId = requestAnimationFrame(titleLoop);
}

// ============================================================
//  GAME LOOP
// ============================================================

let lastTime = 0;
let rafId = null;
let safetyInterval = null;

function loop(timestamp) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  update(dt);
  render();
}

function startLoop() {
  lastTime = performance.now();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);

  if (safetyInterval) clearInterval(safetyInterval);
  safetyInterval = setInterval(() => {
    if (running && !document.hidden) {
      lastTime = performance.now();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }
  }, 2000);
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && running) {
    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
});

//  START / RESTART
