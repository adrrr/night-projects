<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Deep Feed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#001020;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}

/* HUD */
#hud{position:absolute;top:0;left:0;width:100%;pointer-events:none;padding:14px 16px;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;z-index:5}
#score{font-size:22px;font-weight:700;text-shadow:0 2px 8px rgba(0,160,255,.5)}
#highscore{font-size:12px;opacity:.6;margin-top:2px}
#size-info{margin-top:8px;font-size:13px;opacity:.8}
#size-bar-wrap{margin-top:4px;width:130px;height:7px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
#size-bar{height:100%;width:0%;border-radius:4px;transition:width .3s ease}
#boost-wrap{margin-top:5px;width:130px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#boost-bar{height:100%;width:100%;background:linear-gradient(90deg,#ffcc00,#ff8800);border-radius:3px;transition:width .1s}

/* Overlay screens */
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,8,24,.88);z-index:10;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;text-align:center;transition:opacity .4s}
#overlay.hidden{opacity:0;pointer-events:none}
#overlay h1{font-size:clamp(32px,7vw,56px);margin-bottom:6px;background:linear-gradient(135deg,#00e0ff,#0080ff,#00e0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px rgba(0,180,255,.4))}
#overlay .sub{font-size:clamp(13px,3vw,18px);opacity:.7;margin-bottom:24px;max-width:300px;line-height:1.4}
#overlay .stats{font-size:15px;margin-bottom:16px;opacity:.65;line-height:1.6}
.play-btn{pointer-events:all;padding:14px 44px;font-size:clamp(16px,3.5vw,22px);font-weight:600;border:2px solid rgba(0,200,255,.5);background:rgba(0,60,100,.4);color:#fff;border-radius:30px;cursor:pointer;transition:all .25s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.play-btn:hover,.play-btn:active{background:rgba(0,120,180,.5);border-color:#0ff;box-shadow:0 0 30px rgba(0,200,255,.3)}
.hint{font-size:11px;opacity:.4;margin-top:12px}

/* Damage vignette */
#vignette{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,0,.35) 100%);transition:opacity .15s;z-index:4}

/* Orientation hint */
#orient-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;color:rgba(255,255,255,.6);background:rgba(0,30,60,.7);padding:8px 16px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .4s;z-index:6;white-space:nowrap}
#orient-hint.visible{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="score">Score: 0</div>
  <div id="highscore"></div>
  <div id="size-info">Size: Tiny</div>
  <div id="size-bar-wrap"><div id="size-bar"></div></div>
  <div id="boost-wrap"><div id="boost-bar"></div></div>
</div>

<div id="vignette"></div>
<div id="orient-hint">Rotate to portrait for a better experience</div>

<div id="overlay">
  <h1>Deep Feed</h1>
  <div class="sub">Eat smaller fish to grow bigger. Avoid the big ones!</div>
  <div class="stats" id="end-stats"></div>
  <button class="play-btn" id="play-btn">Dive In</button>
  <div class="hint">Tap &amp; hold to boost</div>
</div>

<script>
'use strict';

// ============================================================
//  CONSTANTS & CONFIG
// ============================================================

const TIER_COUNT = 6;
const TIER_NAMES = ['Plancton', 'Fry', 'Small', 'Medium', 'Large', 'Huge'];
const TIER_COLORS = [
  { body: '#88ffff', fin: '#88ffff', eye: '#fff' },  // 0 plancton (cyan glow)
  { body: '#66ee66', fin: '#44cc44', eye: '#fff' },  // 1 fry green
  { body: '#44aaff', fin: '#2288dd', eye: '#fff' },  // 2 blue
  { body: '#ff9933', fin: '#dd7711', eye: '#fff' },  // 3 orange
  { body: '#ff4444', fin: '#cc2222', eye: '#fff' },  // 4 red
  { body: '#bb55ff', fin: '#9933dd', eye: '#ff0' },  // 5 purple boss
];
// Base radius per tier (player radius at that tier)
const TIER_RADIUS = [7, 14, 22, 34, 50, 72];
// How many fish eaten to advance from tier i to tier i+1
const TIER_THRESHOLDS = [8, 5, 10, 18, 30];
// Enemy speed multiplier per tier (player is always faster)
const ENEMY_SPEED = [0.5, 0.7, 0.65, 0.55, 0.5, 0.4];

// Plancton config
const PLANCTON_TARGET_COUNT = 12; // keep 10-15 on screen
const MAX_PLANCTON = 20;

const MAX_FISH = 50;
const MAX_PARTICLES = 120;
const MAX_BUBBLES = 40;
const MIN_VISIBLE = 18;

// Fish-fish eating config
const FISH_EAT_CHECK_INTERVAL = 10; // check every N frames
const FISH_EAT_GLOBAL_COOLDOWN = 1.0; // max 1 eat per second globally
const FISH_EAT_PER_FISH_COOLDOWN = 4; // seconds after eating

const PLAYER_BASE_SPEED = 4.5;
const BOOST_MULT = 1.7;
const BOOST_MAX = 100;
const BOOST_DRAIN = 1.2;
const BOOST_REGEN = 0.35;

const SHAKE_DECAY = 0.88;

// Reference screen size for radius scaling (desktop baseline)
const REF_SCREEN = 900;

// ============================================================
//  DOM REFS
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const playBtn = document.getElementById('play-btn');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highscore');
const sizeInfoEl = document.getElementById('size-info');
const sizeBarEl = document.getElementById('size-bar');
const boostBarEl = document.getElementById('boost-bar');
const vignetteEl = document.getElementById('vignette');
const endStatsEl = document.getElementById('end-stats');
const orientHintEl = document.getElementById('orient-hint');

// ============================================================
//  AUDIO (Web Audio API — lazy init)
// ============================================================

let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playEat() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(400, t);
  o.frequency.exponentialRampToValueAtTime(800, t + 0.06);
  o.frequency.exponentialRampToValueAtTime(500, t + 0.12);
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.15);
  // Add a short noise burst for crunch
  const bufSize = audioCtx.sampleRate * 0.04;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3 * (1 - i / bufSize);
  const noise = audioCtx.createBufferSource();
  noise.buffer = buf;
  const ng = audioCtx.createGain();
  ng.gain.setValueAtTime(0.15, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  noise.connect(ng).connect(audioCtx.destination);
  noise.start(t);
  noise.stop(t + 0.06);
}

function playHurt() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(300, t);
  o.frequency.exponentialRampToValueAtTime(100, t + 0.25);
  g.gain.setValueAtTime(0.15, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + 0.3);
}

function playGameOver() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  [260, 220, 180, 140].forEach((freq, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t + i * 0.2);
    g.gain.setValueAtTime(0.12, t + i * 0.2);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.2 + 0.3);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + i * 0.2);
    o.stop(t + i * 0.2 + 0.35);
  });
}

// ============================================================
//  HAPTIC FEEDBACK
// ============================================================

function haptic(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch(e) {}
}

// ============================================================
//  FLOATING SCORE TEXT
// ============================================================

function spawnFloatingText(x, y, text, color) {
  if (floatingTexts.length >= MAX_FLOATING_TEXTS) return;
  floatingTexts.push({ x, y, text, color: color || '#fff', life: 1, decay: 0.015 });
}

// ============================================================
//  GAME STATE
// ============================================================

let W, H;                  // canvas pixel size
let running = false;
let gameTime = 0;          // seconds since game start
let score = 0;
let highScore = parseInt(localStorage.getItem('deepfeed_hi') || '0', 10);

// Player
let player = null;

// Entities
let fishes = [];
let particles = [];
let bubbles = [];

// Input
let pointer = { x: 0, y: 0, active: false };
let boosting = false;
let boostFuel = BOOST_MAX;

// Camera shake
let shakeX = 0, shakeY = 0, shakeIntensity = 0;

// Fish-fish eating state
let frameCount = 0;
let lastFishEatTime = 0; // gameTime of last fish-fish eat
let pendingRespawns = []; // {tier, delay} entries

// Touch detection & finger offset
let isTouch = false;
const TOUCH_OFFSET_Y = 80;

// Radius scale factor (computed on resize)
let radiusScale = 1;

// HUD throttle
let lastHUDTime = 0;

// Floating score texts
let floatingTexts = [];
const MAX_FLOATING_TEXTS = 20;

// Player eat scale bump
let playerScaleBump = 0;

// Title screen ambient state
let titleBubbles = [];
let titlePlancton = [];

// ============================================================
//  RESIZE
// ============================================================

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Scale radius based on screen size (smaller screens → smaller fish)
  radiusScale = Math.max(0.45, Math.min(1, Math.min(W, H) / REF_SCREEN));

  // Orientation hint (landscape on small screen = probably mobile)
  if (orientHintEl) {
    const isMobileSize = Math.min(W, H) < 500;
    const isLandscape = W > H * 1.2;
    orientHintEl.classList.toggle('visible', isMobileSize && isLandscape);
  }
}
window.addEventListener('resize', resize);
resize();

// ============================================================
//  FISH DRAWING
// ============================================================

function drawFish(x, y, radius, angle, tier, mouthOpen, tailPhase, isPlayer) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  const c = TIER_COLORS[tier];
  const r = radius;
  const bodyLen = r * 2.2;
  const bodyH = r * 1.1;

  // Tail wag
  const tailWag = Math.sin(tailPhase) * 0.3;

  // Shadow beneath
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.ellipse(2, 3, bodyLen * 0.48, bodyH * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Tail fin
  ctx.save();
  ctx.translate(-bodyLen * 0.4, 0);
  ctx.rotate(tailWag);
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(-r * 0.9, -r * 0.7);
  ctx.quadraticCurveTo(-r * 0.5, 0, -r * 0.9, r * 0.7);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Body
  ctx.fillStyle = c.body;
  ctx.beginPath();
  ctx.ellipse(0, 0, bodyLen * 0.45, bodyH, 0, 0, Math.PI * 2);
  ctx.fill();

  // Body shine
  const grad = ctx.createRadialGradient(-r * 0.2, -r * 0.3, 0, 0, 0, r * 1.2);
  grad.addColorStop(0, 'rgba(255,255,255,0.25)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(0, 0, bodyLen * 0.45, bodyH, 0, 0, Math.PI * 2);
  ctx.fill();

  // Dorsal fin
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(-r * 0.2, -bodyH * 0.85);
  ctx.quadraticCurveTo(r * 0.1, -bodyH * 1.5, r * 0.4, -bodyH * 0.85);
  ctx.closePath();
  ctx.fill();

  // Pectoral fin (bottom)
  ctx.fillStyle = c.fin;
  ctx.beginPath();
  ctx.moveTo(r * 0.05, bodyH * 0.6);
  ctx.quadraticCurveTo(r * 0.1, bodyH * 1.3, -r * 0.3, bodyH * 0.9);
  ctx.closePath();
  ctx.fill();

  // Mouth
  if (mouthOpen > 0) {
    ctx.fillStyle = '#331111';
    ctx.beginPath();
    const mx = bodyLen * 0.42;
    const mo = mouthOpen * r * 0.35;
    ctx.ellipse(mx, 0, r * 0.15, mo, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Eye
  const eyeX = r * 0.4;
  const eyeY = -r * 0.25;
  const eyeR = r * 0.2;
  ctx.fillStyle = c.eye;
  ctx.beginPath();
  ctx.arc(eyeX, eyeY, eyeR, 0, Math.PI * 2);
  ctx.fill();
  // Pupil
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(eyeX + eyeR * 0.25, eyeY, eyeR * 0.55, 0, Math.PI * 2);
  ctx.fill();
  // Glint
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(eyeX + eyeR * 0.45, eyeY - eyeR * 0.25, eyeR * 0.2, 0, Math.PI * 2);
  ctx.fill();

  // Player glow ring
  if (isPlayer) {
    ctx.strokeStyle = 'rgba(0,220,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, bodyLen * 0.5 + 4, bodyH + 4, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

// ============================================================
//  PLANCTON DRAWING — bioluminescent dots, NOT fish
// ============================================================

function drawPlancton(x, y, radius, phase) {
  const pulse = 0.7 + 0.3 * Math.sin(phase);
  const glowR = radius * 2.5 * pulse;

  // Outer glow
  const grad = ctx.createRadialGradient(x, y, 0, x, y, glowR);
  grad.addColorStop(0, 'rgba(140,255,255,0.5)');
  grad.addColorStop(0.4, 'rgba(100,220,255,0.2)');
  grad.addColorStop(1, 'rgba(60,180,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, glowR, 0, Math.PI * 2);
  ctx.fill();

  // Bright core
  ctx.fillStyle = `rgba(220,255,255,${0.6 + 0.4 * pulse})`;
  ctx.beginPath();
  ctx.arc(x, y, radius * pulse, 0, Math.PI * 2);
  ctx.fill();
}

// ============================================================
//  PARTICLE & BUBBLE
// ============================================================

function spawnEatParticles(x, y, color, count) {
  for (let i = 0; i < count && particles.length < MAX_PARTICLES; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      size: 2 + Math.random() * 4,
      color,
    });
  }
}

function spawnBubble(x, y) {
  if (bubbles.length >= MAX_BUBBLES) return;
  bubbles.push({
    x: x + (Math.random() - 0.5) * 10,
    y,
    vy: -0.5 - Math.random() * 1.5,
    size: 1 + Math.random() * 3,
    life: 1,
    decay: 0.005 + Math.random() * 0.005,
  });
}

// ============================================================
//  ENEMY FISH
// ============================================================

function createFish(tier, forceEdge, scatterOnScreen) {
  const r = TIER_RADIUS[tier] * radiusScale * (0.85 + Math.random() * 0.3);
  let x, y, angle;

  if (scatterOnScreen) {
    // Spawn anywhere on screen (for initial population)
    x = r + Math.random() * (W - r * 2);
    y = r + Math.random() * (H - r * 2);
    angle = Math.random() * Math.PI * 2;
  } else if (forceEdge || !player) {
    // Spawn from screen edges
    const side = Math.floor(Math.random() * 4);
    const margin = r * 2;
    switch (side) {
      case 0: x = -margin;          y = Math.random() * H; break; // left
      case 1: x = W + margin;       y = Math.random() * H; break; // right
      case 2: x = Math.random() * W; y = -margin; break;          // top
      case 3: x = Math.random() * W; y = H + margin; break;      // bottom
    }
    // Aim roughly towards center area
    const tx = W * (0.2 + Math.random() * 0.6);
    const ty = H * (0.2 + Math.random() * 0.6);
    angle = Math.atan2(ty - y, tx - x);
  } else {
    // Shouldn't happen but fallback
    x = Math.random() * W;
    y = Math.random() * H;
    angle = Math.random() * Math.PI * 2;
  }

  const baseSpeed = (1.2 + Math.random() * 0.8) * ENEMY_SPEED[tier];
  return {
    x, y, angle,
    radius: r,
    tier,
    speed: baseSpeed,
    tailPhase: Math.random() * Math.PI * 2,
    mouthOpen: 0,
    alive: true,
    turnTimer: 1 + Math.random() * 3,
    targetAngle: angle,
    // Fleeing state
    fleeing: false,
    fleeTimer: 0,
    // Fish-fish eating cooldown
    eatCooldown: 0,
    // Temporary size boost after eating (cosmetic)
    sizeBoost: 0,
  };
}

function chooseTier(playerTier, elapsed) {
  // Plancton (tier 0) is spawned separately — chooseTier only picks tier 1+
  const maxSpawnTier = Math.min(TIER_COUNT - 1, playerTier + 1);
  const weights = [];
  for (let t = 0; t < TIER_COUNT; t++) {
    if (t === 0 || t > maxSpawnTier) { weights.push(0); continue; }
    if (t < playerTier) {
      // Food fish — always plenty
      weights.push(t === playerTier - 1 ? 4 : 2);
    } else if (t === playerTier) {
      // Same size — some
      weights.push(1.5);
    } else {
      // Bigger = danger, rarer early, more later
      const dangerScale = Math.min(1, elapsed / 60);
      weights.push(0.5 + dangerScale * 1.5);
    }
  }
  const total = weights.reduce((a, b) => a + b, 0);
  if (total <= 0) return 1; // fallback
  let r = Math.random() * total;
  for (let t = 0; t < TIER_COUNT; t++) {
    r -= weights[t];
    if (r <= 0) return t;
  }
  return 1;
}

// ============================================================
//  PLAYER
// ============================================================

function createPlayer() {
  return {
    x: W / 2,
    y: H / 2,
    angle: 0,
    tier: 1,              // start as Fry (tier 1)
    radius: TIER_RADIUS[1] * radiusScale,
    tailPhase: 0,
    mouthOpen: 0,
    eaten: 0,          // fish eaten in current tier
    totalEaten: 0,     // total fish eaten (score)
    alive: true,
    invincible: 0,     // seconds of invincibility after hit
    flashTimer: 0,
  };
}

// ============================================================
//  GAME INIT
// ============================================================

function initGame() {
  player = createPlayer();
  fishes = [];
  particles = [];
  bubbles = [];
  score = 0;
  gameTime = 0;
  boostFuel = BOOST_MAX;
  shakeIntensity = 0;
  frameCount = 0;
  lastFishEatTime = 0;
  pendingRespawns = [];

  // Spawn initial plancton (10-15) scattered on screen
  const planctonCount = 10 + Math.floor(Math.random() * 6);
  for (let i = 0; i < planctonCount; i++) {
    fishes.push(createFish(0, false, true));
  }
  // Spawn tier 1 Fry (5-8) from edges
  const fryCount = 5 + Math.floor(Math.random() * 4);
  for (let i = 0; i < fryCount; i++) {
    fishes.push(createFish(1, true));
  }
  // Spawn tier 2 Small (2-3) from edges
  const smallCount = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < smallCount; i++) {
    fishes.push(createFish(2, true));
  }

  updateHUD();
}

// ============================================================
//  INPUT HANDLING
// ============================================================

function getPointerPos(e) {
  const touch = e.touches ? e.touches[0] : e;
  if (!touch) return;
  // Detect touch input
  if (e.type && (e.type.startsWith('touch') || (e.pointerType && e.pointerType === 'touch'))) {
    isTouch = true;
  } else if (e.type && (e.type.startsWith('mouse') || (e.pointerType && e.pointerType === 'mouse'))) {
    isTouch = false;
  }
  pointer.x = touch.clientX;
  pointer.y = touch.clientY - (isTouch ? TOUCH_OFFSET_Y : 0);
  pointer.active = true;
}

function onPointerDown(e) {
  e.preventDefault();
  ensureAudio();
  getPointerPos(e);
  boosting = true;
}
function onPointerMove(e) {
  e.preventDefault();
  getPointerPos(e);
}
function onPointerUp(e) {
  e.preventDefault();
  boosting = false;
}

// Pointer events (primary)
canvas.addEventListener('pointerdown', onPointerDown, { passive: false });
canvas.addEventListener('pointermove', onPointerMove, { passive: false });
canvas.addEventListener('pointerup', onPointerUp, { passive: false });
canvas.addEventListener('pointercancel', onPointerUp, { passive: false });

// Touch fallback for in-app browsers
canvas.addEventListener('touchstart', onPointerDown, { passive: false });
canvas.addEventListener('touchmove', onPointerMove, { passive: false });
canvas.addEventListener('touchend', onPointerUp, { passive: false });
canvas.addEventListener('touchcancel', onPointerUp, { passive: false });

// Mouse fallback
canvas.addEventListener('mousedown', (e) => { isTouch = false; ensureAudio(); pointer.active = true; boosting = true; });
canvas.addEventListener('mouseup', () => { boosting = false; });
canvas.addEventListener('mousemove', (e) => { isTouch = false; pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });

// ============================================================
//  HUD UPDATE
// ============================================================

function updateHUD() {
  scoreEl.textContent = `Score: ${score}`;
  if (highScore > 0) highScoreEl.textContent = `Best: ${highScore}`;

  if (player) {
    sizeInfoEl.textContent = `Size: ${TIER_NAMES[player.tier]}`;
    // Progress bar to next tier
    if (player.tier < TIER_COUNT - 1) {
      const progress = (player.eaten / TIER_THRESHOLDS[player.tier]) * 100;
      sizeBarEl.style.width = Math.min(100, progress) + '%';
      sizeBarEl.style.background = `linear-gradient(90deg, ${TIER_COLORS[player.tier].body}, ${TIER_COLORS[player.tier + 1].body})`;
    } else {
      sizeBarEl.style.width = '100%';
      sizeBarEl.style.background = TIER_COLORS[player.tier].body;
    }
  }
  boostBarEl.style.width = (boostFuel / BOOST_MAX * 100) + '%';
}

// ============================================================
//  COLLISION
// ============================================================

function circlesOverlap(ax, ay, ar, bx, by, br) {
  const dx = ax - bx, dy = ay - by;
  const dist = Math.sqrt(dx * dx + dy * dy);
  return dist < (ar + br) * 0.7; // 0.7 = forgiving overlap
}

// ============================================================
//  UPDATE
// ============================================================

function update(dt) {
  if (!running || !player) return;

  gameTime += dt;

  // --- Player movement ---
  if (pointer.active) {
    const dx = pointer.x - player.x;
    const dy = pointer.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > 2) {
      const targetAngle = Math.atan2(dy, dx);
      // Smooth rotation
      let angleDiff = targetAngle - player.angle;
      while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
      while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
      player.angle += angleDiff * Math.min(1, dt * 12);

      // Speed — player is always fast, boost makes faster
      let speed = PLAYER_BASE_SPEED;
      if (boosting && boostFuel > 0) {
        speed *= BOOST_MULT;
        boostFuel = Math.max(0, boostFuel - BOOST_DRAIN);
      }
      // Don't overshoot
      const move = Math.min(dist, speed * (60 * dt));
      player.x += (dx / dist) * move;
      player.y += (dy / dist) * move;
    }
  }

  // Boost regen when not boosting
  if (!boosting) {
    boostFuel = Math.min(BOOST_MAX, boostFuel + BOOST_REGEN);
  }

  // Keep player on screen
  const pr = player.radius;
  player.x = Math.max(pr, Math.min(W - pr, player.x));
  player.y = Math.max(pr, Math.min(H - pr, player.y));

  // Player animation
  player.tailPhase += dt * (boosting ? 18 : 10);
  player.mouthOpen = Math.max(0, player.mouthOpen - dt * 4);

  // Invincibility cooldown
  if (player.invincible > 0) {
    player.invincible -= dt;
    player.flashTimer += dt * 12;
  }

  frameCount++;

  // --- Enemy fish AI ---
  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i];
    if (!f.alive) { fishes.splice(i, 1); continue; }

    // Timers
    if (f.eatCooldown > 0) f.eatCooldown -= dt;
    if (f.sizeBoost > 0) f.sizeBoost -= dt;
    f.mouthOpen = Math.max(0, f.mouthOpen - dt * 4);

    // Movement & animation
    f.tailPhase += dt * (8 + f.speed * 3);

    // Plancton: simple drift, no complex AI
    if (f.tier === 0) {
      f.turnTimer -= dt;
      if (f.turnTimer <= 0) {
        f.turnTimer = 3 + Math.random() * 4;
        f.targetAngle = f.angle + (Math.random() - 0.5) * 2;
      }
      let aDiff = f.targetAngle - f.angle;
      while (aDiff > Math.PI) aDiff -= Math.PI * 2;
      while (aDiff < -Math.PI) aDiff += Math.PI * 2;
      f.angle += aDiff * Math.min(1, dt * 1.5);

      const spd = f.speed * 0.5 * 60 * dt; // slow drift
      f.x += Math.cos(f.angle) * spd;
      f.y += Math.sin(f.angle) * spd;

      // Keep on screen (soft bounce)
      if (f.x < 20) f.targetAngle = 0;
      if (f.x > W - 20) f.targetAngle = Math.PI;
      if (f.y < 20) f.targetAngle = Math.PI / 2;
      if (f.y > H - 20) f.targetAngle = -Math.PI / 2;

      // Remove if way off screen
      const margin = 150;
      if (f.x < -margin || f.x > W + margin || f.y < -margin || f.y > H + margin) {
        fishes.splice(i, 1);
        continue;
      }
    } else {
      // Normal fish AI
      f.turnTimer -= dt;
      if (f.turnTimer <= 0) {
        f.turnTimer = 2 + Math.random() * 4;
        if (player.tier > f.tier && distBetween(player, f) < 250) {
          f.fleeing = true;
          f.fleeTimer = 1.5 + Math.random();
          f.targetAngle = Math.atan2(f.y - player.y, f.x - player.x);
        } else if (player.tier < f.tier && distBetween(player, f) < 300) {
          f.targetAngle = Math.atan2(player.y - f.y, player.x - f.x);
        } else {
          f.targetAngle = f.angle + (Math.random() - 0.5) * 1.5;
        }
      }

      if (f.fleeing) {
        f.fleeTimer -= dt;
        if (f.fleeTimer <= 0) f.fleeing = false;
        f.targetAngle = Math.atan2(f.y - player.y, f.x - player.x);
      }

      let aDiff = f.targetAngle - f.angle;
      while (aDiff > Math.PI) aDiff -= Math.PI * 2;
      while (aDiff < -Math.PI) aDiff += Math.PI * 2;
      f.angle += aDiff * Math.min(1, dt * 3);

      const spd = f.speed * (f.fleeing ? 1.5 : 1) * 60 * dt;
      f.x += Math.cos(f.angle) * spd;
      f.y += Math.sin(f.angle) * spd;

      // Remove if way off screen
      const margin = f.radius * 4 + 100;
      if (f.x < -margin || f.x > W + margin || f.y < -margin || f.y > H + margin) {
        fishes.splice(i, 1);
        continue;
      }

      // Bounce off edges gently
      if (f.x < f.radius) f.targetAngle = 0;
      if (f.x > W - f.radius) f.targetAngle = Math.PI;
      if (f.y < f.radius) f.targetAngle = Math.PI / 2;
      if (f.y > H - f.radius) f.targetAngle = -Math.PI / 2;
    }

    // --- Collision with player ---
    // Plancton: easier to eat (just pass over, use full radius sum)
    const overlapFactor = f.tier === 0 ? 0.9 : 0.7;
    const dx = player.x - f.x, dy = player.y - f.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < (player.radius + f.radius) * overlapFactor) {
      if (f.tier < player.tier) {
        // EAT!
        f.alive = false;
        score++;
        player.totalEaten++;
        player.eaten++;
        player.mouthOpen = 1;

        // Level up?
        if (player.tier < TIER_COUNT - 1 && player.eaten >= TIER_THRESHOLDS[player.tier]) {
          player.tier++;
          player.eaten = 0;
          player.radius = TIER_RADIUS[player.tier] * radiusScale;
          shakeIntensity = 8;
          spawnEatParticles(player.x, player.y, TIER_COLORS[player.tier].body, 20);
        }

        // Particles + bubble (smaller for plancton)
        const pCount = f.tier === 0 ? 3 : 6;
        spawnEatParticles(f.x, f.y, TIER_COLORS[f.tier].body, pCount);
        if (f.tier > 0) spawnBubble(f.x, f.y);
        shakeIntensity = Math.max(shakeIntensity, f.tier === 0 ? 1 : 3);

        // Score popup
        spawnFloatingText(f.x, f.y, '+1', TIER_COLORS[f.tier].body);
        // Scale bump
        playerScaleBump = 0.15;
        // Haptic
        haptic(10);

        playEat();
      } else if (f.tier > player.tier && player.invincible <= 0) {
        // HURT — shrink
        player.invincible = 1.5;
        player.eaten = 0;

        if (player.tier <= 1) {
          // Game over (tier 1 is the lowest playable tier)
          player.alive = false;
          running = false;
          haptic([30, 20, 60]);
          playGameOver();
          gameOver();
          return;
        }

        player.tier--;
        player.radius = TIER_RADIUS[player.tier] * radiusScale;
        shakeIntensity = 12;
        spawnEatParticles(player.x, player.y, '#ff4444', 15);

        const kAngle = Math.atan2(player.y - f.y, player.x - f.x);
        player.x += Math.cos(kAngle) * 40;
        player.y += Math.sin(kAngle) * 40;

        haptic(50);
        playHurt();
        vignetteEl.style.opacity = '1';
        setTimeout(() => vignetteEl.style.opacity = '0', 200);
      }
    }
  }

  // --- Fish-fish eating (throttled: every N frames) ---
  if (frameCount % FISH_EAT_CHECK_INTERVAL === 0 && gameTime - lastFishEatTime >= FISH_EAT_GLOBAL_COOLDOWN) {
    fishFishEating:
    for (let i = 0; i < fishes.length; i++) {
      const a = fishes[i];
      if (!a.alive || a.tier <= 0 || a.eatCooldown > 0) continue;
      for (let j = 0; j < fishes.length; j++) {
        if (i === j) continue;
        const b = fishes[j];
        if (!b.alive || b.tier >= a.tier) continue;
        // Check proximity
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < (a.radius + b.radius) * 0.7) {
          // a eats b
          b.alive = false;
          a.mouthOpen = 1;
          a.eatCooldown = FISH_EAT_PER_FISH_COOLDOWN;
          a.sizeBoost = 1.5; // cosmetic size bump for 1.5s
          lastFishEatTime = gameTime;

          // Particles
          spawnEatParticles(b.x, b.y, TIER_COLORS[b.tier].body, 5);
          spawnBubble(b.x, b.y);

          // Schedule compensatory respawn (same tier as eaten fish)
          const respawnTier = b.tier;
          const respawnDelay = 2 + Math.random();
          pendingRespawns.push({ tier: respawnTier, time: gameTime + respawnDelay });

          break fishFishEating; // max 1 per check
        }
      }
    }
  }

  // --- Process pending respawns ---
  for (let i = pendingRespawns.length - 1; i >= 0; i--) {
    if (gameTime >= pendingRespawns[i].time && fishes.length < MAX_FISH) {
      fishes.push(createFish(pendingRespawns[i].tier, true));
      pendingRespawns.splice(i, 1);
    }
  }

  // --- Spawn new fish ---
  // Count visible fish and plancton separately
  let visibleCount = 0;
  let planctonCount = 0;
  for (const f of fishes) {
    if (f.tier === 0) { planctonCount++; continue; }
    if (f.x > -50 && f.x < W + 50 && f.y > -50 && f.y < H + 50) visibleCount++;
  }

  // Maintain plancton population
  while (planctonCount < PLANCTON_TARGET_COUNT && fishes.length < MAX_FISH) {
    fishes.push(createFish(0, true));
    planctonCount++;
  }

  // Maintain regular fish population
  while (visibleCount < MIN_VISIBLE && fishes.length < MAX_FISH) {
    const tier = chooseTier(player.tier, gameTime);
    fishes.push(createFish(tier, true));
    visibleCount++;
  }
  // Also periodic spawn
  if (Math.random() < dt * 2 && fishes.length < MAX_FISH) {
    fishes.push(createFish(chooseTier(player.tier, gameTime), true));
  }

  // --- Particles ---
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); }
  }

  // --- Bubbles ---
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y += b.vy;
    b.x += Math.sin(b.y * 0.05) * 0.3;
    b.life -= b.decay;
    if (b.life <= 0) { bubbles.splice(i, 1); }
  }

  // Ambient bubbles
  if (Math.random() < dt * 2) {
    spawnBubble(Math.random() * W, H + 5);
  }

  // --- Floating texts ---
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y -= 1.2;
    ft.life -= ft.decay;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  // --- Player scale bump decay ---
  if (playerScaleBump > 0) {
    playerScaleBump = Math.max(0, playerScaleBump - dt * 0.75); // ~200ms to decay
  }

  // --- Camera shake ---
  if (shakeIntensity > 0.5) {
    shakeX = (Math.random() - 0.5) * shakeIntensity;
    shakeY = (Math.random() - 0.5) * shakeIntensity;
    shakeIntensity *= SHAKE_DECAY;
  } else {
    shakeX = shakeY = 0;
    shakeIntensity = 0;
  }

  // HUD update (throttled to ~4/s)
  const now = performance.now();
  if (now - lastHUDTime > 250) {
    lastHUDTime = now;
    updateHUD();
  }
}

function distBetween(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

// ============================================================
//  RENDER
// ============================================================

function render() {
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Background — deep ocean gradient
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#001830');
  bgGrad.addColorStop(0.5, '#001020');
  bgGrad.addColorStop(1, '#000818');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // Subtle light rays from top
  ctx.save();
  ctx.globalAlpha = 0.04;
  for (let i = 0; i < 5; i++) {
    const rx = W * (0.15 + i * 0.18);
    const rw = 40 + i * 20;
    const grad = ctx.createLinearGradient(rx, 0, rx, H * 0.7);
    grad.addColorStop(0, '#88ccff');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(rx - rw / 2, 0);
    ctx.lineTo(rx - rw * 1.5, H * 0.7);
    ctx.lineTo(rx + rw * 1.5, H * 0.7);
    ctx.lineTo(rx + rw / 2, 0);
    ctx.fill();
  }
  ctx.restore();

  // Bubbles (behind fish)
  for (const b of bubbles) {
    ctx.globalAlpha = b.life * 0.3;
    ctx.strokeStyle = '#88ccff';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
    ctx.stroke();
    // Tiny highlight
    ctx.fillStyle = 'rgba(200,230,255,0.3)';
    ctx.beginPath();
    ctx.arc(b.x - b.size * 0.2, b.y - b.size * 0.2, b.size * 0.3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Enemy fish & plancton
  for (const f of fishes) {
    if (!f.alive) continue;
    if (f.tier === 0) {
      drawPlancton(f.x, f.y, f.radius, f.tailPhase);
    } else {
      const r = f.sizeBoost > 0 ? f.radius * (1 + 0.08 * f.sizeBoost) : f.radius;
      drawFish(f.x, f.y, r, f.angle, f.tier, f.mouthOpen, f.tailPhase, false);
    }
  }

  // Player
  if (player && player.alive) {
    // Flash when invincible
    if (player.invincible > 0 && Math.sin(player.flashTimer * Math.PI) > 0) {
      ctx.globalAlpha = 0.4;
    }
    const pDrawR = player.radius * (1 + playerScaleBump);
    drawFish(player.x, player.y, pDrawR, player.angle, player.tier,
             player.mouthOpen, player.tailPhase, true);
    ctx.globalAlpha = 1;

    // Boost trail when sprinting
    if (boosting && boostFuel > 0) {
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = '#ffcc44';
      for (let i = 0; i < 3; i++) {
        const bx = player.x - Math.cos(player.angle) * (player.radius + 10 + i * 8) + (Math.random() - 0.5) * 6;
        const by = player.y - Math.sin(player.angle) * (player.radius + 10 + i * 8) + (Math.random() - 0.5) * 6;
        ctx.beginPath();
        ctx.arc(bx, by, 2 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating score texts
  ctx.font = 'bold 16px "Segoe UI", system-ui, sans-serif';
  ctx.textAlign = 'center';
  for (const ft of floatingTexts) {
    ctx.globalAlpha = ft.life;
    ctx.fillStyle = ft.color;
    ctx.fillText(ft.text, ft.x, ft.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ============================================================
//  GAME OVER
// ============================================================

function gameOver() {
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('deepfeed_hi', String(highScore));
  }
  endStatsEl.innerHTML = `Fish eaten: ${score}<br>Max size: ${TIER_NAMES[Math.max(0, player ? player.tier : 0)]}`;
  playBtn.textContent = 'Play Again';
  overlay.classList.remove('hidden');
  updateHUD();
}

// ============================================================
//  GAME LOOP
// ============================================================

let lastTime = 0;
let rafId = null;
let safetyInterval = null;

function loop(timestamp) {
  rafId = requestAnimationFrame(loop);
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // cap dt
  lastTime = timestamp;

  update(dt);
  render();
}

function startLoop() {
  lastTime = performance.now();
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);

  // Safety net: restart RAF if it dies
  if (safetyInterval) clearInterval(safetyInterval);
  safetyInterval = setInterval(() => {
    if (running && !document.hidden) {
      lastTime = performance.now();
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }
  }, 2000);
}

// Visibility change — pause/resume
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && running) {
    lastTime = performance.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }
});

// ============================================================
//  START / RESTART
// ============================================================

let btnCooldown = false;

playBtn.addEventListener('click', (e) => {
  e.preventDefault();
  if (btnCooldown) return;
  btnCooldown = true;
  setTimeout(() => btnCooldown = false, 500);

  ensureAudio();
  overlay.classList.add('hidden');
  initGame();
  running = true;
  startLoop();
});

// Also handle touch on button for in-app browsers
playBtn.addEventListener('touchend', (e) => {
  e.preventDefault();
  playBtn.click();
}, { passive: false });

// Initial render (show background)
render();

// Show high score on load
if (highScore > 0) highScoreEl.textContent = `Best: ${highScore}`;

</script>
</body>
